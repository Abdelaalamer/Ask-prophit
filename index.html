تر به إلى أن أمره الله تعالى بإظهار دينه ثلاث سنين، فيما بلغني»**. واستشهد بـ15:94 و26:214–216.\n- **الدرجة: D** للمدة (بلاغ). وهي أول تحديد لمدة المرحلة السرية في القاعدة، فتقدّم الفجوة `RG-035` ولا تغلقها.\n- **صلته:** حديث الصفا (`E-S03-005`، البخاري 4971) مرتبط بنزول 26:214.\n\n---\n\n## E-S03-013 — الصلاة في الشعاب، وأول دم في الإسلام\n\n- **رواية ابن إسحاق (ج1 ص237):** كان الصحابة إذا صلوا ذهبوا في الشعاب مستخفين، فظهر عليهم نفر من المشركين فعابوهم حتى قاتلوهم، فضرب سعد بن أبي وقاص رجلاً منهم بلحي بعير فشجه، «فكان أول دم هريق في الإسلام».\n- **الدرجة: D.** بلا إسناد.\n\n---\n\n## E-S03-014 — بدء العداوة عند عيب الآلهة، وحماية أبي طالب\n\n- **رواية ابن إسحاق (ج1 ص237):** لما صدع بالدعوة لم يبتعد عنه قومه ولم يردوا عليه، «فيما بلغني»، حتى ذكر آلهتهم وعابها، فأجمعوا خلافه وعداوته. وحدب عليه أبو طالب ومنعه، «ومضى رسول الله ﷺ على أمر الله، مظهراً لأمره، لا يرده عنه شيء». ثم مشى أشراف قريش إلى أبي طالب (يتبع في ص238 وما بعدها).\n- **الدرجة: D.**\n- **صلته بالقرآن (E):** قال السعدي في تفسير 68:8–9 إن سياق «ودوا لو تدهن فيدهنون» أن المشركين طلبوا منه أن يسكت عن عيب آلهتهم ويسكتوا عنه. وهذا يتسق مع رواية ابن إسحاق في أن العداوة اشتدت عند عيب الآلهة.\n- **الموضوعات:** `T03` الثبات، `C10`، `PD-007` (علاقته بأبي طالب).\n\n---\n\n## فهرس الأحداث\n\n| المعرّف | الحدث | الدرجة الغالبة |\n|---|---|---|\n| `E-S02-008` | إيمان خديجة ومؤازرتها | B للبشارة، D للتفاصيل |\n| `E-S02-009` | نزول الضحى | B، مع رواية مخالفة D |\n| `E-S03-001` | الدعوة السرية | D |\n| `E-S03-002` | فرض الصلاة | B |\n| `E-S03-003` | علي في كفالة النبي ﷺ | D |\n| `E-S03-004` | أبو طالب يكتشف الصلاة | D |\n| `E-S03-005` | الجهر على الصفا | B |\n| `E-S03-006` | استماع الجن | B |\n| `E-S03-007` | توعد أبي جهل | B |\n| `E-S03-008` | أبو طالب يسأل علياً | D |\n| `E-S03-009` | زيد بن حارثة | B للتبني، D لقصة التخيير |\n| `E-S03-010` | إسلام أبي بكر ودعوته | D |\n| `E-S03-011` | السابقون إلى الإسلام | D |\n| `E-S03-012` | الأمر بالصدع بعد ثلاث سنين | D |\n| `E-S03-013` | الصلاة في الشعاب | D |\n| `E-S03-014` | بدء العداوة وحماية أبي طالب | D |\n"}, {"code": "PC-00", "slug": "pc-00", "sec": "05", "title": "الشخصية النبوية — الصفات والأخلاق", "short": "الشخصية: الصفات والأخلاق", "md": "# الشخصية النبوية — الصفات والأخلاق\n\n- **القسم:** 05 — الشخصية النبوية\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 4\n- **قاعدة هذا القسم:** لا تُستنتج صفة نفسية أو سلوكية من رواية منفردة. بجوار كل استنتاج عدد الأدلة المستقلة التي بُني عليها. ما بُني على دليل واحد يُوسم «مبدئي».\n- **ما معنى «مستقل»:** نصان من مصدرين أو راويين أو مقامين مختلفين، لا روايتان لحديث واحد.\n\n---\n\n## 1. لوحة الحالة\n\n| الرمز | الجانب | الأدلة المسجلة | الحالة |\n|---|---|---|---|\n| `T01` | شخصيته الإنسانية وطباعه | 68:4؛ مسلم 746؛ البخاري 3549؛ ظهور السرور في وجهه (3555، 3556)؛ **د4:** أكثر ضحكه التبسم، وضحك حتى بدت نواجذه (مسلم 190، البخاري 6571)؛ أشد حياء من العذراء (الشمائل 359) | **متقاطع (6)** |\n| `T02` | الرحمة والرفق واللين | 3:159؛ 9:128؛ 21:107؛ البخاري 6038 ومسلم 2309؛ مسلم 2328 | **متقاطع (5)** |\n| `T03` | الحزم والقوة | البخاري 3560 (الانتقام لحرمات الله)؛ مرشح: 2820؛ **د4:** «أنا النبي لا كذب» يوم حنين (البخاري 2864)؛ «جاهد الكفار والمنافقين واغلظ عليهم» 66:9 بتفسيري السعدي وابن كثير؛ «فتغيّظ فيه» (البخاري 4908) | بداية |\n| `T04` | الصبر والتحمل | البخاري 2 و5؛ 18:6؛ 6:33؛ 86:17؛ 94:5–6؛ 96:19؛ **الأمر بالصبر خمس مرات في جزء تبارك**: 68:48، 70:5، 73:10، 74:7، 76:24 | **متقاطع (أكثر من 5)** |\n| `T05` | التواضع | 80:1–10؛ «عبد الله ورسوله» في الكتاب إلى هرقل؛ ما عاب طعاماً قط (3563)؛ **د4:** «لا تطروني» (البخاري 3445)؛ امرأة في عقلها شيء (مسلم 2326)؛ «في مهنة أهله» (البخاري 676)؛ دعوة الخياط وخبز الشعير (البخاري 2092، 2069)؛ كراهته القيام له (الشمائل 336) | **متقاطع (8)** |\n| `T06` | الكرم والعطاء | البخاري 6 ومسلم 2308؛ شهادة خديجة (البخاري 3)؛ أمره بالقلائص لأبي جحيفة وقومه (3544)؛ **د4:** «ما سئل شيئاً قط فقال لا» (البخاري 6034، مسلم 2311)؛ يقبل الهدية ويثيب عليها (البخاري 2585)؛ لم يرد صاحب الجهد وطلب له مضيفاً (البخاري 4889) | **متقاطع (6)** |\n| `T07` | الصدق والأمانة | شهادة خديجة (6 159؛ 33:21؛ 33:45–46؛ البخاري 7؛ «لست عليهم بمصيطر» 88:22؛ **د4:** ثباته يوم حنين (البخاري 2864)؛ «لا يتحدث الناس أن محمداً يقتل أصحابه» (البخاري 4905)؛ الوصية بالأنصار (البخاري 3799)؛ «وتركوك قائماً» 62:11 | بداية |\n| `T19` | الحياة الزوجية | البخاري 3؛ 5225؛ مسلم 2328؛ **د4:** مراجعة الزوجات واعتزالهن (البخاري 4913)؛ قصة العسل (البخاري 4912)؛ أم زرع (البخاري 5189)؛ «في مهنة أهله» (البخاري 676)؛ 66:1–5 | **متقاطع (7)** |\n| `T21` | التجارة والحقوق المالية | المطففين 83:1–3 (توجيه عام للأمة)؛ **د4:** فيء بني النضير: نفقة سنة للأهل والباقي عدة (البخاري 4885)؛ «كي لا يكون دولة بين الأغنياء» 59:7؛ ترك البيع وقت الجمعة ثم الانتشار 62:9–10 | بداية |\n| `T22` | المسؤولية وحدودها | 79:45؛ 88:21–22؛ «إنما العلم عند الله وإنما أنا نذير مبين» 67:26؛ «لا أملك لكم ضراً ولا رشداً» 72:21؛ «أم تسألهم أجراً» 68:46 | **متقاطع (5)** |\n| `T23` | التخطيط والاستعداد | قصة أصحاب الجنة 68:17–33 (تخطيط دون استثناء المشيئة)؛ **د4:** نفقة السنة للأهل والباقي عدة في سبيل الله (البخاري 4885 و5357)؛ «ولتنظر نفس ما قدمت لغد» 59:18؛ الجمع مع «لا يدخر شيئاً لغد» في `SD-016` | بداية، وفيه نص في سلوكه ﷺ |\n| `T24` | الاختلاف في الرأي والدين | «لكم دينكم ولي دين» 109؛ «ودّوا لو تدهن فيدهنون» 68:9؛ موافقة أهل الكتاب فيما لم يؤمر فيه ثم مخالفتهم (3558، وشرح ابن حجر)؛ **د4:** رد اعتراض عمر على ابن رواحة: «خل عنه يا عمر» (الترمذي 2847)؛ 60:8–9: البر والقسط مع غير المحارب | بداية |\n| `T25` | العبادة والحياة | البخاري 1؛ 6؛ صلاة الليل (3569)؛ 94:7–8؛ **المزمل: قيام الليل و«إن لك في النهار سبحاً طويلاً» 73:1–9، وتخفيفه لأجل المرضى والمسافرين في طلب الرزق 73:20** | **متقاطع** |\n| `T26` | الاستماع والإنصات | البخاري 5 و75:16–19؛ 87:6؛ **د4:** «هيه» واستزادة مائة بيت (مسلم 2255)؛ سكوته وتبسمه في مجالس أصحابه (الشمائل 248)؛ أم زرع (البخاري 5189)؛ «ما هذا يا حاطب؟» (البخاري 4890)؛ «فدعاني فحدثته» (البخاري 4900) | **متقاطع (5)** (`P-T26-02`) |\n| `T27` | تلقي النقد والتصحيح | 80:1–10 والترمذي 3331؛ **د4:** عتاب التحريم 66:1 مع قصة العسل (البخاري 4912) | **متقاطع (2)** |\n| `T28` | المواقف المحرجة | البخاري 5225 | مبدئي |\n| `T17` | الأصدقاء والأعداء | **د4:** حفظ سابقة حاطب في بدر (البخاري 4890)؛ الوصية بالأنصار (البخاري 3799)؛ ترك قتل ابن أبي (البخاري 4905)؛ «عسى الله أن يجعل بينكم وبين الذين عاديتم منهم مودة» 60:7 | بداية |\n| `T20` | التربية وبناء الإنسان | **د4:** «يتلو عليهم آياته ويزكيهم ويعلمهم» 62:2؛ يعيد الكلمة لتُفهم (البخاري 95)؛ تكنية الطفل وممازحته (البخاري 6129)؛ مجلس النساء بعد العيد (البخاري 4895)؛ «قوا أنفسكم وأهليكم» 66:6 | بداية |\n\n---\n\n## 2. الاستنتاجات المتقاطعة (مستوى E)\n\n### 2.1 الرحمة واللين هما السمة الغالبة في التعامل `T02`\n- **الأدلة:** ثلاث آيات (3:159، 9:128، 21:107)، وشهادة خادمه أنس عن عشر سنين (البخاري 6038، مسلم 2309)، وشهادة زوجته عائشة أنه لم يضرب بيده امرأة ولا خادماً (مسلم 2328).\n- **الحدّ:** النص نفسه يستثني انتهاك حرمات الله والجهاد في سبيل الله (البخاري 3560، مسلم 2328).\n\n### 2.2 الصدق صفة معروفة له قبل النبوة، يشهد بها القريب والخصم `T07`\n- **الأدلة:** خديجة (البخاري 6982)، وأبو سفيان وهو خصم (البخاري 7)، و6:33.\n- **ومن القرآن (الدفعة 4):** «وما هو على الغيب بضنين» (81:24): الضمير للنبي ﷺ عند السعدي وابن كثير، والمعنى بالقراءتين: لا يُتهم في الوحي، ولا يبخل به على أحد.\n- **ومن الشمائل:** «إني لا أقول إلا حقاً» جواباً لمن استغرب مداعبته (الترمذي 1990، B). الصدق شمل المزاح.\n\n### 2.3 الانفعال ظاهر على الوجه، منضبط في القول والفعل `T01` `T12`\n- **الأدلة:** السرور يضيء وجهه (عائشة 3555، كعب بن مالك 3556)، والكره يُعرف في وجهه (أبو سعيد 3562)، ولا فحش في قوله (عبد الله بن عمرو 3559)، ولا انتقام لنفسه (عائشة 3560)، ولا لوم لخادمه (أنس 6038).\n- **الصورة:** لم يكن يخفي مشاعره، وكان الصحابة يقرؤونها في وجهه («وكنا نعرف ذلك منه»). وفي المقابل لم يكن الانفعال يتحول إلى فحش في القول أو أذى في الفعل.\n- **قيمته:** هذا أوضح نمط في القاعدة حتى الآن، وأدلته من خمسة صحابة.\n\n### 2.4 الكلام واضح متمهل نقي `T09` `D05`\n- **الأدلة:** «لم يكن فاحشاً ولا متفحشاً» (عبد الله بن عمرو، 3559)، و«يحدث حديثاً لو عده العاد لأحصاه» و«لم يكن يسرد الحديث كسردكم» (عائشة، 3567 و3568).\n- **مع قوله:** «إن من خياركم أحسنكم أخلاقاً» (3559).\n\n### 2.5 الكرم سمة ثابتة، ويزداد في مواسم العبادة `T06`\n- **الأدلة:** حديث ابن عباس (البخاري 6، مسلم 2308)، وشهادة خديجة (البخاري 3)، وأمره بثلاث عشرة قلوصاً لأبي جحيفة وقومه قبيل وفاته (3544).\n\n### 2.6 القرآن يطمئنه في الشدة ويحدد له حدود المسؤولية `T16` `T22`\n- **الأدلة:** «ما ودعك ربك وما قلى» (93:3)، «ألم نشرح لك صدرك» (94:1)، «إن مع العسر يسراً» (94:5–6)، «فلعلك باخع نفسك» (18:6)، «إنما أنت مذكر لست عليهم بمصيطر» (88:21–22).\n- **الصورة:** الحزن والضيق أمران بشريان يعترف بهما النص القرآني، والعلاج المقرر: التذكير بنعم الله السابقة، والوعد بالفرج، وتحديد المسؤولية بالبلاغ دون النتيجة.\n\n### 2.7 التواضع في الشأن اليومي `T05`\n- **الأدلة:** ما عاب طعاماً قط (3563)، وتقديم «عبد الله» قبل «رسوله» في كتابه إلى ملك الروم (7)، وقبوله العتاب القرآني ونقله للناس (عبس).\n\n### 2.8 الصبر على أذى المكذبين أكثر ما أُمر به في مكة `T04` `T13`\n- **الأدلة:** خمسة أوامر صريحة في جزء تبارك وحده (68:48، 70:5، 73:10، 74:7، 76:24)، ومعها 86:17 و94:5–6 من جزء عمّ، وكلها في سياق أذى المكذبين.\n- **أنواع الصبر المذكورة في النصوص:** «صبراً جميلاً» (70:5)، والصبر مع «هجر جميل» (73:10)، والصبر «لحكم ربك» (68:48، 76:24) مع النهي عن أن يكون كصاحب الحوت.\n- **قيمته (E):** يدل على أن ضبط النفس أمام الأذى كان توجيهاً إلهياً متكرراً، لا طبعاً فقط. معاني «الجميل» عند المفسرين تُوثق `RG-037`.\n\n### 2.9 حدود علمه وقدرته ﷺ بنصوص صريحة `T05` `T22`\n- **الأدلة:** «لا أملك لكم ضراً ولا رشداً» (72:21)، «قل إن أدري أقريب ما توعدون» (72:25)، «إنما العلم عند الله» (67:26)، «إنما أنت منذر» (79:45)، «لست عليهم بمصيطر» (88:22).\n- **قيمته المنهجية:** يحمي المشروع من نسبة ما ليس له إليه ﷺ، ويتسق مع القاعدتين الثانية والرابعة في تعليمات المشروع.\n\n---\n\n### 2.10 المزاح صادق، ومع من يحتاج الأنس `T09` `D05` (الدفعة 4)\n- **الأدلة:** ستة نصوص مقبولة: «يا أبا عمير» (البخاري 6129، مسلم 2150)، «يا ذا الأذنين» (الترمذي 1992)، «ولد الناقة» (الترمذي 1991)، «لا أقول إلا حقاً» (الترمذي 1990)، زاهر (الشمائل 240)، والعجوز (الشمائل 241، C).\n- **الصورة:** طفل حزين على طائره، وخادم، وأعرابي دميم «كان ﷺ يحبه»، وعجوز. الضابط منصوص: لا يقول إلا حقاً. وفي حديثي زاهر والعجوز ختم المزاح بما يجبر الخاطر.\n- **المبدأ:** `P-T09-02`.\n\n### 2.11 الضحك: الغالب التبسم، مع ضحك ظاهر أحياناً `T01` (الدفعة 4)\n- **الأدلة:** «ما رأيت أحداً أكثر تبسماً» و«ما كان ضحكه إلا تبسماً» (الشمائل 228–229، صححه الألباني)؛ وضحك حتى بدت نواجذه (مسلم 190، البخاري 6571)؛ وما رآه جرير إلا تبسم في وجهه (البخاري 3035)؛ وتبسم حين حكى له عمر رد أم سلمة عليه (البخاري 4913).\n- **ما لا يثبت:** الحصر «كان لا يضحك إلا تبسماً» من حديث جابر بن سمرة ضعيف، وضحكه يوم الخندق من رمية سعد ضعيف (الشمائل 227، 235).\n\n### 2.12 الإنصات للناس وسماع عذرهم `T26` `T08` (الدفعة 4)\n- **الأدلة:** خمسة مواقف مستقلة: استزادة الشعر (مسلم 2255)، ومجالس أصحابه (الشمائل 248)، وأم زرع (البخاري 5189)، وحاطب (البخاري 4890)، وزيد بن أرقم (البخاري 4900).\n- **الصورة:** يستمع إلى آخر الكلام، ويطلب الاستزادة، ويسأل صاحب الخطأ سؤالاً مفتوحاً قبل الحكم.\n- **المبادئ:** `P-T26-02`، `P-T08-01`.\n\n### 2.13 المخطئ من أصحابه: سؤال، ثم سماع، ثم حفظ السابقة `T13` `T17` (الدفعة 4)\n- **الأدلة:** حاطب (البخاري 4890)، والمرأة التي قبضت يدها في البيعة «فما قال لها شيئاً» (البخاري 4892)، وابن عمر في الطلاق: غضب ثم تعليم (البخاري 4908).\n- **ومع المنافق الظاهر:** قبول الظاهر، وعرض الاستغفار، وترك القتل حفظاً لصورة الدعوة (البخاري 4900–4907).\n\n### 2.14 البيت: خلاف حقيقي، وإدارة بلا أذى `T19` `T11` (الدفعة 4)\n- **الأدلة:** مراجعة الزوجات له «حتى يظل يومه غضبان» واعتزاله لهن (البخاري 4913)، وقصة العسل (البخاري 4912)، و«عرّف بعضه وأعرض عن بعض» (66:3)، ومعها من قبل: «غارت أمكم» (البخاري 5225) وما ضرب امرأة قط (مسلم 2328).\n- **الصورة:** لا تصور البيت النبوي في النصوص الصحيحة خالياً من الخلاف. ووسائله الثابتة فيها: تفسير الدافع، وترك الاستقصاء، والاعتزال المؤقت. ولا ضرب ولا سب.\n- **حدّ:** سبب الاعتزال ومدته من روايات أخرى لم تُقرأ (`RG-047`).\n\n### 2.15 الزهد الشخصي مع تدبير حاجة الأهل `T14` `T23` (الدفعة 4)\n- **الأدلة:** نفقة سنة للأهل من فيء بني النضير والباقي عدة (البخاري 4885، 5357)، وبيوت بلا طعام لضيف (البخاري 4889)، وحصير أثّر في جنبه (البخاري 4913)، ودرع مرهونة على شعير (البخاري 2916)، و«لا يدخر شيئاً لغد» (الشمائل 355).\n- **الجمع:** ابن دقيق العيد كما نقله ابن حجر: لا يدخر لنفسه، ويدخر لأهله. وكان يعطي من قوت السنة لمن يرد عليه، ولذلك مات ودرعه مرهونة (فتح الباري ج9 ص503، `SD-016`).\n\n---\n\n## 3. استنتاجات مبدئية تحتاج أدلة إضافية\n- **الاعتراف بالخوف وطلب السند من القريب الموثوق `T16` `T19`:** البخاري 3 و4. **مبدئي.**\n- **الاستماع الكامل قبل الكلام `T26`:** صار متقاطعاً في الدفعة 4 (البند 2.12).\n- **التعامل مع النجاح بالتسبيح والاستغفار `T15`:** سورة النصر وتطبيقه الثابت في صلاته (4967). ما زال يحتاج مواقف عملية من فتح مكة.\n\n---\n\n## 4. ما لا يجوز استنتاجه من المادة الحالية\n- لا وصف نفسي من بلاغ الزهري في البخاري 6982 (`SD-003`).\n- لا بناء على «إنما بعثت لأتمم صالح الأخلاق» حتى يُوثق حكمه.\n- لا بناء على قصة اختبار خديجة للملك (منقطعة).\n- لا قياس على «تنام عيني ولا ينام قلبي»، فهو وصف خاص بالأنبياء بنص الحديث.\n- لا تعميم لتبرك الصحابة بآثاره ﷺ قبل بحث مسألة الخصوصية (`RG-027`).\n- **من الشمائل (الدفعة 4):** لا بناء على الأوصاف الجامعة المنقولة عن هند بن أبي هالة وعن الحسين عن علي («متواصل الأحزان»، «دائم الفكرة»، «طويل السكت»، «دائم البشر»، «جزأ دخوله ثلاثة أجزاء»، «يتغافل عما لا يشتهي»). ضعّفها الألباني جداً (`HKB-SHM-01`، قائمة التحذير).\n- لا بناء على «لا يكاد يواجه أحداً بشيء يكرهه» (ضعيف). وترك تسمية المخطئ في الإنكار العام له أصل صحيح آخر: «ما بال أقوام» (البخاري 6101).\n- لا بناء على قصة تخيير زيد بن حارثة، ولا على «ما دعوت أحداً إلى الإسلام إلا كانت فيه عنده كبوة... إلا أبا بكر»؛ كلاهما بلا إسناد في سيرة ابن هشام (`RG-049`، `RG-050`).\n"}, {"code": "PD-00", "slug": "pd-00", "sec": "06", "title": "القرارات والمواقف النبوية", "short": "القرارات والمواقف النبوية", "md": "# القرارات والمواقف النبوية\n\n- **القسم:** 06 — القرارات النبوية\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 3\n- **بنية كل سجل:** الموقف، البدائل التي تذكرها المصادر فقط، التصرف النبوي، النتيجة، الدرجة، المبدأ المستنبط (E) ومن قال به إن وُجد.\n\n---\n\n## PD-001 — الإفصاح للزوجة والاستعانة بأهل العلم بعد أول وحي\n\n- **الموقف:** تجربة غير مسبوقة، وخوف صرح به. (`E-S02-004`، البخاري 3، **B**)\n- **التصرف:** عاد إلى بيته، طلب التزميل حتى سكن روعه، ثم أخبر خديجة الخبر كاملاً وصرح بخوفه.\n- **ما فعلته خديجة:** طمأنته بالاستدلال بأخلاقه، ثم أخذته إلى ورقة بن نوفل لأنه أعلم الحاضرين بالكتب السابقة.\n- **النتيجة:** طمأنينة، ومعرفة أولى بطبيعة ما حدث (الناموس)، وتنبيه مبكر على أن قومه سيعادونه.\n- **مبدأ مستنبط (E، مبدئي):** عند الحدث الكبير المربك: تهدئة النفس أولاً، ثم الإفصاح الكامل لأقرب موثوق، ثم سؤال صاحب الخبرة. هذا تحليل للمشروع من نص واحد، ولم نقف بعد على من سبق إليه من العلماء.\n\n---\n\n## PD-002 — معالجة حادثة الصحفة المكسورة\n\n- **الموقف:** تصرف غيرة من إحدى زوجاته تجاه هدية طعام من زوجة أخرى، كُسرت فيه صحفة وانسكب طعام. وقوله «غارت أمكم» خطاب لمن كان حاضراً، فالموقف لم يكن خاصاً. ولا يذكر نص البخاري هوية الحاضرين. (البخاري 5225، **B**)\n- **التصرف بالتسلسل:**\n  1. جمع الكسر والطعام بنفسه.\n  2. فسّر للحاضرين الدافع بكلمة واحدة: «غارت أمكم».\n  3. انتظر حتى أُتي بصحفة سليمة من بيت التي كسرت.\n  4. أعطى الصحفة السليمة لصاحبة الطعام، وأبقى المكسورة في بيت التي كسرتها.\n- **ما لم يُذكر في النص:** لا توبيخ، ولا عقوبة، ولا جدال أمام الحاضرين.\n- **مبدأ مستنبط (E، مبدئي):** في الإحراج العلني: معالجة الأثر المادي فوراً، وتفسير الدافع الإنساني بدل إدانة صاحبه، ثم إنصاف المتضرر بتعويض محدد يتحمله المتسبب.\n\n---\n\n## PD-003 — صياغة الكتاب إلى ملك الروم\n\n- **الموقف:** مخاطبة رأس دولة عظمى بدعوة دينية. (البخاري 7، مسلم 1773، **B**)\n- **عناصر الصياغة كما في النص:**\n  1. البسملة.\n  2. تعريف المرسل بصفتين: «عبد الله ورسوله»؛ العبودية قبل الرسالة.\n  3. تسمية المخاطب بلقبه عند قومه: «عظيم الروم».\n  4. تحية مشروطة بالهدى: «سلام على من اتبع الهدى».\n  5. دعوة موجزة في جملة: «أسلم تسلم».\n  6. حافز: «يؤتك الله أجرك مرتين».\n  7. تحميل المسؤولية عن الرعية إن رفض.\n  8. أرضية مشتركة من القرآن: «تعالوا إلى كلمة سواء» (3:64).\n- **مبدأ مستنبط (E، مبدئي):** الاحترام البروتوكولي للمنصب لا يعني التنازل عن الرسالة؛ والخطاب للكبار يكون موجزاً ويبدأ من أرضية مشتركة.\n\n---\n\n## PD-004 — الإقبال على عظيم من قريش وتأخير ابن أم مكتوم، ثم العتاب\n\n- **الموقف:** فرصة لهداية رجل من عظماء المشركين، وجاء في الوقت نفسه رجل أعمى مسلم يطلب التعليم. (80:1–10 **A**؛ الترمذي 3331 **C**)\n- **التصرف:** أقبل على العظيم وأعرض عن الأعمى رجاء هداية الأول. هذا ما وصفته الآيات وعاتبت عليه.\n- **النتيجة:** نزل العتاب، وبلّغه ﷺ للناس قرآناً يتلى. ونُقل أنه كان بعد ذلك يكرم ابن أم مكتوم (**D**).\n- **مبدأ مستنبط (قول السعدي، E):** لا يُترك أمر معلوم لأمر موهوم، ولا مصلحة متحققة لمصلحة متوهمة، ويُقدم طالب العلم الحريص.\n- **مبدأ مستنبط (قول ابن كثير، E):** لا يُخص بالإنذار أحد؛ يُساوى فيه بين الشريف والضعيف والغني والفقير.\n- **أهمية منهجية:** يُثبت هذا السجل أن من تصرفاته ﷺ ما كان اجتهاداً صُحح بالوحي. يُراعى هذا عند تصنيف الأفعال (منهج التحقق، البند 6).\n\n---\n\n## PD-005 — قاعدة الاختيار بين أمرين\n\n- **النص:** «ما خُيّر رسول الله ﷺ بين أمرين إلا أخذ أيسرهما ما لم يكن إثماً، فإن كان إثماً كان أبعد الناس منه». (البخاري 3560، **B**)\n- **طبيعته:** وصف من عائشة لنمط متكرر، لا موقف واحد. فهو قاعدة قرار مستقرأة من راوية لازمته.\n- **مبدأ (E):** عند تساوي الخيارين في الجواز يُقدم الأيسر؛ والإثم قيد مانع لا يُتجاوز.\n\n---\n\n## PD-007 — التخفيف عن أبي طالب في الأزمة بكفالة علي (الدفعة 3)\n\n- **الموقف:** أزمة شديدة أصابت قريشاً، وأبو طالب كثير العيال. (ابن هشام ج1 ص228–229، من مرسل مجاهد، **D**)\n- **التصرف بحسب الرواية:** بادر ﷺ واقترح على عمه العباس، وكان من أيسر بني هاشم، أن يخففا عن أبي طالب، فأخذ كل منهما ولداً يكفله.\n- **مبدأ مستنبط (E، مبدئي، ومن رواية D):** المبادرة إلى تخفيف العبء عن القريب المثقل، وإشراك القادر من العائلة في ذلك. لا يُبنى عليه وحده حتى يتقوى بغيره.\n\n---\n\n## PD-008 — طريقة الجهر بالدعوة على الصفا (الدفعة 3)\n\n- **الموقف:** أول مخاطبة علنية لقريش مجتمعة بعد نزول «وأنذر عشيرتك الأقربين». (البخاري 4971–4973، **B**)\n- **التصرف بالتسلسل كما في النص:**\n  1. اختيار مكان مرتفع معروف (الصفا) ونداء الاستنفار المعهود عندهم «يا صباحاه».\n  2. سؤال يعرفون جوابه من تجربتهم معه: لو أخبرتكم أن خيلاً تخرج من سفح هذا الجبل أكنتم مصدقيّ؟\n  3. بعد إقرارهم «ما جربنا عليك كذباً» جاء الإنذار: «فإني نذير لكم بين يدي عذاب شديد».\n- **النتيجة:** اعتراض أبي لهب، ونزول سورة المسد.\n- **مبدأ مستنبط (E):** بناء الرسالة الصعبة على رصيد ثقة معترف به سلفاً، وجعل السامع هو من يقرر ذلك الرصيد بلسانه قبل سماع الرسالة.\n\n---\n\n## PD-006 — الشورى قبل العزم\n\n- **النص:** «وشاورهم في الأمر فإذا عزمت فتوكل على الله» (3:159، **A**).\n- **الحالة:** أمر قرآني. المواقف التطبيقية للشورى في السيرة لم تُدرس بعد، وتأتي في دفعة الغزوات.\n\n---\n\n## PD-009 — حاطب بن أبي بلتعة: كتاب سري إلى قريش\n\n- **الموقف:** صحابي من أهل بدر كتب إلى مشركي مكة يخبرهم ببعض أمر النبي ﷺ. (البخاري 4890، **B**)\n- **التصرف بالتسلسل:**\n  1. أرسل ثلاثة فاستخرجوا الكتاب.\n  2. واجهه بسؤال مفتوح: «ما هذا يا حاطب؟».\n  3. سمع عذره كاملاً: لا قرابة له في قريش تحمي أهله، فأراد يداً عندهم، «وما فعلت ذلك كفراً ولا ارتداداً».\n  4. حكم بصدقه علناً: «إنه قد صدقكم».\n  5. رد طلب عمر بقتله: «إنه شهد بدراً».\n- **البدائل في النص:** قتله، وهو ما طلبه عمر.\n- **النتيجة في النص:** لم يُعاقب، ونزلت 60:1 في النهي عن موالاة العدو (مع تردد سفيان في كون ذكر الآية من الحديث).\n- **مبدأ مستنبط (E):** `P-T08-01`، و`P-T18-06`.\n\n---\n\n## PD-010 — خبر زيد بن أرقم عن ابن أبي: الحكم بالظاهر ثم تصحيح الوحي\n\n- **الموقف:** في سفر شديد نقل زيد كلاماً لابن أبي يحرض فيه على الانفضاض عن النبي ﷺ. (البخاري 4900–4904، **B**)\n- **التصرف:** دعا زيداً فسمع منه، ثم أرسل إلى ابن أبي وأصحابه فحلفوا ما قالوا، فصدّقهم وكذّب زيداً.\n- **النتيجة:** أصاب زيداً هم شديد ولامه قومه، ثم نزلت سورة المنافقين، فأرسل إليه وقرأها عليه: «إن الله قد صدقك يا زيد». ودعا المنافقين ليستغفر لهم فلووا رءوسهم (4903).\n- **أهمية منهجية:** حُكم فيه بالمتاح من البينة، ثم جاء الوحي بخلاف النتيجة. ونظائره في القاعدة من جهة تصحيح الوحي: `PD-004` و`PD-012`. ويُراعى عند تصنيف الأفعال.\n- **مبدأ مستنبط (E):** `P-T08-01`.\n\n---\n\n## PD-011 — ترك قتل ابن أبي\n\n- **الموقف:** بعد حادثة تداعي المهاجرين والأنصار بالعصبية، قال ابن أبي: «لئن رجعنا إلى المدينة ليخرجن الأعز منها الأذل». (البخاري 4905 و4907، **B**)\n- **التصرف:** أنكر العصبية أولاً: «ما بال دعوى جاهلية... دعوها فإنها منتنة». ثم رد طلب عمر بضرب عنق ابن أبي: «دعه، لا يتحدث الناس أن محمداً يقتل أصحابه».\n- **البدائل في النص:** القتل، وهو ما طلبه عمر.\n- **العلة:** منصوصة في الحديث نفسه.\n- **مبدأ مستنبط (E):** `P-T18-05`.\n\n---\n\n## PD-012 — تحريم العسل على نفسه إرضاءً لأزواجه، ثم العتاب\n\n- **الموقف:** تواطأت عائشة وحفصة على أن تقول كل منهما: «أجد منك ريح مغافير». (البخاري 4912، **B**؛ 66:1، **A**)\n- **التصرف:** «لا، ولكني كنت أشرب عسلاً عند زينب ابنة جحش، فلن أعود له، وقد حلفت، لا تخبري بذلك أحداً».\n- **النتيجة:** نزل «لم تحرم ما أحل الله لك تبتغي مرضات أزواجك والله غفور رحيم». قال السعدي: «هذا تصريح بأن الله قد غفر لرسوله ورفع عنه اللوم». وشُرعت كفارة اليمين للأمة (66:2).\n- **أهمية منهجية:** تصحيح قرآني ثانٍ لتصرف نبوي بعد `PD-004`. الأول تقديم عظيم على ضعيف، وهذا ترك مباح لإرضاء الأهل.\n- **في سبب النزول خلاف:** `SD-018`.\n"}, {"code": "FSR-00", "slug": "fsr-00", "sec": "07", "title": "العلاقات الأسرية والاجتماعية", "short": "العلاقات الأسرية والاجتماعية", "md": "# العلاقات الأسرية والاجتماعية\n\n- **القسم:** 07 — العلاقات الأسرية والاجتماعية\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 3\n- **طريقة العرض:** لكل فئة من الناس: النصوص الثابتة بمعرفاتها، ثم الملاحظة التحليلية (E).\n\n---\n\n## C01 — الزوجات\n\n| المعرّف | المضمون | الدرجة |\n|---|---|---|\n| `H-BKH-0003` | خديجة سكنه الأول عند الوحي: أفصح لها عن خوفه، فثبتته واستدلت بأخلاقه، وأخذته إلى ورقة | B |\n| `H-BKH-5225` | معالجة غيرة زوجة كسرت صحفة زوجة أخرى: «غارت أمكم» وتعويض عادل | B |\n| `H-MSL-2328` | ما ضرب بيده امرأة قط | B |\n\n**ملاحظة (E):** النصوص الثلاثة تجمع بين الاعتماد العاطفي المتبادل (خديجة)، وتفهّم الغيرة دون إقرار الظلم (الصحفة)، ونفي العنف البدني مطلقاً (مسلم 2328). الصورة لم تكتمل؛ أحكام البيت النبوي في سورتي الأحزاب والتحريم لم تُدرس بعد.\n\n---\n\n## C06 — الخدم والعمال\n\n| المعرّف | المضمون | الدرجة |\n|---|---|---|\n| `H-BKH-6038` و`H-MSL-2309` | أنس خدمه عشر سنين فما قال له «أف» ولا لامه على فعل أو ترك | B |\n| `H-MSL-2328` | ما ضرب بيده خادماً قط | B |\n| `H-BKH-5225` | «حبس الخادم» حتى أُتي بالصحفة السليمة، ولم يُذكر لوم للخادم الذي ضُربت يده | B |\n\n**ملاحظة (E):** زيادة أبي الربيع في رواية مسلم («ليس مما يصنعه الخادم») تفيد أن عدم اللوم شمل ما هو خارج عمل الخادم أصلاً، لا تقصيره في عمله فقط.\n\n---\n\n## C07 — الضعفاء والفقراء وذوو الإعاقة\n\n| المعرّف | المضمون | الدرجة |\n|---|---|---|\n| `Q-80:1-10` | العتاب على الإعراض عن ابن أم مكتوم الأعمى | A |\n| `H-TRM-3331` | تعيين ابن أم مكتوم سبباً للنزول | C |\n| `Q-93:9-10` | النهي عن قهر اليتيم ونهر السائل | A |\n| `H-BKH-0003` | شهادة خديجة: «تحمل الكَلّ، وتكسب المعدوم» | B |\n\n**ملاحظة (E):** القرآن نفسه جعل المساواة بين الضعيف والقوي في الدعوة والتعليم أمراً معاتباً عليه عند الإخلال به.\n\n---\n\n## C02 الأبناء، C03 الأطفال، C04 الأصحاب، C05 النساء، C08 الغرباء، C09 أهل الكتاب، C10 الأعداء، C11 المنافقون، C12 المخطئون\n\n- **C09 أهل الكتاب:** `H-BKH-0007` (الكتاب إلى هرقل مع آية «كلمة سواء»، B)؛ `H-BKH-0003` (ورقة بن نوفل، B)؛ **الدفعة 2:** `H-BKH-3558` «كان يحب موافقة أهل الكتاب فيما لم يؤمر فيه بشيء» ثم ترك ذلك (B)؛ سورة الكافرون «لكم دينكم ولي دين» (A).\n- **C10 الأعداء:** شهادة أبي سفيان وهو خصم (`H-BKH-0007`، B)؛ **الدفعة 2:** أبو لهب، عمه، مذكور بالاسم في سورة المسد (A)؛ الناهي عن الصلاة في العلق 9–19 (A، وهويته غير مذكورة في الآية)؛ «إن شانئك هو الأبتر» 108:3 (A).\n- **C03 الأطفال واليتامى:** `Q-93:6-9` (A)؛ **الدفعة 2:** ذم من لا يكرم اليتيم (89:17)، ومن يدع اليتيم (107:2)، والحث على إطعام «يتيماً ذا مقربة» (90:15) (A)؛ حمل أبي بكر للحسن على عاتقه ومزاحه معه (البخاري 3542، B؛ موقف صحابي لا نبوي).\n- **C05 النساء:** **الدفعة 2:** سؤال الموءودة «بأي ذنب قتلت» (81:8–9، A)، شاهد على واقع وأد البنات قبل الإسلام وإدانته.\n- **C06 الرقيق:** **الدفعة 2:** «فك رقبة» أول خصال اقتحام العقبة (90:13، A).\n- **C07 الفقراء والمساكين:** **الدفعة 2:** 89:18، 90:14–16، 107:3 (A).\n- **C02 الأقارب (الدفعة 3):** موقفان متقابلان من عمّين: أبو لهب يعاديه علناً على الصفا (البخاري 4971، B)، وأبو طالب يرفض ترك دين آبائه لكنه يتعهد بحمايته (ابن هشام ج1 ص229، D). ومبادرته ﷺ إلى كفالة علي تخفيفاً عن أبي طالب في الأزمة (ابن هشام ج1 ص228–229، D).\n- **C04 الأصحاب (الدفعة 3):** «وطائفة من الذين معك» يقومون الليل معه (73:20، A)؛ وخروجه في طائفة من أصحابه إلى سوق عكاظ وصلاته بهم بنخلة (البخاري 4921، B).\n- **C01 الزوجات (الدفعة 3):** بشارة خديجة ببيت في الجنة وإبلاغها السلام من ربها (البخاري 3820، B).\n- **بقية الفئات:** `C08` `C11` `C12` بدأت أدلتها في الدفعة 4 (آخر الملف).\n\n---\n\n## إضافات الدفعة 4 (الشمائل، وتفسير الجزء 28 من البخاري)\n\n### C01 — الزوجات\n| المعرّف | المضمون | الدرجة |\n|---|---|---|\n| `H-BKH-4913` | مراجعة الزوجات له «حتى يظل يومه غضبان»، وإقرار حفصة «والله إنا لنراجعه»؛ أم سلمة تصد عمر عن التدخل فيتبسم ﷺ لما سمع؛ اعتزاله أزواجه في المشربة | B |\n| `H-BKH-4912` | تواطؤ عائشة وحفصة في قصة العسل، وتحريمه العسل على نفسه، ثم العتاب في 66:1 | B |\n| `H-BKH-4916` | «اجتمع نساء النبي ﷺ في الغيرة عليه» | B |\n| `Q-66:3` | «عرّف بعضه وأعرض عن بعض»: قال السعدي: «كرماً منه وحلماً» | A، والقول E |\n| `H-BKH-5189` | حديث أم زرع: استمع لعائشة حتى أتمت، ثم قال: «كنت لك كأبي زرع لأم زرع» | B |\n| `H-BKH-0676` | «كان يكون في مهنة أهله» | B |\n| `H-SHM-0343` | «كان بشراً من البشر، يفلي ثوبه، ويحلب شاته، ويخدم نفسه» | B |\n\n**ملاحظة (E):** صورة البيت في هذه النصوص: خلاف حقيقي ومراجعة وغيرة، يقابلها إنصات، وإعراض عن الاستقصاء في العتاب، واعتزال مؤقت. ولم يرد في أي منها ضرب ولا سب، ويتسق ذلك مع مسلم 2328. سبب الاعتزال ومدته من الروايات الأخرى فجوة `RG-047`.\n\n### C02 الأبناء والأسرة عامة\n- `Q-64:14-15`: «إن من أزواجكم وأولادكم عدواً لكم فاحذروهم، وإن تعفوا وتصفحوا وتغفروا» (A).\n- `Q-66:6`: «قوا أنفسكم وأهليكم ناراً» (A).\n- `Q-65:6-7`: السكنى والنفقة بقدر الوسع، و«وأتمروا بينكم بمعروف» حتى بعد الفراق (A).\n\n### C03 الأطفال\n- «يا أبا عمير، ما فعل النغير؟» لطفل مات طائره (البخاري 6129، مسلم 2150، B). وفي مسلم أنه كان فطيماً.\n- يوسف بن عبد الله بن سلام: سماه، وأقعده في حجره، ومسح على رأسه (الشمائل 340، صححه الألباني، B).\n\n### C04 الأصحاب\n- جرير: ما حجبه منذ أسلم، ولا رآه إلا تبسم في وجهه، ودعا له حين شكا أنه لا يثبت على الخيل (البخاري 3035، B).\n- جالسهم أكثر من مائة مرة وهم يتناشدون الشعر ويتذاكرون أمر الجاهلية، وهو ساكت وربما تبسم معهم (الشمائل 248، B).\n- الوصية بالأنصار: «اقبلوا من محسنهم وتجاوزوا عن مسيئهم» (البخاري 3799، B).\n- حاطب: حفظ سابقته في بدر (البخاري 4890، B).\n\n### C05 النساء\n- امرأة «في عقلها شيء»: «انظري أي السكك شئت حتى أقضي لك حاجتك»، فخلا معها في بعض الطرق حتى فرغت (مسلم 2326، B).\n- المبايعة بالكلام: «ما مست يده يد امرأة قط في المبايعة» (البخاري 4891، B).\n- مجلس خاص بالنساء بعد خطبة العيد (البخاري 4895، B).\n- المرأة التي قبضت يدها في البيعة: «فما قال لها شيئاً»، فرجعت فبايعها (البخاري 4892، B).\n- العجوز: «أخبروها أنها لا تدخلها وهي عجوز» (الشمائل 241، C).\n- «قد سمع الله قول التي تجادلك في زوجها» (58:1، A)؛ هويتها `RG-048`.\n\n### C06 الخدم\n- «يا ذا الأذنين» لأنس، يمازحه (الشمائل 236، الترمذي 1992، B).\n\n### C08 الغرباء وغير العرب\n- وضع يده على سلمان الفارسي: «لو كان الإيمان عند الثريا لناله رجال من هؤلاء» (البخاري 4897، B).\n- زاهر البدوي الدميم، «وكان ﷺ يحبه» (الشمائل 240، B).\n\n### C09 أهل الكتاب وغير المحاربين\n- `Q-60:8-9`: البر والقسط مع غير المحارب (A)، و«نعم، صلي أمك» (البخاري 2620، مسلم 1003، B). المبدأ `P-C09-01`.\n\n### C11 المنافقون (أول مادة)\n| المعرّف | المضمون | الدرجة |\n|---|---|---|\n| `H-BKH-4900`–`4904` | قبول أيمانهم الظاهرة حتى نزل الوحي، ودعوتهم ليستغفر لهم | B |\n| `H-BKH-4905`، `4907` | ترك قتل ابن أبي: «لا يتحدث الناس أن محمداً يقتل أصحابه» | B |\n| `Q-63:1-8` | صفاتهم: الأيمان جنة، تعجبك أجسامهم، «هم العدو فاحذرهم» | A |\n\n**ملاحظة (E):** القرآن يكشف حقيقتهم ويأمر بالحذر، والتعامل النبوي الثابت في هذه النصوص بقي على الظاهر.\n\n### C12 المخطئون\n- حاطب: سؤال وسماع ثم عفو (البخاري 4890، B).\n- ابن عمر طلق امرأته وهي حائض: «فتغيّظ فيه»، ثم علّمه الطريقة (البخاري 4908، B).\n- «بئس أخو العشيرة» ثم إلانة القول (البخاري 6032، B).\n"}, {"code": "LM-00", "slug": "lm-00", "sec": "08", "title": "القيادة والإدارة والتخطيط", "short": "القيادة والإدارة والتخطيط", "md": "# القيادة والإدارة والتخطيط\n\n- **القسم:** 08 — القيادة والإدارة\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 3\n- **تنبيه:** المادة القيادية الكبرى في السيرة (الغزوات، الحديبية، إدارة المدينة) لم تُدرس بعد. هذا الملف يسجل ما ظهر حتى الدفعة 4 فقط.\n\n---\n\n## 1. النصوص الثابتة\n\n| المعرّف | المضمون القيادي | الدرجة |\n|---|---|---|\n| `Q-3:159` | اللين سبب اجتماع الأتباع، والفظاظة سبب انفضاضهم؛ العفو والاستغفار لهم؛ الشورى ثم العزم والتوكل | A |\n| `Q-33:21` | القائد قدوة بفعله لا بقوله فقط؛ حضوره ﷺ القتال بنفسه في الأحزاب، بحسب تفسير السعدي | A |\n| `Q-33:45-46` | وظائف الرسالة: الشهادة والتبشير والإنذار والدعوة والإنارة | A |\n| `Q-9:128` | الحرص على مصالح الأتباع والمشقة لما يشق عليهم | A |\n| `H-BKH-0007` | الكتاب إلى هرقل: صياغة دبلوماسية | B |\n| `H-BKH-3560` | قاعدة الأيسر ما لم يكن إثماً | B |\n\n---\n\n## 2. المبادئ المستخلصة\n\n### P-T18-01 — الخلق الحسن من القائد شرط لاجتماع الناس\n- **النص:** 3:159 (A).\n- **من قال به:** السعدي في تفسيره: الأخلاق الحسنة من الرئيس في الدين تجذب الناس، والسيئة تنفرهم، وإذا كان هذا للمعصوم فغيره أولى.\n- **نوع الاستدلال:** نص صريح في السبب («لانفضوا من حولك»).\n\n### P-T18-02 — الشورى في الأمور الاجتهادية، ثم العزم والتوكل\n- **النص:** 3:159 (A).\n- **من قال به:** السعدي، مع تعداد فوائد الشورى: تطييب النفوس، ونفي الاستبداد، وإنارة الأفكار، ورفع اللوم عند الخطأ.\n- **الحدود:** «في الأمر» عند السعدي: الأمور التي تحتاج إلى نظر وفكر، لا ما حسمه الوحي.\n- **التطبيقات النبوية للشورى:** لم تُدرس بعد.\n\n### P-T18-03 — الاحترام البروتوكولي مع الثبات على الرسالة\n- **النص:** `H-BKH-0007` (B). التفصيل في `PD-003`.\n- **نوع الاستدلال:** استنباط من صياغة نص واحد. **مبدئي.**\n\n### P-T10-01 — الأيسر ما لم يكن إثماً\n- **النص:** `H-BKH-3560` (B). التفصيل في `PD-005`.\n\n---\n\n### P-T22-01 — مسؤولية المبلّغ تقف عند البلاغ (الدفعة 2)\n- **النصوص:** «إنما أنت منذر من يخشاها» (79:45)؛ «فذكر إنما أنت مذكر، لست عليهم بمصيطر» (88:21–22)؛ ومعها من الدفعة 1: 18:6 بتفسير السعدي (A).\n- **نوع الاستدلال:** نصوص صريحة متعددة.\n- **الحدود:** الآيات في سياق الدعوة إلى الإيمان. تطبيقها على أدوار القيادة الإدارية يحتاج حذراً، لأن القائد الإداري مسؤول عن نتائج فريقه بخلاف الداعي مع المدعوين. الفرق مسجل للتحليل في دفعة القيادة.\n\n### P-T15-01 — عند تمام النصر: تسبيح وحمد واستغفار (الدفعة 2، مبدئي)\n- **النص:** سورة النصر (A).\n- **نوع الاستدلال:** نص صريح في التوجيه، والمواقف العملية عند فتح مكة لم تُدرس بعد. **مبدئي.**\n\n### P-T18-04 — الرسالة الصعبة تُبنى على رصيد الثقة (الدفعة 3)\n- **النص:** النداء على الصفا (البخاري 4971–4973، B). التفصيل في `PD-008`.\n- **نوع الاستدلال:** استنباط من تسلسل التصرف في نص صحيح متعدد الطرق.\n\n### ملاحظة من تصرف صحابي — تقديم صاحب العلم وإن صغر سنه\n- **النص:** إدخال عمر ابن عباس مع أشياخ بدر، ثم إظهار علمه لهم بسؤال عن سورة النصر (البخاري 4970، B).\n- **الوسم:** تصرف صحابي، لا نبوي. يُستأنس به في موضوع القيادة ولا يُنسب إلى النبي ﷺ.\n\n### P-T25-02 — التكليف يراعي ظروف الناس المعيشية (الدفعة 3)\n- **النص:** المزمل 20: خُفف قيام الليل لأن منهم مرضى، وآخرين يضربون في الأرض يبتغون من فضل الله، وآخرين يقاتلون (A).\n- **نوع الاستدلال:** نص صريح في التعليل.\n- **صلته بالقيادة (E):** من يضع الأعباء على الجماعة يراعي اختلاف أحوالهم: المريض، والعامل في رزقه، ومن يحمل عبئاً عاماً.\n\n## 3. الفجوات في هذا القسم\n- الشورى التطبيقية في بدر وأحد والخندق.\n- التفويض وتوزيع المهام.\n- إدارة الأزمات (الحديبية، الإفك، حنين).\n\n---\n\n## مبادئ أضافتها الدفعة 4\n\n### P-T18-05 — حساب أثر القرار على سمعة الرسالة\n- **النص:** طلب عمر قتل ابن أبي بعد قوله «ليخرجن الأعز منها الأذل»، فقال: «دعه، لا يتحدث الناس أن محمداً يقتل أصحابه» (البخاري 4905 و4907، B). التفصيل في `PD-011`.\n- **نوع الاستدلال:** تعليل نبوي صريح.\n- **الحدود (E):** العلة المنصوصة هي أثر الفعل على ما يتحدث به الناس عن الدعوة. ولا يُفهم منه ترك كل عقوبة مستحقة لأجل الصورة.\n\n### P-T18-06 — حفظ حق السابقين، والتجاوز عن زلتهم\n- **الأدلة:** حاطب: «إنه شهد بدراً» في رد طلب قتله (البخاري 4890، B)؛ الوصية بالأنصار في آخر خطبة: «قد قضوا الذي عليهم وبقي الذي لهم، فاقبلوا من محسنهم وتجاوزوا عن مسيئهم» (البخاري 3799، B)؛ ونقلها عمر في وصيته (البخاري 4888).\n- **نوع الاستدلال:** موقف وقول نبوي.\n\n### P-T18-07 — ثبات القائد في موضعه عند الهزيمة\n- **النص:** يوم حنين حين ولّى سرعان الناس كان على بغلته يقول: «أنا النبي لا كذب، أنا ابن عبد المطلب» (البخاري 2864، مسلم 1776، والشمائل 246، B)، وفي البخاري: «فلم يفر».\n- **نوع الاستدلال:** موقف واحد صحيح. **مبدئي** حتى تُدرس غزوة حنين كاملة.\n"}, {"code": "HBE-00", "slug": "hbe-00", "sec": "09", "title": "الأخلاق والتعامل الإنساني", "short": "الأخلاق والتعامل الإنساني", "md": "# الأخلاق والتعامل الإنساني\n\n- **القسم:** 09 — الأخلاق والسلوك الإنساني\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 3\n- **محتوى القسم:** المبادئ الأخلاقية العامة المستخلصة، كل مبدأ بأدلته ونوع الاستدلال وحدوده.\n\n---\n\n## P-T25-01 — النية أساس تقويم العمل\n- **النص:** «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى» (`H-BKH-0001`، B، متفق عليه).\n- **نوع الاستدلال:** نص صريح.\n- **مثال النص نفسه:** الهجرة، وهي عمل واحد في ظاهره، تتفاوت قيمتها بحسب المقصود منها.\n- **الحدود:** النية لا تصحح عملاً محرماً في ذاته؛ هذا قيد يذكره العلماء ويُوثق من الشروح في دفعة لاحقة (فجوة بحثية).\n\n## P-T07-01 — الصدق رأس المال الأخلاقي، ويشهد به الخصوم\n- **الأدلة:** `H-BKH-0007` (B)، `H-BKH-6982` في قول خديجة (B)، `Q-6:33` (A).\n- **نوع الاستدلال:** استقراء من ثلاثة أدلة مستقلة.\n- **الملاحظة المركزية (E):** أبو سفيان لم يستطع الكذب عليه أمام هرقل خوفاً من أن يؤثر عنه الكذب أمام قومه؛ أي أن قيمة الصدق كانت معترفاً بها حتى في مجتمع الخصومة، وكان صدق النبي ﷺ معروفاً فيه.\n\n## P-T12-01 — لا انتقام للنفس، والغضب لحرمات الله\n- **الأدلة:** `H-BKH-3560`، `H-MSL-2328` (B).\n- **نوع الاستدلال:** وصف لنمط متكرر من راوية لازمته.\n- **الحدود:** النص نفسه يستثني انتهاك حرمات الله والجهاد في سبيله.\n\n## P-T06-01 — الكرم يزداد في مواسم القرب من الله\n- **الأدلة:** `H-BKH-0006`، `H-MSL-2308` (B).\n- **نوع الاستدلال:** نص وصفي صريح.\n\n## P-C07-01 — المساواة بين الناس في التعليم والدعوة\n- **الأدلة:** `Q-80:1-10` (A)، `H-TRM-3331` (C).\n- **من قال به:** ابن كثير: لا يُخص بالإنذار أحد، ويُساوى فيه بين الشريف والضعيف. والسعدي: يُقدم طالب العلم الحريص المفتقر.\n\n## P-T16-01 — البلاغ على الإنسان، والنتيجة بيد الله\n- **الأدلة:** `Q-18:6`، `Q-6:33`، `Q-9:129` (A).\n- **من قال به:** السعدي: على الداعي بذل الأسباب مع التوكل، فإن لم يستجيبوا فلا يحزن ولا يأسف، لأن ذلك يضعف النفس بلا فائدة.\n- **نوع الاستدلال:** نص صريح مع تفسير معتمد.\n\n## P-T26-01 — الاستماع الكامل يسبق الترديد (مبدئي في مقام الوحي؛ والاستماع للناس في `P-T26-02`)\n- **الدليل:** `H-BKH-0005` و`Q-75:16-19`.\n- **نوع الاستدلال:** نص واحد في مقام تلقي الوحي. تعميمه على الاستماع للناس استنباط يحتاج أدلة أخرى.\n\n---\n\n## مبادئ أضافتها الدفعة 2\n\n## P-T09-01 — حسن الخلق معيار التفاضل، ونقاء الكلام منه\n- **الأدلة:** «إن من خياركم أحسنكم أخلاقاً»، مع وصفه ﷺ بأنه لم يكن فاحشاً ولا متفحشاً (البخاري 3559، مسلم 2321، B)؛ وكلامه المتمهل الذي يمكن عدّه (البخاري 3567، مسلم 2493، B).\n- **نوع الاستدلال:** قول نبوي صريح مع وصف لسلوكه من راويين.\n\n## P-T14-01 — السعة والضيق كلاهما ابتلاء، والكرامة ليست بالمال\n- **الأدلة:** الفجر 15–16 (A)، ويعضدها: العلق 6–7، والتكاثر، والهمزة 1–3، والعاديات 8 (A).\n- **نوع الاستدلال:** نص صريح متكرر المعنى.\n\n## P-T21-01 — الوفاء في الكيل والميزان\n- **الدليل:** المطففين 1–3 (A).\n- **نوع الاستدلال:** نص صريح. المواقف النبوية في البيع والشراء لم تُدرس بعد.\n\n## P-T06-02 — العطاء الخالص لا لمكافأة نعمة\n- **الدليل:** الليل 17–21 «وما لأحد عنده من نعمة تجزى، إلا ابتغاء وجه ربه الأعلى» (A).\n- **نوع الاستدلال:** نص صريح.\n\n## P-C07-02 — الإنفاق في الشدة على الأقرب والأحوج\n- **الدليل:** البلد 11–16: فك رقبة، وإطعام في يوم ذي مسغبة يتيماً ذا مقربة أو مسكيناً ذا متربة (A).\n- **نوع الاستدلال:** نص صريح يرتب الأولويات بحسب الحاجة والقرابة.\n\n## P-T04-01 — الصبر قرين العمل والتواصي، لا انعزال\n- **الأدلة:** العصر 3 «وتواصوا بالحق وتواصوا بالصبر»، والبلد 17 «وتواصوا بالصبر وتواصوا بالمرحمة»، والشرح 5–6 «إن مع العسر يسراً» (A).\n- **ملاحظة (E):** النصان الأولان يجعلان الصبر عملاً جماعياً يتواصى به الناس، ويقرنانه بالحق وبالرحمة.\n\n---\n\n## مبادئ أضافتها الدفعة 3\n\n## P-T13-01 — الهجر الجميل للمؤذي\n- **النص:** «واصبر على ما يقولون واهجرهم هجراً جميلاً» (73:10، A).\n- **نوع الاستدلال:** نص صريح.\n- **المعنى عند المفسرين (الدفعة 4):** السعدي: الهجر «حيث اقتضت المصلحة الهجر، الذي لا أذية فيه»، بالإعراض عن الأقوال المؤذية، مع جدالهم بالتي هي أحسن. ابن كثير: «الذي لا عتاب معه». (`QKB-04` البند 4).\n- **الحدود:** قيد السعدي «حيث اقتضت المصلحة» يجعله أداة بحسب الحال، لا قطيعة دائمة.\n\n## P-T24-01 — لا مداهنة في الأصول\n- **النص:** «فلا تطع المكذبين، ودّوا لو تدهن فيدهنون» (68:8–9، A)، ويعضده «لكم دينكم ولي دين» (109:6، A).\n- **الحدود:** النص في أصل الدين والعبادة. المرونة في الوسائل والمعاملات مسألة أخرى تُدرس من مواقف مثل صلح الحديبية.\n- **قول السعدي (الدفعة 4):** الإدهان موافقتهم على بعض ما هم عليه «بالقول، أو بالفعل، أو بالسكوت عما يتعين الكلام فيه». فالمذموم من السكوت ما تعين فيه الكلام.\n\n## P-T23-01 — التخطيط مع ربط النتيجة بمشيئة الله\n- **النص:** قصة أصحاب الجنة: أقسموا ليصرمنها مصبحين «ولا يستثنون» فطاف عليها طائف (68:17–20، A).\n- **نوع الاستدلال:** قصة قرآنية للاعتبار. المراد بـ«لا يستثنون» عند المفسرين يُوثق لاحقاً.\n\n## P-T02-01 — الرحمة تشمل الأسير\n- **النص:** «ويطعمون الطعام على حبه مسكيناً ويتيماً وأسيراً، إنما نطعمكم لوجه الله» (76:8–9، A).\n- **نوع الاستدلال:** نص صريح في الثناء على هذا الفعل.\n\n## P-T07-02 — الأمانة في البلاغ مضمونة بالوعيد\n- **النص:** «ولو تقوّل علينا بعض الأقاويل لأخذنا منه باليمين، ثم لقطعنا منه الوتين» (69:44–46، A).\n- **قيمته المنهجية:** أساس قرآني للثقة فيما بلّغه ﷺ عن ربه.\n\n---\n\n## مبادئ أضافتها الدفعة 4\n\n## P-T09-02 — المزاح حق لا كذب فيه، ولا يُترك حتى يجرح\n- **الأدلة:** «إني لا أقول إلا حقاً» جواباً لمن قال: إنك تداعبنا (الترمذي 1990، والشمائل 238، صححه الألباني، B)؛ «وهل تلد الإبل إلا النوق؟» (B)؛ «يا أبا عمير ما فعل النغير» (البخاري 6129، مسلم 2150، B)؛ زاهر و«أنت عند الله غالٍ» (الشمائل 240، B)؛ العجوز (الشمائل 241، C).\n- **نوع الاستدلال:** قول نبوي صريح في الضابط، مع خمسة مواقف مقبولة.\n- **الملاحظة (E):** في حديثي زاهر والعجوز انتهى المزاح بجبر الخاطر قبل الافتراق: «أنت عند الله غالٍ»، و«أخبروها أنها لا تدخلها وهي عجوز».\n\n## P-T26-02 — الإنصات الكامل للناس، وطلب الاستزادة\n- **الأدلة:** استزادته الشعر بقوله «هيه» مائة بيت (مسلم 2255، B)؛ سكوته وتبسمه في مجالس أصحابه وهم يتناشدون الشعر ويتذاكرون أمر الجاهلية (الشمائل 248، الترمذي 2850، B)؛ استماعه حديث أم زرع إلى آخره (البخاري 5189، B)؛ سؤاله حاطباً «ما هذا يا حاطب؟» وسماع عذره كاملاً (البخاري 4890، B)؛ «فدعاني فحدثته» في خبر زيد بن أرقم (البخاري 4900، B).\n- **نوع الاستدلال:** استقراء من خمسة مواقف مستقلة. **متقاطع.** وبه يتجاوز `P-T26-01` حد «المبدئي».\n\n## P-T08-01 — سماع صاحب الشأن قبل الحكم، والحكم بالظاهر\n- **الأدلة:** حاطب: سؤال مفتوح، ثم سماع العذر، ثم «إنه قد صدقكم» (البخاري 4890، B)؛ خبر زيد بن أرقم: سمع من زيد، ثم أرسل إلى ابن أبي وأصحابه فحلفوا، فقبل أيمانهم حتى نزل الوحي (البخاري 4900–4904، B).\n- **ويعضده:** «إن المقسطين عند الله على منابر من نور... الذين يعدلون في حكمهم وأهليهم وما ولوا» (مسلم 1827، B).\n- **نوع الاستدلال:** موقفان صحيحان وقول نبوي عام.\n- **الحدود:** الحكم بالظاهر في خبر زيد كان قبل نزول الوحي، ثم صحح الوحي النتيجة. ولا يُفهم منه أن الأيمان تقدّم على الشهادة في كل حال؛ أحكام القضاء مسألة فقهية لم تُدرس.\n\n## P-T13-02 — لين القول في المواجهة مع سيئ الخلق (مبدئي)\n- **الدليل:** «بئس أخو العشيرة»، ثم ألان له القول، و«إن شر الناس من تركه الناس اتقاء فحشه»، وفي البخاري: «يا عائشة متى عهدتني فحاشاً؟» (البخاري 6032، مسلم 2591، B).\n- **نوع الاستدلال:** موقف واحد. **مبدئي.**\n- **الحدود:** الفرق بين المداراة المحمودة والمداهنة المذمومة يُوثق من الشروح `RG-043`، ويُقرأ مع `P-T24-01`.\n\n## P-T23-02 — تدبير نفقة الأهل مع الزهد في النفس\n- **الأدلة:** كان ينفق على أهله نفقة سنتهم من فيء بني النضير، ويجعل الباقي في السلاح والكراع عدة (البخاري 4885 و5357، B)؛ مع «كان لا يدخر شيئاً لغد» (الشمائل 355، الترمذي 2362، B)؛ ومات ودرعه مرهونة على شعير لأهله (البخاري 2916، B).\n- **الجمع (ابن دقيق العيد، نقله ابن حجر):** عدم الادخار لنفسه، والادخار لغيره (`SD-016`).\n- **نوع الاستدلال:** نصوص صحيحة مع جمع منقول عن العلماء.\n\n## P-C09-01 — البر والقسط مع غير المحارب\n- **الأدلة:** «لا ينهاكم الله عن الذين لم يقاتلوكم في الدين ولم يخرجوكم من دياركم أن تبروهم وتقسطوا إليهم» (60:8، A)؛ و«نعم، صلي أمك» لأسماء في أمها المشركة (البخاري 2620، مسلم 1003، B).\n- **من قال به:** السعدي: البر والصلة والمكافأة بالمعروف والقسط، والمنهي عنه التولي بالنصرة والمودة. وابن كثير: الإحسان إليهم والعدل.\n- **الحدود:** الآية 60:9 تستثني المحاربين ومن أعان على الإخراج.\n"}, {"code": "DLA-00", "slug": "dla-00", "sec": "10", "title": "التطبيقات المعاصرة (الحالة بعد الدفعة 1)", "short": "التطبيقات المعاصرة", "md": "# التطبيقات المعاصرة (الحالة بعد الدفعة 1)\n\n- **القسم:** 10 — تطبيق المبادئ على الحياة المعاصرة\n- **آخر تحديث:** 15 نوفمبر 2026\n- **مستوى كل ما في هذا القسم: F** (تطبيق معاصر أو اجتهاد تحليلي). ليس قولاً منسوباً إلى النبي ﷺ، ولا حكماً شرعياً.\n- **وضع القسم:** مسودات. لم يُفتح وضع الإجابة عن الأسئلة اليومية بعد، التزاماً بتوجيه صاحب المشروع.\n\n---\n\n## ضوابط التطبيق\n\n1. كل تطبيق يذكر المبدأ الذي يستند إليه بمعرّفه، ودرجة ذلك المبدأ.\n2. لا يُبنى تطبيق على مبدأ موسوم «مبدئي» إلا مع التنبيه على ذلك.\n3. يُذكر ما لا يدخل في التطبيق، حتى لا يُستعمل المبدأ لتبرير تصرف متعسف.\n4. التطبيق لا ينقل حكماً فقهياً؛ المسائل الفقهية تُرد إلى أهلها.\n\n---\n\n## مسودات أولية\n\n### F-001 — موقف محرج في العمل أو البيت بحضور آخرين\n- **المستند:** `PD-002` (حادثة الصحفة، B)، و`P-T12-01` (B).\n- **التطبيق:** معالجة الأثر العملي أولاً، وتفسير الدافع الإنساني للحاضرين بكلمة هادئة بدل الإدانة، ثم إنصاف المتضرر بتعويض محدد يتحمله المتسبب، وتأجيل أي عتاب إلى غير محضر الناس.\n- **لا يدخل فيه:** السكوت عن الظلم؛ النص انتهى بإنصاف المتضرر.\n- **قوة المستند:** نص واحد. **مبدئي.**\n\n### F-002 — مخاطبة جهة أعلى أو صاحب منصب كبير برسالة رسمية\n- **المستند:** `PD-003` و`P-T18-03` (B).\n- **التطبيق:** إيجاز، وتسمية المخاطب بلقبه الرسمي، وتعريف المرسل بصفته الحقيقية دون تضخيم، وطلب واضح في جملة، وفائدة واضحة للمخاطب، والانطلاق من أرضية مشتركة.\n- **قوة المستند:** نص واحد. **مبدئي.**\n\n### F-003 — اختيار بين بديلين مشروعين\n- **المستند:** `PD-005` و`P-T10-01` (B).\n- **التطبيق:** عند تساوي البديلين في المشروعية يُقدم الأيسر على الناس وعلى النفس؛ ولا يُقدم الأيسر إن كان فيه إثم أو ظلم.\n- **قوة المستند:** نمط متكرر وصفته راوية لازمته.\n"}, {"code": "SD-00", "slug": "sd-00", "sec": "11", "title": "الخلاف بين العلماء وبين الروايات", "short": "الخلاف بين العلماء وبين الروايات", "md": "# الخلاف بين العلماء وبين الروايات\n\n- **القسم:** 11 — الخلافات العلمية والروائية\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 4\n- **القاعدة:** تُعرض الأقوال والروايات كلها بمصادرها. لا يُرجح المشروع من عنده؛ يُنقل ترجيح من رجّح من العلماء إن وُجد.\n- **أنواع الخلاف:** (أ) خلاف في الثبوت، (ب) خلاف بين الروايات في التفاصيل، (ج) خلاف في التفسير، (د) فروق لفظية لا تعارض فيها.\n\n---\n\n## SD-001 — معنى «خلق عظيم» في 68:4 — النوع (ج)\n- **الأقوال كما نقلها ابن كثير:** «دين عظيم وهو الإسلام» (ابن عباس من طريق العوفي، ومجاهد وأبو مالك والسدي والربيع والضحاك وابن زيد)؛ «أدب عظيم» (عطية)؛ وقول عائشة «كان خلقه القرآن» (مسلم 746، B).\n- **توجيه ابن كثير:** أن امتثال القرآن صار له سجية وخلقاً، مع ما جُبل عليه من الأخلاق.\n- **ملاحظة (E):** الأقوال متقاربة؛ كلها ترجع إلى أن خلقه هو تطبيق ما جاء به الوحي.\n\n## SD-002 — هيئة أول لقاء بالملك: يقظة أم منام؟ — النوع (ب)\n- **رواية الصحيح:** «حتى جاءه الحق وهو في غار حراء، فجاءه الملك فقال: اقرأ» (البخاري 3، B). لا ذكر للنوم في هذا الموضع.\n- **رواية ابن إسحاق:** «فجاءني جبريل وأنا نائم بنمط من ديباج فيه كتاب... وهببت من نومي» (ابن هشام، ت طه عبد الرءوف سعد، ج1 ص220–221). من رواية وهب بن كيسان عن عبيد بن عمير، **D**.\n- **جمع منقول (نقل ثانوي):** نُقل في كتاب معاصر على الشاملة (الكتاب 9800) أن رواية النوم كالتوطئة لما بعدها من اليقظة، وأن مغازي موسى بن عقبة عن الزهري صرحت بأنه رأى في المنام ثم جاءه الملك في اليقظة. لم يُفتح المصدر الأصلي لهذا الجمع.\n- **ما وجدناه في فتح الباري (الدفعة 2، ج1 ص9، مقروء من الأصل):** ذكر ابن حجر في مناسبة بدء البخاري بالوحي أن أول أحوال الأنبياء في الوحي الرؤيا، ونقل عن أبي نعيم في الدلائل **بإسناد حسن** (بحكم ابن حجر) عن علقمة بن قيس صاحب ابن مسعود: إن أول ما يؤتى به الأنبياء في المنام حتى تهدأ قلوبهم، ثم ينزل الوحي بعد في اليقظة. وهذا قول تابعي في أصل عام، لا نص في واقعة حراء.\n- **الموقف الحالي:** المقدم رواية الصحيح في أن نزول الملك بحراء كان في اليقظة. ورواية ابن إسحاق في النوم يمكن حملها على ما قبل ذلك بحسب قول علقمة، لكن لم نقف بعد على نص لابن حجر يجمع بين الروايتين صراحة في هذا الموضع.\n\n## SD-003 — خبر الحزن وإرادة التردي من الجبال — النوع (أ)\n- **الموضع:** البخاري 6982، بعد قوله «فيما بلغنا».\n- **حكم ابن حجر (فتح الباري، ط دار المعرفة، ج12 ص359–360، مقروء من الأصل):** الزيادة من رواية معمر، والقائل «فيما بلغنا» الزهري، «وهو من بلاغات الزهري وليس موصولاً». ونقل عن الكرماني احتمال أن يكون بلغه بالإسناد المذكور، وقال إن الأول هو المعتمد.\n- **حكم آخر (نقل ثانوي):** الشيخ محمد عوامة: من بلاغات الزهري وليس موصولاً، ومراسيل الزهري ضعيفة عند الشافعي والقطان وابن معين.\n- **رواية ابن إسحاق في نسخة ابن هشام المدروسة:** ذكر خروجه إلى وسط الجبل وسماع الصوت ورؤية جبريل في الأفق (ج1 ص221)، **ولم ترد فيها عبارة العزم على إلقاء النفس**. وذكر صاحب «الرحيق المختوم مع زيادات» أن عبارة العزم في رواية الطبري (نقل ثانوي). تاريخ الطبري لم يُقرأ بعد.\n- **رواية ابن سعد:** ذكر ابن حجر في الموضع نفسه أن عند ابن سعد عن ابن عباس نحو هذا الخبر. لم يُقرأ في طبقات ابن سعد بعد ولم يُحكم عليه.\n- **الدرجة الحالية: D.** لا يُبنى عليه وصف نفسي ولا مبدأ.\n\n## SD-004 — من الرجل الذي أقبل عليه النبي ﷺ في سبب نزول «عبس»؟ — النوع (ب)\n- **الثابت (C):** أن المعاتَب لأجله ابن أم مكتوم الأعمى (الترمذي 3331، وقول جمع من التابعين).\n- **في تعيين الآخر:**\n  - «رجل من عظماء المشركين» دون تسمية: الترمذي 3331.\n  - أُبي بن خلف: رواية قتادة عند أبي يعلى، ونبه محقق تفسير ابن كثير على أن «عن أنس» في إسنادها مقحم.\n  - عتبة بن ربيعة وأبو جهل والعباس: رواية العوفي عن ابن عباس. قال ابن كثير: «فيه غرابة ونكارة، وقد تُكلم في إسناده».\n  - حاشية محقق تفسير ابن كثير تنقل عن ابن العربي عبر السهيلي أن تعيين الوليد بن المغيرة وأمية بن خلف والعباس كله باطل لاعتبارات تاريخية.\n- **الموقف الحالي:** التعيين غير ثابت. يُكتفى بما في الترمذي.\n\n## SD-005 — الشهر الذي بدأ فيه نزول الوحي — النوع (ب)\n- **قول ابن إسحاق:** رمضان (ابن هشام ج1 ص217 وص219). وفي تاريخ ابن أبي خيثمة رواية لابن إسحاق بالمعنى نفسه (اطلاع ملخص عبر صفحة الشاملة 8477، لا يُحتسب قراءة).\n- **أقوال أخرى:** لم تُجمع بعد (فجوة بحثية).\n\n## SD-006 — لفظ حديث النية في أول البخاري — النوع (د)\n- **المشاهد:** رواية البخاري 1 ليس فيها جملة «فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله»، وهي في مسلم 1907.\n- **التوجيه (فتح الباري ج1 ص15، مقروء من الأصل، الدفعة 2):** قال ابن حجر إن الحديث وقع كذلك في جميع الأصول التي اتصلت به عن البخاري، بحذف أحد وجهي التقسيم. ونقل قول الخطابي إنه وقع في روايتهم «مخروماً قد ذهب شطره» مع أن البخاري ذكره من غير طريق الحميدي تاماً، وأن الأثبات رووه من طريق الحميدي تاماً. ونقل عن ابن العربي أنه لا عذر للبخاري في إسقاطه لأن الحميدي رواه في مسنده تاماً، وعن بعضهم احتمال أن يكون البخاري سمعه من حفظ الحميدي هكذا. وردّ ابن حجر فهم ابن التين أن في السند انقطاعاً.\n- **الحالة:** محسوم من حيث الثبوت: الجملة ثابتة في الصحيحين من طرق أخرى. سبب حذفها في الموضع الأول محل أقوال ذكرها ابن حجر.\n\n## SD-007 — القدر الذي أُقرئه أولاً من سورة العلق — النوع (د)\n- **البخاري 3:** إلى «اقرأ وربك الأكرم» (96:3).\n- **البخاري 6982:** «حتى بلغ: ما لم يعلم» (96:5).\n- **ابن هشام:** إلى «ما لم يعلم».\n- **ملاحظة (E):** الظاهر أنه اختصار من بعض الرواة لا تعارض. يُوثق من الشروح.\n\n## SD-008 — ألفاظ شهادة خديجة — النوع (د)\n- **البخاري 3:** «إنك لتصل الرحم، وتحمل الكَلّ، وتكسب المعدوم، وتقري الضيف، وتعين على نوائب الحق».\n- **البخاري 6982:** «إنك لتصل الرحم، وتصدق الحديث، وتحمل الكَلّ، وتقري الضيف، وتعين على نوائب الحق».\n- **الحاصل (E):** مجموع الروايتين ست خصال. والروايتان صحيحتان.\n\n## SD-009 — لغة كتابة ورقة بن نوفل — النوع (ب)\n- **البخاري 3:** «يكتب الكتاب العبراني، فيكتب من الإنجيل بالعبرانية».\n- **البخاري 6982:** «يكتب الكتاب العربي، فيكتب بالعربية من الإنجيل».\n- **التوجيه (فتح الباري ج1 ص25، مقروء من الأصل، الدفعة 2):** قال ابن حجر: «والجميع صحيح»، لأن ورقة تعلّم اللسان العبراني والكتابة العبرانية، فكان يكتب الكتاب العبراني كما كان يكتب الكتاب العربي لتمكنه من الكتابين واللسانين. ونبه في الموضع نفسه على أن ما وقع في مسلم من قول خديجة «يا عم» وهم، لأن القصة لم تتعدد ومخرجها واحد.\n- **الحالة:** محسوم بجمع ابن حجر.\n\n## SD-010 — مدة فترة الوحي — النوع (أ)\n- **مرسل الشعبي:** سنتان ونصف (نقله ابن حجر، فتح الباري ج12 ص360).\n- **رواية ابن سعد عن ابن عباس:** «مكث أياماً»، وقال ابن حجر إنها تفيد تقليل مدة الفترة.\n- **في الصحيح:** لم تُحدد المدة.\n- **كلام ابن حجر في أول بدء الوحي (ج1 ص27، مقروء من الأصل، الدفعة 2):**\n  - ذكر أن في تاريخ أحمد عن الشعبي أن مدة الفترة ثلاث سنين وبه جزم ابن إسحاق، ثم راجع لفظ الشعبي فوجده: نزلت عليه النبوة وهو ابن أربعين، فقُرن بنبوته إسرافيل ثلاث سنين يعلمه الكلمة والشيء ولم ينزل عليه القرآن، ثم قُرن به جبريل فنزل القرآن عشرين سنة.\n  - نبه على أن الفترة المقدرة بثلاث سنين لا تعني انقطاع جبريل، بل تأخر نزول القرآن فقط.\n  - نقل جمع السهيلي (الفترة سنتان ونصف، والرؤيا ستة أشهر) وقال: الاحتجاج بمرسل الشعبي «لا يثبت»، وعارضه ما جاء عن ابن عباس أن مدة الفترة كانت أياماً.\n  - ذكر من حكمة الفترة: أن يذهب عنه الروع، ويحصل له التشوف إلى العود.\n- **ملاحظة على النص:** في ج12 ص360 أحال ابن حجر إلى «مرسل الشعبي في أن مدة الفترة كانت سنتين ونصفاً كما نقلته في أول بدء الوحي»، والذي في ج1 ص27 «ثلاث سنين»، والسنتان ونصف هناك منسوبة إلى السهيلي. تعارض ظاهر بين الموضعين في النسخة المقروءة، مسجل فجوة `RG-031`.\n- **الموقف الحالي:** الأقوى عند ابن حجر أن الفترة قصيرة (أيام)، وتحديدها بسنوات مبني على مرسل لا يثبت عنده.\n\n## SD-011 — مدة إقامته ﷺ بمكة بعد البعثة، وسنه عند الوفاة — النوع (ب)\n- **رواية أنس:** «أُنزل عليه وهو ابن أربعين، فلبث بمكة عشر سنين ينزل عليه، وبالمدينة عشر سنين» (البخاري 3547 و3548، ومسلم 2347). مجموعها ستون.\n- **رواية ابن عباس:** «بُعث لأربعين سنة، فمكث بمكة ثلاث عشرة سنة يوحى إليه... ومات وهو ابن ثلاث وستين» (البخاري 3902).\n- **الروايتان في صحيح البخاري، والتعارض بينهما صريح.**\n- **ما وقفنا عليه من الجمع:** ذكر ابن حجر (ج1 ص27) أن مرسل الشعبي في اقتران إسرافيل به ثلاث سنين قبل نزول القرآن قد يجمع «إن ثبت» بين القولين في مدة إقامته بمكة، عشراً أو ثلاث عشرة. ونقل عن السهيلي جمعاً آخر بإضافة مدة الرؤيا والفترة أو حذفهما، ولم يقبل احتجاجه.\n- **شرح ابن حجر على حديث أنس (فتح الباري ج6 ص570، الدفعة 3، مقروء من الأصل):** قال إن مقتضى «فلبث بمكة عشر سنين» أنه عاش ستين، وإن مسلماً أخرج من وجه آخر عن أنس أنه عاش ثلاثاً وستين، «وهو موافق لحديث عائشة... وبه قال الجمهور». ونقل عن الإسماعيلي: لا بد أن يكون الصحيح أحدهما، وعن غيره الجمع **بإلغاء الكسر** (أي أن من قال عشراً أسقط الزائد على العقد). وذكر قولاً شاذاً عن سعيد بن المسيب أنه أُنزل عليه وهو ابن ثلاث وأربعين، وبه قال الواقدي. وأحال إلى تمام الكلام في الوفاة آخر المغازي.\n- **الموقف الحالي:** قول الجمهور: عاش ثلاثاً وستين، وأقام بمكة بعد البعثة ثلاث عشرة. ورواية العشر تُحمل على إلغاء الكسر عند من جمع. **يُعتمد في الخط الزمني قول الجمهور، مع ذكر الخلاف.**\n\n## SD-012 — رواية شريك بن عبد الله في الإسراء — النوع (أ)\n- **النص:** البخاري 3570، وفيه أن الإسراء كان «قبل أن يوحى إليه».\n- **تنبيه مسلم:** أورد مسلم رواية شريك بعد رواية ثابت البناني وقال: «وقدّم فيه شيئاً وأخّر، وزاد ونقص» (مسلم 162).\n- **كلام ابن حجر (فتح الباري ج13 ص480، الدفعة 3، مقروء من الأصل):** أخّر البخاري الكلام على رواية شريك إلى كتاب التوحيد «لما اختصت به من المخالفات». وقوله «قبل أن يوحى إليه» أنكره الخطابي وابن حزم وعبد الحق والقاضي عياض والنووي. ونقل عبارة النووي: في رواية شريك أوهام أنكرها العلماء، أحدها «قبل أن يوحى إليه»، وهو غلط لم يوافق عليه، وأجمع العلماء أن فرض الصلاة كان ليلة الإسراء فكيف يكون قبل الوحي. ثم قال ابن حجر: «وفي دعوى التفرد نظر»، وبقية كلامه لم تُقرأ.\n- **الموقف الحالي:** لفظ «قبل أن يوحى إليه» في رواية شريك منكر عند جمع من الأئمة، فلا يُبنى عليه تأريخ للإسراء. يُقرأ تمام كلام ابن حجر في الدفعة القادمة.\n\n## SD-013 — سبب نزول سورة الضحى — النوع (ب)\n- **رواية الصحيح (البخاري 4950 و4951، B):** مرض فلم يقم ليلتين أو ثلاثاً، فقالت امرأة: إن «شيطانه» تركه، فنزلت.\n- **رواية ابن إسحاق (ابن هشام ج1 ص225، D):** فترة الوحي حتى شق عليه ذلك.\n- **فرق داخل روايتي البخاري:** في إحداهما قول شامت صريح، وفي الأخرى «يا رسول الله ما أرى صاحبك إلا أبطأك».\n- **الموقف الحالي:** المقدم ما في الصحيح. توجيه الروايتين عند الشراح `RG-034`.\n\n## SD-014 — معنى «الكوثر» — النوع (ج)\n- **نهر في الجنة:** أنس في حديث المعراج (البخاري 4964)، وعائشة (4965).\n- **الخير الذي أعطاه الله إياه:** ابن عباس (4966).\n- **الجمع:** قال سعيد بن جبير: النهر الذي في الجنة من الخير الذي أعطاه الله إياه (4966).\n- **الحالة:** محسوم بجمع سعيد بن جبير.\n\n## SD-015 — المقصود بسورة النصر — النوع (ج)\n- **قول بعض أشياخ بدر:** أُمرنا أن نحمد الله ونستغفره إذا نُصرنا وفُتح علينا (البخاري 4970).\n- **قول ابن عباس، ووافقه عمر:** هي أجل رسول الله ﷺ أعلمه له؛ النصر والفتح علامة أجله (البخاري 4969 و4970).\n- **ملاحظة (E):** القولان لا يتعارضان: الأمر بالتسبيح والاستغفار عام، والإشارة إلى قرب الأجل خاصة به ﷺ. وتطبيقه العملي ثابت في البخاري 4967.\n\n---\n\n## SD-016 — «لا يدخر شيئاً لغد» و«يحبس لأهله قوت سنتهم» — النوع (ب) — **محسوم بجمع**\n- **الرواية الأولى:** أنس: «كان النبي ﷺ لا يدخر شيئاً لغد» (الشمائل 355، الترمذي 2362، صححه الألباني، B).\n- **الرواية الثانية:** عمر: «كان يبيع نخل بني النضير، ويحبس لأهله قوت سنتهم» (البخاري 5357، B)، ومثله في البخاري 4885: «ينفق على أهله منها نفقة سنته، ثم يجعل ما بقي في السلاح والكراع».\n- **الجمع (فتح الباري ج9 ص503، مقروء من الأصل):** نقل ابن حجر عن ابن دقيق العيد: يُحمل «لا يدخر شيئاً لغد» على الادخار لنفسه، وحبس القوت على الادخار لغيره، «حتى لو لم يوجدوا لم يدخر». وأضاف ابن حجر أنه ﷺ كان مع ذلك يأخذ من قوت السنة في أثنائها لمن يرد عليه ويعوضهم عنه، «ولذلك مات ﷺ ودرعه مرهونة على شعير اقترضه قوتاً لأهله».\n- **أقوال أخرى في الموضع نفسه:** استدل الطبري بالحديث على جواز الادخار مطلقاً، وقواه ابن حجر. ونقل عن عياض في ادخار القوت لمن يشتريه من السوق أقوالاً: الجواز، والمنع إلا إن لم يضر بالسعر. وقال ابن حجر: محل الخلاف في غير حال الضيق، «وإلا فلا يجوز الادخار في تلك الحالة أصلاً».\n\n## SD-017 — عدة الحامل المتوفى عنها زوجها — النوع (ج، فقهي)\n- **قول ابن عباس:** «آخر الأجلين» (البخاري 4909).\n- **ما احتج به أبو سلمة ووافقه أبو هريرة:** «وأولات الأحمال أجلهن أن يضعن حملهن» (65:4).\n- **الفاصل من السنة:** روت أم سلمة أن سبيعة الأسلمية وضعت بعد موت زوجها بأربعين ليلة، فأنكحها رسول الله ﷺ (البخاري 4909، B). وقال ابن مسعود: «أتجعلون عليها التغليظ ولا تجعلون عليها الرخصة؟ لنزلت سورة النساء القصرى بعد الطولى» (البخاري 4910).\n- **الحالة:** الفعل النبوي ثابت. تحرير المذاهب الفقهية في المسألة لم يُقرأ من كتب الفقه.\n\n## SD-018 — سبب نزول أول سورة التحريم — النوع (ب)\n- **في البخاري (B):** قصة العسل عند زينب بنت جحش، وتواطؤ عائشة وحفصة (البخاري 4912).\n- **قول آخر:** ذكر السعدي أن العتاب كان «حين حرم على نفسه سريته مارية أو شرب العسل... في قصة معروفة»، دون إسناد ولا ترجيح.\n- **الحالة:** المعتمد في القاعدة رواية البخاري. ورواية مارية تحتاج تخريجاً وحكماً `RG-046`.\n\n## SD-019 — جهاد المنافقين في 66:9 — النوع (ج)\n- **السعدي:** الجهاد مرتبتان: بالحجة والموعظة «بالتي هي أحسن»، وبالسلاح لمن أبى. والإغلاظ في الثانية.\n- **ابن كثير:** الكفار بالسلاح والقتال، والمنافقون «بإقامة الحدود عليهم».\n- **ملاحظة (E):** القولان يتفقان على أن جهاد المنافقين لم يكن بالقتال، ويتسقان مع ترك قتل ابن أبي في البخاري 4905.\n"}, {"code": "RG-00", "slug": "rg-00", "sec": "12", "title": "الفجوات البحثية", "short": "الفجوات البحثية", "md": "# الفجوات البحثية\n\n- **القسم:** 12 — ما يحتاج مزيد بحث\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 4\n- **الأولوية:** 1 عاجل يمنع البناء عليه، 2 مهم للدفعة القادمة، 3 للتوسع.\n- **الحالة:** مفتوحة، أو جزئية، أو مغلقة مع الإحالة إلى ما أغلقها.\n\n## 1. الفجوات المفتوحة والجزئية\n\n| المعرّف | الفجوة | المصدر المتوقع للحل | الأولوية | الحالة |\n|---|---|---|---|---|\n| `RG-001` | شرح ابن حجر الكامل على أحاديث بدء الوحي 1–7 | فتح الباري ج1 ص5–46 تقريباً | 2 | جزئية: قُرئت 7 مواضع مستهدفة في الدفعة 2 |\n| `RG-002` | نص صريح لابن حجر في الجمع بين رواية اليقظة ورواية النوم | فتح الباري، شرح الحديث 3 | 2 | جزئية: وُجد قول علقمة بإسناد حسن عند ابن حجر (`SD-002`) |\n| `RG-003` | توجيه القدر المقروء أولاً من العلق (`SD-007`) | فتح الباري | 3 | جزئية: أُغلق `SD-006` و`SD-009` |\n| `RG-005` | رواية الطبري لخبر العزم على إلقاء النفس، والحكم عليها | تاريخ الطبري | 2 | مفتوحة |\n| `RG-006` | حكم جزء ابن الناطور من حيث الاتصال | فتح الباري، شرح الحديث 7 | 3 | جزئية: زمن الهدنة حُدد (`E-S07-001`) |\n| `RG-007` | الحكم على «إنما بعثت لأتمم صالح الأخلاق» | السلسلة الصحيحة، تح 2 — الدفعة 1\n- إنشاء الأقسام الثلاثة عشر؛ اكتشاف مدونة OpenITI؛ ثبوت أن أداة الجلب لا تنقل النص.\n- مسح لفظي للمصحف؛ تفسير 12 مقطعاً؛ كتاب بدء الوحي؛ شواهد الخلق؛ ابن هشام ج1 ص217–222.\n- التقرير: `RP-01`.\n\n### الجلسة 3 — الدفعة 2\n- **اعتماد صاحب المشروع** للإضافتين في سلم الثقة (X للمردود، وعلامة الاستفهام للحكم المؤقت).\n- **فتح الباري:** 7 مواضع مستهدفة في شرح كتاب بدء الوحي؛ أُغلق `RG-004` و`RG-015`، وحُسم `SD-006` و`SD-009`، وتقدم `SD-002` و`SD-010`.\n- **البخاري:** باب صفة النبي ﷺ والباب الذي يليه كاملين (29 حديثاً) مع تخريجها في مسلم.\n- **القرآن:** توسيم موضوعي للجزء الثلاثين كاملاً (564 آية).\n- **خلافات جديدة:** `SD-011` (مدة الإقامة بمكة: عشر أم ثلاث عشرة، وكلتاهما في البخاري)، و`SD-012` (رواية شريك في الإسراء).\n- التقرير: `RP-02`.\n\n### الجلسة 4 — الدفعة 3\n- **القرآن:** توسيم موضوعي للجزء 29 كاملاً (431 آية). صار المجموع 995 آية (16%).\n- **البخاري، كتاب التفسير:** 14 حديثاً في أسباب نزول وتفسير مواضع من الجزأين 29 و30، مع التحقق من تبويبها في طبعة طوق النجاة.\n- **فتح الباري:** شرح ابن حجر على حديث أنس في مدة الإقامة (ج6 ص570)، وعلى حديث السدل (ج6 ص574)، وعلى رواية شريك (ج13 ص480).\n- **ابن هشام:** ج1 ص223–229.\n- **مسند أحمد:** حُدد موضع «إنما بعثت لأتمم صالح الأخلاق» (8952 في طبعة الرسالة)، وثبت أن نسخة OpenITI بلا حواشي التحقيق.\n- **حُسم:** `SD-011` بقول الجمهور (63 سنة)، و`SD-014`. **فُتح:** `SD-013` و`SD-015`.\n- التقرير: `RP-03`.\n\n### الجلسة 5 — الدفعة 4\n- **الشمائل:** ثمانية أبواب كاملة (61 رقماً) بأحكام الألباني من مختصره، مع التخريج من الصحيحين وجامع الترمذي. والنتيجة: 45 B، و4 C، و12 X.\n- **القرآن:** توسيم الجزء 28 كاملاً (137 آية). المجموع 1132 آية (18.2%).\n- **البخاري، كتاب التفسير:** سور الجزء 28 كلها (4882–4916).\n- **التفسير:** السعدي وابن كثير على تسع آيات محورية. أُغلق `RG-033` و`RG-037`.\n- **فتح الباري:** ج9 ص503 في الجمع بين «لا يدخر شيئاً لغد» و«قوت سنتهم» (`SD-016`).\n- **ابن هشام:** ج1 ص230–238.\n- **جديد:** `SD-016` إلى `SD-019`، و`PD-009` إلى `PD-012`، و`RG-041` إلى `RG-051`.\n- التقرير: `RP-04`.\n"}, {"code": "RP-01", "slug": "rp-01", "sec": "13", "title": "تقرير الدفعة البحثية 1", "short": "تقرير الدفعة البحثية 1", "md": "# تقرير الدفعة البحثية 1\n\n- **التاريخ:** 15 نوفمبر 2026\n- **محور الدفعة:** صورة النبي ﷺ في القرآن، وبدء الوحي بين الصحيح وكتب السيرة، وشواهد الخلق النبوي.\n\n---\n\n## 1. المصادر التي دُرست فعلياً\n\n| المصدر | النسخة | ما قُرئ من النص الكامل |\n|---|---|---|\n| المصحف | quran-api | مسح لفظي آلي لكل الآيات، وقراءة سياق كل نتيجة ملتبسة |\n| تفسير السعدي | tafsir_api | تفسير 32 آية في 12 مقطعاً |\n| تفسير ابن كثير | tafsir_api | تفسير 68:4 و80:1–10 |\n| صحيح البخاري | hadith-api | الأحاديث 1–7، 3549، 3560، 3902، 5225، 6038، 6982 |\n| صحيح مسلم | hadith-api | 2308، 2309، 2328 |\n| جامع الترمذي | hadith-api | 3331 |\n| سيرة ابن هشام | OpenITI، الشاملة 7450 | ج1 ص217–222 |\n| فتح الباري | OpenITI، الشاملة 1673 | ج12 ص359–360 |\n\n## 2. الأجزاء والأبواب المغطاة\n\n- **مكتمل:** كتاب بدء الوحي من صحيح البخاري (7 من 7). الفهرس اللفظي للمصحف (6 معايير على 6236 آية).\n- **جزئي:** ما سبق في الجدول.\n\n## 3. أهم النتائج\n\n1. **الإتاحة أوسع بكثير مما قُدّر في الخطة:** مدونة OpenITI تتيح النص الكامل الحرفي لأغلب المصادر التراثية ذات الأولوية، ومنها فتح الباري، وسيرة ابن هشام، والمسند، والأدب المفرد، والشمائل، وزاد المعاد، وكتاب القرافي في تمييز التصرفات. وفي المقابل ثبت أن أداة جلب صفحات الويب لا تصلح للقراءة.\n2. **الرحمة واللين سمة متقاطعة الأدلة:** خمسة أدلة مستقلة بين قرآن وشهادة خادم وشهادة زوجة.\n3. **الصدق تشهد به ثلاثة مصادر مستقلة،** أقواها شهادة أبي سفيان وهو خصم، وكان يتمنى أن يكذب لولا خوفه من أن يُعرف عنه الكذب.\n4. **رواية البخاري ورواية ابن إسحاق في بدء الوحي تختلفان في تفاصيل جوهرية:** اليقظة أو المنام، وذهاب النبي ﷺ إلى ورقة أو لقاء ورقة له عند الكعبة. المقدم رواية الصحيح.\n5. **خبر محاولة التردي من الجبال ليس ثابتاً:** ابن حجر صرح بأنه من بلاغات الزهري وليس موصولاً، ولم يرد في نسخة ابن هشام المدروسة.\n6. **القرآن نفسه سجل عتاباً على اجتهاد نبوي** (عبس)، وهذا أساس منهجي للتمييز بين التبليغ والاجتهاد.\n7. **أول نص صريح في أدب الاستماع:** حديث «لا تحرك به لسانك» (البخاري 5).\n\n## 4. أهم النصوص الموثقة\n\n| المعرّف | النص | الدرجة |\n|---|---|---|\n| `H-BKH-0003` | حديث بدء الوحي | B |\n| `H-BKH-0007` | حديث هرقل وأبي سفيان | B |\n| `H-BKH-3560` | ما خُير بين أمرين إلا أخذ أيسرهما... وما انتقم لنفسه | B |\n| `H-BKH-5225` | حادثة الصحفة: «غارت أمكم» | B |\n| `H-BKH-6038` | خدمة أنس عشر سنين | B |\n| `Q-3:159` | اللين والعفو والشورى | A |\n| `Q-80:1-10` و`H-TRM-3331` | عتاب عبس وسببه | A و C |\n\n## 5. ما يحتاج مراجعة\n\n- اثنتان وعشرون فجوة مسجلة في القسم 12. أعجلها: قراءة شرح فتح الباري على أحاديث بدء الوحي، والحكم على حديث «إنما بعثت لأتمم صالح الأخلاق».\n- حكم الألباني على الترمذي 3331 منقول من قاعدة بيانات، ويحتاج فتحاً في كتابه. ونسبة حكم إلى أحمد شاكر في الموضع نفسه مشكوك فيها.\n- تمييز المقصود في 47 موضعاً من «الرسول» بُني على سياق الآية وحده.\n\n## 6. تحديث قاعدة المعرفة\n\nأُنشئت الأقسام الثلاثة عشر كلها:\n- **محتوى أصيل:** 02 (ملفان)، 03 (ملفان)، 04، 05، 06، 11، 12، 13.\n- **فهارس ومسودات:** 01، 07، 08، 09، 10.\n- **حُدثت وثائق الحوكمة:** الخطة الرئيسية (الإصدار 1.1)، وسجل المصادر (بند الإتاحة الفعلية)، ومنهج التحقق (سلم A–F).\n\n## 7. نسبة الإنجاز لكل مصدر\n\nفي ملف التغطية `RP-00`. خلاصتها: كل المصادر دون 1%، إلا كتاب بدء الوحي (100%) والفهرس اللفظي للمصحف (100% لمعاييره).\n\n## 8. الخطوة البحثية التالية (الدفعة 2، مقترحة)\n\n1. **فتح الباري على كتاب بدء الوحي كاملاً،** لسد الفجوات `RG-001` إلى `RG-004` و`RG-006`.\n2. **التوسيم الموضوعي للقرآن، بدءاً بالجزأين 29 و30:** وفيهما أوائل ما نزل بمكة، وهي سياق المرحلتين `S02` و`S03`.\n3. **صحيح البخاري، كتاب المناقب، باب صفة النبي ﷺ** وما يليه، دراسة كاملة: أغنى باب في الصحيح للشمائل.\n4. **سيرة ابن هشام من ج1 ص223** متابعةً للمرحلة المكية، مع المقارنة بالصحيح.\n"}, {"code": "RP-02", "slug": "rp-02", "sec": "13", "title": "تقرير الدفعة البحثية 2", "short": "تقرير الدفعة البحثية 2", "md": "# تقرير الدفعة البحثية 2\n\n- **التاريخ:** 15 نوفمبر 2026\n- **محور الدفعة:** سد فجوات بدء الوحي من فتح الباري، وباب صفة النبي ﷺ في البخاري، والتوسيم الموضوعي لجزء عمّ.\n\n---\n\n## 1. المصادر التي دُرست فعلياً\n\n| المصدر | النسخة | ما قُرئ من النص الكامل |\n|---|---|---|\n| فتح الباري | OpenITI، الشاملة 1673، دار المعرفة 1379هـ | 7 مواضع مستهدفة في ج1: ص9، 15، 20، 25، 27، 34، 40 |\n| صحيح البخاري | طبعة طوق النجاة (الشاملة 1681) لتحديد الباب، وhadith-api للنص | الأحاديث 3542–3570 (29 حديثاً)، ج4 ص187–191 |\n| صحيح مسلم | hadith-api | بحث نصي للتخريج: 11 موضعاً جديداً |\n| المصحف | quran-api | الجزء 30 كاملاً: 564 آية |\n\n## 2. الأجزاء والأبواب المغطاة\n\n- **مكتمل:** باب صفة النبي ﷺ (27 من 27)، وباب «كان النبي ﷺ تنام عينه ولا ينام قلبه» (2 من 2)، والتوسيم الموضوعي للجزء 30 (564 من 564).\n- **جزئي:** فتح الباري على كتاب بدء الوحي (مواضع مستهدفة).\n\n## 3. أهم النتائج\n\n1. **تعارض صريح داخل صحيح البخاري في مدة الإقامة بمكة:** أنس يقول عشر سنين (3547، 3548)، وابن عباس ثلاث عشرة (3902). سُجل في `SD-011` دون ترجيح، مع ما ذكره ابن حجر من وجوه الجمع.\n2. **فترة الوحي قصيرة على الأرجح عند ابن حجر:** تحديدها بسنتين ونصف أو ثلاث سنين مبني على مرسل الشعبي، وقال ابن حجر إن الاحتجاج به «لا يثبت»، وعارضه بما عن ابن عباس أنها أيام. ووُجد تعارض ظاهر بين موضعين من فتح الباري نفسه (ج1 ص27 وج12 ص360) سُجل للمراجعة.\n3. **أُغلق خلافان لفظيان بكلام ابن حجر:** حذف جملة «فمن كانت هجرته إلى الله ورسوله» من أول البخاري، وكتابة ورقة بالعبرانية أو العربية («والجميع صحيح»).\n4. **نمط شخصي واضح من خمسة صحابة:** انفعاله ﷺ يظهر على وجهه سروراً وكراهة، ولا يتحول إلى فحش في القول ولا انتقام للنفس.\n5. **أسلوب الكلام:** لا فحش، وكلام متمهل يمكن عدّه، لا سرد متتابع. وقوله: «إن من خياركم أحسنكم أخلاقاً».\n6. **أول نص في القاعدة لموضوع النجاح `T15`:** سورة النصر: التسبيح والحمد والاستغفار عند تمام النصر.\n7. **جزء عمّ يحدد حدود دور النبي ﷺ:** «إنما أنت منذر»، «إنما أنت مذكر، لست عليهم بمصيطر».\n8. **أول نصوص في المال والتجارة:** الويل للمطففين، والسعة والضيق كلاهما ابتلاء (الفجر 15–16).\n9. **قاعدة منهجية من نص صحيح:** «كان يحب موافقة أهل الكتاب فيما لم يؤمر فيه بشيء» ثم ترك ذلك (3558). تتصل مباشرة بالتفريق بين العادة والتشريع.\n10. **تنبيه من مسلم نفسه على رواية شريك في الإسراء:** «قدّم فيه شيئاً وأخّر، وزاد ونقص».\n\n## 4. أهم النصوص الموثقة\n\n| المعرّف | النص | الدرجة |\n|---|---|---|\n| `H-BKH-3559` | لم يكن فاحشاً ولا متفحشاً، و«إن من خياركم أحسنكم أخلاقاً» | B |\n| `H-BKH-3562` | أشد حياء من العذراء، ويُعرف كرهه في وجهه | B |\n| `H-BKH-3567` | يحدث حديثاً لو عدّه العاد لأحصاه | B |\n| `H-BKH-3556` | إذا سُرّ استنار وجهه حتى كأنه قطعة قمر | B |\n| `H-BKH-3558` | موافقة أهل الكتاب فيما لم يؤمر فيه | B |\n| `H-BKH-3547` و`H-BKH-3902` | التعارض في مدة الإقامة بمكة | B |\n| `Q-110` | سورة النصر | A |\n| `Q-89:15-16` | الابتلاء بالسعة والضيق | A |\n\n## 5. ما يحتاج مراجعة\n\n- 11 فجوة جديدة (`RG-023` إلى `RG-033`)، أهمها: أسباب النزول المشهورة في جزء عمّ، وشرح ابن حجر على 3547 و3902، والتبرك بآثاره ﷺ.\n- الحكم على «إنما بعثت لأتمم صالح الأخلاق» ما زال مفتوحاً (أولوية 1).\n- نسخة قاعدة البيانات للبخاري 3562 ناقصة الجملة الثانية؛ أُكملت من طبعة طوق النجاة. يدل هذا على ضرورة المطابقة مع طبعة محققة قبل الاقتباس.\n\n## 6. تحديث قاعدة المعرفة\n\n- **ملفات جديدة:** `QKB-03` (جزء عمّ)، `HKB-BKH-02` (باب صفة النبي ﷺ)، وهذا التقرير.\n- **ملفات حُدّثت:** منهج التحقق (اعتماد X وعلامة الاستفهام)، الشخصية `PC-00` (لوحة الحالة أُعيد بناؤها، وأُضيفت ثلاث خلاصات متقاطعة)، السيرة `SC-S01-S02`، العلاقات `FSR-00`، القيادة `LM-00`، الأخلاق `HBE-00` (ستة مبادئ جديدة)، الخلاف `SD-00`، الفجوات `RG-00`، الفهرس `MKI-00`، التغطية `RP-00`.\n\n## 7. نسبة الإنجاز لكل مصدر\n\nفي `RP-00`. أبرز التغير: التوسيم الموضوعي للمصحف من 0% إلى 9.0%، وصحيح البخاري من 0.17% إلى 0.53%.\n\n## 8. الخطوة البحثية التالية (الدفعة 3، مقترحة)\n\n1. **الجزء 29 (تبارك):** توسيم موضوعي كامل، ومعه سور المزمل والمدثر والقلم المتصلة ببدء الدعوة.\n2. **فتح الباري:** شرح الأحاديث 3547 و3902 (مدة الإقامة بمكة)، و3558 (السدل)، و3570 (رواية شريك).\n3. **أسباب النزول الموثقة لجزء عمّ** من كتاب التفسير في صحيح البخاري ومن أسباب النزول للواحدي.\n4. **سيرة ابن هشام:** المرحلة المكية الأولى من ج1 ص223.\n5. **الحكم على «إنما بعثت لأتمم صالح الأخلاق»** من مسند أحمد في OpenITI، إن كانت نسخته بتحقيق يذكر الحكم.\n"}, {"code": "RP-03", "slug": "rp-03", "sec": "13", "title": "تقرير الدفعة البحثية 3", "short": "تقرير الدفعة البحثية 3", "md": "# تقرير الدفعة البحثية 3\n\n- **التاريخ:** 15 نوفمبر 2026\n- **محور الدفعة:** جزء تبارك، وأسباب النزول الموثقة لجزأي عمّ وتبارك، ومراجعة ابن حجر في مسائل معلقة، وبداية المرحلة المكية.\n\n---\n\n## 1. المصادر التي دُرست فعلياً\n\n| المصدر | النسخة | ما قُرئ من النص الكامل |\n|---|---|---|\n| المصحف | quran-api | الجزء 29 كاملاً: 431 آية |\n| صحيح البخاري، كتاب التفسير | hadith-api، والتبويب من طبعة طوق النجاة ج6 ص159–179 | 14 حديثاً: 4917، 4921، 4950، 4951، 4958، 4964–4967، 4969–4973 |\n| فتح الباري | OpenITI، دار المعرفة | ج6 ص570 (مدة الإقامة بمكة)، ج6 ص574 (السدل)، ج13 ص480 (رواية شريك) |\n| سيرة ابن هشام | OpenITI، ت طه عبد الرءوف سعد | ج1 ص223–229 |\n| مسند أحمد | OpenITI، طبعة الرسالة | تحديد موضع حديث واحد |\n\n## 2. الأجزاء والأبواب المغطاة\n\n- **مكتمل:** التوسيم الموضوعي للجزء 29 (431 من 431). المجموع مع الدفعة السابقة: 995 آية من المصحف.\n- **جزئي:** كتاب التفسير في البخاري (أحاديث الجزأين 29 و30 المتصلة بمحاور المشروع)، وابن هشام حتى ج1 ص229.\n\n## 3. أهم النتائج\n\n1. **الصبر أكثر ما أُمر به النبي ﷺ في القرآن المكي المدروس:** خمسة أوامر صريحة في جزء تبارك وحده، كلها في سياق أذى المكذبين، ومنها «فاصبر صبراً جميلاً» و«واهجرهم هجراً جميلاً».\n2. **شهادة جماعية بالصدق:** على الصفا قالت قريش مجتمعة «ما جربنا عليك كذباً» (البخاري 4971). صار الصدق أقوى صفة توثيقاً في القاعدة: خمسة أدلة مستقلة.\n3. **أسلوب خطاب واضح من نص صحيح:** على الصفا بدأ بسؤال يستخرج اعترافهم بصدقه، ثم بنى عليه الإنذار.\n4. **النجاح: نص وتطبيق:** بعد نزول سورة النصر كان يقول في كل صلاة «سبحانك ربنا وبحمدك، اللهم اغفر لي» (البخاري 4967). وفهم ابن عباس، ووافقه عمر، أن السورة إشارة إلى قرب أجله.\n5. **حدود علمه وقدرته بنصوص صريحة:** «لا أملك لكم ضراً ولا رشداً»، «قل إن أدري»، «إنما العلم عند الله».\n6. **التوازن بين العبادة والعمل:** سورة المزمل خففت قيام الليل لأجل المرضى، والمسافرين في طلب الرزق، والمجاهدين.\n7. **حُسم خلاف مدة الإقامة بمكة:** نقل ابن حجر أن الجمهور على أنه عاش ثلاثاً وستين، وأن مسلماً روى ذلك عن أنس نفسه من وجه آخر، وأن رواية العشر تُحمل على إلغاء الكسر.\n8. **رواية شريك في الإسراء:** لفظ «قبل أن يوحى إليه» أنكره الخطابي وابن حزم وعبد الحق والقاضي عياض والنووي.\n9. **سبب ترك موافقة أهل الكتاب:** عند ابن حجر، كانت موافقتهم مقدمة حين كان عبّاد الأوثان أكثر، فلما أسلم أكثرهم أحب مخالفة أهل الكتاب.\n10. **سبب نزول الضحى في الصحيح غير ما عند ابن إسحاق:** في البخاري مرضه وشماتة امرأة، وعند ابن إسحاق فترة الوحي.\n\n## 4. أهم النصوص الموثقة\n\n| المعرّف | النص | الدرجة |\n|---|---|---|\n| `H-BKH-4971` | الجهر على الصفا: «ما جربنا عليك كذباً» | B |\n| `H-BKH-4967` | «سبحانك ربنا وبحمدك، اللهم اغفر لي» بعد سورة النصر | B |\n| `H-BKH-4950` | سبب نزول الضحى | B |\n| `H-BKH-4921` | استماع الجن بنخلة | B |\n| `H-BKH-4958` | توعد أبي جهل: «لو فعله لأخذته الملائكة» | B |\n| `Q-73:10` | «واهجرهم هجراً جميلاً» | A |\n| `Q-73:20` | تخفيف قيام الليل مراعاة لأحوال الناس | A |\n| `Q-72:21` | «لا أملك لكم ضراً ولا رشداً» | A |\n\n## 5. ما يحتاج مراجعة\n\n- **«إنما بعثت لأتمم صالح الأخلاق» ما زال بلا حكم موثق:** موضعه في المسند 8952 (طبعة الرسالة)، لكن نسخة OpenITI منها بلا حواشي الأرنؤوط. البديل: كتب الألباني أو نسخة أخرى من المسند فيها الحواشي، أو موصل الشاملة.\n- **سبعة فجوات جديدة** (`RG-034` إلى `RG-040`)، أهمها: معنى «الهجر الجميل»، والجمع بين فرض الصلاة ركعتين أول البعثة وفرض الخمس ليلة الإسراء، ومدة الدعوة السرية.\n- **مصادر ابن إسحاق في الصفحات المقروءة أكثرها غير مسند** («بعض أهل العلم»، «من أثق به»، مراسيل). صُنفت D، والثابت منها له شاهد في البخاري.\n\n## 6. تحديث قاعدة المعرفة\n\n- **ملفات جديدة:** `QKB-04` (جزء تبارك)، `HKB-BKH-03` (أسباب النزول من كتاب التفسير)، `SC-S02-S03` (الدعوة الأولى في مكة، تسعة أحداث)، وهذا التقرير.\n- **ملفات حُدّثت:** `QKB-03` (ربط أسباب النزول الموثقة)، `HKB-BKH-02` (شرح ابن حجر على السدل ورواية شريك)، `PC-00` (خلاصتان جديدتان، و`T07` و`T13` و`T15` و`T22` و`T25` صارت متقاطعة)، `PD-00` (قراران جديدان)، `FSR-00`، `LM-00`، `HBE-00` (خمسة مبادئ جديدة)، `SD-00` (ثلاثة خلافات جديدة وحسم اثنين)، `RG-00`، `MKI-00`، `RP-00`.\n\n## 7. نسبة الإنجاز لكل مصدر\n\nفي `RP-00`. أبرز التغير: التوسيم الموضوعي للمصحف 16%، وصحيح البخاري 0.71%، وسيرة ابن هشام 2.1%.\n\n## 8. الخطوة البحثية التالية (الدفعة 4، مقترحة)\n\n1. **الشمائل المحمدية:** البدء بدراستها كاملة من طبعة الجليمي (الشاملة 13037) مع أحكام الألباني من مختصر الشمائل (الشاملة 700)، وكلاهما متاح في OpenITI. هذا أهم مصدر للقسم الأعمق في المشروع، ولم يبدأ بعد.\n2. **الجزء 28 (قد سمع):** وفيه سور مدنية أساسية في البيت النبوي والعلاقات (المجادلة، الحشر، الممتحنة، الطلاق، التحريم).\n3. **ابن هشام:** متابعة المرحلة المكية من ج1 ص230.\n4. **تفسير الآيات المحورية في جزء تبارك** من تفسيري السعدي وابن كثير: 68:9، 70:5، 73:10، 73:20، 72:21.\n"}, {"code": "RP-04", "slug": "rp-04", "sec": "13", "title": "تقرير الدفعة البحثية 4", "short": "تقرير الدفعة البحثية 4", "md": "# تقرير الدفعة البحثية 4\n\n- **التاريخ:** 15 نوفمبر 2026\n- **محور الدفعة:** بدء الشمائل المحمدية بأبواب الخلق، والجزء 28 من القرآن مع كتاب التفسير من البخاري، وتفسير آيات محورية، وتكملة المرحلة المكية.\n\n---\n\n## 1. المصادر التي دُرست فعلياً\n\n| المصدر | النسخة | ما قُرئ من النص الكامل |\n|---|---|---|\n| الشمائل المحمدية | OpenITI، الشاملة 13037، ت الجليمي | ثمانية أبواب كاملة: 61 رقماً (224–254، 331–360) |\n| مختصر الشمائل للألباني | OpenITI، الشاملة 700 | أحكام الأرقام الـ61 نفسها |\n| المصحف | quran-api | الجزء 28 كاملاً: 137 آية |\n| صحيح البخاري، كتاب التفسير | hadith-api، والتبويب من طوق النجاة ج6 ص147–159 | سور الجزء 28 كلها: 35 حديثاً (4882–4916)، ومعها 3801 و5664 و6034 |\n| تفسير السعدي | tafsir_api | 62 آية في تسعة مواضع |\n| تفسير ابن كثير | tafsir_api | 7 آيات في أربعة مواضع |\n| فتح الباري | OpenITI | ج9 ص503 (موضع مستهدف) |\n| سيرة ابن هشام | OpenITI | ج1 ص230–238 |\n\n## 2. الأجزاء والأبواب المغطاة\n\n- **مكتمل:** ثمانية أبواب من الشمائل (من 56)، والجزء 28 توسيماً (فصارت الأجزاء 28–30 مكتملة)، وكتاب التفسير في البخاري لسور الجزء 28.\n- **جزئي:** ابن هشام حتى ج1 ص238، والتفسير في مواضع مختارة.\n\n## 3. أهم النتائج\n\n1. **الأوصاف الجامعة المشهورة لكلامه ومجلسه ضعيفة جداً.** «متواصل الأحزان»، «دائم الفكرة»، «طويل السكت»، «دائم البشر»، «جزأ دخوله ثلاثة أجزاء»، «يتغافل عما لا يشتهي»: كلها من حديث واحد عن هند بن أبي هالة وعن الحسين عن علي، من طريق رجل لم يُسمّ، وحكم عليه الألباني بأنه ضعيف جداً. وهي شائعة جداً. أُخرجت من القاعدة إلى قائمة تحذير.\n2. **12 من 61 رقماً في أبواب الخلق من الشمائل ضعيفة** عند الألباني. منها «لا يكاد يواجه أحداً بشيء يكرهه»، و«كان لا يضحك إلا تبسماً» بصيغة الحصر.\n3. **الضحك:** الغالب التبسم (صحيح)، وثبت أيضاً أنه ضحك حتى بدت نواجذه (مسلم 190، البخاري 6571).\n4. **المزاح:** ضابطه منصوص: «إني لا أقول إلا حقاً». وفي حديثي زاهر والعجوز انتهى المزاح بجبر الخاطر.\n5. **الإنصات صار متقاطعاً بخمسة مواقف:** «هيه» واستزادة مائة بيت، وسكوته في مجالس أصحابه، وأم زرع، و«ما هذا يا حاطب؟»، و«فدعاني فحدثته».\n6. **ثلاثة قرارات صحيحة في التعامل مع المخطئ والمنافق:**\n   - **حاطب:** سؤال، فسماع، فحكم بالصدق، وحفظ سابقته في بدر.\n   - **زيد بن أرقم وابن أبي:** حكم بالظاهر من الأيمان، ثم صحح الوحي النتيجة.\n   - **ابن أبي:** ترك قتله بنص التعليل: «لا يتحدث الناس أن محمداً يقتل أصحابه».\n7. **البيت النبوي في الصحيح:**\n   - فيه خلاف حقيقي: زوجات يراجعنه «حتى يظل يومه غضبان»، وتواطؤ في قصة العسل، وغيرة مجتمعة.\n   - ووسائله: ترك الاستقصاء في العتاب «عرّف بعضه وأعرض عن بعض»، والاعتزال المؤقت. ولا ضرب ولا سب.\n   - وفيه تصحيح قرآني ثانٍ لتصرف نبوي (66:1)، بعد عبس.\n8. **قوت السنة والزهد:** «لا يدخر شيئاً لغد» مع «يحبس لأهله قوت سنتهم». جمع ابن دقيق العيد بينهما: لا يدخر لنفسه، ويدخر لأهله. وأضاف ابن حجر أنه كان يعطي من قوت السنة لمن يرد عليه، ولذلك مات ودرعه مرهونة.\n9. **البر بغير المحارب:** 60:8 بتفسيري السعدي وابن كثير، مع «نعم، صلي أمك» (البخاري 2620).\n10. **الهجر الجميل:** عند السعدي هجر لا أذية فيه حيث اقتضت المصلحة، مع الجدال بالتي هي أحسن. وعند ابن كثير: هجر لا عتاب معه.\n11. **81:24:** الضمير للنبي ﷺ، وبالقراءتين: لا يُتهم في الوحي، ولا يبخل به.\n12. **ابن هشام:** ابن إسحاق يحدد المرحلة السرية بثلاث سنين «فيما بلغني». وقصة تخيير زيد بن حارثة، وقول «ما دعوت أحداً إلا كانت فيه كبوة إلا أبا بكر»، كلاهما بلا إسناد.\n\n## 4. أهم النصوص الموثقة\n\n| المعرّف | النص | الدرجة |\n|---|---|---|\n| `H-BKH-4890` | حاطب: «ما هذا يا حاطب؟»... «إنه شهد بدراً» | B |\n| `H-BKH-4905` | «دعه، لا يتحدث الناس أن محمداً يقتل أصحابه» | B |\n| `H-BKH-4913` | مراجعة الزوجات، والاعتزال، والحصير، و«أما ترضى أن تكون لهم الدنيا ولنا الآخرة» | B |\n| `H-BKH-4885` | نفقة سنة للأهل، والباقي عدة | B |\n| `H-SHM-0238` | «إني لا أقول إلا حقاً» | B |\n| `H-SHM-0248` | جالسته أكثر من مائة مرة... وهو ساكت وربما تبسم معهم | B |\n| `H-MSL-2326` | امرأة في عقلها شيء: «انظري أي السكك شئت حتى أقضي لك حاجتك» | B |\n| `H-MSL-1827` | «المقسطون... الذين يعدلون في حكمهم وأهليهم وما ولوا» | B |\n| `Q-60:8` | البر والقسط مع غير المحارب | A |\n| `Q-66:3` | «عرّف بعضه وأعرض عن بعض» | A |\n\n## 5. ما يحتاج مراجعة\n\n- **«إنما بعثت لأتمم صالح الأخلاق»:** ما زال بلا حكم موثق (`RG-007`).\n- **تعارض في بيانات hadith-api:** نُسب إلى الألباني تضعيف الترمذي 2754، وفي مختصره تصحيح الحديث نفسه (`RG-042`). اعتمدنا كتابه.\n- **11 فجوة جديدة** (`RG-041` إلى `RG-051`)، أهمها:\n  - سبب اعتزاله أزواجه ومدته.\n  - رواية مارية في سبب نزول التحريم.\n  - الفرق بين المداراة والمداهنة.\n  - إسناد قصة تخيير زيد.\n- **أحكام الألباني في المختصر بلا تعليل.** وما خالف فيه غيره يحتاج مراجعة في كتبه الأخرى.\n\n## 6. تحديث قاعدة المعرفة\n\n- **ملفات جديدة:**\n  - `HKB-SHM-01`: الشمائل.\n  - `HKB-BKH-04`: تفسير الجزء 28 من البخاري.\n  - `QKB-05`: توسيم الجزء 28.\n  - `RP-04`: هذا التقرير.\n- **ملفات حُدّثت:**\n  - `QKB-03` و`QKB-04`: التفسير المقروء.\n  - `SC-S02-S03`: سبعة أحداث جديدة، `E-S03-008` إلى `014`.\n  - `PC-00`: ست خلاصات جديدة (2.10–2.15)، وصار `T17` و`T20` بدايتين، وتحذيرات جديدة.\n  - `PD-00`: `PD-009` إلى `PD-012`.\n  - `HBE-00`: ستة مبادئ.\n  - `LM-00`: ثلاثة مبادئ.\n  - `FSR-00`: إضافات في عشر فئات، منها أول مادة عن المنافقين `C11`.\n  - `SD-00`: `SD-016` إلى `SD-019`.\n  - `RG-00`: إغلاق `RG-033` و`RG-037`.\n  - `MKI-00` و`RP-00`.\n\n## 7. نسبة الإنجاز لكل مصدر\n\nفي `RP-00`. أبرز التغير:\n\n| المصدر | النسبة |\n|---|---|\n| الشمائل | 14.7% (61 من 415) |\n| التوسيم الموضوعي للمصحف | 18.2% |\n| صحيح البخاري | 1.22% |\n| تفسير السعدي | 1.51% |\n| سيرة ابن هشام | 3.6% |\n\n## 8. الخطوة البحثية التالية (الدفعة 5، مقترحة)\n\n1. **الشمائل:** أبواب العبادة والصوم والقراءة والبكاء والنوم (39–46)، ثم العيش والوفاة (52–55).\n2. **فتح الباري** على المواضع المعلقة الأعلى قيمة:\n   - البخاري 6032 (المداراة، `RG-043`).\n   - البخاري 4913 وروايات الاعتزال الأخرى (`RG-047`).\n   - البخاري 4892 (`RG-045`).\n3. **الجزء 27** (الذاريات إلى الحديد).\n4. **ابن هشام:** من ص238، مشي أشراف قريش إلى أبي طالب.\n"}], "sections": [["00", "الحوكمة"], ["01", "الفهرس الرئيسي"], ["02", "القرآن"], ["03", "الأحاديث"], ["04", "السيرة"], ["05", "الشخصية"], ["06", "القرارات"], ["07", "الأسرة والعلاقات"], ["08", "القيادة"], ["09", "الأخلاق"], ["10", "التطبيقات"], ["11", "الخلافات"], ["12", "الفجوات"], ["13", "تقدم البحث"]], "names": {"S01": "ما قبل البعثة", "S02": "نزول الوحي وبداية الدعوة", "S03": "المرحلة المكية", "S04": "الهجرة إلى المدينة", "S05": "تأسيس المجتمع والدولة في المدينة", "S06": "الغزوات والأحداث الكبرى", "S07": "العلاقات مع القبائل والدول", "S08": "صلح الحديبية", "S09": "فتح مكة", "S10": "حجة الوداع", "S11": "السنوات والأيام الأخيرة", "T01": "شخصيته الإنسانية", "T14": "التعامل مع الفقر والغنى", "T02": "الرحمة والرفق واللين", "T15": "التعامل مع النجاح والفشل", "T03": "الحزم والقوة عند الحاجة", "T16": "التعامل مع الخوف والقلق والحزن", "T04": "الصبر والتحمل", "T17": "التعامل مع الأصدقاء والأعداء", "T05": "التواضع", "T18": "القيادة وإدارة الجماعات", "T06": "الكرم والعطاء", "T19": "إدارة الأسرة والحياة الزوجية", "T07": "الصدق والأمانة", "T20": "التربية وبناء الإنسان", "T08": "العدل والإنصاف", "T21": "التجارة والعمل والحقوق المالية", "T09": "الذكاء الاجتماعي", "T22": "المسؤولية والسلطة", "T10": "الحكمة في اتخاذ القرارات", "T23": "التخطيط والاستعداد للمستقبل", "T11": "إدارة الخلافات", "T24": "التعامل مع الاختلاف في الرأي", "T12": "التعامل مع الغضب", "T25": "التوازن بين العبادة والحياة اليوم /* ---------- text utilities ---------- */
const TASHKEEL = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
function plainOf(s){
  return s.replace(TASHKEEL,'')
    .replace(/\*\*/g,'').replace(/`/g,'')
    .replace(/^#{1,4}\s*/gm,'').replace(/^\s*>\s?/gm,'')
    .replace(/^\s*([-*]|\d+\.)\s+/gm,'').replace(/^\|?\s*:?-{2,}.*$/gm,'')
    .replace(/\|/g,' ').replace(/\s+/g,' ').trim();
}
function normOf(plain){
  return plain.toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
}
function normQuery(q){ return normOf(q.replace(TASHKEEL,'').replace(/\s+/g,' ').trim()); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function saw(h){ return h.replace(/ﷺ/g,'<span class="saw">ﷺ</span>'); }
