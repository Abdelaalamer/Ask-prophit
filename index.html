/* ---------- markdown ---------- */
const GRADE_TITLE={A:'نص قرآني',B:'حديث صحيح ثابت',C:'حسن أو مقبول بحكم موثق',D:'رواية تاريخية تحتاج بيان الدرجة',E:'استنتاج من مصادر موثقة',F:'تطبيق معاصر',X:'مردود: ضعيف أو موضوع'};
function chip(g,q){ return '<span class="g g-'+g+'" title="'+GRADE_TITLE[g]+(q?' (حكم مؤقت)':'')+'">'+g+(q?'؟':'')+'</span>'; }
function refHtml(code){
  const c=code.trim();
  if(/^[TCDS]\d\d$/.test(c)) return '<a class="ref" href="#topic-'+c.toLowerCase()+'">'+esc(c)+'</a>';
  if(DOC_BY_CODE[c.toUpperCase()]) return '<a class="ref" href="#doc-'+DOC_BY_CODE[c.toUpperCase()].slug+'">'+esc(c)+'</a>';
  if(/^(H-[A-Z]{3}-\d|SD-|RG-|PD-|F-\d|E-S\d|P-[TC]\d|Q-\d)/.test(c)) return '<a class="ref" data-ref="'+esc(c)+'" href="#">'+esc(c)+'</a>';
  return '<code>'+esc(c)+'</code>';
}
function inline(s){
  const keep=[];
  s=s.replace(/`([^`]+)`/g,(_,c)=>{ keep.push(refHtml(c)); return '\u0000'+(keep.length-1)+'\u0000'; });
  s=esc(s);
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,(_,t,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>');
  s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/<strong>الدرجة:\s*([A-FX])(؟)?\.?<\/strong>/g,(_,g,q)=>'<strong>الدرجة:</strong> '+chip(g,q));
  s=s.replace(/(<strong>الدرجة[^<]*<\/strong>\s*)([A-FX])(؟)?(?=[\s.،؛—)]|$)/g,(_,p,g,q)=>p+chip(g,q));
  s=s.replace(/<strong>([A-FX])(؟)?<\/strong>/g,(_,g,q)=>chip(g,q));
  s=s.replace(/(^|[\s(،])([A-FX])(؟)?(?=[)،؛.\s]|$)/g,(m,p,g,q)=>p+chip(g,q));
  s=saw(s);
  s=s.replace(/\u0000(\d+)\u0000/g,(_,i)=>keep[+i]);
  return s;
}
function cellHtml(c){ const m=c.trim().match(/^\**([A-FX])(؟)?\**$/); return m?chip(m[1],m[2]):inline(c); }
function splitRow(r){ return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim()); }
function md(src,docIdx){
  const L=src.split('\n'); let i=0, out=[], hn=-1;
  const isList=l=>/^\s*([-*]|\d+\.)\s+/.test(l);
  const isBlock=l=>/^(#{1,4})\s/.test(l)||/^\|/.test(l)||/^\s*>/.test(l)||isList(l)||/^-{3,}\s*$/.test(l);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){ i++; continue; }
    let m=l.match(/^(#{1,4})\s+(.*)$/);
    if(m){ hn++; const lv=m[1].length; out.push('<h'+lv+' id="d'+docIdx+'-h'+hn+'">'+inline(m[2])+'</h'+lv+'>'); i++; continue; }
    if(/^-{3,}\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^\|/.test(l)){
      const rows=[]; while(i<L.length && /^\|/.test(L[i])){ rows.push(L[i]); i++; }
      const head=splitRow(rows[0]); let body=rows.slice(1);
      if(body.length && /^\|?\s*:?-{2,}/.test(body[0])) body=body.slice(1);
      let h='<div class="tw"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      body.forEach(r=>{ h+='<tr>'+splitRow(r).map(c=>'<td>'+cellHtml(c)+'</td>').join('')+'</tr>'; });
      out.push(h+'</tbody></table></div>'); continue;
    }
    if(/^\s*>/.test(l)){
      const q=[]; while(i<L.length && /^\s*>/.test(L[i])){ q.push(L[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+inline(q.join(' '))+'</blockquote>'); continue;
    }
    if(isList(l)){
      const items=[];
      while(i<L.length && L[i].trim() && (isList(L[i]) || (/^\s+\S/.test(L[i]) && items.length))){
        const mm=L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if(mm) items.push({lv:Math.floor(mm[1].length/2),ord:/\d/.test(mm[2]),t:mm[3]});
        else items[items.length-1].t+=' '+L[i].trim();
        i++;
      }
      let h='', st=[];
      for(const it of items){
        while(st.length && st[st.length-1].lv>it.lv) h+='</li></'+st.pop().tag+'>';
        const top=st[st.length-1];
        if(top && top.lv===it.lv) h+='</li>';
        else { const tag=it.ord?'ol':'ul'; h+='<'+tag+'>'; st.push({lv:it.lv,tag}); }
        h+='<li>'+inline(it.t);
      }
      while(st.length) h+='</li></'+st.pop().tag+'>';
      out.push(h); continue;
    }
    const p=[]; while(i<L.length && L[i].trim() && !isBlock(L[i])){ p.push(L[i].trim()); i++; }
    if(p.length) out.push('<p>'+inline(p.join(' '))+'</p>'); else { out.push('<p>'+inline(l)+'</p>'); i++; }
  }
  return out.join('\n');
}

    for(const t of toks){ const c=s.norm.split(t).length-1; if(!c){ok=false;break;} score+=c; if(normOf(s.headPlain).includes(t)) score+=8; }
    if(ok) res.push({s,score});
  }
  res.sort((a,b)=>b.score-a.score);
  return {toks,list:res.slice(0,limit||80),total:res.length};
}
function snippet(s,toks){
  const n=s.norm; let pos=-1;
  for(const t of toks){ const p=n.indexOf(t, Math.min(n.length, s.headPlain.length)); if(p>=0 && (pos<0||p<pos)) pos=p; }
  if(pos<0) pos=0;
  const a=Math.max(0,pos-70), b=Math.min(n.length,pos+170);
  let txt=s.plain.slice(a,b), nn=n.slice(a,b);
  const marks=[];
  toks.forEach(t=>{ let k=0; while((k=nn.indexOf(t,k))>=0){ marks.push([k,k+t.length]); k+=t.length; } });
  marks.sort((x,y)=>x[0]-y[0]);
  let h='', c=0;
  for(const [x,y] of marks){ if(x<c) continue; h+=esc(txt.slice(c,x))+'<mark>'+esc(txt.slice(x,y))+'</mark>'; c=y; }
  h+=esc(txt.slice(c));
  return (a>0?'… ':'')+h+(b<n.length?' …':'');
}

function searchAny(q,limit){
  const nq=normQuery(q); if(!nq) return [];
  const toks=[...new Set(nq.split(' ').filter(t=>t.length>2||/\d/.test(t)))]; if(!toks.length) return [];
  const vars=toks.map(t=>{ const v=[t]; const m=t.match(/^(?:[وفبل]?ال|[وف])(.{3,})$/); if(m) v.push(m[1]); return v; });
  const res=[];
  for(const s of SECTIONS){
    let matched=0, occ=0; const hp=normOf(s.headPlain);
    vars.forEach(v=>{ let hit=0; for(const t of v){ const c=s.norm.split(t).length-1; if(c){ hit=c; if(hp.includes(t)) occ+=6; break; } } if(hit){ matched++; occ+=Math.min(hit,6); } });
    if(matched){ const c=s.doc.code; const w=/^(GOV|MKI|RP)/.test(c)?0.45:/^(PC|HBE|PD|LM|FSR|SD)/.test(c)?1.25:1; const dens=occ/Math.sqrt(Math.max(400,s.norm.length)/400); res.push({s,score:(matched*100+dens*8)*w}); }
  }
  res.sort((a,b)=>b.score-a.score);
  return res.slice(0,limit||8);
}

const MODELS=[['claude-sonnet-5-5','Sonnet 5.5 — متوازن (مقترح)'],['claude-opus-5-5','Opus 5.5 — الأعمق والأغلى'],['claude-haiku-5-5','Haiku 5.5 — الأسرع والأرخص']];

async function askApi(key,model,msgs,tools,signal,onStatus){
  const system=[{type:'text',text:PROMPT,cache_control:{type:'ephemeral'}}];
  const apiTools=tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  const conv=msgs.map(m=>({role:m.role,content:m.content}));
  for(let step=0;step<10;step++){
    let r, j;
    try{
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model,max_tokens:3000,system,tools:apiTools,messages:conv})});
      j=await r.json();
    }catch(e){ if(e&&e.name==='AbortError') throw e; throw {code:'api',message:'تعذر الاتصال. تأكد من الإنترنت ثم أعد المحاولة.'}; }
    if(!r.ok){
      const msg=(j&&j.error&&j.error.message)||'';
      throw {code:'api',message: r.status===401?'مفتاح API غير صحيح. راجعه من «الإعداد».'
        : r.status===429?'وصلت إلى حد الطلبات مؤقتاً. حاول بعد دقيقة.'
        : r.status===529||r.status===503?'الخدمة مزدحمة الآن. حاول بعد قليل.'
        : /credit|balance/i.test(msg)?'رصيد حساب API لا يكفي. اشحن الرصيد من console.anthropic.com.'
        : r.status===404||/model/i.test(msg)?'النموذج المختار غير متاح لحسابك. اختر نموذجاً آخر من «الإعداد».'
        : 'خطأ من الخدمة ('+r.status+'): '+msg};
    }
    if(j.stop_reason!=='tool_use'){ return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim(); }
    conv.push({role:'assistant',content:j.content});
    const results=[];
    for(const b of j.content){ if(b.type!=='tool_use') continue;
      if(b.name==='search_kb') onStatus('يبحث في القاعدة: '+((b.input&&b.input.query)||'')+' …'); else onStatus('يقرأ قسماً من القاعدة …');
      const t=tools.find(x=>x.name===b.name); let out, isErr=false;
      try{ out=JSON.stringify(await t.execute(b.input||{})); }catch(e){ out=String((e&&e.message)||e); isErr=true; }
      results.push({type:'tool_result',tool_use_id:b.id,content:out,is_error:isErr});
    }
    conv.push({role:'user',content:results});
    onStatus('يكتب الإجابة …');
  }
  throw {code:'api',message:'طال البحث أكثر من اللازم. أعد صياغة السؤال بشكل أقصر.'};
}

  h+='</div><div class="legend"><span><i class="dot strong"></i>متقاطع: أدلة مستقلة متعددة</span><span><i class="dot start"></i>بداية</span><span><i class="dot tent"></i>مبدئي: دليل واحد</span><span><i class="dot none"></i>لم يبدأ</span></div></section>';
  h+='<section class="block"><h2>سلم الثقة</h2><p class="sub">كل معلومة في القاعدة تحمل حرفاً يبين درجة ثبوتها.</p><div class="scale">';
  [['A','نص قرآني واضح'],['B','حديث صحيح ثابت: في الصحيحين، أو بحكم موثق'],['C','حديث حسن أو رواية مقبولة بحكم موثق'],['D','رواية تاريخية يُبيَّن حالها'],['E','استنتاج أو قول عالم منسوب إليه'],['F','تطبيق معاصر'],['X','مردود: ضعيف أو موضوع، لا يُستدل به']].forEach(([g,t])=>{ h+='<div>'+chip(g)+'<span>'+t+'</span></div>'; });
  h+='<div><span class="g g-C">C؟</span><span>علامة الاستفهام: حكم مؤقت لم يُفتح في كتاب صاحبه بعد</span></div></div></section>';
  h+='<section class="block"><h2>مداخل سريعة</h2><div class="cards">';
  h+='<a class="card" href="#ask"><b>اسأل</b><span>سؤالك والإجابة من سيرته ومنهجه ﷺ</span></a>';
  h+='<a class="card warn" href="#warnings"><b>قائمة التحذير</b><span>أوصاف وروايات مشهورة لا تثبت</span></a>';
  [['PC-00','الشخصية: الاستنتاجات المتقاطعة'],['PD-00','القرارات النبوية'],['HKB-SHM-01','الشمائل بأحكام الألباني'],['SD-00','الخلافات العلمية'],['RG-00','الفجوات البحثية'],[DATA.lastReport,'آخر تقرير']].forEach(([c,t])=>{ const d=DOC_BY_CODE[c]; if(d) h+='<a class="card" href="#doc-'+d.slug+'"><b>'+esc(t)+'</b><span>'+esc(d.short)+'</span></a>'; });
  h+='</div></section>';
  h+='<p class="note">نسخة من مستندات المشروع حتى الدفعة '+DATA.batch+'، بتاريخ '+DATA.date+'. عدد المستندات '+DOCS.length+'. تُحدَّث بعد كل دفعة بحثية.</p>';
  return h;
}
function docView(d){
  try{ localStorage.setItem('lastDoc',d.slug); }catch(e){}
  const secName=(SEC_NAMES.find(s=>s[0]===d.sec)||['',''])[1];
  const hs=[]; let n=-1; d.md.split('\n').forEach(l=>{ const m=l.match(/^(#{1,4})\s+(.*)$/); if(m){ n++; if(m[1].length===2) hs.push([n,plainOf(m[2])]); } });
  let h='<div class="crumb"><a href="#library">الفهرس</a> · '+d.sec+' '+esc(secName)+' · <bdi>'+esc(d.code)+'</bdi></div>';
  if(hs.length>2) h+='<nav class="toc" aria-label="أقسام المستند">'+hs.map(([k,t])=>'<a href="#" data-jump="d'+d.i+'-h'+k+'">'+saw(esc(t.length>48?t.slice(0,46)+'…':t))+'</a>').join('')+'</nav>';
  h+='<article class="doc">'+md(d.md,d.i)+'</article>';
  return h;
}
function searchView(){
  const q=$q.value.trim();
  let h='<h1 class="view-title">البحث</h1>';
  if(!q){ return h+'<p class="empty">اكتب كلمة أو أكثر في خانة البحث. البحث يتجاهل التشكيل والهمزات والتاء المربوطة، ويقبل المعرفات مثل H-BKH-4890 أو SD-016 أو T26.</p>'; }
  const r=search(q,80);
  if(!r.list || !r.list.length) return h+'<p class="empty">لا نتائج لـ «'+esc(q)+'». جرّب كلمة أقصر أو بلا «ال».</p>';
  h+='<p class="view-sub">'+r.total+' موضعاً'+(r.total>80?'، يظهر أول 80':'')+'.</p><div class="res">';
  r.list.forEach(({s})=>{ h+='<a class="hit" href="#" data-go="'+s.doc.i+':'+s.h+'"><div class="w">'+saw(esc(s.doc.short))+' · <bdi>'+esc(s.doc.code)+'</bdi></div><div class="h">'+saw(esc(s.headPlain||s.doc.title))+'</div><div class="s">'+saw(snippet(s,r.toks))+'</div></a>'; });
  return h+'</div>';
}
function topicView(code){
  const C=code.toUpperCase(); const name=DATA.names[C]||'';
  const row=DATA.board.find(r=>r.code===C);
  let h='<h1 class="view-title"><bdi>'+C+'</bdi> · '+esc(name)+'</h1>';
  if(row){ const st=statusOf(row.status); h+='<p class="view-sub"><i class="dot '+st+'" style="display:inline-block;vertical-align:-1px"></i> الحالة: '+esc(row.status.replace(/\*/g,''))+'</p><div class="topic-ev">'+inline(row.evidence)+'</div>'; }
  const r=search(C,120);
  h+='<h2 class="view-title" style="font-size:1.15rem">مواضع ذكره في القاعدة</h2>';
  if(!r.list||!r.list.length) return h+'<p class="empty">لا مواضع مسجلة بعد.</p>';
  h+='<div class="res">';
  r.list.forEach(({s})=>{ h+='<a class="hit" href="#" data-go="'+s.doc.i+':'+s.h+'"><div class="w">'+saw(esc(s.doc.short))+' · <bdi>'+esc(s.doc.code)+'</bdi></div><div class="h">'+saw(esc(s.headPlain||s.doc.title))+'</div><div class="s">'+saw(snippet(s,r.toks))+'</div></a>'; });
  return h+'</div>';
}
function sliceSection(code,needle){
  const d=DOC_BY_CODE[code]; if(!d) return '';
  const L=d.md.split('\n'); let start=-1, lv=0;
  for(let i=0;i<L.length;i++){ const m=L[i].match(/^(#{1,4})\s+(.*)$/); if(!m) continue;
    if(start<0 && m[2].includes(needle)){ start=i; lv=m[1].length; continue; }
    if(start>=0 && m[1].length<=lv) return L.slice(start,i).join('\n'); }
  return start>=0?L.slice(start).join('\n'):'';
}
function warningsView(){
  let h='<h1 class="view-title">قائمة التحذير</h1><p class="view-sub">ما ثبت ضعفه أو لم يُوجد له إسناد، فلا يُبنى عليه وصف ولا مبدأ. كل بند بمصدر الحكم.</p><article class="doc">';
  const a=sliceSection('HKB-SHM-01','قائمة التحذير'); if(a) h+=md(a,'w1');
  const b=sliceSection('PC-00','ما لا يجوز استنتاجه'); if(b) h+='<hr>'+md(b,'w2');
  return h+'</article>';
}
function setActiveTab(v){ document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v)); }
function render(){
  const hash=(location.hash||'').slice(1);
  let v='home', html='', activeDoc=null;
  if(hash.startsWith('doc-')){ const d=DOCS.find(x=>x.slug===hash.slice(4)); if(d){ v='doc'; html=docView(d); activeDoc=d.slug; } }
  else if(hash.startsWith('topic-')){ v='topic'; html=topicView(hash.slice(6)); }
  else if(hash==='search'){ v='search'; html=searchView(); }
  else if(hash==='library'){ v='library'; html='<h1 class="view-title">الفهرس</h1><p class="view-sub">مستندات المشروع بحسب أقسامه الثلاثة عشر.</p>'+libraryHtml(null); }
  else if(hash==='warnings'){ v='warnings'; html=warningsView(); }
  else if(hash==='home'){ v='home'; html=home(); }
  else if(hash==='setup'){ v='setup'; html=setupView(); }
  if(!html){ v='ask'; html=askView(); }
  $main.innerHTML=html;
  $side.innerHTML=libraryHtml(activeDoc);
  setActiveTab(v==='doc'||v==='topic'?'library':(v==='warnings'?'home':v));
  if(pendingAnchor){ const el=document.getElementById(pendingAnchor); pendingAnchor=null; if(el){ el.scrollIntoView({block:'start'}); window.scrollBy(0,-70); el.classList.add('flash'); return; } }
  if(v==='ask'){ const ci=document.getElementById('ci'); if(ci){ ci.addEventListener('input',()=>{ ci.style.height='auto'; ci.style.height=Math.min(170,ci.scrollHeight)+'px'; }); ci.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(min-width:861px)').matches){ e.preventDefault(); send(ci.value); } }); } if(BUSY||CHAT.length) return; }
  if(v!=='search') window.scrollTo(0,0);
}
function goTo(docIdx,h){
  const d=DOCS[docIdx]; pendingAnchor=h>=0?('d'+docIdx+'-h'+h):null;
  if(location.hash==='#doc-'+d.slug) render(); else location.hash='doc-'+d.slug;
}
document.addEventListener('click',e=>{
  const ex=e.target.closest('[data-ex]'); if(ex){ e.preventDefault(); send(ex.dataset.ex); return; }
  if(e.target.closest('#cn')){ e.preventDefault(); if(!BUSY){ CHAT=[]; saveChat(); render(); } return; }
  const go=e.target.closest('[data-go]'); if(go){ e.preventDefault(); const [a,b]=go.dataset.go.split(':').map(Number); goTo(a,b); return; }
  const j=e.target.closest('[data-jump]'); if(j){ e.preventDefault(); const el=document.getElementById(j.dataset.jump); if(el){ el.scrollIntoView({block:'start'}); window.scrollBy(0,-70); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1700); } return; }
  const r=e.target.closest('[data-ref]'); if(r){ e.preventDefault(); const id=r.dataset.ref; const def=DEFS[id];
    if(def){ goTo(def.doc.i,def.h); } else { $q.value=id; if(location.hash==='#search') render(); else location.hash='search'; } }
});
let tmr=null;
$q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ if(location.hash!=='#search') location.hash='search'; else render(); },220); });
document.getElementById('sf').addEventListener('submit',e=>{ e.preventDefault(); $q.blur(); if(location.hash!=='#search') location.hash='search'; else render(); });
document.addEventListener('submit',e=>{ if(e.target.id==='cf'){ e.preventDefault(); if(BUSY){ if(CTL) CTL.abort(); return; } const ci=document.getElementById('ci'); send(ci.value); } });
document.addEventListener('submit',e=>{ if(e.target.id==='kf'){ e.preventDefault(); const k=document.getElementById('kk').value.trim(), m=document.getElementById('km').value; try{ if(k) localStorage.setItem('api-key',k); localStorage.setItem('api-model',m); document.getElementById('km2').textContent='حُفظ. ارجع إلى «اسأل» وجرّب.'; }catch(x){ document.getElementById('km2').textContent='تعذر الحفظ على هذا الجهاز.'; } } });
document.addEventListener('click',e=>{ if(e.target.closest('#kc')){ try{ localStorage.removeItem('api-key'); }catch(x){} render(); } });
if(IS_PWA && 'serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
window.addEventListener('hashchange',render);
render();
</script>
