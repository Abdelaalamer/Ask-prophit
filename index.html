 الحسن بن محمد الزعفراني قال: حدثنا الحجاج بن محمد، عن ابن جريج قال: أخبرني عثمان بن أبي سليمان، أن أبا سلمة بن عبد الرحمن، أخبره أن عائشة، أخبرته «أن النبي صلى الله عليه وسلم لم يمت حتى كان أكثر صلاته وهو جالس»\n\n- **الدرجة:** B — صححه الألباني (المختصر 237) (مطابقة آلية ضعيفة، تُراجع).\n\n*الرقم 283 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0284 — صليت مع النبي صلى الله عليه وسلم ركعتين قبل الظهر، وركعتين…\nحدثنا أحمد بن منيع قال: حدثنا إسماعيل بن إبراهيم قال: حدثنا أيوب، عن نافع، عن ابن عمر قال: «صليت مع النبي صلى الله عليه وسلم ركعتين قبل الظهر، وركعتين بعدها، وركعتين بعد المغرب في بيته، وركعتين بعد العشاء في بيته»\n\n- **الدرجة:** B — صححه الألباني (المختصر 239)، وله مطابقة لفظية في البخاري 1180.\n\n### H-SHM-0285 — أن رسول الله صلى الله عليه وسلم كان يصلي ركعتين حين يطلع ا…\nحدثنا أحمد بن منيع قال: حدثنا إسماعيل بن إبراهيم قال: حدثنا أيوب، عن نافع، عن ابن عمر، قال: حدثتني حفصة: «أن رسول الله صلى الله عليه وسلم كان يصلي ركعتين حين يطلع الفجر وينادي المنادي» قال أيوب: \" وأراه قال: خفيفتين \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 240).\n\n### H-SHM-0286 — وحدثتني حفصة بركعتي الغداة، ولم أكن أراهما من النبي صلى ال…\nحدثنا قتيبة بن سعيد قال: حدثنا مروان بن معاوية الفزاري، عن جعفر بن برقان، عن ميمون بن مهران، عن ابن عمر قال: \" حفظت من رسول الله صلى الله عليه وسلم ثماني ركعات: ركعتين قبل الظهر، وركعتين بعدها، وركعتين بعد المغرب، وركعتين بعد العشاء \" قال ابن عمر: «وحدثتني حفصة بركعتي الغداة، ولم أكن أراهما من النبي صلى الله عليه وسلم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 241).\n\n### H-SHM-0287 — كان يصلي قبل الظهر ركعتين وبعدها ركعتين، وبعد المغرب ركعتي…\nحدثنا أبو سلمة يحيى بن خلف قال: حدثنا بشر بن المفضل، عن خالد الحذاء، عن عبد الله بن شقيق قال: سألت عائشة، عن صلاة النبي صلى الله عليه وسلم قالت: «كان يصلي قبل الظهر ركعتين وبعدها ركعتين، وبعد المغرب ركعتين، وبعد العشاء ركعتين، وقبل الفجر ثنتين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 242).\n\n### H-SHM-0288 — كان إذا كانت الشمس من هاهنا كهيئتها من هاهنا عند العصر صلى…\nحدثنا محمد بن المثنى قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن أبي إسحاق قال: سمعت عاصم بن ضمرة يقول: سألنا عليا، عن صلاة رسول الله صلى الله عليه وسلم من النهار، فقال: إنكم لا تطيقون ذلك قال: فقلنا: من أطاق ذلك منا صلى، فقال: «كان إذا كانت الشمس من هاهنا كهيئتها من هاهنا عند العصر صلى ركعتين، وإذا كانت الشمس من ههنا كهيئتها من هاهنا عند الظهر صلى أربعا، ويصلي قبل الظهر أربعا، وبعدها ركعتين، وقبل العصر أربعا، يفصل بين كل ركعتين بالتسليم على الملائكة المقربين والنبيين، ومن تبعهم من المؤمنين والمسلمين»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 243).\n\n\n## الباب 41: صلاة الضحى\n\n### H-SHM-0289 — نعم، أربع ركعات ويزيد ما شاء الله عز وجل\nحدثنا محمود بن غيلان قال: حدثنا أبو داود الطيالسي قال: حدثنا شعبة، عن يزيد الرشك قال: سمعت معاذة، قالت: قلت لعائشة: أكان النبي صلى الله عليه وسلم يصلي الضحى؟ قالت: «نعم، أربع ركعات ويزيد ما شاء الله عز وجل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 244).\n\n### H-SHM-0290 — أن النبي صلى الله عليه وسلم كان يصلي الضحى ست ركعات\nحدثنا محمد بن المثنى قال: حدثني حكيم بن معاوية الزيادي قال: حدثنا زياد بن عبيد الله بن الربيع الزيادي، عن حميد الطويل، عن أنس بن مالك : «أن النبي صلى الله عليه وسلم كان يصلي الضحى ست ركعات»\n\n- **الدرجة:** B — صححه الألباني (المختصر 245).\n\n### H-SHM-0291 — أن رسول الله صلى الله عليه وسلم دخل بيتها يوم فتح مكة فاغت…\nحدثنا محمد بن المثنى قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن عمرو بن مرة، عن عبد الرحمن بن أبي ليلى قال: ما أخبرني أحد، أنه رأى النبي صلى الله عليه وسلم يصلي الضحى إلا أم هانئ، فإنها حدثت «أن رسول الله صلى الله عليه وسلم دخل بيتها يوم فتح مكة فاغتسل فسبح ثماني ركعات ما رأيته صلى الله عليه وسلم صلى صلاة قط أخف منها، غير أنه كان يتم الركوع والسجود»\n\n- **الدرجة:** B — صححه الألباني (المختصر 246)، وله مطابقة لفظية في مسلم 336.\n\n### H-SHM-0292 — لا إلا أن يجيء من مغيبه\nحدثنا ابن أبي عمر قال: حدثنا وكيع قال: حدثنا كهمس بن الحسن، عن عبد الله بن شقيق قال: قلت لعائشة: أكان النبي صلى الله عليه وسلم يصلي الضحى؟ قالت: «لا إلا أن يجيء من مغيبه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 247)، وله مطابقة لفظية في مسلم 717.\n\n### H-SHM-0293 — كان النبي صلى الله عليه وسلم يصلي الضحى حتى نقول: لا يدعها…\nحدثنا زياد بن أيوب البغدادي قال: حدثنا محمد بن ربيعة، عن فضيل بن مرزوق، عن عطية، عن أبي سعيد الخدري قال: \" كان النبي صلى الله عليه وسلم يصلي الضحى حتى نقول: لا يدعها، ويدعها حتى نقول: لا يصليها \"\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 248) (مطابقة آلية ضعيفة، تُراجع).\n\n*الرقم 294 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0295 — إن أبواب السماء تفتح عند زوال الشمس فلا ترتج حتى تصلى الظه…\nحدثنا أحمد بن منيع، عن هشيم قال: حدثنا عبيدة، عن إبراهيم، عن سهم بن منجاب، عن قرثع الضبي، أو عن قزعة، عن قرثع، عن أبي أيوب الأنصاري، أن النبي صلى الله عليه وسلم كان يدمن أربع ركعات عند زوال الشمس فقلت: يا رسول الله، إنك تدمن هذه الأربع ركعات عند زوال الشمس فقال: «إن أبواب السماء تفتح عند زوال الشمس فلا ترتج حتى تصلى الظهر، فأحب أن يصعد لي في تلك الساعة خير» قلت: أفي كلهن قراءة؟ قال: «نعم» . قلت: هل فيهن تسليم فاصل؟ قال: «لا» أخبرني أحمد بن منيع قال: حدثنا أبو معاوية قال: حدثنا عبيدة، عن إبراهيم، عن سهم بن منجاب، عن قزعة، عن قرثع، عن أبي أيوب الأنصاري، عن النبي صلى الله عليه وسلم نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 249) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0296 — إنها ساعة تفتح فيها أبواب السماء، فأحب أن يصعد لي فيها عمل…\nحدثنا محمد بن المثنى قال: حدثنا أبو داود قال: حدثنا محمد بن مسلم بن أبي الوضاح، عن عبد الكريم الجزري، عن مجاهد، عن عبد الله بن السائب، أن رسول الله صلى الله عليه وسلم كان يصلي أربعا بعد أن تزول الشمس قبل الظهر وقال: «إنها ساعة تفتح فيها أبواب السماء، فأحب أن يصعد لي فيها عمل صالح»\n\n- **الدرجة:** B — صححه الألباني (المختصر 250).\n\n### H-SHM-0297 — كان يصلي قبل الظهر أربعا، وذكر أن رسول الله صلى الله عليه …\nحدثنا أبو سلمة يحيى بن خلف قال: حدثنا عمر بن علي المقدمي، عن مسعر بن كدام، عن أبي إسحاق، عن عاصم بن ضمرة، عن علي، أنه «كان يصلي قبل الظهر أربعا، وذكر أن رسول الله صلى الله عليه وسلم كان يصليها عند الزوال ويمد فيها»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 243).\n\n\n## الباب 42: صلاة التطوع في البيت\n\n### H-SHM-0298 — قد ترى ما أقرب بيتي من المسجد، فلأن أصلي في بيتي أحب إلي م…\nحدثنا عباس العنبري قال: حدثنا عبد الرحمن بن مهدي، عن معاوية بن صالح، عن العلاء بن الحارث، عن حرام بن معاوية، عن عمه عبد الله بن سعد قال: سألت رسول الله صلى الله عليه وسلم عن الصلاة في بيتي والصلاة في المسجد قال: «قد ترى ما أقرب بيتي من المسجد، فلأن أصلي في بيتي أحب إلي من أن أصلي في المسجد إلا أن تكون صلاة مكتوبة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 251).\n\n\n## الباب 43: صومه\n\n**خلاصة الباب (E):** «كان يصوم حتى نقول قد صام، ويفطر حتى نقول قد أفطر» (299–301): لا نمط ثابت يُشق على الناس اتباعه. يتحرى الاثنين والخميس (307–308). **«كان عمله ديمة» (311)، و«عليكم من الأعمال ما تطيقون، فوالله لا يمل الله حتى تملوا» (312)**، و«كان أحب العمل إليه ما ديم عليه وإن قل» (313). `T25`\n\n### H-SHM-0299 — كان يصوم حتى نقول قد صام، ويفطر حتى نقول قد أفطر . قالت: و…\nحدثنا قتيبة بن سعيد قال: حدثنا حماد بن زيد، عن أيوب، عن عبد الله بن شقيق قال: سألت عائشة، عن صيام رسول الله صلى الله عليه وسلم، قالت: «كان يصوم حتى نقول قد صام، ويفطر حتى نقول قد أفطر» . قالت: «وما صام رسول الله صلى الله عليه وسلم شهرا كاملا منذ قدم المدينة إلا رمضان»\n\n- **الدرجة:** B — صححه الألباني (المختصر 252)، وله مطابقة لفظية في مسلم 1156.\n\n### H-SHM-0300 — كان يصوم من الشهر حتى نرى أن لا يريد أن يفطر منه، ويفطر من…\nحدثنا علي بن حجر قال: حدثنا إسماعيل بن جعفر، عن حميد، عن أنس بن مالك، أنه سئل عن صوم النبي صلى الله عليه وسلم، فقال: «كان يصوم من الشهر حتى نرى أن لا يريد أن يفطر منه، ويفطر منه حتى نرى أن لا يريد أن يصوم منه شيئا. وكنت لا تشاء أن تراه من الليل مصليا إلا رأيته مصليا، ولا نائما إلا رأيته نائما»\n\n- **الدرجة:** B — صححه الألباني (المختصر 253).\n\n### H-SHM-0301 — كان النبي صلى الله عليه وسلم يصوم حتى نقول ما يريد أن يفطر…\nحدثنا محمود بن غيلان قال: حدثنا أبو داود قال: حدثنا شعبة، عن أبي بشر قال: سمعت سعيد بن جبير، عن ابن عباس قال: «كان النبي صلى الله عليه وسلم يصوم حتى نقول ما يريد أن يفطر منه، ويفطر حتى نقول ما يريد أن يصوم منه، وما صام شهرا كاملا منذ قدم المدينة إلا رمضان»\n\n- **الدرجة:** B — صححه الألباني (المختصر 254).\n\n### H-SHM-0302 — ما رأيت النبي صلى الله عليه وسلم يصوم شهرين متتابعين إلا ش…\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي، عن سفيان، عن منصور، عن سالم بن أبي الجعد، عن أبي سلمة، عن أم سلمة، قالت: «ما رأيت النبي صلى الله عليه وسلم يصوم شهرين متتابعين إلا شعبان ورمضان» قال أبو عيسى: \" هذا إسناد صحيح وهكذا قال: عن أبي سلمة، عن أم سلمة. وروى هذا الحديث غير واحد، عن أبي سلمة، عن عائشة، عن النبي صلى الله عليه وسلم، ويحتمل أن يكون أبو سلمة بن عبد الرحمن قد روى الحديث، عن عائشة وأم سلمة جميعا، عن النبي صلى الله عليه وسلم \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 255).\n\n### H-SHM-0303 — لم أر رسول الله صلى الله عليه وسلم يصوم في شهر أكثر من صيا…\nحدثنا هناد قال: حدثنا عبدة، عن محمد بن عمرو قال: حدثنا أبو سلمة، عن عائشة، قالت: «لم أر رسول الله صلى الله عليه وسلم يصوم في شهر أكثر من صيامه لله في شعبان، كان يصوم شعبان إلا قليلا بل كان يصومه كله»\n\n- **الدرجة:** B — صححه الألباني (المختصر 256).\n\n*الرقم 304 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0305 — كان رسول الله صلى الله عليه وسلم يصوم من غرة كل شهر ثلاثة …\nحدثنا القاسم بن دينار الكوفي قال: حدثنا عبيد الله بن موسى، وطلق بن غنام، عن شيبان، عن عاصم، عن زر بن حبيش، عن عبد الله قال: «كان رسول الله صلى الله عليه وسلم يصوم من غرة كل شهر ثلاثة أيام وقلما كان يفطر يوم الجمعة»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 257).\n\n*الرقم 306 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0307 — كان النبي صلى الله عليه وسلم يتحرى صوم الاثنين والخميس\nحدثنا أبو حفص عمرو بن علي قال: حدثنا عبد الله بن داود، عن ثور بن يزيد، عن خالد بن معدان، عن ربيعة الجرشي، عن عائشة، قالت : «كان النبي صلى الله عليه وسلم يتحرى صوم الاثنين والخميس»\n\n- **الدرجة:** B — صححه الألباني (المختصر 258).\n\n### H-SHM-0308 — تعرض الأعمال يوم الاثنين والخميس فأحب أن يعرض عملي وأنا صا…\nحدثنا محمد بن يحيى قال: حدثنا أبو عاصم، عن محمد بن رفاعة، عن سهيل بن أبي صالح، عن أبيه، عن أبي هريرة، أن النبي صلى الله عليه وسلم قال: «تعرض الأعمال يوم الاثنين والخميس فأحب أن يعرض عملي وأنا صائم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 259).\n\n### H-SHM-0309 — كان النبي صلى الله عليه وسلم يصوم من الشهر السبت والأحد وا…\nحدثنا محمود بن غيلان قال: حدثنا أبو أحمد، ومعاوية بن هشام، قالا: حدثنا سفيان، عن منصور، عن خيثمة، عن عائشة، قالت: «كان النبي صلى الله عليه وسلم يصوم من الشهر السبت والأحد والاثنين، ومن الشهر الآخر الثلاثاء والأربعاء والخميس» حدثنا أبو مصعب المديني، عن مالك بن أنس، عن أبي النضر، عن أبي سلمة بن عبد الرحمن، عن عائشة، قالت: «ما كان رسول الله صلى الله عليه وسلم يصوم في شهر أكثر من صيامه في شعبان» حدثنا محمود بن غيلان قال: حدثنا أبو داود قال: حدثنا شعبة، عن يزيد الرشك قال: سمعت معاذة، قالت: قلت لعائشة: أكان رسول الله صلى الله عليه وسلم يصوم ثلاثة أيام من كل شهر؟ قالت: «نعم» . قلت: من أيه كان يصوم؟ قالت: «كان لا يبالي من أيه صام» قال أبو عيسى: \" يزيد الرشك هو يزيد الضبعي البصري وهو ثقة روى عنه شعبة، وعبد الوارث بن سعيد، وحماد بن زيد، وإسماعيل بن إبراهيم، وغير واحد من الأئمة، وهو يزيد القاسم ويقال: القسام، والرشك بلغة أهل البصرة هو القسام \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 260) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0310 — كان عاشوراء يوما تصومه قريش في الجاهلية، وكان رسول الله صل…\nحدثنا هارون بن إسحاق الهمداني قال: حدثنا عبدة بن سليمان، عن هشام بن عروة، عن أبيه، عن عائشة، قالت : «كان عاشوراء يوما تصومه قريش في الجاهلية، وكان رسول الله صلى الله عليه وسلم يصومه، فلما قدم المدينة صامه وأمر بصيامه، فلما افترض رمضان كان رمضان هو الفريضة وترك عاشوراء، فمن شاء صامه ومن شاء تركه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 263).\n\n### H-SHM-0311 — كان عمله ديمة، وأيكم يطيق ما كان رسول الله صلى الله عليه و…\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن منصور، عن إبراهيم، عن علقمة قال: سألت عائشة، أكان رسول الله صلى الله عليه وسلم يخص من الأيام شيئا؟ قالت: «كان عمله ديمة، وأيكم يطيق ما كان رسول الله صلى الله عليه وسلم يطيق»\n\n- **الدرجة:** B — صححه الألباني (المختصر 264)، وله مطابقة لفظية في البخاري 1987.\n\n### H-SHM-0312 — من هذه؟ قلت: فلانة لا تنام الليل، فقال رسول الله صلى الله …\nحدثنا هارون بن إسحاق قال: حدثنا عبدة، عن هشام بن عروة، عن أبيه، عن عائشة، قالت: دخل علي رسول الله صلى الله عليه وسلم وعندي امرأة فقال: «من هذه؟» قلت: فلانة لا تنام الليل، فقال رسول الله صلى الله عليه وسلم: «عليكم من الأعمال ما تطيقون، فوالله لا يمل الله حتى تملوا» ، وكان أحب ذلك إلى رسول الله صلى الله عليه وسلم الذي يدوم عليه صاحبه\n\n- **الدرجة:** B — صححه الألباني (المختصر 265).\n\n### H-SHM-0313 — ما ديم عليه وإن قل\nحدثنا أبو هشام محمد بن يزيد الرفاعي قال: حدثنا ابن فضيل، عن الأعمش، عن أبي صالح قال : سألت عائشة، وأم سلمة، أي العمل كان أحب إلى رسول الله صلى الله عليه وسلم؟ قالتا: «ما ديم عليه وإن قل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 266).\n\n### H-SHM-0314 — سبحان ذي الجبروت والملكوت والكبرياء والعظمة ، ثم سجد بقدر …\nحدثنا محمد بن إسماعيل قال: حدثنا عبد الله بن صالح قال: حدثني معاوية بن صالح، عن عمرو بن قيس، أنه سمع عاصم بن حميد قال: سمعت عوف بن مالك يقول: كنت مع رسول الله صلى الله عليه وسلم ليلة فاستاك ثم توضأ ثم قام يصلي، فقمت معه فبدأ فاستفتح البقرة فلا يمر بآية رحمة إلا وقف فسأل، ولا يمر بآية عذاب إلا وقف فتعوذ، ثم ركع فمكث راكعا بقدر قيامه، ويقول في ركوعه: «سبحان ذي الجبروت والملكوت والكبرياء والعظمة» ، ثم سجد بقدر ركوعه، ويقول في سجوده: «سبحان ذي الجبروت والملكوت والكبرياء والعظمة» ثم قرأ آل عمران ثم سورة سورة يفعل مثل ذلك\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 267).\n\n\n## الباب 44: قراءته\n\n**خلاصة الباب (E):** قراءة «مفسرة حرفاً حرفاً» (315)، يقف على رؤوس الآي (317). «ربما أسرّ وربما جهر»، فقال السائل: الحمد لله الذي جعل في الأمر سعة (318). `D05`\n\n### H-SHM-0315 — قراءة مفسرة حرفا حرفا\nحدثنا قتيبة بن سعيد قال: حدثنا الليث، عن ابن أبي مليكة، عن يعلى بن مملك أنه سأل أم سلمة، عن قراءة رسول الله صلى الله عليه وسلم فإذا هي تنعت «قراءة مفسرة حرفا حرفا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 268).\n\n### H-SHM-0316 — مدا\nحدثنا محمد بن بشار قال: حدثنا وهب بن جرير بن حازم قال: حدثنا أبي، عن قتادة، قال : قلت لأنس بن مالك: كيف كانت قراءة رسول الله صلى الله عليه وسلم؟ فقال: «مدا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 268) (إسناد آخر للحديث السابق).\n\n### H-SHM-0317 — كان النبي صلى الله عليه وسلم يقطع قراءته يقول: {الحمد لله …\nحدثنا علي بن حجر قال: حدثنا يحيى بن سعيد الأموي، عن ابن جريج، عن ابن أبي مليكة، عن أم سلمة، قالت: \" كان النبي صلى الله عليه وسلم يقطع قراءته يقول: {الحمد لله رب العالمين} [الفاتحة: 2] ثم يقف، ثم يقول: {الرحمن الرحيم} [الفاتحة: 1] ثم يقف، وكان يقرأ (ملك يوم الدين)\n\n- **الدرجة:** B — صححه الألباني (المختصر 269) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0318 — كل ذلك قد كان يفعل قد كان ربما أسر وربما جهر . فقلت: الحمد…\nحدثنا قتيبة قال: حدثنا الليث، عن معاوية بن صالح، عن عبد الله بن أبي قيس قال: سألت عائشة، عن قراءة النبي صلى الله عليه وسلم أكان يسر بالقراءة أم يجهر؟ قالت: «كل ذلك قد كان يفعل قد كان ربما أسر وربما جهر» . فقلت: الحمد لله الذي جعل في الأمر سعة\n\n- **الدرجة:** B — صححه الألباني (المختصر 269).\n\n### H-SHM-0319 — كنت أسمع قراءة النبي صلى الله عليه وسلم بالليل وأنا على عر…\nحدثنا محمود بن غيلان قال: حدثنا وكيع قال: حدثنا مسعر، عن أبي العلاء العبدي، عن يحيى بن جعدة، عن أم هانئ، قالت: «كنت أسمع قراءة النبي صلى الله عليه وسلم بالليل وأنا على عريشي»\n\n- **الدرجة:** B — صححه الألباني (المختصر 269) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0320 — فقرأ ورجع قال: وقال معاوية بن قرة: لولا أن يجتمع الناس علي…\nحدثنا محمود بن غيلان قال: حدثنا أبو داود قال: حدثنا شعبة، عن معاوية بن قرة قال: سمعت عبد الله بن مغفل يقول: \" رأيت النبي صلى الله عليه وسلم على ناقته يوم الفتح وهو يقرأ: {إنا فتحنا لك فتحا مبينا ليغفر لك الله ما تقدم من ذنبك وما تأخر} [الفتح: 2] \". قال: «فقرأ ورجع» قال: وقال معاوية بن قرة: «لولا أن يجتمع الناس علي لأخذت لكم في ذلك الصوت» أو قال: «اللحن»\n\n- **الدرجة:** B — صححه الألباني (المختصر 269).\n\n### H-SHM-0321 — ما بعث الله نبيا إلا حسن الوجه، حسن الصوت، وكان نبيكم صلى …\nحدثنا قتيبة بن سعيد قال: حدثنا نوح بن قيس الحداني، عن حسام بن مصك، عن قتادة قال: «ما بعث الله نبيا إلا حسن الوجه، حسن الصوت، وكان نبيكم صلى الله عليه وسلم حسن الوجه، حسن الصوت، وكان لا يرجع»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 274).\n\n### H-SHM-0322 — كانت قراءة النبي صلى الله عليه وسلم ربما يسمعها من في الحج…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا يحيى بن حسان قال: حدثنا عبد الرحمن بن أبي الزناد، عن عمرو بن أبي عمرو، عن عكرمة، عن ابن عباس قال: «كانت قراءة النبي صلى الله عليه وسلم ربما يسمعها من في الحجرة وهو في البيت»\n\n- **الدرجة:** B — صححه الألباني (المختصر 275) (مطابقة آلية ضعيفة، تُراجع).\n\n\n## الباب 45: بكاؤه\n\n**خلاصة الباب (E):** ستة مواضع لبكائه: في الصلاة «ولجوفه أزيز كأزيز المرجل» (323)، وعند سماع القرآن من ابن مسعود: «إني أحب أن أسمعه من غيري» (324)، وفي الكسوف يدعو لأمته (325)، وعند احتضار ابنة له: «إني لست أبكي، إنما هي رحمة» (326)، وعند تقبيل عثمان بن مظعون ميتاً (327)، وعلى قبر ابنته وعيناه تدمعان (328). `T16` `T02`\n\n### H-SHM-0323 — أتيت رسول الله صلى الله عليه وسلم وهو يصلي ولجوفه أزيز كأز…\nحدثنا سويد بن نصر قال: حدثنا عبد الله بن المبارك، عن حماد بن سلمة، عن ثابت، عن مطرف وهو ابن عبد الله بن الشخير، عن أبيه قال: «أتيت رسول الله صلى الله عليه وسلم وهو يصلي ولجوفه أزيز كأزيز المرجل من البكاء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 276).\n\n### H-SHM-0324 — اقرأ علي فقلت: يا رسول الله، أقرأ عليك وعليك أنزل قال: إني…\nحدثنا محمود بن غيلان قال: حدثنا معاوية بن هشام قال: حدثنا سفيان، عن الأعمش، عن إبراهيم، عن عبيدة، عن عبد الله بن مسعود قال: قال لي رسول الله صلى الله عليه وسلم: «اقرأ علي» فقلت: يا رسول الله، أقرأ عليك وعليك أنزل قال: «إني أحب أن أسمعه من غيري» ، فقرأت سورة النساء، حتى بلغت {وجئنا بك على هؤلاء شهيدا} [النساء: 41] قال: فرأيت عيني رسول الله تهملان\n\n- **الدرجة:** B — صححه الألباني (المختصر 277).\n\n### H-SHM-0325 — رب ألم تعدني أن لا تعذبهم وأنا فيهم؟ رب ألم تعدني أن لا تع…\nحدثنا قتيبة قال: حدثنا جرير، عن عطاء بن السائب، عن أبيه، عن عبد الله بن عمرو قال: انكسفت الشمس يوما على عهد رسول الله صلى الله عليه وسلم فقام رسول الله صلى الله عليه وسلم يصلي، حتى لم يكد يركع ثم ركع، فلم يكد يرفع رأسه، ثم رفع رأسه، فلم يكد أن يسجد، ثم سجد فلم يكد أن يرفع رأسه، ثم رفع رأسه، فلم يكد أن يسجد، ثم سجد فلم يكد أن يرفع رأسه، فجعل ينفخ ويبكي، ويقول: «رب ألم تعدني أن لا تعذبهم وأنا فيهم؟ رب ألم تعدني أن لا تعذبهم وهم يستغفرون؟ ونحن نستغفرك» . فلما صلى ركعتين انجلت الشمس، فقام فحمد الله تعالى وأثنى عليه، ثم قال: «إن الشمس والقمر آيتان من آيات الله لا ينكسفان لموت أحد ولا لحياته، فإذا انكسفا فافزعوا إلى ذكر الله تعالى»\n\n- **الدرجة:** B — صححه الألباني (المختصر 277).\n\n### H-SHM-0326 — أتبكين عند رسول الله؟ فقالت: ألست أراك تبكي؟ قال: إني لست …\nحدثنا محمود بن غيلان قال: حدثنا أبو أحمد قال: حدثنا سفيان، عن عطاء بن السائب، عن عكرمة، عن ابن عباس قال : أخذ رسول الله صلى الله عليه وسلم ابنة له تقضي فاحتضنها فوضعها بين يديه فماتت وهي بين يديه وصاحت أم أيمن فقال - يعني صلى الله عليه وسلم -: «أتبكين عند رسول الله؟» فقالت: ألست أراك تبكي؟ قال: «إني لست أبكي، إنما هي رحمة، إن المؤمن بكل خير على كل حال، إن نفسه تنزع من بين جنبيه، وهو يحمد الله عز وجل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 277) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0327 — أن رسول الله صلى الله عليه وسلم قبل عثمان بن مظعون وهو ميت…\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن عاصم بن عبيد الله، عن القاسم بن محمد، عن عائشة: «أن رسول الله صلى الله عليه وسلم قبل عثمان بن مظعون وهو ميت وهو يبكي» أو قال: «عيناه تهراقان»\n\n- **الدرجة:** B — صححه الألباني (المختصر 280).\n\n### H-SHM-0328 — أفيكم رجل لم يقارف الليلة؟ قال أبو طلحة: أنا قال: انزل فنز…\nحدثنا إسحاق بن منصور قال: أخبرنا أبو عامر قال: حدثنا فليح وهو ابن سليمان، عن هلال بن علي، عن أنس بن مالك قال: شهدنا ابنة لرسول الله صلى الله عليه وسلم ورسول الله جالس على القبر فرأيت عيينه تدمعان، فقال: «أفيكم رجل لم يقارف الليلة؟» قال أبو طلحة: أنا قال: «انزل» فنزل في قبرها\n\n- **الدرجة:** ؟ — الحكم غير واضح في النسخة الرقمية من المختصر؛ يُراجع `RG-053`.\n\n\n## الباب 46: فراشه\n\n**خلاصة الباب (E):** فراشه من أدم حشوه ليف (329). وفي حديث حفصة (330) أنها ثنت له المسح أربع ثنيات ليكون أوطأ، فلما أصبح قال: «ردوه لحالته الأولى، فإنه منعتني وطاءته صلاتي الليلة»: ردّ الراحة الزائدة لأنها شغلته عن قيام الليل. `T14`\n\n### H-SHM-0329 — إنما كان فراش رسول الله صلى الله عليه وسلم الذي ينام عليه …\nحدثنا علي بن حجر قال: حدثنا علي بن مسهر، عن هشام بن عروة، عن أبيه، عن عائشة قالت: «إنما كان فراش رسول الله صلى الله عليه وسلم الذي ينام عليه من أدم حشوه ليف»\n\n- **الدرجة:** ؟ — الحكم غير واضح في النسخة الرقمية من المختصر، والمتن له مطابقة في الصحيحين؛ يُراجع `RG-053`.\n\n### H-SHM-0330 — من أدم حشوه من ليف وسئلت حفصة، ما كان فراش رسول الله صلى ا…\nحدثنا أبو الخطاب زياد بن يحيى البصري قال: حدثنا عبد الله بن ميمون قال: حدثنا جعفر بن محمد، عن أبيه قال: سئلت عائشة، ما كان فراش رسول الله صلى الله عليه وسلم في بيتك؟ قالت: «من أدم حشوه من ليف» وسئلت حفصة، ما كان فراش رسول الله صلى الله عليه وسلم في بيتك؟ قالت: مسحا نثنيه ثنيتين فينام عليه، فلما كان ذات ليلة قلت: لو ثنيته أربع ثنيات لكان أوطأ له فثنيناه له بأربع ثنيات، فلما أصبح قال: «ما فرشتم لي الليلة» قالت: قلنا: هو فراشك إلا أنا ثنيناه بأربع ثنيات، قلنا: هو أوطأ لك قال: «ردوه لحالته الأولى، فإنه منعتني وطاءته صلاتي الليلة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 283).\n\n\n## الباب 50: حجامته\n\n**خلاصة الباب (E):** احتجم وأعطى الحجام أجره (362–363)، وسأله عن خراجه فوضع عنه صاعاً وأعطاه أجره (364): وفاء الأجير حقه، والشفاعة له عند مواليه في التخفيف. `T21` `C06`\n\n### H-SHM-0361 — إن أفضل ما تداويتم به الحجامة ، أو إن من أمثل دوائكم الحجا…\nحدثنا علي بن حجر قال: حدثنا إسماعيل بن جعفر، عن حميد قال: سئل أنس بن مالك عن كسب الحجام، فقال: احتجم رسول الله صلى الله عليه وسلم حجمه أبو طيبة، فأمر له بصاعين من طعام، وكلم أهله فوضعوا عنه من خراجه وقال: «إن أفضل ما تداويتم به الحجامة» ، أو «إن من أمثل دوائكم الحجامة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 309).\n\n### H-SHM-0362 — أن النبي صلى الله عليه وسلم احتجم وأمرني فأعطيت الحجام أجر…\nحدثنا عمرو بن علي قال: حدثنا أبو داود، قال: حدثنا ورقاء بن عمر، عن عبد الأعلى، عن أبي جميلة، عن علي: «أن النبي صلى الله عليه وسلم احتجم وأمرني فأعطيت الحجام أجره»\n\n- **الدرجة:** B — صححه الألباني (المختصر 310).\n\n### H-SHM-0363 — إن النبي صلى الله عليه وسلم احتجم في الأخدعين وبين الكتفين…\nحدثنا هارون بن إسحاق الهمداني قال: حدثنا عبدة، عن سفيان الثوري، عن جابر، عن الشعبي، عن ابن عباس قال: «إن النبي صلى الله عليه وسلم احتجم في الأخدعين وبين الكتفين، وأعطى الحجام أجره ولو كان حراما لم يعطه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 311).\n\n### H-SHM-0364 — كم خراجك؟ فقال: ثلاثة آصع، فوضع عنه صاعا وأعطاه أجره\nحدثنا هارون بن إسحاق، قال: حدثنا عبدة، عن ابن أبي ليلى، عن نافع، عن ابن عمر، أن النبي صلى الله عليه وسلم دعا حجاما فحجمه وسأله: «كم خراجك؟» فقال: ثلاثة آصع، فوضع عنه صاعا وأعطاه أجره\n\n- **الدرجة:** B — صححه الألباني (المختصر 312).\n\n### H-SHM-0365 — كان رسول الله صلى الله عليه وسلم يحتجم في الأخدعين والكاهل…\nحدثنا عبد القدوس بن محمد العطار البصري، قال: حدثنا عمرو بن عاصم، قال: حدثنا همام، وجرير بن حازم قالا: حدثنا قتادة، عن أنس بن مالك قال : «كان رسول الله صلى الله عليه وسلم يحتجم في الأخدعين والكاهل، وكان يحتجم لسبع عشرة وتسع عشرة وإحدى وعشرين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 313).\n\n### H-SHM-0366 — أن رسول الله صلى الله عليه وسلم احتجم وهو محرم بملل على ظه…\nحدثنا إسحاق بن منصور قال: أنبأنا عبد الرزاق، عن معمر، عن قتادة، عن أنس بن مالك: «أن رسول الله صلى الله عليه وسلم احتجم وهو محرم بملل على ظهر القدم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 314).\n\n\n## الباب 51: أسماؤه\n\n### H-SHM-0367 — إن لي أسماء أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الل…\nحدثنا سعيد بن عبد الرحمن المخزومي، وغير واحد قالوا: حدثنا سفيان، عن الزهري، عن محمد بن جبير بن مطعم، عن أبيه قال: قال رسول الله صلى الله عليه وسلم: «إن لي أسماء» أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب والعاقب الذي ليس بعده نبي \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 315)، وله مطابقة لفظية في البخاري 4896، مسلم 2354.\n\n### H-SHM-0368 — أنا محمد، وأنا أحمد، وأنا نبي الرحمة، ونبي التوبة، وأنا ال…\nحدثنا محمد بن طريف الكوفي، قال: حدثنا أبو بكر بن عياش، عن عاصم، عن أبي وائل، عن حذيفة قال: لقيت النبي صلى الله عليه وسلم في بعض طرق المدينة فقال: «أنا محمد، وأنا أحمد، وأنا نبي الرحمة، ونبي التوبة، وأنا المقفى، وأنا الحاشر، ونبي الملاحم»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 316).\n\n### H-SHM-0369 — قال: حدثنا النضر بن شميل قال: أنبأنا حماد بن سلمة، عن عاصم…\nحدثنا إسحاق بن منصور قال: حدثنا النضر بن شميل قال: أنبأنا حماد بن سلمة، عن عاصم، عن زر، عن حذيفة، عن النبي صلى الله عليه وسلم نحوه بمعناه، هكذا قال حماد بن سلمة، عن عاصم، عن زر، عن حذيفة\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 316) (إسناد آخر للحديث السابق).\n\n\n## الباب 52: عيشه (الباب الثاني)\n\n**خلاصة الباب (E):** «إن كنا آل محمد نمكث شهراً ما نستوقد بنار» (371). خروجه من بيته من الجوع ولقاؤه أبا بكر وعمر، ثم ذهابهم إلى أبي الهيثم بن التيهان (373). **«لقد أُخفت في الله وما يخاف أحد، ولقد أوذيت في الله وما يؤذى أحد»** (376). والضعيف: رفع الحجر عن البطن من حديث أبي طلحة (372)، و378. `T14` `T04`\n\n### H-SHM-0370 — لقد رأيت نبيكم صلى الله عليه وسلم وما يجد من الدقل ما يملأ…\nحدثنا قتيبة بن سعيد قال: حدثنا أبو الأحوص، عن سماك بن حرب قال: سمعت النعمان بن بشير يقول: ألستم في طعام وشراب ما شئتم؟ «لقد رأيت نبيكم صلى الله عليه وسلم وما يجد من الدقل ما يملأ بطنه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 110).\n\n### H-SHM-0371 — إن كنا آل محمد نمكث شهرا ما نستوقد بنار، إن هو إلا التمر و…\nحدثنا هارون بن إسحاق، قال: حدثنا عبدة، عن هشام بن عروة، عن أبيه، عن عائشة، قالت: «إن كنا آل محمد نمكث شهرا ما نستوقد بنار، إن هو إلا التمر والماء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 111).\n\n### H-SHM-0372 — شكونا إلى رسول الله صلى الله عليه وسلم الجوع ورفعنا عن بطو…\nحدثنا عبد الله بن أبي زياد، قال: حدثنا سيار، قال: حدثنا سهل بن أسلم، عن يزيد بن أبي منصور، عن أنس، عن أبي طلحة قال: «شكونا إلى رسول الله صلى الله عليه وسلم الجوع ورفعنا عن بطوننا عن حجر حجر، فرفع رسول الله صلى الله عليه وسلم عن بطنه عن حجرين» قال أبو عيسى: \" هذا حديث غريب من حديث أبي طلحة لا نعرفه إلا من هذا الوجه، ومعنى قوله: ورفعنا عن بطوننا عن حجر حجر، كان أحدهم يشد في بطنه الحجر من الجهد والضعف الذي به من الجوع \"\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 112).\n\n### H-SHM-0373 — ما جاء بك يا أبا بكر؟ قال: خرجت ألقى رسول الله صلى الله عل…\nحدثنا محمد بن إسماعيل، قال: حدثنا آدم بن أبي إياس، قال: حدثنا شيبان أبو معاوية، قال: حدثنا عبد الملك بن عمير، عن أبي سلمة بن عبد الرحمن، عن أبي هريرة قال : خرج رسول الله صلى الله عليه وسلم في ساعة لا يخرج فيها ولا يلقاه فيها أحد، فأتاه أبو بكر، فقال: «ما جاء بك يا أبا بكر؟» قال: خرجت ألقى رسول الله صلى الله عليه وسلم وأنظر في وجهه، والتسليم عليه، فلم يلبث أن جاء عمر فقال: «ما جاء بك يا عمر؟» قال: الجوع يا رسول الله، قال صلى الله عليه وسلم: «وأنا قد وجدت بعض ذلك» فانطلقوا إلى منزل أبي الهيثم بن التيهان الأنصاري وكان رجلا كثير النخل والشاء، ولم يكن له خدم، فلم يجدوه، فقالوا لامرأته: أين صاحبك؟ فقالت: انطلق يستعذب لنا الماء، فلم يلبثوا أن جاء أبو الهيثم بقربة يزعبها، فوضعها ثم جاء يلتزم النبي صلى الله عليه وسلم ويفديه بأبيه وأمه، ثم انطلق بهم إلى حديقته فبسط لهم بساطا، ثم انطلق إلى نخلة فجاء بقنو فوضعه، فقال النبي صلى الله عليه وسلم: «أفلا تنقيت لنا من رطبه؟» فقال: يا رسول الله، إني أردت أن تختاروا، أو تخيروا من رطبه وبسره، فأكلوا وشربوا من ذلك الماء. فقال صلى الله عليه وسلم: «هذا والذي نفسي بيده من النعيم الذي تسألون عنه يوم القيامة ظل بارد، ورطب طيب، وماء بارد» . فانطلق أبو الهيثم ليصنع لهم طعاما. فقال النبي صلى الله عليه وسلم: «لا تذبحن ذات در» ، فذبح لهم عناقا أو جديا، فأتاهم بها فأكلوا، فقال صلى الله عليه وسلم: «هل لك خادم؟» قال: لا. قال: «فإذا أتانا سبي فأتنا» . فأتي النبي صلى الله عليه وسلم برأسين ليس معهما ثالث، فأتاه أبو الهيثم، فقال النبي صلى الله عليه وسلم: «اختر منهما» فقال: يا رسول الله، اختر لي. فقال النبي صلى الله عليه وسلم: «إن المستشار مؤتمن، خذ هذا فإني رأيته يصلي، واستوص به معروفا» . فانطلق أبو الهيثم إلى امرأته، فأخبرها بقول رسول الله صلى الله عليه وسلم، فقالت امرأته: ما أنت ببالغ حق ما قال فيه النبي صلى الله عليه وسلم إلا بأن تعتقه قال: فهو عتيق، فقال صلى الله عليه وسلم: \" إن الله لم يبعث نبيا ولا خليفة إلا وله بطانتان: بطانة تأمره بالمعروف وتنهاه عن المنكر، وبطانة لا تألوه خبالا، ومن يوق بطانة السوء فقد وقي \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 113).\n\n### H-SHM-0374 — إني لأول رجل أهراق دما في سبيل الله عز وجل، وإني لأول رجل …\nحدثنا عمر بن إسماعيل بن مجالد بن سعيد، قال: حدثني أبي، عن بيان بن بشر، عن قيس بن أبي حازم، قال : سمعت سعد بن أبي وقاص يقول: «إني لأول رجل أهراق دما في سبيل الله عز وجل، وإني لأول رجل رمى بسهم في سبيل الله، لقد رأيتني أغزو في العصابة من أصحاب محمد عليه الصلاة والسلام ما نأكل إلا ورق الشجر والحبلة حتى تقرحت أشداقنا، وإن أحدنا ليضع كما تضع الشاة والبعير، وأصبحت بنو أسد يعزروني في الدين. لقد خبت وخسرت إذا وضل عملي»\n\n- **الدرجة:** B — صححه الألباني (المختصر 114).\n\n### H-SHM-0375 — لقد رأيتني وإني لسابع سبعة مع رسول الله صلى الله عليه وسلم…\nحدثنا محمد بن بشار قال: حدثنا صفوان بن عيسى، قال: حدثنا عمرو بن عيسى أبو نعامة العدوي قال : سمعت خالد بن عمير، وشويسا أبا الرقاد، قالا: بعث عمر بن الخطاب عتبة بن غزوان وقال: انطلق أنت ومن معك، حتى إذا كنتم في أقصى بلاد العرب، وأدنى بلاد العجم فأقبلوا، حتى إذا كانوا بالمربد وجدوا هذا الكذان، فقالوا: ما هذه؟ قالوا: هذه البصرة فساروا حتى إذا بلغوا حيال الجسر الصغير، فقالوا: ههنا أمرتم، فنزلوا - فذكروا الحديث بطوله - قال: فقال عتبة بن غزوان: «لقد رأيتني وإني لسابع سبعة مع رسول الله صلى الله عليه وسلم ما لنا طعام إلا ورق الشجر حتى تقرحت أشداقنا، فالتقطت بردة قسمتها بيني وبين سعد، فما منا من أولئك السبعة أحد إلا وهو أمير مصر من الأمصار وستجربون الأمراء بعدنا»\n\n- **الدرجة:** B/X — قول عتبة «لقد رأيتني وإني لسابع سبعة...» صحيح، والقصة التي في أوله ضعيفة (المختصر 115).\n\n### H-SHM-0376 — لقد أخفت في الله وما يخاف أحد، ولقد أوذيت في الله وما يؤذى…\nحدثنا عبد الله بن عبد الرحمن، قال: حدثنا روح بن أسلم أبو حاتم البصري، قال: حدثنا حماد بن سلمة، قال: حدثنا ثابت، عن أنس قال: قال رسول الله صلى الله عليه وسلم: «لقد أخفت في الله وما يخاف أحد، ولقد أوذيت في الله وما يؤذى أحد، ولقد أتت علي ثلاثون من بين ليلة ويوم وما لي ولبلال طعام يأكله ذو كبد إلا شيء يواريه إبط بلال»\n\n- **الدرجة:** B — صححه الألباني (المختصر 116).\n\n### H-SHM-0377 — أن النبي صلى الله عليه وسلم لم يجتمع عنده غداء ولا عشاء من…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عفان بن مسلم، قال: حدثنا أبان بن يزيد العطار، قال: حدثنا قتادة، عن أنس بن مالك: «أن النبي صلى الله عليه وسلم لم يجتمع عنده غداء ولا عشاء من خبز ولحم إلا على ضفف» قال عبد الله: \" قال بعضهم: هو كثرة الأيدي \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 117).\n\n### H-SHM-0378 — هلك رسول الله صلى الله عليه وسلم ولم يشبع هو وأهل بيته من …\nحدثنا عبد بن حميد، قال: حدثنا محمد بن إسماعيل بن أبي فديك، قال: حدثنا ابن أبي ذئب، عن مسلم بن جندب، عن نوفل بن إياس الهذلي قال: كان عبد الرحمن بن عوف لنا جليسا، وكان نعم الجليس، وإنه انقلب بنا ذات يوم حتى إذا دخلنا بيته ودخل فاغتسل، ثم خرج وأتينا بصحفة فيها خبز ولحم، فلما وضعت بكى عبد الرحمن فقلت له: يا أبا محمد، ما يبكيك؟ فقال: «هلك رسول الله صلى الله عليه وسلم ولم يشبع هو وأهل بيته من خبز الشعير» فلا أرانا أخرنا لما هو خير لنا\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 118).\n\n\n## الباب 53: سنه\n\n**خلاصة الباب (E):** ثلاث وستون في ثلاث روايات (379–381)، ومعها عن ابن عباس «خمس وستين» (382) بتصحيح الألباني، ورواية دغفل (383) ضعيفة. يُضاف 382 إلى `SD-011`.\n\n### H-SHM-0379 — مكث النبي صلى الله عليه وسلم بمكة ثلاث عشرة سنة يوحى إليه،…\nحدثنا أحمد بن منيع، قال: حدثنا روح بن عبادة، قال: حدثنا زكريا بن إسحاق، قال: حدثنا عمرو بن دينار، عن ابن عباس قال: «مكث النبي صلى الله عليه وسلم بمكة ثلاث عشرة سنة يوحى إليه، وبالمدينة عشرا، وتوفي وهو ابن ثلاث وستين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 317)، وله مطابقة لفظية في مسلم 2351.\n\n### H-SHM-0380 — مات رسول الله صلى الله عليه وسلم وهو ابن ثلاث وستين وأبو ب…\nحدثنا محمد بن بشار، قال: حدثنا محمد بن جعفر، عن شعبة، عن أبي إسحاق، عن عامر بن سعد، عن جرير، عن معاوية، أنه سمعه يخطب قال: «مات رسول الله صلى الله عليه وسلم وهو ابن ثلاث وستين» وأبو بكر وعمر، وأنا ابن ثلاث وستين\n\n- **الدرجة:** B — صححه الألباني (المختصر 318)، وله مطابقة لفظية في مسلم 2352.\n\n### H-SHM-0381 — أن النبي صلى الله عليه وسلم مات وهو ابن ثلاث وستين سنة\nحدثنا حسين بن مهدي البصري، قال: حدثنا عبد الرزاق، عن ابن جريج، عن الزهري، عن عروة، عن عائشة: «أن النبي صلى الله عليه وسلم مات وهو ابن ثلاث وستين سنة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 319).\n\n### H-SHM-0382 — توفي رسول الله صلى الله عليه وسلم وهو ابن خمس وستين\nحدثنا أحمد بن منيع، ويعقوب بن إبراهيم الدورقي، قالا: حدثنا إسماعيل بن علية، عن خالد الحذاء، قال: أنبأنا عمار مولى بني هاشم قال: سمعت ابن عباس يقول: \" توفي رسول الله صلى الله عليه وسلم وهو ابن خمس وستين\n\n- **الدرجة:** B — صححه الألباني (المختصر 320) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0383 — أن النبي صلى الله عليه وسلم قبض وهو ابن خمس وستين قال أبو …\nحدثنا محمد بن بشار، ومحمد بن أبان، قالا: حدثنا معاذ بن هشام، قال: حدثني أبي، عن قتادة، عن الحسن، عن دغفل بن حنظلة: «أن النبي صلى الله عليه وسلم قبض وهو ابن خمس وستين» قال أبو عيسى: ودغفل لا نعرف له سماعا من النبي صلى الله عليه وسلم وكان في زمن النبي صلى الله عليه وسلم رجلا\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 321).\n\n### H-SHM-0384 — كان رسول الله صلى الله عليه وسلم ليس بالطويل البائن، ولا ب…\nحدثنا إسحاق بن موسى الأنصاري، قال: حدثنا معن، حدثنا مالك بن أنس، عن ربيعة بن أبي عبد الرحمن، عن أنس بن مالك، أنه سمعه يقول: «كان رسول الله صلى الله عليه وسلم ليس بالطويل البائن، ولا بالقصير، ولا بالأبيض الأمهق، ولا بالآدم، ولا بالجعد القطط، ولا بالسبط، بعثه الله تعالى على رأس أربعين سنة، فأقام بمكة عشر سنين، وبالمدينة عشر سنين، وتوفاه الله على رأس ستين سنة وليس في رأسه ولحيته عشرون شعرة بيضاء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 1)، وله مطابقة لفظية في البخاري 5900، مسلم 2347.\n\n### H-SHM-0385 — حدثنا قتيبة بن سعيد، عن مالك بن أنس، عن ربيعة بن أبي عبد ا…\nحدثنا قتيبة بن سعيد، عن مالك بن أنس، عن ربيعة بن أبي عبد الرحمن، عن أنس بن مالك، نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 1)، وله مطابقة لفظية في البخاري 3548 (إسناد آخر للحديث السابق).\n\n\n## الباب 54: وفاته\n\n**خلاصة الباب (E):** آخر نظرة لأنس: كشف الستارة يوم الاثنين «كأن وجهه ورقة مصحف»، وأشار إليهم أن اثبتوا وأبو بكر يؤمهم (386). **«مروا أبا بكر فليصل بالناس»** وكررها كلما أفاق (397). شدة موته (389). قول فاطمة وجوابه «لا كرب على أبيك بعد اليوم» (398). والضعيف: «اللهم أعني على سكرات الموت» (388)، و396، و399. `S11` `T23`\n\n### H-SHM-0386 — آخر نظرة نظرتها إلى رسول الله صلى الله عليه وسلم كشف الستا…\nحدثنا أبو عمار الحسين بن حريث، وقتيبة بن سعيد، وغير واحد قالوا: حدثنا سفيان بن عيينة، عن الزهري، عن أنس بن مالك قال: «آخر نظرة نظرتها إلى رسول الله صلى الله عليه وسلم كشف الستارة يوم الإثنين، فنظرت إلى وجهه كأنه ورقة مصحف والناس خلف أبي بكر، فأشار إلى الناس أن اثبتوا، وأبو بكر يؤمهم وألقى السجف، وتوفي رسول الله صلى الله عليه وسلم من آخر ذلك اليوم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 322).\n\n### H-SHM-0387 — كنت مسندة النبي صلى الله عليه وسلم إلى صدري - أو قالت: إلى…\nحدثنا حميد بن مسعدة البصري، قال: حدثنا سليم بن أخضر، عن ابن عون، عن إبراهيم، عن الأسود، عن عائشة، قالت: \" كنت مسندة النبي صلى الله عليه وسلم إلى صدري - أو قالت: إلى حجري - فدعا بطست ليبول فيه، ثم بال، فمات \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 323) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0388 — اللهم أعني على منكرات - أو قال على سكرات - الموت\nحدثنا قتيبة، قال: حدثنا الليث، عن ابن الهاد، عن موسى بن سرجس، عن القاسم بن محمد، عن عائشة، أنها قالت: رأيت رسول الله صلى الله عليه وسلم وهو بالموت وعنده قدح فيه ماء، وهو يدخل يده في القدح ثم يمسح وجهه بالماء، ثم يقول: «اللهم أعني على منكرات - أو قال على سكرات - الموت»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 324).\n\n### H-SHM-0389 — لا أغبط أحدا بهون موت بعد الذي رأيت من شدة موت رسول الله ص…\nحدثنا الحسن بن الصباح البزاز، قال: حدثنا مبشر بن إسماعيل، عن عبد الرحمن بن العلاء، عن أبيه، عن ابن عمر، عن عائشة، قالت : «لا أغبط أحدا بهون موت بعد الذي رأيت من شدة موت رسول الله صلى الله عليه وسلم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 325).\n\n### H-SHM-0390 — ما قبض الله نبيا إلا في الموضع الذي يحب أن يدفن فيه . ادفن…\nحدثنا أبو كريب محمد بن العلاء، قال: حدثنا أبو معاوية، عن عبد الرحمن بن أبي بكر وهو ابن المليكي، عن ابن أبي مليكة، عن عائشة، قالت: لما قبض رسول الله صلى الله عليه وسلم اختلفوا في دفنه، فقال أبو بكر: سمعت من رسول الله صلى الله عليه وسلم شيئا ما نسيته قال: «ما قبض الله نبيا إلا في الموضع الذي يحب أن يدفن فيه» . ادفنوه في موضع فراشه\n\n- **الدرجة:** B — صححه الألباني (المختصر 326).\n\n### H-SHM-0391 — قبل النبي صلى الله عليه وسلم بعد ما مات\nحدثنا محمد بن بشار، وعباس العنبري، وسوار بن عبد الله، وغير واحد قالوا: حدثنا يحيى بن سعيد، عن سفيان الثوري، عن موسى بن أبي عائشة، عن عبيد الله بن عبد الله، عن ابن عباس، وعائشة، أن أبا بكر، «قبل النبي صلى الله عليه وسلم بعد ما مات»\n\n- **الدرجة:** B — صححه الألباني (المختصر 327).\n\n### H-SHM-0392 — وانبياه، واصفياه، واخليلاه\nحدثنا نصر بن علي الجهضمي، قال: حدثنا مرحوم بن عبد العزيز العطار، عن أبي عمران الجوني، عن يزيد بن بابنوس، عن عائشة، أن أبا بكر، دخل على النبي صلى الله عليه وسلم بعد وفاته فوضع فمه بين عينيه ووضع يديه على ساعديه، وقال: «وانبياه، واصفياه، واخليلاه»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 328).\n\n### H-SHM-0393 — لما كان اليوم الذي دخل فيه رسول الله صلى الله عليه وسلم ال…\nحدثنا بشر بن هلال الصواف البصري، قال: حدثنا جعفر بن سليمان، عن ثابت، عن أنس قال: «لما كان اليوم الذي دخل فيه رسول الله صلى الله عليه وسلم المدينة أضاء منها كل شيء، فلما كان اليوم الذي مات فيه أظلم منها كل شيء، وما نفضنا أيدينا من التراب، وإنا لفي دفنه صلى الله عليه وسلم حتى أنكرنا قلوبنا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 329).\n\n### H-SHM-0394 — توفي رسول الله صلى الله عليه وسلم يوم الاثنين\nحدثنا محمد بن حاتم، قال: حدثنا عامر بن صالح، عن هشام بن عروة ، عن أبيه، عن عائشة، قالت: «توفي رسول الله صلى الله عليه وسلم يوم الاثنين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 330).\n\n### H-SHM-0395 — قبض رسول الله صلى الله عليه وسلم يوم الاثنين فمكث ذلك اليو…\nحدثنا محمد بن أبي عمر، قال: حدثنا سفيان بن عيينة، عن جعفر بن محمد، عن أبيه قال: «قبض رسول الله صلى الله عليه وسلم يوم الاثنين فمكث ذلك اليوم وليلة الثلاثاء، ودفن من الليل» وقال سفيان: \" وقال غيره: يسمع صوت المساحي من آخر الليل \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 331).\n\n### H-SHM-0396 — توفي رسول الله صلى الله عليه وسلم يوم الاثنين، ودفن يوم ال…\nحدثنا قتيبة بن سعيد قال: حدثنا عبد العزيز بن محمد، عن شريك بن عبد الله بن أبي نمر، عن أبي سلمة بن عبد الرحمن بن عوف، قال: «توفي رسول الله صلى الله عليه وسلم يوم الاثنين، ودفن يوم الثلاثاء» قال أبو عيسى: «هذا حديث غريب»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 332).\n\n### H-SHM-0397 — حضرت الصلاة ؟ فقالوا: نعم. فقال: مروا بلالا فليؤذن، ومروا …\nحدثنا نصر بن علي الجهضمي قال: حدثنا عبد الله بن داود قال : حدثنا سلمة بن نبيط، عن نعيم بن أبي هند، عن نبيط بن شريط، عن سالم بن عبيد، وكانت له صحبة قال: أغمي على رسول الله صلى الله عليه وسلم في مرضه فأفاق، فقال: «حضرت الصلاة» ؟ فقالوا: نعم. فقال: «مروا بلالا فليؤذن، ومروا أبا بكر أن يصلي للناس» - أو قال: بالناس - قال: ثم أغمي عليه، فأفاق، فقال: «حضرت الصلاة؟» فقالوا: نعم. فقال: «مروا بلالا فليؤذن، ومروا أبا بكر فليصل بالناس» ، فقالت عائشة: إن أبي رجل أسيف، إذا قام ذلك المقام بكى فلا يستطيع، فلو أمرت غيره قال: ثم أغمي عليه فأفاق فقال: «مروا بلالا فليؤذن، ومروا أبا بكر فليصل بالناس، فإنكن صواحب أو صواحبات يوسف» قال: فأمر بلال فأذن، وأمر أبو بكر فصلى بالناس، ثم إن رسول الله صلى الله عليه وسلم وجد خفة، فقال: «انظروا لي من أتكئ عليه» ، فجاءت بريرة ورجل آخر، فاتكأ عليهما فلما رآه أبو بكر ذهب لينكص فأومأ إليه أن يثبت مكانه، حتى قضى أبو بكر صلاته، ثم إن رسول الله صلى الله عليه وسلم قبض، فقال عمر: والله لا أسمع أحدا يذكر أن رسول الله صلى الله عليه وسلم قبض إلا ضربته بسيفي هذا قال: وكان الناس أميين لم يكن فيهم نبي قبله، فأمسك الناس، فقالوا: يا سالم، انطلق إلى صاحب رسول الله صلى الله عليه وسلم فادعه، فأتيت أبا بكر وهو في المسجد فأتيته أبكي دهشا، فلما رآني قال: أقبض رسول الله صلى الله عليه وسلم؟ قلت: إن عمر يقول: لا أسمع أحدا يذكر أن رسول الله صلى الله عليه وسلم قبض إلا ضربته بسيفي هذا، فقال لي: انطلق، فانطلقت معه، فجاء هو والناس قد دخلوا على رسول الله صلى الله عليه وسلم فقال: يا أيها الناس، أفرجوا لي، فأفرجوا له فجاء حتى أكب عليه ومسه، فقال: {إنك ميت وإنهم ميتون} [الزمر: 30] ثم قالوا: يا صاحب رسول الله صلى الله عليه وسلم، أقبض رسول الله صلى الله عليه وسلم؟ قال: نعم، فعلموا أن قد صدق، قالوا: يا صاحب رسول الله صلى الله عليه وسلم، أيصلى على رسول الله؟ قال: نعم، قالوا: وكيف؟ قال: يدخل قوم فيكبرون ويصلون ويدعون، ثم يخرجون، ثم يدخل قوم فيكبرون ويصلون ويدعون، ثم يخرجون، حتى يدخل الناس، قالوا: يا صاحب رسول الله صلى الله عليه وسلم، أيدفن رسول الله صلى الله عليه وسلم؟ قال: نعم، قالوا: أين؟ قال: في المكان الذي قبض الله فيه روحه، فإن الله لم يقبض روحه إلا في مكان طيب. فعلموا أن قد صدق، ثم أمرهم أن يغسله بنو أبيه واجتمع المهاجرون يتشاورون، فقالوا: انطلق بنا إلى إخواننا من الأنصار ندخلهم معنا في هذا الأمر، فقالت الأنصار: منا أمير ومنكم أمير، فقال عمر بن الخطاب: من له مثل هذه الثلاث {ثاني اثنين إذ هما في الغار إذ يقول لصاحبه لا تحزن إن الله معنا} [التوبة: 40] من هما؟ قال: ثم بسط يده فبايعه وبايعه الناس بيعة حسنة جميلة\n\n- **الدرجة:** B — صححه الألباني (المختصر 333).\n\n### H-SHM-0398 — لا كرب على أبيك بعد اليوم، إنه قد حضر من أبيك ما ليس بتارك…\nحدثنا نصر بن علي، قال: حدثنا عبد الله بن الزبير، شيخ باهلي قديم بصري، قال: حدثنا ثابت البناني، عن أنس بن مالك قال: لما وجد رسول الله صلى الله عليه وسلم من كرب الموت ما وجد، قالت فاطمة: واكرباه، فقال النبي صلى الله عليه وسلم: «لا كرب على أبيك بعد اليوم، إنه قد حضر من أبيك ما ليس بتارك منه أحدا الموافاة يوم القيامة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 334).\n\n### H-SHM-0399 — من كان له فرطان من أمتي أدخله الله تعالى بهما الجنة ، فقال…\nحدثنا أبو الخطاب زياد بن يحيى البصري، ونصر بن علي، قالا: حدثنا عبد ربه بن بارق الحنفي قال: سمعت جدي أبا أمي سماك بن الوليد، يحدث أنه سمع ابن عباس، يحدث أنه سمع رسول الله صلى الله عليه وسلم يقول: «من كان له فرطان من أمتي أدخله الله تعالى بهما الجنة» ، فقالت عائشة: فمن كان له فرط من أمتك؟ قال: «ومن كان له فرط يا موفقة» قالت: فمن لم يكن له فرط من أمتك؟ قال: «فأنا فرط لأمتي، لن يصابوا بمثلي»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 335).\n\n\n## الباب 55: ميراثه\n\n**خلاصة الباب (E):** «ما ترك رسول الله ﷺ ديناراً ولا درهماً ولا شاة ولا بعيراً» (406)، و«لا نورث، ما تركنا صدقة» (403)، و«ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة» (404). عدم التوريث نص في الأنبياء، فهو من الخصوصيات ولا يُعمم. وفي 404 تقديم نفقة الأهل وأجرة العامل. `T23` `T21`\n\n### H-SHM-0400 — ما ترك رسول الله صلى الله عليه وسلم إلا سلاحه وبغلته وأرضا…\nحدثنا أحمد بن منيع، قال: حدثنا حسين بن محمد، قال: حدثنا إسرائيل، عن أبي إسحاق، عن عمرو بن الحارث، أخي جويرية له صحبة قال: «ما ترك رسول الله صلى الله عليه وسلم إلا سلاحه وبغلته وأرضا جعلها صدقة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 336).\n\n### H-SHM-0401 — لا نورث ، ولكني أعول من كان رسول الله صلى الله عليه وسلم ي…\nحدثنا محمد بن المثنى قال: حدثنا أبو الوليد، قال: حدثنا حماد بن سلمة، عن محمد بن عمرو، عن أبي سلمة، عن أبي هريرة قال: جاءت فاطمة إلى أبي بكر فقالت: من يرثك؟ فقال: أهلي وولدي، فقالت: ما لي لا أرث أبي؟ فقال أبو بكر: سمعت رسول الله صلى الله عليه وسلم يقول: «لا نورث» ، ولكني أعول من كان رسول الله صلى الله عليه وسلم يعوله، وأنفق على من كان رسول الله صلى الله عليه وسلم ينفق عليه\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 337).\n\n### H-SHM-0402 — كل مال نبي صدقة، إلا ما أطعمه، إنا لا نورث؟ وفي الحديث قصة\nحدثنا محمد بن المثنى قال: حدثنا يحيى بن كثير العنبري أبو غسان، قال: حدثنا شعبة، عن عمرو بن مرة، عن أبي البختري، أن العباس، وعليا، جاءا إلى عمر يختصمان يقول كل واحد منهما لصاحبه: أنت كذا، أنت كذا، فقال عمر، لطلحة، والزبير، وعبد الرحمن بن عوف، وسعد: أنشدكم بالله أسمعتم رسول الله صلى الله عليه وسلم يقول: «كل مال نبي صدقة، إلا ما أطعمه، إنا لا نورث؟» وفي الحديث قصة\n\n- **الدرجة:** B — صححه الألباني (المختصر 338).\n\n### H-SHM-0403 — لا نورث ما تركنا فهو صدقة\nحدثنا محمد بن المثنى قال: حدثنا صفوان بن عيسى، عن أسامة بن زيد، عن الزهري، عن عروة، عن عائشة ، أن رسول الله صلى الله عليه وسلم قال: «لا نورث ما تركنا فهو صدقة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 339)، وله مطابقة لفظية في البخاري 3711، مسلم 1758.\n\n### H-SHM-0404 — لا يقسم ورثتي دينارا ولا درهما، ما تركت بعد نفقة نسائي ومؤ…\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن أبي الزناد، عن الأعرج، عن أبي هريرة، عن النبي صلى الله عليه وسلم قال: «لا يقسم ورثتي دينارا ولا درهما، ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 340).\n\n### H-SHM-0405 — لا نورث، ما تركناه صدقة فقالوا: اللهم نعم وفي الحديث قصة ط…\nحدثنا الحسن بن علي الخلال، قال: حدثنا بشر بن عمر قال: سمعت مالك بن أنس، عن الزهري، عن مالك بن أوس بن الحدثان قال : دخلت على عمر فدخل عليه عبد الرحمن بن عوف، وطلحة، وسعد، وجاء علي، والعباس، يختصمان، فقال لهم عمر: أنشدكم بالذي بإذنه تقوم السماء والأرض، أتعلمون أن رسول الله صلى الله عليه وسلم قال: «لا نورث، ما تركناه صدقة» فقالوا: اللهم نعم وفي الحديث قصة طويلة\n\n- **الدرجة:** B — صححه الألباني (المختصر 341).\n\n### H-SHM-0406 — ما ترك رسول الله صلى الله عليه وسلم دينارا ولا درهما ولا ش…\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن عاصم ابن بهدلة، عن زر بن حبيش، عن عائشة، قالت: «ما ترك رسول الله صلى الله عليه وسلم دينارا ولا درهما ولا شاة ولا بعيرا» قال: «وأشك في العبد والأمة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 342).\n\n\n## الباب 56: رؤيته في المنام\n\n**خلاصة الباب (E):** آخر الباب أثران ليسا حديثين: عن ابن المبارك «إذا ابتُليت بالقضاء فعليك بالأثر» (416)، وعن ابن سيرين «هذا الحديث دين، فانظروا عمن تأخذون دينكم» (417). وهو أصل منهج التحقق في هذا المشروع.\n\n### H-SHM-0407 — من رآني في المنام فقد رآني فإن الشيطان لا يتمثل بي\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن أبي إسحاق، عن أبي الأحوص، عن عبد الله بن مسعود، عن النبي صلى الله عليه وسلم قال: «من رآني في المنام فقد رآني فإن الشيطان لا يتمثل بي»\n\n- **الدرجة:** B — صححه الألباني (المختصر 343)، وله مطابقة لفظية في البخاري 6994، مسلم 2266.\n\n### H-SHM-0408 — من رآني في المنام فقد رآني فإن الشيطان لا يتصور أو قال: لا…\nحدثنا محمد بن بشار، ومحمد بن المثنى، قالا: حدثنا محمد بن جعفر، قال: حدثنا شعبة، عن أبي حصين، عن أبي صالح، عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من رآني في المنام فقد رآني فإن الشيطان لا يتصور» أو قال: «لا يتشبه بي»\n\n- **الدرجة:** B — صححه الألباني (المختصر 344).\n\n*الرقم 409 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0410 — من رآني في المنام فقد رآني قال أبو عيسى:  وأبو مالك هذا هو…\nحدثنا قتيبة، قال: حدثنا خلف بن خليفة، عن أبي مالك الأشجعي، عن أبيه قال: قال رسول الله صلى الله عليه وسلم: «من رآني في المنام فقد رآني» قال أبو عيسى: \" وأبو مالك هذا هو: سعد بن طارق بن أشيم، وطارق بن أشيم هو من أصحاب النبي صلى الله عليه وسلم وقد روى عن النبي صلى الله عليه وسلم أحاديث \" سمعت علي بن حجر يقول: قال خلف بن خليفة: «رأيت عمرو بن حريث صاحب النبي صلى الله عليه وسلم وأنا غلام صغير» حدثنا قتيبة هو ابن سعيد، قال: حدثنا عبد الواحد بن زياد، عن عاصم بن كليب قال: حدثني أبي، أنه سمع أبا هريرة يقول: قال رسول الله صلى الله عليه وسلم: «من رآني في المنام فقد رآني فإن الشيطان لا يتمثلني» قال أبي: فحدثت به ابن عباس، فقلت: قد رأيته، فذكرت الحسن بن علي فقلت: شبهته به، فقال ابن عباس: «إنه كان يشبهه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 345) (مطابقة آلية ضعيفة، تُراجع).\n\n*الرقم 411 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0412 — إن الشيطان لا يستطيع أن يتشبه بي، فمن رآني في النوم فقد رآ…\nحدثنا محمد بن بشار، قال: حدثنا ابن أبي عدي، ومحمد بن جعفر، قالا: حدثنا عوف بن أبي جميلة، عن يزيد الفارسي - وكان يكتب المصاحف - قال: رأيت النبي صلى الله عليه وسلم في المنام زمن ابن عباس قال: فقلت لابن عباس: إني رأيت رسول الله صلى الله عليه وسلم في النوم، فقال ابن عباس: إن رسول الله كان يقول: «إن الشيطان لا يستطيع أن يتشبه بي، فمن رآني في النوم فقد رآني» ، هل تستطيع أن تنعت هذا الرجل الذي رأيته في النوم؟ قال: نعم، أنعت لك رجلا بين الرجلين، جسمه ولحمه أسمر إلى البياض، أكحل العينين، حسن الضحك، جميل دوائر الوجه، ملأت لحيته ما بين هذه إلى هذه، قد ملأت نحره - قال عوف: ولا أدري ما كان مع هذا النعت - فقال ابن عباس: لو رأيته في اليقظة ما استطعت أن تنعته فوق هذا قال أبو عيسى: \" ويزيد الفارسي هو: يزيد بن هرمز، وهو أقدم من يزيد الرقاشي، وروى يزيد الفارسي، عن ابن عباس أحاديث، ويزيد الرقاشي لم يدرك ابن عباس، وهو يزيد بن أبان الرقاشي، وهو يروي عن أنس بن مالك، ويزيد الفارسي، ويزيد الرقاشي كلاهما من أهل البصرة، وعوف بن أبي جميلة هو: عوف الأعرابي \"\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 347).\n\n### H-SHM-0413 — أنا أكبر من قتادة\nحدثنا أبو داود سليمان بن سلم البلخي، قال: حدثنا النضر بن شميل قال: قال عوف الأعرابي: «أنا أكبر من قتادة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 348) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0414 — من رآني - يعني في النوم - فقد رأى الحق\nحدثنا عبد الله بن أبي زياد، قال: حدثنا يعقوب بن إبراهيم بن سعد، قال: حدثنا ابن أخي ابن شهاب الزهري، عن عمه قال: قال أبو سلمة: قال أبو قتادة: قال رسول الله صلى الله عليه وسلم: «من رآني - يعني في النوم - فقد رأى الحق»\n\n- **الدرجة:** B — صححه الألباني (المختصر 348).\n\n### H-SHM-0415 — من رآني في المنام فقد رآني، فإن الشيطان لا يتخيل بي وقال: …\nحدثنا عبد الله بن عبد الرحمن الدارمي قال: حدثنا معلى بن أسد، قال: حدثنا عبد العزيز بن المختار، قال: حدثنا ثابت، عن أنس: أن رسول الله صلى الله عليه وسلم قال: «من رآني في المنام فقد رآني، فإن الشيطان لا يتخيل بي» وقال: «ورؤيا المؤمن جزء من ستة وأربعين جزءا من النبوة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 350)، وله مطابقة لفظية في البخاري 6994 (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0416 — إذا ابتليت بالقضاء فعليك بالأثر\nحدثنا محمد بن علي قال: سمعت أبي يقول: قال عبد الله بن المبارك: «إذا ابتليت بالقضاء فعليك بالأثر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 351).\n\n### H-SHM-0417 — هذا الحديث دين، فانظروا عمن تأخذون دينكم PageV00P000\nحدثنا محمد بن علي، قال: حدثنا النضر بن شميل، قال: أنبأنا ابن عوف، عن ابن سيرين قال : «هذا الحديث دين، فانظروا عمن تأخذون دينكم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 352).\n\n\n---\n\n## قائمة التحذير: ما ضعّفه الألباني في هذه الأبواب (X)\n\nلا يُستدل بشيء منها.\n\n| الرقم | مطلع المتن | الحكم |\n|---|---|---|\n| `H-SHM-0007` | لم يكن رسول الله بالطويل الممغط، ولا بالقصير المتردد، وكان… | ضعيف عند الألباني (المختصر 5) |\n| `H-SHM-0008` | كان رسول الله صلى الله عليه وسلم فخما مفخما، يتلألأ وجهه ت… | ضعيف جداً عند الألباني (المختصر 6) (مطابقة آلية ضعيفة، تُراجع) |\n| `H-SHM-0015` | كان رسول الله صلى الله عليه وسلم أفلج الثنيتين، إذا تكلم ر… | ضعيف جداً عند الألباني (المختصر 13) |\n| `H-SHM-0019` | بين كتفيه خاتم النبوة، وهو خاتم النبيين | ضعيف عند الألباني (المختصر 5) |\n| `H-SHM-0027` | لم يكن بالجعد ولا بالسبط، كان يبلغ شعره شحمة أذنيه | ضعيف عند الألباني (المختصر 5) (مطابقة آلية ضعيفة، تُراجع) |\n| `H-SHM-0033` | كان رسول الله صلى الله عليه وسلم يكثر دهن رأسه وتسريح لحيت… | ضعيف عند الألباني (المختصر 26) |\n| `H-SHM-0036` | أن النبي صلى الله عليه وسلم كان يترجل غبا | ضعيف عند الألباني (المختصر 29) |\n| `H-SHM-0047` | أنا رأيت رسول الله صلى الله عليه وسلم يخرج من بيته ينفض رأ… | ضعيف عند الألباني (المختصر 39) |\n| `H-SHM-0058` | كان كم قميص رسول الله صلى الله عليه وسلم إلى الرسغ | ضعيف عند الألباني (المختصر 47) |\n| `H-SHM-0  الوحي (الدفعة 1)\n\n- **القسم:** 04 — التسلسل الزمني للسيرة\n- **الدفعة:** 1 — 15 نوفمبر 2026\n- **المصادر المقروءة فعلاً:** صحيح البخاري 1–7 و3902 و6982؛ سيرة ابن هشام (تحقيق طه عبد الرءوف سعد، نسخة الشاملة 7450 عبر مدونة OpenITI) ج1 ص217–222 كاملة، ومواضع من ص216 وص223؛ فتح الباري ج12 ص359–360، ومواضع مستهدفة من ج1 ص9–34 (الدفعة 2).\n- **لم يُقرأ بعد:** طبقات ابن سعد، تاريخ الطبري، البداية والنهاية، زاد المعاد، في هذه الأحداث.\n\n---\n\n## E-S01-001 — إطار المدد الكبرى في حياته ﷺ\n\n- **النص:** عن ابن عباس رضي الله عنهما: «بُعث رسول الله ﷺ لأربعين سنة، فمكث بمكة ثلاث عشرة سنة يوحى إليه، ثم أُمر بالهجرة فهاجر عشر سنين، ومات وهو ابن ثلاث وستين». البخاري 3902.\n- **الدرجة: B.**\n- **الاستعمال:** هيكل زمني للخط كله: البعثة عند الأربعين، 13 سنة في مكة، 10 سنوات في المدينة، الوفاة عند 63.\n- **تنبيه (الدفعة 2):** في صحيح البخاري نفسه رواية أنس أنه أقام بمكة بعد البعثة عشر سنين (3547 و3548)، ومجموعها ستون سنة. التعارض مسجل في `SD-011`، والإطار أعلاه مبني على رواية ابن عباس مؤقتاً.\n\n---\n\n## E-S02-001 — الرؤيا الصادقة قبل الوحي\n\n- **التاريخ:** قبل نزول الملك، ومدتها غير محددة في النص.\n- **التفاصيل:** «أول ما بدئ به رسول الله ﷺ من الوحي الرؤيا الصالحة في النوم، فكان لا يرى رؤيا إلا جاءت مثل فلق الصبح».\n- **المصادر:** البخاري 3 («الصالحة») و6982 («الصادقة»)؛ مسلم 160؛ ابن هشام ج1 ص216 (رواه ابن إسحاق عن الزهري عن عروة عن عائشة).\n- **الدرجة: B.**\n- **رواية مرافقة في ابن هشام:** ج1 ص217، أن الحجر والشجر كانا يسلمان عليه حين يخرج لحاجته في شعاب مكة. رواها ابن إسحاق عن عبد الملك بن عبيد الله الثقفي **عن بعض أهل العلم**، أي عن مبهم. **الدرجة: D.**\n\n---\n\n## E-S02-002 — التحنث في غار حراء\n\n- **المكان:** غار حراء.\n- **التفاصيل في البخاري 3:** حُبب إليه الخلاء، فكان يخلو بغار حراء فيتحنث، وهو التعبد، الليالي ذوات العدد، ويتزود لذلك، ثم يرجع إلى خديجة فيتزود لمثلها. **الدرجة: B.**\n- **تفاصيل زائدة عند ابن إسحاق (ابن هشام ج1 ص218–219):** من رواية وهب بن كيسان عن عبيد بن عمير: كان يجاور في حراء شهراً من كل سنة، وكان ذلك مما تتحنث به قريش في الجاهلية، **ويطعم من جاءه من المساكين**، فإذا انصرف بدأ بالكعبة فطاف بها قبل أن يدخل بيته. **الدرجة: D** (عبيد بن عمير من كبار التابعين ولم يشهد الحدث، فالرواية مرسلة بحسب ظاهر الإسناد؛ يُوثق حكم المحدثين عليها).\n- **مستوى E — ملاحظة:** إطعام المساكين في أيام الخلوة يتسق مع وصف خديجة له بحمل الكَلّ وقرى الضيف في الرواية الصحيحة، لكنه لا يثبت بنفسه.\n\n---\n\n## E-S02-003 — نزول الملك وأول ما نزل من القرآن\n\n- **المكان:** غار حراء.\n- **التاريخ:** الشهر عند ابن إسحاق رمضان (ابن هشام ج1 ص217 وص219). لم يُذكر الشهر في رواية البخاري. **الدرجة في تحديد الشهر: D**، وفيه خلاف مسجل `SD-005`.\n- **التفاصيل في البخاري 3:** جاءه الملك فقال «اقرأ»، قال «ما أنا بقارئ»، فغطه حتى بلغ منه الجهد، ثلاث مرات، ثم أقرأه أول سورة العلق. **الدرجة: B.**\n- **رواية ابن إسحاق (ابن هشام ج1 ص220–221):** «فجاءني جبريل وأنا نائم بنمط من ديباج فيه كتاب»، ثم ذكر الغط ثلاثاً ونزول العلق إلى «ما لم يعلم»، ثم «وهببت من نومي فكأنما كتبت في قلبي كتاباً». ثم خرج فسمع في وسط الجبل صوتاً، فرأى جبريل في صورة رجل في أفق السماء، فوقف لا يتقدم ولا يتأخر حتى بعثت خديجة رسلها في طلبه. **الدرجة: D** (مرسل عبيد بن عمير).\n- **مستوى E — فرق جوهري:** رواية البخاري ظاهرها اليقظة في الغار، ورواية ابن إسحاق صريحة في النوم أولاً ثم رؤية الملك في الأفق يقظة. التفصيل `SD-002`.\n- **الآيات:** 96:1–5.\n\n---\n\n## E-S02-004 — رجوعه إلى خديجة وتثبيتها له\n\n- **الأشخاص:** النبي ﷺ، خديجة بنت خويلد رضي الله عنها.\n- **الظرف السابق:** تجربة الوحي الأولى وما فيها من شدة («حتى بلغ مني الجهد»).\n- **التصرف النبوي (البخاري 3، B):** رجع «يرجف فؤاده»، وطلب أن يُزمَّل حتى ذهب عنه الروع، ثم أخبر خديجة بكل ما حدث، وصرح بخوفه: «لقد خشيت على نفسي».\n- **موقف خديجة (B):** نفت بالقسم أن يخزيه الله، واستدلت بأخلاقه الثابتة عندها. ثم أخذته إلى من عنده علم بالكتب السابقة.\n- **رواية ابن إسحاق (D):** جلس إليها، فقالت: «أبشر يا ابن عم واثبت»، ورجت أن يكون نبي هذه الأمة. وفي ابن هشام ج1 ص223 خبر اختبار خديجة لحقيقة الملك، من رواية إسماعيل بن أبي حكيم «أنه حُدِّث عن خديجة»، وهو منقطع. **الدرجة: D.**\n- **النتائج:** طمأنينة بعد الروع، وانتقال من الحيرة إلى سؤال أهل العلم.\n- **القرار المرتبط:** `PD-001`.\n\n---\n\n## E-S02-005 — ورقة بن نوفل\n\n- **الأشخاص:** ورقة بن نوفل بن أسد بن عبد العزى، ابن عم خديجة، تنصر في الجاهلية، شيخ كبير قد عمي (البخاري 3).\n- **التفاصيل (B):** سمع الخبر فقال: هذا الناموس الذي نزل على موسى، وتمنى أن يكون شاباً حين يخرجه قومه. فقال ﷺ: «أوَمخرجيّ هم؟». قال: نعم، لم يأت رجل قط بمثل ما جئت به إلا عودي، ووعد بنصره إن أدركه.\n- **رواية ابن إسحاق (D):** خديجة ذهبت إلى ورقة وحدها أولاً فقال: «قدوس قدوس»، ثم لقيه ﷺ وهو يطوف بالكعبة بعد انقضاء جواره، فقبّل يافوخه (ابن هشام ج1 ص222).\n- **مستوى E — ملاحظة:** في رواية البخاري ذهب النبي ﷺ مع خديجة إلى ورقة، وفي رواية ابن إسحاق ذهبت خديجة وحدها ثم لقيه ورقة عند الكعبة. الروايتان مختلفتان في التفاصيل، والمقدم رواية الصحيح.\n\n---\n\n## E-S02-006 — وفاة ورقة وفترة الوحي\n\n- **التفاصيل (B):** «ثم لم ينشب ورقة أن توفي، وفتر الوحي» (البخاري 3).\n- **مدة الفترة:** غير مذكورة في الصحيح. الأقوى عند ابن حجر أنها قصيرة (أيام)، وتحديدها بسنتين ونصف أو ثلاث سنين مبني على مرسل الشعبي الذي قال عنه «لا يثبت» (فتح الباري ج1 ص27، وج12 ص360). **الدرجة في تحديد المدة: D**، والتفاصيل في `SD-010`.\n- **حكمة الفترة عند ابن حجر (E، ج1 ص27):** أن يذهب عنه الروع، ويحصل له التشوف إلى عودة الوحي.\n- **خبر الحزن ومحاولة التردي من الجبال:** بلاغ للزهري ليس موصولاً، بنص ابن حجر. **الدرجة: D**. لا يُبنى عليه وصف نفسي. التفاصيل `SD-003`.\n\n---\n\n## E-S02-007 — رؤية الملك بين السماء والأرض ونزول المدثر\n\n- **التفاصيل (البخاري 4، مسلم 161، B):** بعد الفترة سمع صوتاً من السماء، فرأى الملك الذي جاءه بحراء جالساً على كرسي بين السماء والأرض، فرعب ورجع يقول «زملوني»، فنزلت المدثر 74:1–5، ثم حمي الوحي وتتابع.\n- **النتائج:** بدء مرحلة الإنذار: «قم فأنذر».\n\n---\n\n## E-S07-001 — الكتاب إلى هرقل ومساءلته لأبي سفيان\n\n- **التاريخ:** زمن الهدنة بين النبي ﷺ وقريش بنص الحديث. **قال ابن حجر (فتح الباري ج1 ص34، الدفعة 2):** المدة هي مدة صلح الحديبية، «وكانت في سنة ست، وكانت مدتها عشر سنين كما في السيرة»، وعند أبي نعيم والحاكم أربع سنين، والأول أشهر، ثم نقضت قريش فغزاهم سنة ثمان وفتح مكة. فالحدث بعد صلح الحديبية وقبل الفتح. **الدرجة في التحديد: E** منسوب إلى ابن حجر.\n- **المكان:** إيلياء (بيت المقدس) حيث كان هرقل، والكتاب أُرسل مع دحية إلى عظيم بصرى فدفعه إلى هرقل.\n- **الأشخاص:** هرقل، أبو سفيان بن حرب وركب من قريش تجار بالشام، الترجمان، عظماء الروم.\n- **التفاصيل:** البخاري 7، ومسلم 1773. **الدرجة: B.** التحليل في قسم الأحاديث `H-BKH-0007` وقسم القيادة.\n- **النتائج بنص أبي سفيان:** «فما زلت موقناً أنه سيظهر حتى أدخل الله عليّ الإسلام».\n\n---\n\n## فهرس الأحداث في هذا الملف\n\n| المعرّف | الحدث | الدرجة الغالبة |\n|---|---|---|\n| `E-S01-001` | المدد الكبرى | B |\n| `E-S02-001` | الرؤيا الصادقة | B |\n| `E-S02-002` | التحنث في حراء | B، والتفاصيل الزائدة D |\n| `E-S02-003` | نزول الملك وأول ما نزل | B، والشهر D |\n| `E-S02-004` | الرجوع إلى خديجة | B |\n| `E-S02-005` | ورقة بن نوفل | B |\n| `E-S02-006` | وفاة ورقة وفترة الوحي | B، والمدة D |\n| `E-S02-007` | نزول المدثر | B |\n| `E-S07-001` | الكتاب إلى هرقل | B |\n"}, {"code": "SC-S02-S03", "slug": "sc-s02-s03", "sec": "04", "title": "السيرة — بعد بدء الوحي: الدعوة الأولى في مكة", "short": "الدعوة الأولى في مكة", "md": "# السيرة — بعد بدء الوحي: الدعوة الأولى في مكة\n\n- **القسم:** 04 — التسلسل الزمني للسيرة\n- **الدفعة:** 3، ومُدّ في الدفعة 4 — 15 نوفمبر 2026\n- **المصادر المقروءة فعلاً:** سيرة ابن هشام (الشاملة 7450، ت طه عبد الرءوف سعد) ج1 ص223–238 كاملة؛ صحيح البخاري 4782 (ومسلم 2425)، 4917، 4921، 4950، 4951، 4958، 4971–4973؛ ومواضع في البخاري وُثق نصها المقصود بالبحث النصي: 3820، 3935.\n- **تنبيه على الترتيب:** الترتيب هنا ترتيب ابن إسحاق في السيرة. ولا تحدد نصوص الصحيح زمن أكثر هذه الأحداث بدقة.\n\n---\n\n## E-S02-008 — إيمان خديجة ومؤازرتها\n\n- **رواية ابن إسحاق (ج1 ص224):** آمنت به خديجة وصدقته ووازرته، وكانت أول من آمن. فكان لا يسمع شيئاً يكرهه من رد وتكذيب فيحزنه إلا فرّج الله عنه بها إذا رجع إليها، تثبته وتخفف عنه وتصدقه وتهون عليه أمر الناس. **الدرجة: D** (كلام ابن إسحاق بلا إسناد).\n- **الثابت في الصحيح:** أمره ﷺ أن يبلغها السلام من ربها ويبشرها ببيت في الجنة من قصب لا صخب فيه ولا نصب (البخاري 3820 عن أبي هريرة، وفيه أن جبريل قال ذلك، ومعناه في 1792). **الدرجة: B.**\n- **رواية ابن هشام في السلام (ج1 ص225):** «حدثني من أثق به»، وفيها رد خديجة: «الله السلام، ومنه السلام، وعلى جبريل السلام». **الدرجة: D** (شيخ مبهم).\n- **الربط:** `E-S02-004`، `C01`، `T19`.\n\n---\n\n## E-S02-009 — نزول سورة الضحى\n\n- **رواية الصحيح (البخاري 4950 و4951، B):** اشتكى ﷺ فلم يقم ليلتين أو ثلاثاً، فقالت امرأة شامتة إن «شيطانه» تركه، فنزلت «والضحى... ما ودعك ربك وما قلى».\n- **رواية ابن إسحاق (ج1 ص225، D):** فتر الوحي حتى شق ذلك عليه وأحزنه، فجاءه جبريل بسورة الضحى.\n- **ما أضافه ابن إسحاق في التفسير (ج1 ص226، E منسوب إليه):** «فأما اليتيم فلا تقهر» أي لا تكن جباراً ولا متكبراً ولا فحاشاً فظاً على الضعفاء؛ و«وأما بنعمة ربك فحدث» أي اذكر النبوة وادع إليها، فجعل ﷺ يذكرها **سراً إلى من يطمئن إليه من أهله**.\n- **الخلاف:** `SD-013`.\n\n---\n\n## E-S03-001 — مرحلة الدعوة السرية\n\n- **المصدر:** ابن إسحاق في تفسير «وأما بنعمة ربك فحدث» (ج1 ص226)، وخبر صلاة النبي ﷺ وعلي مستخفيين في شعاب مكة (ج1 ص229، «وذكر بعض أهل العلم»).\n- **الدرجة: D.**\n- **المدة:** ذكر ابن إسحاق لاحقاً أنها ثلاث سنين «فيما بلغني» (`E-S03-012`). `RG-035` جزئية.\n\n---\n\n## E-S03-002 — فرض الصلاة أول الأمر\n\n- **الثابت في الصحيح (البخاري 3935 عن عائشة، B):** «فرضت الصلاة ركعتين، ثم هاجر النبي ﷺ ففرضت أربعاً، وتُركت صلاة السفر على الأولى».\n- **رواية ابن إسحاق عن عائشة (ج1 ص227):** بالمعنى نفسه دون ذكر الهجرة: أتمها الله في الحضر أربعاً، وأقرها في السفر ركعتين.\n- **تعليم جبريل الوضوء والصلاة ثم تعليمه ﷺ خديجة (ج1 ص227):** «حدثني بعض أهل العلم». **الدرجة: D.**\n- **إمامة جبريل في المواقيت (ج1 ص228):** رواه ابن إسحاق عن عتبة بن مسلم عن نافع بن جبير عن ابن عباس. لم يُحكم عليه بعد. **الدرجة: D؟** حتى يُوثق الحكم.\n- **ملاحظة:** فرض الصلوات الخمس مرتبط عند العلماء بليلة الإسراء، كما نقل ابن حجر عن النووي (`SD-012`). الجمع بين ذلك وبين ما هنا يُبحث `RG-038`.\n\n---\n\n## E-S03-003 — علي بن أبي طالب في كفالة النبي ﷺ، وأول من أسلم من الذكور\n\n- **رواية ابن إسحاق (ج1 ص228):** أول ذكر آمن وصلى معه علي بن أبي طالب، وهو ابن عشر سنين.\n- **سبب نشأته في بيت النبي ﷺ (ج1 ص228–229):** من رواية ابن أبي نجيح عن مجاهد: أصابت قريشاً أزمة شديدة، وكان أبو طالب كثير العيال، فاقترح ﷺ على عمه العباس، وكان من أيسر بني هاشم، أن يخففا عن أبي طالب، فأخذ النبي ﷺ علياً وأخذ العباس جعفراً. **الدرجة: D** (مرسل مجاهد).\n- **القرار المرتبط:** `PD-007`.\n- **ملاحظة:** في أول من أسلم أقوال أخرى مشهورة لم تُجمع بعد `RG-039`.\n\n---\n\n## E-S03-004 — أبو طالب يكتشف صلاتهما\n\n- **رواية ابن إسحاق (ج1 ص229، «وذكر بعض أهل العلم»، D):** عثر أبو طالب على النبي ﷺ وعلي يصليان في الشعب، فسأله عن الدين، فدعاه النبي ﷺ وقال إنه أحق من بذل له النصيحة ودعاه إلى الهدى. فقال أبو طالب إنه لا يستطيع فراق دين آبائه، ولكنه لن يُخلَص إليه بشيء يكرهه ما بقي.\n- **الأهمية (E):** علاقة النبي ﷺ بعمّ لم يؤمن لكنه يحميه، وهي مادة لموضوع `C02` و`C10` و`T17`. الرواية غير مسندة فتُذكر للسياق فقط.\n\n---\n\n## E-S03-005 — الجهر على الصفا وموقف أبي لهب\n\n- **الثابت (البخاري 4971–4973، B):** لما نزلت «وأنذر عشيرتك الأقربين» صعد الصفا ونادى، فلما اجتمعوا قال: أرأيتم لو أخبرتكم أن خيلاً تخرج من سفح هذا الجبل أكنتم مصدقيّ؟ قالوا: «ما جربنا عليك كذباً». قال: «فإني نذير لكم بين يدي عذاب شديد». فقال أبو لهب: «تباً لك، ألهذا جمعتنا؟»، فنزلت سورة المسد.\n- **الأهمية:** بداية الجهر بالدعوة لقريش عامة، وأول عداوة علنية من أقرب الأقارب.\n- **الآيات:** 26:214؛ سورة المسد.\n\n---\n\n## E-S03-006 — استماع الجن بنخلة\n\n- **الثابت (البخاري 4921، B):** في طريقه ﷺ مع طائفة من أصحابه إلى سوق عكاظ، صلى بهم الفجر بنخلة، فاستمع نفر من الجن، ونزلت سورة الجن. ولم يرهم ﷺ في هذه الواقعة بقول ابن عباس.\n- **الزمن:** غير محدد في النص `RG-040`.\n\n---\n\n## E-S03-007 — توعد أبي جهل له عند الكعبة\n\n- **الثابت (البخاري 4958، B):** قال أبو جهل: لئن رأيت محمداً يصلي عند الكعبة لأطأن على عنقه. فبلغه ﷺ فقال: «لو فعله لأخذته الملائكة».\n- **الآيات:** أورده البخاري في تفسير العلق 15–16.\n- **الموضوعات:** `T13` الإساءة، `T03` الثبات (مواصلة الصلاة عند الكعبة)، `C10`.\n\n---\n\n## E-S03-008 — أبو طالب يسأل علياً عن دينه\n\n- **رواية ابن إسحاق (ج1 ص230):** «وذكروا»: سأل أبو طالب ابنه علياً عن دينه، فقال: آمنت بالله ورسوله وصدقته وصليت معه. «فزعموا» أنه قال: أما إنه لم يدعك إلا إلى خير فالزمه.\n- **الدرجة: D.** بلا إسناد، وبصيغة «ذكروا» و«زعموا».\n\n---\n\n## E-S03-009 — زيد بن حارثة: الإعتاق والتبني، ثم الإسلام\n\n- **الثابت في الصحيح (B):** قال ابن عمر: «ما كنا ندعو زيد بن حارثة إلا زيد بن محمد، حتى نزل القرآن: ادعوهم لآبائهم» (البخاري 4782، مسلم 2425).\n- **رواية ابن إسحاق (ج1 ص230):** ثم أسلم زيد بن حارثة، «وكان أول ذكر أسلم، وصلى بعد علي».\n- **زيادة ابن هشام بلا إسناد (ج1 ص230):** اشترت خديجة زيداً من رقيق قدم به حكيم بن حزام من الشام، فاستوهبه النبي ﷺ منها فأعتقه وتبناه «قبل أن يوحى إليه». وجاء أبوه حارثة يطلبه بعد أن قال فيه شعراً في الحزن عليه، **فخيّره النبي ﷺ: «إن شئت فأقم عندي، وإن شئت فانطلق مع أبيك»، فاختار البقاء**.\n- **الدرجة:** B لأصل التبني، و**D** لقصة التخيير وما قبلها.\n- **الموضوعات:** `C06` `T24`. قصة التخيير مشهورة جداً، لكنها في هذا المصدر بلا إسناد، فلا يُبنى عليها مبدأ حتى توجد مسندة `RG-049`.\n\n---\n\n## E-S03-010 — إسلام أبي بكر ودعوته\n\n- **رواية ابن إسحاق (ج1 ص230–231):** أظهر أبو بكر إسلامه ودعا إليه. ووصفه: «رجلاً مألفاً لقومه، محبباً سهلاً، وكان أنسب قريش لقريش... وكان رجلاً تاجراً ذا خلق ومعروف». ودعا من يثق به ممن يجلس إليه، فأسلم بدعائه «فيما بلغني» عثمان والزبير وعبد الرحمن بن عوف وسعد بن أبي وقاص وطلحة.\n- **قول منسوب إلى النبي ﷺ (ج1 ص231):** «ما دعوت أحداً إلى الإسلام إلا كانت فيه عنده كبوة ونظر وتردد، إلا ما كان من أبي بكر...». قال ابن إسحاق فيه: «فيما بلغني». **الدرجة: D**، بلاغ بلا إسناد، فلا يُنسب إلى النبي ﷺ قولاً ثابتاً حتى يُوجد مسنداً ويُحكم عليه `RG-050`.\n- **قيمته (E):** أول وصف في القاعدة لطريقة الدعوة الشخصية: داعية محبوب صاحب تجارة ومجلس يدعو من يثق به.\n\n---\n\n## E-S03-011 — السابقون إلى الإسلام\n\n- **رواية ابن إسحاق (ج1 ص232–236):** قال: «فكان هؤلاء النفر الثمانية الذين سبقوا الناس بالإسلام»، ثم سرد أسماء من أسلم بعدهم: أبو عبيدة، وأبو سلمة، والأرقم، وعثمان بن مظعون وأخواه، وعبيدة بن الحارث، وسعيد بن زيد وامرأته فاطمة بنت الخطاب، وأسماء وعائشة ابنتا أبي بكر «وهي يومئذ صغيرة»، وخباب بن الأرت، وعبد الله بن مسعود، وجعفر بن أبي طالب وامرأته أسماء بنت عميس، وعامر بن فهيرة، وعمار بن ياسر، وصهيب، وغيرهم.\n- **ملاحظة (E):** في القائمة موالٍ وحلفاء ومستضعفون (خباب، وعامر بن فهيرة، وعمار، وصهيب) إلى جانب أشراف من قريش، ونساء مع أزواجهن.\n- **«صهيب سابق الروم»:** ذكره ابن هشام بقوله: «وجاء في الحديث»، بلا إسناد. لم يُحكم عليه بعد `RG-051`. **D؟**\n\n---\n\n## E-S03-012 — الأمر بالصدع بعد ثلاث سنين\n\n- **رواية ابن إسحاق (ج1 ص236):** دخل الناس في الإسلام أرسالاً حتى فشا ذكره بمكة، ثم أُمر بالصدع. **«وكان بين ما أخفى رسول الله ﷺ أمره واستتر به إلى أن أمره الله تعالى بإظهار دينه ثلاث سنين، فيما بلغني»**. واستشهد بـ15:94 و26:214–216.\n- **الدرجة: D** للمدة (بلاغ). وهي أول تحديد لمدة المرحلة السرية في القاعدة، فتقدّم الفجوة `RG-035` ولا تغلقها.\n- **صلته:** حديث الصفا (`E-S03-005`، البخاري 4971) مرتبط بنزول 26:214.\n\n---\n\n## E-S03-013 — الصلاة في الشعاب، وأول دم في الإسلام\n\n- **رواية ابن إسحاق (ج1 ص237):** كان الصحابة إذا صلوا ذهبوا في الشعاب مستخفين، فظهر عليهم نفر من المشركين فعابوهم حتى قاتلوهم، فضرب سعد بن أبي وقاص رجلاً منهم بلحي بعير فشجه، «فكان أول دم هريق في الإسلام».\n- **الدرجة: D.** بلا إسناد.\n\n---\n\n## E-S03-014 — بدء العداوة عند عيب الآلهة، وحماية أبي طالب\n\n- **رواية ابن إسحاق (ج1 ص237):** لما صدع بالدعوة لم يبتعد عنه قومه ولم يردوا عليه، «فيما بلغني»، حتى ذكر آلهتهم وعابها، فأجمعوا خلافه وعداوته. وحدب عليه أبو طالب ومنعه، «ومضى رسول الله ﷺ على أمر الله، مظهراً لأمره، لا يرده عنه شيء». ثم مشى أشراف قريش إلى أبي طالب (يتبع في ص238 وما بعدها).\n- **الدرجة: D.**\n- **صلته بالقرآن (E):** قال السعدي في تفسير 68:8–9 إن سياق «ودوا لو تدهن فيدهنون» أن المشركين طلبوا منه أن يسكت عن عيب آلهتهم ويسكتوا عنه. وهذا يتسق مع رواية ابن إسحاق في أن العداوة اشتدت عند عيب الآلهة.\n- **الموضوعات:** `T03` الثبات، `C10`، `PD-007` (علاقته بأبي طالب).\n\n---\n\n## فهرس الأحداث\n\n| المعرّف | الحدث | الدرجة الغالبة |\n|---|---|---|\n| `E-S02-008` | إيمان خديجة ومؤازرتها | B للبشارة، D للتفاصيل |\n| `E-S02-009` | نزول الضحى | B، مع رواية مخالفة D |\n| `E-S03-001` | الد
