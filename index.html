ب قال: قيل لجابر بن سمرة: أكان في رأس رسول الله صلى الله عليه وسلم شيب؟ قال: «لم يكن في رأس رسول الله صلى الله عليه وسلم شيب إلا شعرات في مفرق رأسه، إذا ادهن واراهن الدهن»\n\n- **الدرجة:** B — صححه الألباني (المختصر 32).\n\n\n## الباب 6: خضابه\n\n### H-SHM-0045 — ابنك هذا؟ فقلت: نعم أشهد به، قال: لا يجني عليك، ولا تجني ع…\nحدثنا أحمد بن منيع قال: حدثنا هشيم قال: حدثنا عبد الملك بن عمير، عن إياد بن لقيط قال: أخبرني أبو رمثة قال: أتيت رسول الله صلى الله عليه وسلم مع ابن لي، فقال: «ابنك هذا؟» فقلت: نعم أشهد به، قال: «لا يجني عليك، ولا تجني عليه» قال: ورأيت الشيب أحمر قال أبو عيسى: \" هذا أحسن شيء روي في هذا الباب، وأفسر؛ لأن الروايات الصحيحة أن النبي صلى الله عليه وسلم لم يبلغ الشيب. وأبو رمثة اسمه: رفاعة بن يثربي التيمي \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 37).\n\n### H-SHM-0046 — نعم قال أبو عيسى:  وروى أبو عوانة هذا الحديث عن عثمان بن ع…\nحدثنا سفيان بن وكيع قال: حدثنا أبي، عن شريك، عن عثمان بن موهب قال: سئل أبو هريرة: هل خضب رسول الله صلى الله عليه وسلم؟ قال: «نعم» قال أبو عيسى: \" وروى أبو عوانة هذا الحديث عن عثمان بن عبد الله بن موهب، فقال: عن أم سلمة \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 38).\n\n### H-SHM-0047 — أنا رأيت رسول الله صلى الله عليه وسلم يخرج من بيته ينفض رأ…\nحدثنا إبراهيم بن هارون قال: أنبأنا النضر بن زرارة، عن أبي جناب، عن إياد بن لقيط، عن الجهدمة، امرأة بشر ابن الخصاصية، قالت: «أنا رأيت رسول الله صلى الله عليه وسلم يخرج من بيته ينفض رأسه وقد اغتسل، وبرأسه ردع من حناء» أو قال: «ردغ» شك في هذا الشيخ\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 39).\n\n### H-SHM-0048 — رأيت شعر رسول الله صلى الله عليه وسلم مخضوبا\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عمرو بن عاصم قال: حدثنا حماد بن سلمة قال: حدثنا حميد، عن أنس قال: «رأيت شعر رسول الله صلى الله عليه وسلم مخضوبا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 40).\n\n### H-SHM-0049 — رأيت شعر رسول الله صلى الله عليه وسلم عند أنس بن مالك مخضو…\nقال حماد: وأخبرنا عبد الله بن محمد بن عقيل قال: «رأيت شعر رسول الله صلى الله عليه وسلم عند أنس بن مالك مخضوبا»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 41).\n\n\n## الباب 7: كحله\n\n### H-SHM-0050 — اكتحلوا بالإثمد فإنه يجلو البصر، وينبت الشعر وزعم أن النبي…\nحدثنا محمد بن حميد الرازي قال: حدثنا أبو داود الطيالسي، عن عباد بن منصور، عن عكرمة، عن ابن عباس، أن النبي صلى الله عليه وسلم قال: «اكتحلوا بالإثمد فإنه يجلو البصر، وينبت الشعر» وزعم «أن النبي صلى الله عليه وسلم كانت له مكحلة يكتحل منها كل ليلة ثلاثة في هذه، وثلاثة في هذه»\n\n- **الدرجة:** B/X — القول «اكتحلوا بالإثمد...» صحيح، وزيادة المكحلة كل ليلة ضعيفة جداً (المختصر 42).\n\n### H-SHM-0051 — كان رسول الله صلى الله عليه وسلم يكتحل قبل أن ينام بالإثمد…\nحدثنا عبد الله بن الصباح الهاشمي البصري قال: حدثنا عبيد الله بن موسى قال: حدثنا إسرائيل، عن عباد بن منصور، (ح) وحدثنا علي بن حجر قال: حدثنا يزيد بن هارون قال: حدثنا عباد بن منصور، عن عكرمة، عن ابن عباس قال: «كان رسول الله صلى الله عليه وسلم يكتحل قبل أن ينام بالإثمد ثلاثا في كل عين» وقال يزيد بن هارون، في حديثه: «إن النبي صلى الله عليه وسلم كانت له مكحلة يكتحل منها عند النوم ثلاثا في كل عين»\n\n- **الدرجة:** B/X — كسابقه (المختصر 42).\n\n### H-SHM-0052 — عليكم بالإثمد عند النوم، فإنه يجلو البصر، وينبت الشعر\nحدثنا أحمد بن منيع قال: حدثنا محمد بن يزيد، عن محمد بن إسحاق، عن محمد بن المنكدر، عن جابر هو ابن عبد الله، قال: قال رسول الله صلى الله عليه وسلم: «عليكم بالإثمد عند النوم، فإنه يجلو البصر، وينبت الشعر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 43).\n\n### H-SHM-0053 — إن خير أكحالكم الإثمد، يجلو البصر، وينبت الشعر\nحدثنا قتيبة بن سعيد قال: حدثنا بشر بن المفضل، عن عبد الله بن عثمان بن خثيم، عن سعيد بن جبير، عن ابن عباس قال: قال رسول الله صلى الله عليه وسلم: «إن خير أكحالكم الإثمد، يجلو البصر، وينبت الشعر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 44).\n\n### H-SHM-0054 — عليكم بالإثمد، فإنه يجلو البصر، وينبت الشعر\nحدثنا إبراهيم بن المستمر البصري قال: حدثنا أبو عاصم، عن عثمان بن عبد الملك، عن سالم، عن ابن عمر قال: قال رسول الله صلى الله عليه وسلم: «عليكم بالإثمد، فإنه يجلو البصر، وينبت الشعر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 43).\n\n\n## الباب 8: لباسه\n\n**خلاصة الباب (E):** يُفرَّق هنا بين عادته في اللباس (القميص، الحبرة، الحلة الحمراء، البردان الأخضران) وبين أمره العام للأمة: «البسوا البياض» (68–69). العادة لا تصير حكماً بمجردها.\n\n### H-SHM-0055 — كان أحب الثياب إلى رسول الله صلى الله عليه وسلم القميص\nحدثنا محمد بن حميد الرازي قال: حدثنا الفضل بن موسى، وأبو تميلة، وزيد بن حباب، عن عبد المؤمن بن خالد، عن عبد الله بن بريدة، عن أم سلمة، قالت: «كان أحب الثياب إلى رسول الله صلى الله عليه وسلم القميص»\n\n- **الدرجة:** B — صححه الألباني (المختصر 46).\n\n### H-SHM-0056 — كان أحب الثياب إلى رسول الله صلى الله عليه وسلم القميص\nحدثنا علي بن حجر، قال: حدثنا الفضل بن موسى، عن عبد المؤمن بن خالد، عن عبد الله بن بريدة، عن أم سلمة، قالت: «كان أحب الثياب إلى رسول الله صلى الله عليه وسلم القميص»\n\n- **الدرجة:** B — صححه الألباني (المختصر 46).\n\n### H-SHM-0057 — كان أحب الثياب إلى رسول الله صلى الله عليه وسلم يلبسه القم…\nحدثنا زياد بن أيوب البغدادي، قال: حدثنا أبو تميلة، عن عبد المؤمن بن خالد، عن عبد الله بن بريدة، عن أمه، عن أم سلمة، قالت: «كان أحب الثياب إلى رسول الله صلى الله عليه وسلم يلبسه القميص» قال: \" هكذا قال زياد بن أيوب، في حديثه: عن عبد الله بن بريدة، عن أمه، عن أم سلمة، وهكذا روى غير واحد، عن أبي تميلة مثل رواية زياد بن أيوب، وأبو تميلة يزيد في هذا الحديث عن أمه وهو أصح \"\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n### H-SHM-0058 — كان كم قميص رسول الله صلى الله عليه وسلم إلى الرسغ\nحدثنا عبد الله بن محمد بن الحجاج قال: حدثنا معاذ بن هشام قال: حدثني أبي، عن بديل يعني ابن ميسرة العقيلي، عن شهر بن حوشب، عن أسماء بنت يزيد قالت : «كان كم قميص رسول الله صلى الله عليه وسلم إلى الرسغ»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 47).\n\n### H-SHM-0059 — قال: حدثنا أبو نعيم قال: حدثنا زهير، عن عروة بن عبد الله ب…\nحدثنا أبو عمار الحسين بن حريث قال: حدثنا أبو نعيم قال: حدثنا زهير، عن عروة بن عبد الله بن قشير، عن معاوية بن قرة، عن أبيه قال: أتيت رسول الله صلى الله عليه وسلم في رهط من مزينة لنبايعه، وإن قميصه لمطلق، أو قال: زر قميصه مطلق، قال: فأدخلت يدي في جيب قميصه فمسست الخاتم\n\n- **الدرجة:** B — صححه الألباني (المختصر 48) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0060 — فأمليته عليه، ثم أخرجت كتابي فقرأت عليه\nحدثنا عبد بن حميد قال: حدثنا محمد بن الفضل قال: حدثنا حماد بن سلمة، عن حبيب بن الشهيد، عن الحسن، عن أنس بن مالك ، أن النبي صلى الله عليه وسلم خرج وهو يتكئ على أسامة بن زيد عليه ثوب قطري قد توشح به، فصلى بهم. وقال عبد بن حميد: قال محمد بن الفضل: سألني يحيى بن معين عن هذا الحديث أول ما جلس إلي، فقلت: حدثنا حماد بن سلمة، فقال: لو كان من كتابك، فقمت لأخرج كتابي فقبض على ثوبي ثم قال: أمله علي؛ فإني أخاف أن لا ألقاك، قال: «فأمليته عليه، ثم أخرجت كتابي فقرأت عليه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 49) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0061 — اللهم لك الحمد كما كسوتنيه، أسألك خيره وخير ما صنع له، وأع…\nحدثنا سويد بن نصر قال: حدثنا عبد الله بن المبارك، عن سعيد بن إياس الجريري، عن أبي نضرة، عن أبي سعيد الخدري قال : كان رسول الله صلى الله عليه وسلم إذا استجد ثوبا سماه باسمه عمامة أو قميصا أو رداء، ثم يقول: «اللهم لك الحمد كما كسوتنيه، أسألك خيره وخير ما صنع له، وأعوذ بك من شره وشر ما صنع له» .\n\n- **الدرجة:** B — صححه الألباني (المختصر 50).\n\n### H-SHM-0062 — قال: حدثنا القاسم بن مالك المزني، عن الجريري، عن أبي نضرة،…\nحدثنا هشام بن يونس الكوفي قال: حدثنا القاسم بن مالك المزني، عن الجريري، عن أبي نضرة، عن أبي سعيد الخدري، عن النبي صلى الله عليه وسلم نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 50) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0063 — كان أحب الثياب إلى رسول الله صلى الله عليه وسلم يلبسه الحب…\nحدثنا محمد بن بشار قال: حدثنا معاذ بن هشام قال: حدثني أبي، عن قتادة، عن أنس بن مالك قال: «كان أحب الثياب إلى رسول الله صلى الله عليه وسلم يلبسه الحبرة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 51).\n\n### H-SHM-0064 — رأيت النبي صلى الله عليه وسلم وعليه حلة حمراء كأني أنظر إل…\nحدثنا محمود بن غيلان قال: حدثنا عبد الرزاق قال: حدثنا سفيان، عن عون بن أبي جحيفة، عن أبيه قال: «رأيت النبي صلى الله عليه وسلم وعليه حلة حمراء كأني أنظر إلى بريق ساقيه» قال سفيان: أراها حبرة\n\n- **الدرجة:** B — صححه الألباني (المختصر 52).\n\n### H-SHM-0065 — ما رأيت أحدا من الناس أحسن في حلة حمراء من رسول الله صلى ا…\nحدثنا علي بن خشرم قال: حدثنا عيسى بن يونس، عن إسرائيل، عن أبي إسحاق، عن البراء بن عازب قال: «ما رأيت أحدا من الناس أحسن في حلة حمراء من رسول الله صلى الله عليه وسلم، إن كانت جمته لتضرب قريبا من منكبيه»\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n### H-SHM-0066 — رأيت النبي صلى الله عليه وسلم وعليه بردان أخضران\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا عبيد الله بن إياد، عن أبيه، عن أبي رمثة قال: «رأيت النبي صلى الله عليه وسلم وعليه بردان أخضران»\n\n- **الدرجة:** B — صححه الألباني (المختصر 36).\n\n### H-SHM-0067 — رأيت النبي صلى الله عليه وسلم وعليه أسمال مليتين كانتا بزع…\nحدثنا عبد بن حميد قال: حدثنا عفان بن مسلم قال: حدثنا عبد الله بن حسان العنبري، عن جدتيه، دحيبة وعليبة، عن قيلة بنت مخرمة قالت: «رأيت النبي صلى الله عليه وسلم وعليه أسمال مليتين كانتا بزعفران وقد نفضته» . وفي الحديث قصة طويلة\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 53).\n\n### H-SHM-0068 — عليكم بالبياض من الثياب ليلبسها أحياؤكم، وكفنوا فيها موتاك…\nحدثنا قتيبة بن سعيد قال: حدثنا بشر بن المفضل، عن عبد الله بن عثمان بن خثيم، عن سعيد بن جبير، عن ابن عباس قال: قال رسول الله صلى الله عليه وسلم: «عليكم بالبياض من الثياب ليلبسها أحياؤكم، وكفنوا فيها موتاكم، فإنها من خير ثيابكم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 54).\n\n### H-SHM-0069 — البسوا البياض؛ فإنها أطهر وأطيب، وكفنوا فيها موتاكم\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن حبيب بن أبي ثابت، عن ميمون بن أبي شبيب، عن سمرة بن جندب قال: قال رسول الله صلى الله عليه وسلم: «البسوا البياض؛ فإنها أطهر وأطيب، وكفنوا فيها موتاكم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 55).\n\n### H-SHM-0070 — خرج رسول الله صلى الله عليه وسلم ذات غداة وعليه مرط من شعر…\nحدثنا أحمد بن منيع، قال حدثنا يحيى بن زكريا بن أبي زائدة قال: حدثنا أبي، عن مصعب بن شيبة، عن صفية بنت شيبة، عن عائشة قالت: «خرج رسول الله صلى الله عليه وسلم ذات غداة وعليه مرط من شعر أسود»\n\n- **الدرجة:** B — صححه الألباني (المختصر 56).\n\n### H-SHM-0071 — قال: حدثنا وكيع قال: حدثنا يونس بن أبي إسحاق، عن أبيه، عن …\nحدثنا يوسف بن عيسى قال: حدثنا وكيع قال: حدثنا يونس بن أبي إسحاق، عن أبيه، عن الشعبي، عن عروة بن المغيرة بن شعبة، عن أبيه ، أن النبي صلى الله عليه وسلم لبس جبة رومية ضيقة الكمين \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 57) (مطابقة آلية ضعيفة، تُراجع).\n\n\n## الباب 9: عيشه\n\n**خلاصة الباب (E):** شاهدان على شدة العيش: إغماء أبي هريرة من الجوع بين المنبر والحجرة (72)، و«ما شبع من خبز قط ولا لحم إلا على ضفف» (73). `T14`\n\n### H-SHM-0072 — بخ بخ يتمخط أبو هريرة في الكتان، لقد رأيتني وإني لأخر فيما…\nحدثنا قتيبة بن سعيد قال: حدثنا حماد بن زيد، عن أيوب، عن محمد بن سيرين قال: كنا عند أبي هريرة، وعليه ثوبان ممشقان من كتان فتمخط في أحدهما، فقال: «بخ بخ يتمخط أبو هريرة في الكتان، لقد رأيتني وإني لأخر فيما بين منبر رسول الله صلى الله عليه وسلم وحجرة عائشة مغشيا علي فيجيء الجائي فيضع رجله على عنقي يرى أن بي جنونا، وما بي جنون، وما هو إلا الجوع»\n\n- **الدرجة:** B — صححه الألباني (المختصر 108).\n\n### H-SHM-0073 — ما شبع رسول الله صلى الله عليه وسلم من خبز قط ولا لحم، إلا…\nحدثنا قتيبة قال: حدثنا جعفر بن سليمان الضبعي، عن مالك بن دينار قال: «ما شبع رسول الله صلى الله عليه وسلم من خبز قط ولا لحم، إلا على ضفف» . قال مالك: سألت رجلا من أهل البادية: ما الضفف؟ قال: «أن يتناول مع الناس»\n\n- **الدرجة:** B — صححه الألباني (المختصر 109).\n\n\n## الباب 10: خفه\n\n### H-SHM-0074 — قال: حدثنا وكيع، عن دلهم بن صالح، عن حجير بن عبد الله، عن …\nحدثنا هناد بن السري قال: حدثنا وكيع، عن دلهم بن صالح، عن حجير بن عبد الله، عن ابن بريدة، عن أبيه، أن النجاشي أهدى للنبي صلى الله عليه وسلم خفين أسودين ساذجين، فلبسهما ثم توضأ ومسح عليهما \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 58) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0075 — أهدى دحية للنبي صلى الله عليه وسلم خفين، فلبسهما . وقال إس…\nحدثنا قتيبة بن سعيد، قال: حدثنا يحيى بن زكريا بن أبي زائدة، عن الحسن بن عياش، عن أبي إسحاق، عن الشعبي قال: قال المغيرة بن شعبة: «أهدى دحية للنبي صلى الله عليه وسلم خفين، فلبسهما» . وقال إسرائيل: عن جابر، عن عامر «وجبة فلبسهما حتى تخرقا» لا يدري النبي صلى الله عليه وسلم أذكى هما أم لا. قال أبو عيسى: \" وأبو إسحاق هذا هو أبو إسحاق الشيباني، واسمه سليمان\n\n- **الدرجة:** B/X — إهداء الخفين صحيح، وزيادة «وجبة فلبسهما حتى تخرقا» ضعيفة (المختصر 59).\n\n\n## الباب 11: نعله\n\n### H-SHM-0076 — لهما قبالان\nحدثنا محمد بن بشار قال: حدثنا أبو داود الطيالسي قال: حدثنا همام، عن قتادة قال: قلت لأنس بن مالك: كيف كان نعل رسول الله صلى الله عليه وسلم؟ قال: «لهما قبالان»\n\n- **الدرجة:** B — صححه الألباني (المختصر 60).\n\n### H-SHM-0077 — كان لنعل رسول الله صلى الله عليه وسلم قبالان مثني شراكهما\nحدثنا أبو كريب محمد بن العلاء قال: حدثنا وكيع، عن سفيان، عن خالد الحذاء، عن عبد الله بن الحارث، عن ابن عباس قال: «كان لنعل رسول الله صلى الله عليه وسلم قبالان مثني شراكهما»\n\n- **الدرجة:** B — صححه الألباني (المختصر 61).\n\n### H-SHM-0078 — أخرج إلينا أنس بن مالك نعلين جرداوين لهما قبالان. قال: فحد…\nحدثنا أحمد بن منيع قال: حدثنا أبو أحمد الزبيري قال: حدثنا عيسى بن طهمان قال: «أخرج إلينا أنس بن مالك نعلين جرداوين لهما قبالان.» قال: فحدثني ثابت بعد عن أنس أنهما كانتا نعلي النبي صلى الله عليه وسلم\n\n- **الدرجة:** B — صححه الألباني (المختصر 62).\n\n### H-SHM-0079 — إني رأيت رسول الله صلى الله عليه وسلم يلبس النعال التي ليس…\nحدثنا إسحاق بن موسى الأنصاري قال: حدثنا معن قال: حدثنا مالك قال: حدثنا سعيد بن أبي سعيد المقبري، عن عبيد بن جريج، أنه قال لابن عمر: رأيتك تلبس النعال السبتية، قال : «إني رأيت رسول الله صلى الله عليه وسلم يلبس النعال التي ليس فيها شعر، ويتوضأ فيها، فأنا أحب أن ألبسها»\n\n- **الدرجة:** B — صححه الألباني (المختصر 63)، وله مطابقة لفظية في البخاري 5851، مسلم 1187.\n\n### H-SHM-0080 — كان لنعل رسول الله صلى الله عليه وسلم قبالان\nحدثنا إسحاق بن منصور قال: حدثنا عبد الرزاق، عن معمر، عن ابن أبي ذئب، عن صالح مولى التوأمة، عن أبي هريرة قال: «كان لنعل رسول الله صلى الله عليه وسلم قبالان»\n\n- **الدرجة:** B — صححه الألباني (المختصر 61).\n\n### H-SHM-0081 — رأيت رسول الله صلى الله عليه وسلم يصلي في نعلين مخصوفتين\nحدثنا أحمد بن منيع قال: حدثنا أبو أحمد قال: حدثنا سفيان، عن السدي قال: حدثني من سمع عمرو بن حريث يقول: «رأيت رسول الله صلى الله عليه وسلم يصلي في نعلين مخصوفتين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 65).\n\n### H-SHM-0082 — لا يمشين أحدكم في نعل واحدة، لينعلهما جميعا أو ليحفهما جمي…\nحدثنا إسحاق بن موسى الأنصاري قال: حدثنا معن قال: حدثنا مالك، عن أبي الزناد، عن الأعرج، عن أبي هريرة، أن رسول الله صلى الله عليه وسلم قال: «لا يمشين أحدكم في نعل واحدة، لينعلهما جميعا أو ليحفهما جميعا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 66).\n\n### H-SHM-0083 — حدثنا قتيبة، عن مالك بن أنس، عن أبي الزناد نحوه\nحدثنا قتيبة، عن مالك بن أنس، عن أبي الزناد نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 66) (إسناد آخر للحديث السابق).\n\n### H-SHM-0084 — قال: حدثنا معن قال: حدثنا مالك، عن أبي الزبير، عن جابر، أن…\nحدثنا إسحاق بن موسى قال: حدثنا معن قال: حدثنا مالك، عن أبي الزبير، عن جابر، أن النبي صلى الله عليه وسلم نهى أن يأكل، يعني الرجل، بشماله، أو يمشي في نعل واحدة \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 67) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0085 — إذا انتعل أحدكم فليبدأ باليمين، وإذا نزع فليبدأ بالشمال، ف…\nحدثنا قتيبة، عن مالك، ح وحدثنا إسحاق بن موسى قال: حدثنا معن قال: حدثنا مالك، عن أبي الزناد، عن الأعرج، عن أبي هريرة، أن النبي صلى الله عليه وسلم قال: «إذا انتعل أحدكم فليبدأ باليمين، وإذا نزع فليبدأ بالشمال، فلتكن اليمين أولهما تنعل وآخرهما تنزع»\n\n- **الدرجة:** B — صححه الألباني (المختصر 68).\n\n### H-SHM-0086 — كان رسول الله صلى الله عليه وسلم يحب التيمن ما استطاع في ت…\nحدثنا أبو موسى محمد بن المثنى قال: حدثنا محمد بن جعفر قال: حدثنا شعبة قال: حدثنا أشعث هو ابن أبي الشعثاء، عن أبيه، عن مسروق، عن عائشة قالت : «كان رسول الله صلى الله عليه وسلم يحب التيمن ما استطاع في ترجله وتنعله وطهوره»\n\n- **الدرجة:** B — صححه الألباني (المختصر 69).\n\n### H-SHM-0087 — كان لنعل رسول الله صلى الله عليه وسلم قبالان وأبي بكر وعمر…\nحدثنا محمد بن مرزوق أبو عبد الله قال: حدثنا عبد الرحمن بن قيس أبو معاوية قال: حدثنا هشام، عن محمد، عن أبي هريرة قال: «كان لنعل رسول الله صلى الله عليه وسلم قبالان وأبي بكر وعمر» ، «وأول من عقد عقدا واحدا عثمان»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 70).\n\n\n## الباب 12: خاتمه\n\n**خلاصة الباب (E):** اتخذ الخاتم حين أراد أن يكتب إلى الملوك، لأنهم لا يقبلون كتاباً إلا مختوماً (91–93): اتخاذ الوسيلة التي يقتضيها التعامل مع الدول. `T18` `T23`\n\n### H-SHM-0088 — كان خاتم النبي صلى الله عليه وسلم من ورق، وكان فصه حبشيا\nحدثنا قتيبة بن سعيد، وغير واحد، عن عبد الله بن وهب، عن يونس، عن ابن شهاب، عن أنس بن مالك قال: «كان خاتم النبي صلى الله عليه وسلم من ورق، وكان فصه حبشيا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 71).\n\n### H-SHM-0089 — أبو بشر اسمه جعفر بن أبي وحشية\nحدثنا قتيبة قال: حدثنا أبو عوانة، عن أبي بشر، عن نافع، عن ابن عمر، أن النبي صلى الله عليه وسلم اتخذ خاتما من فضة، فكان يختم به ولا يلبسه. قال أبو عيسى: \" أبو بشر اسمه جعفر بن أبي وحشية\n\n- **الدرجة:** B — صححه الألباني (المختصر 72) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0090 — كان خاتم رسول الله صلى الله عليه وسلم من فضة فصه منه\nحدثنا محمود بن غيلان قال: حدثنا حفص بن عمر بن عبيد هو الطنافسي قال: حدثنا زهير أبو خيثمة، عن حميد، عن أنس بن مالك قال: «كان خاتم رسول الله صلى الله عليه وسلم من فضة فصه منه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 73).\n\n### H-SHM-0091 — لما أراد رسول الله صلى الله عليه وسلم أن يكتب إلى العجم قي…\nحدثنا إسحاق بن منصور قال: حدثنا معاذ بن هشام قال: حدثني أبي، عن قتادة، عن أنس بن مالك قال: \" لما أراد رسول الله صلى الله عليه وسلم أن يكتب إلى العجم قيل له: إن العجم لا يقبلون إلا كتابا عليه خاتم، فاصطنع خاتما فكأني أنظر إلى بياضه في كفه \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 74) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0092 — كان نقش خاتم رسول الله صلى الله عليه وسلم: محمد سطر، ورسول…\nحدثنا محمد بن يحيى قال: حدثنا محمد بن عبد الله الأنصاري قال: حدثني أبي، عن ثمامة، عن أنس بن مالك قال: \" كان نقش خاتم رسول الله صلى الله عليه وسلم: محمد سطر، ورسول سطر، والله سطر \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 74) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0093 — قال: حدثنا نوح بن قيس، عن خالد بن قيس، عن قتادة، عن أنس بن…\nحدثنا نصر بن علي الجهضمي أبو عمرو قال: حدثنا نوح بن قيس، عن خالد بن قيس، عن قتادة، عن أنس بن مالك، أن النبي صلى الله عليه وسلم كتب إلى كسرى وقيصر والنجاشي، فقيل له: إنهم لا يقبلون كتابا إلا بخاتم فصاغ رسول الله صلى الله عليه وسلم خاتما حلقته فضة، ونقش فيه: محمد رسول الله \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 74).\n\n### H-SHM-0094 — قال: حدثنا سعيد بن عامر، والحجاج بن منهال، عن همام، عن ابن…\nحدثنا إسحاق بن منصور قال: حدثنا سعيد بن عامر، والحجاج بن منهال، عن همام، عن ابن جريج، عن الزهري، عن أنس، أن النبي صلى الله عليه وسلم كان إذا دخل الخلاء نزع خاتمه \"\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 75) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0095 — اتخذ رسول الله صلى الله عليه وسلم خاتما من ورق، فكان في يد…\nحدثنا إسحاق بن منصور قال: حدثنا عبد الله بن نمير قال: حدثنا عبيد الله بن عمر، عن نافع، عن ابن عمر قال: \" اتخذ رسول الله صلى الله عليه وسلم خاتما من ورق، فكان في يده ثم كان في يد أبي بكر، ويد عمر، ثم كان في يد عثمان، حتى وقع في بئر أريس نقشه: محمد رسول الله \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 76) (مطابقة آلية ضعيفة، تُراجع).\n\n\n## الباب 13: تختمه في يمينه\n\n**خلاصة الباب (E):** طرح خاتم الذهب وقال «لا ألبسه أبداً»، فطرح الناس خواتيمهم (105): أثر القدوة المباشر. `T18`\n\n### H-SHM-0096 — قال: حدثنا سليمان بن بلال، عن شريك بن عبد الله بن أبي نمر،…\nحدثنا محمد بن سهل بن عسكر البغدادي، وعبد الله بن عبد الرحمن، قالا: أخبرنا يحيى بن حسان قال: حدثنا سليمان بن بلال، عن شريك بن عبد الله بن أبي نمر، عن إبراهيم بن عبد الله بن حنين، عن أبيه، عن علي بن أبي طالب: أن النبي صلى الله عليه وسلم كان يلبس خاتمه في يمينه \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 77) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0097 — قال: حدثنا أحمد بن صالح قال: حدثنا عبد الله بن وهب، عن سلي…\nحدثنا محمد بن يحيى قال: حدثنا أحمد بن صالح قال: حدثنا عبد الله بن وهب، عن سليمان بن بلال، عن شريك بن عبد الله بن أبي نمر، نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 78) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0098 — كان رسول الله صلى الله عليه وسلم يتختم في يمينه\nحدثنا أحمد بن منيع قال: حدثنا يزيد بن هارون، عن حماد بن سلمة قال: رأيت ابن أبي رافع، يتختم في يمينه فسألته عن ذلك فقال: رأيت عبد الله بن جعفر يتختم في يمينه، وقال عبد الله بن جعفر: «كان رسول الله صلى الله عليه وسلم يتختم في يمينه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 78).\n\n### H-SHM-0099 — أن النبي صلى الله عليه وسلم كان يتختم في يمينه\nحدثنا يحيى بن موسى قال: حدثنا عبد الله بن نمير قال: حدثنا إبراهيم بن الفضل، عن عبد الله بن محمد بن عقيل، عن عبد الله بن جعفر: «أن النبي صلى الله عليه وسلم كان يتختم في يمينه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 76).\n\n### H-SHM-0100 — أن النبي صلى الله عليه وسلم كان يتختم في يمينه\nحدثنا أبو الخطاب زياد بن يحيى قال: حدثنا عبد الله بن ميمون، عن جعفر بن محمد، عن أبيه، عن جابر بن عبد الله : «أن النبي صلى الله عليه وسلم كان يتختم في يمينه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 76).\n\n### H-SHM-0101 — كان رسول الله صلى الله عليه وسلم يتختم في يمينه\nحدثنا محمد بن حميد الرازي قال: حدثنا جرير، عن محمد بن إسحاق، عن الصلت بن عبد الله قال: كان ابن عباس، يتختم في يمينه ولا إخاله إلا قال: «كان رسول الله صلى الله عليه وسلم يتختم في يمينه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 78).\n\n### H-SHM-0102 — أن النبي صلى الله عليه وسلم اتخذ خاتما من فضة، وجعل فصه مم…\nحدثنا محمد بن أبي عمر قال: حدثنا سفيان، عن أيوب بن موسى، عن نافع، عن ابن عمر : «أن النبي صلى الله عليه وسلم اتخذ خاتما من فضة، وجعل فصه مما يلي كفه، ونقش فيه محمد رسول الله، ونهى أن ينقش أحد عليه» وهو الذي سقط من معيقيب في بئر أريس\n\n- **الدرجة:** B — صححه الألباني (المختصر 81).\n\n### H-SHM-0103 — كان الحسن والحسين يتختمان في يسارهما\nحدثنا قتيبة بن سعيد قال: حدثنا حاتم بن إسماعيل، عن جعفر بن محمد، عن أبيه قال: «كان الحسن والحسين يتختمان في يسارهما»\n\n- **الدرجة:** B — صححه الألباني (المختصر 82).\n\n### H-SHM-0104 — أنه صلى الله عليه وسلم كان يتختم في يمينه وقال أبو عيسى: ه…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا محمد بن عيسى وهو ابن الطباع قال: حدثنا عباد بن العوام، عن سعيد بن أبي عروبة، عن قتادة، عن أنس بن مالك: «أنه صلى الله عليه وسلم كان يتختم في يمينه» وقال أبو عيسى: «هذا حديث غريب لا نعرفه من حديث سعيد بن أبي عروبة، عن قتادة، عن أنس، عن النبي صلى الله عليه وسلم نحو هذا إلا من هذا الوجه» وروى بعض أصحاب قتادة، عن قتادة، عن أنس بن مالك، عن النبي صلى الله عليه وسلم «أنه كان يتختم في يساره» وهو حديث لا يصح أيضا \"\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n### H-SHM-0105 — لا ألبسه أبدا فطرح الناس خواتيمهم\nحدثنا محمد بن عبيد الله المحاربي قال: حدثنا عبد العزيز بن أبي حازم، عن موسى بن عقبة، عن نافع، عن ابن عمر قال: اتخذ رسول الله صلى الله عليه وسلم خاتما من ذهب، فكان يلبسه في يمينه، فاتخذ الناس خواتيم من ذهب فطرحه صلى الله عليه وسلم وقال: «لا ألبسه أبدا» فطرح الناس خواتيمهم\n\n- **الدرجة:** B — صححه الألباني (المختصر 84).\n\n\n## الباب 14: سيفه\n\n### H-SHM-0106 — كانت قبيعة سيف رسول الله صلى الله عليه وسلم من فضة\nحدثنا محمد بن بشار قال: حدثنا وهب بن جرير قال: حدثنا أبي، عن قتادة، عن أنس قال: «كانت قبيعة سيف رسول الله صلى الله عليه وسلم من فضة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 85).\n\n### H-SHM-0107 — كانت قبيعة سيف رسول الله صلى الله عليه وسلم من فضة\nحدثنا محمد بن بشار قال: حدثنا معاذ بن هشام قال: حدثني أبي، عن قتادة، عن سعيد بن أبي الحسن قال: «كانت قبيعة سيف رسول الله صلى الله عليه وسلم من فضة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 85).\n\n### H-SHM-0108 — دخل رسول الله صلى الله عليه وسلم مكة يوم الفتح وعلى سيفه ذ…\nحدثنا أبو جعفر محمد بن صدران البصري قال: حدثنا طالب بن حجير، عن هود وهو ابن عبد الله بن سعد، عن جده قال: «دخل رسول الله صلى الله عليه وسلم مكة يوم الفتح وعلى سيفه ذهب وفضة» قال طالب: فسألته عن الفضة فقال: «كانت قبيعة السيف فضة»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 87).\n\n### H-SHM-0109 — صنعت سيفي على سيف سمرة بن جندب، وزعم سمرة أنه صنع سيفه على…\nحدثنا محمد بن شجاع البغدادي قال: حدثنا أبو عبيدة الحداد، عن عثمان بن سعد، عن ابن سيرين قال: «صنعت سيفي على سيف سمرة بن جندب، وزعم سمرة أنه صنع سيفه على سيف رسول الله صلى الله عليه وسلم وكان حنفيا»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 88).\n\n### H-SHM-0110 — قال: حدثنا محمد بن بكر، عن عثمان بن سعد، بهذا الإسناد نحوه\nحدثنا عقبة بن مكرم البصري قال: حدثنا محمد بن بكر، عن عثمان بن سعد، بهذا الإسناد نحوه\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 88) (إسناد آخر للحديث السابق).\n\n\n## الباب 15: درعه\n\n### H-SHM-0111 — أوجب طلحة\nحدثنا أبو سعيد عبد الله بن سعيد الأشج قال: حدثنا يونس بن بكير، عن محمد بن إسحاق، عن يحيى بن عباد بن عبد الله بن الزبير، عن أبيه، عن جده عبد الله بن الزبير، عن الزبير بن العوام قال: كان على النبي صلى الله عليه وسلم يوم أحد درعان، فنهض إلى الصخرة فلم يستطع، فأقعد طلحة تحته، وصعد النبي صلى الله عليه وسلم حتى استوى على الصخرة قال: سمعت النبي صلى الله عليه وسلم يقول: «أوجب طلحة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 89).\n\n### H-SHM-0112 — أن رسول الله صلى الله عليه وسلم كان عليه يوم أحد درعان، قد…\nحدثنا محمد بن أبي عمر قال: حدثنا سفيان بن عيينة، عن يزيد بن خصيفة، عن السائب بن يزيد، «أن رسول الله صلى الله عليه وسلم كان عليه يوم أحد درعان، قد ظاهر بينهما»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 90).\n\n\n## الباب 16: مغفره\n\n### H-SHM-0113 — اقتلوه\nحدثنا قتيبة بن سعيد قال: حدثنا مالك بن أنس، عن ابن شهاب، عن أنس بن مالك: أن النبي صلى الله عليه وسلم دخل مكة وعليه مغفر، فقيل له: هذا ابن خطل متعلق بأستار الكعبة، فقال: «اقتلوه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 91).\n\n### H-SHM-0114 — اقتلوه قال ابن شهاب: وبلغني أن رسول الله صلى الله عليه وسل…\nحدثنا عيسى بن أحمد قال: حدثنا عبد الله بن وهب قال: حدثني مالك بن أنس، عن ابن شهاب، عن أنس بن مالك، أن رسول الله صلى الله عليه وسلم دخل مكة عام الفتح، وعلى رأسه المغفر قال: فلما نزعه جاءه رجل، فقال له: ابن خطل متعلق بأستار الكعبة فقال: «اقتلوه» قال ابن شهاب: وبلغني أن رسول الله صلى الله عليه وسلم لم يكن يومئذ محرما\n\n- **الدرجة:** B — صححه الألباني (المختصر 91).\n\n\n## الباب 17: عمامته\n\n### H-SHM-0115 — دخل النبي صلى الله عليه وسلم مكة يوم الفتح وعليه عمامة سود…\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي، عن حماد بن سلمة، ح وحدثنا محمود بن غيلان قال: حدثنا وكيع، عن حماد بن سلمة، عن أبي الزبير، عن جابر قال: «دخل النبي صلى الله عليه وسلم مكة يوم الفتح وعليه عمامة سوداء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 92).\n\n### H-SHM-0116 — رأيت النبي صلى الله عليه وسلم يخطب على المنبر وعليه عمامة …\nحدثنا ابن أبي عمر قال: حدثنا سفيان، عن مساور الوراق، عن جعفر بن عمرو بن حريث، عن أبيه قال: «رأيت النبي صلى الله عليه وسلم يخطب على المنبر وعليه عمامة سوداء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 92) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0117 — أن النبي صلى الله عليه وسلم خطب الناس وعليه عمامة سوداء\nحدثنا محمود بن غيلان، ويوسف بن عيسى، قالا: حدثنا وكيع، عن مساور الوراق، عن جعفر بن عمرو بن حريث، عن أبيه، «أن النبي صلى الله عليه وسلم خطب الناس وعليه عمامة سوداء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 93).\n\n### H-SHM-0118 — كان النبي صلى الله عليه وسلم إذا اعتم سدل عمامته بين كتفيه…\nحدثنا هارون بن إسحاق الهمداني قال: حدثنا يحيى بن محمد المدني، عن عبد العزيز بن محمد، عن عبيد الله بن عمر، عن نافع، عن ابن عمر قال : «كان النبي صلى الله عليه وسلم إذا اعتم سدل عمامته بين كتفيه» قال نافع: «وكان ابن عمر، يفعل ذلك» قال عبيد الله: «ورأيت القاسم بن محمد، وسالما يفعلان ذلك»\n\n- **الدرجة:** B — صححه الألباني (المختصر 94).\n\n### H-SHM-0119 — أن النبي صلى الله عليه وسلم خطب الناس وعليه عصابة دسماء\nحدثنا يوسف بن عيسى قال: حدثنا وكيع قال: حدثنا أبو سليمان وهو عبد الرحمن بن الغسيل، عن عكرمة، عن ابن عباس: «أن النبي صلى الله عليه وسلم خطب الناس وعليه عصابة دسماء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 95).\n\n\n## الباب 18: إزاره\n\n**خلاصة الباب (E):** «ارفع إزارك، فإنه أتقى وأبقى» (121)، وتحديد موضع الإزار (123). وأثر عثمان في 122 ضعيف، والمرفوع منه «هكذا كانت إزرة صاحبي» صحيح.\n\n### H-SHM-0120 — قبض روح رسول الله صلى الله عليه وسلم في هذين\nحدثنا أحمد بن منيع قال: حدثنا إسماعيل بن إبراهيم قال: حدثنا أيوب، عن حميد بن هلال، عن أبي بردة قال: أخرجت إلينا عائشة، كساء ملبدا وإزارا غليظا، فقالت: «قبض روح رسول الله صلى الله عليه وسلم في هذين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 96).\n\n### H-SHM-0121 — ارفع إزارك، فإنه أتقى وأبقى فإذا هو رسول الله صلى الله علي…\nحدثنا محمود بن غيلان قال: حدثنا أبو داود، عن شعبة، عن الأشعث بن سليم قال: سمعت عمتي، تحدث عن عمها قال : بينا أنا أمشي بالمدينة، إذا إنسان خلفي يقول: «ارفع إزارك، فإنه أتقى وأبقى» فإذا هو رسول الله صلى الله عليه وسلم فقلت: يا رسول الله إنما هي بردة ملحاء قال: «أما لك في أسوة؟» فنظرت فإذا إزاره إلى نصف ساقيه\n\n- **الدرجة:** B — صححه الألباني (المختصر 97).\n\n### H-SHM-0122 — هكذا كانت إزرة صاحبي ، يعني النبي صلى الله عليه وسلم\nحدثنا سويد بن نصر قال: حدثنا عبد الله بن المبارك، عن موسى بن عبيدة، عن إياس بن سلمة بن الأكوع، عن أبيه قال : كان عثمان بن عفان، يأتزر إلى أنصاف ساقيه، وقال: «هكذا كانت إزرة صاحبي» ، يعني النبي صلى الله عليه وسلم\n\n- **الدرجة:** B/X — «هكذا كانت إزرة صاحبي» صحيح، وأثر عثمان في أوله ضعيف (المختصر 98).\n\n### H-SHM-0123 — هذا موضع الإزار، فإن أبيت فأسفل، فإن أبيت فلا حق للإزار في…\nحدثنا قتيبة بن سعيد قال: حدثنا أبو الأحوص، عن أبي إسحاق، عن مسلم بن نذير، عن حذيفة بن اليمان قال: أخذ رسول الله صلى الله عليه وسلم بعضلة ساقي أو ساقه فقال : «هذا موضع الإزار، فإن أبيت فأسفل، فإن أبيت فلا حق للإزار في الكعبين»\n\n- **الدرجة:** B — صححه الألباني (المختصر 99).\n\n\n## الباب 19: مشيته\n\n### H-SHM-0124 — ولا رأيت شيئا أحسن من رسول الله صلى الله عليه وسلم كأن الش…\nحدثنا قتيبة بن سعيد قال: حدثنا ابن لهيعة، عن أبي يونس، عن أبي هريرة قال: «ولا رأيت شيئا أحسن من رسول الله صلى الله عليه وسلم كأن الشمس تجري في وجهه، وما رأيت أحدا أسرع في مشيته من رسول الله صلى الله عليه وسلم كأنما الأرض تطوى له إنا لنجهد أنفسنا وإنه لغير مكترث»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 100).\n\n### H-SHM-0125 — كان إذا مشى تقلع كأنما ينحط من صبب\nحدثنا علي بن حجر، وغير واحد قالوا: حدثنا عيسى بن يونس، عن عمر بن عبد الله مولى غفرة قال: أخبرني إبراهيم بن محمد، من ولد علي بن أبي طالب قال: كان علي إذا وصف النبي صلى الله عليه وسلم قال: «كان إذا مشى تقلع كأنما ينحط من صبب»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 5).\n\n### H-SHM-0126 — كان النبي صلى الله عليه وسلم إذا مشى تكفأ تكفؤا كأنما ينحط…\nحدثنا سفيان بن وكيع قال: حدثنا أبي، عن المسعودي، عن عثمان بن مسلم بن هرمز، عن نافع بن جبير بن مطعم، عن علي بن أبي طالب قال: «كان النبي صلى الله عليه وسلم إذا مشى تكفأ تكفؤا كأنما ينحط من صبب»\n\n- **الدرجة:** B — صححه الألباني (المختصر 4).\n\n\n## الباب 20: تقنعه\n\n### H-SHM-0127 — كان رسول الله صلى الله عليه وسلم يكثر القناع كأن ثوبه ثوب …\nحدثنا يوسف بن عيسى قال: حدثنا وكيع قال: حدثنا الربيع بن صبيح، عن يزيد بن أبان، عن أنس بن مالك قال: «كان رسول الله صلى الله عليه وسلم يكثر القناع كأن ثوبه ثوب زيات»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 26).\n\n\n## الباب 21: جلسته\n\n### H-SHM-0128 — فلما رأيت رسول الله صلى الله عليه وسلم المتخشع في الجلسة أ…\nحدثنا عبد بن حميد قال: حدثنا عفان بن مسلم قال: حدثنا عبد الله بن حسان، عن جدتيه، عن قيلة بنت مخرمة، أنها رأت رسول الله صلى الله عليه وسلم في المسجد وهو قاعد القرفصاء قالت: «فلما رأيت رسول الله صلى الله عليه وسلم المتخشع في الجلسة أرعدت من الفرق»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 101).\n\n### H-SHM-0129 — أنه رأى النبي صلى الله عليه وسلم مستلقيا في المسجد واضعا إ…\nحدثنا سعيد بن عبد الرحمن المخزومي، وغير واحد قالوا: حدثنا سفيان، عن الزهري، عن عباد بن تميم، عن عمه، «أنه رأى النبي صلى الله عليه وسلم مستلقيا في المسجد واضعا إحدى رجليه على الأخرى»\n\n- **الدرجة:** B — صححه الألباني (المختصر 102)، وله مطابقة لفظية في البخاري 475، مسلم 2100.\n\n### H-SHM-0130 — كان رسول الله صلى الله عليه وسلم إذا جلس في المسجد احتبى ب…\nحدثنا سلمة بن شبيب قال: حدثنا عبد الله بن إبراهيم المدني قال: حدثنا إسحاق بن محمد الأنصاري، عن ربيح بن عبد الرحمن بن أبي سعيد، عن أبيه، عن جده أبي سعيد الخدري قال : «كان رسول الله صلى الله عليه وسلم إذا جلس في المسجد احتبى بيديه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 103).\n\n\n## الباب 22: تكأته\n\n**خلاصة الباب (E):** «أما أنا فلا آكل متكئاً» (133–134، 140): عبّر عن فعله هو، ولم يأمر به غيره بلفظه. `T05`\n\n### H-SHM-0131 — رأيت رسول الله صلى الله عليه وسلم متكئا على وسادة على يسار…\nحدثنا عباس بن محمد الدوري البغدادي قال: حدثنا إسحاق بن منصور، عن إسرائيل، عن سماك بن حرب، عن جابر بن سمرة قال: «رأيت رسول الله صلى الله عليه وسلم متكئا على وسادة على يساره»\n\n- **الدرجة:** B — صححه الألباني (المختصر 104).\n\n### H-SHM-0132 — ألا أحدثكم بأكبر الكبائر؟ قالوا: بلى يا رسول الله. قال: ال…\nحدثنا حميد بن مسعدة قال: حدثنا بشر بن المفضل قال: حدثنا الجريري، عن عبد الرحمن بن أبي بكرة، عن أبيه قال : قال رسول الله صلى الله عليه وسلم: «ألا أحدثكم بأكبر الكبائر؟» قالوا: بلى يا رسول الله. قال: «الإشراك بالله، وعقوق الوالدين» . قال: وجلس رسول الله صلى الله عليه وسلم وكان متكئا قال: «وشهادة الزور،» أو «قول الزور» قال: فما زال رسول الله صلى الله عليه وسلم يقولها حتى قلنا: ليته سكت\n\n- **الدرجة:** B — صححه الألباني (المختصر 105).\n\n### H-SHM-0133 — أما أنا فلا آكل متكئا\nحدثنا قتيبة بن سعيد قال: حدثنا شريك، عن علي بن الأقمر، عن أبي جحيفة قال: قال رسول الله صلى الله عليه وسلم: «أما أنا فلا آكل متكئا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 106).\n\n### H-SHM-0134 — لا آكل متكئا\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن علي بن الأقمر قال: سمعت أبا جحيفة يقول: قال رسول الله صلى الله عليه وسلم: «لا آكل متكئا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 106).\n\n### H-SHM-0135 — رأيت النبي صلى الله عليه وسلم متكئا على وسادة قال أبو عيسى…\nحدثنا يوسف بن عيسى قال: حدثنا وكيع قال: حدثنا إسرائيل، عن سماك بن حرب، عن جابر بن سمرة قال: «رأيت النبي صلى الله عليه وسلم متكئا على وسادة» قال أبو عيسى: «لم يذكر وكيع على يساره، وهكذا روى غير واحد عن إسرائيل نحو رواية وكيع، ولا نعلم أحدا روى فيه على يساره إلا ما رواه إسحاق بن منصور، عن إسرائيل»\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n\n## الباب 23: اتكاؤه\n\n### H-SHM-0136 — أن النبي صلى الله عليه وسلم كان شاكيا فخرج يتوكأ على أسامة…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عمرو بن عاصم قال: حدثنا حماد بن سلمة، عن حميد، عن أنس: «أن النبي صلى الله عليه وسلم كان شاكيا فخرج يتوكأ على أسامة بن زيد وعليه ثوب قطري قد توشح به فصلى بهم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 49).\n\n### H-SHM-0137 — يا فضل قلت: لبيك يا رسول الله قال: اشدد بهذه العصابة رأسي …\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا محمد بن المبارك قال: حدثنا عطاء بن مسلم الخفاف الحلبي قال: حدثنا جعفر بن برقان، عن عطاء بن أبي رباح، عن الفضل بن عباس قال : دخلت على رسول الله صلى الله عليه وسلم في مرضه الذي توفي فيه وعلى رأسه عصابة صفراء فسلمت عليه، فقال: «يا فضل» قلت: لبيك يا رسول الله قال: «اشدد بهذه العصابة رأسي» قال: ففعلت، ثم قعد فوضع كفه على منكبي، ثم قام فدخل في المسجد وفي الحديث قصة\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 107).\n\n\n## الباب 24: صفة أكله\n\n**خلاصة الباب (E):** يأكل بثلاث أصابع ويلعقهن (139، 142)، وأكل التمر «وهو مقعٍ من الجوع» (143). `D02` `T14`\n\n### H-SHM-0138 — أن النبي صلى الله عليه وسلم كان يلعق أصابعه ثلاثا قال أبو …\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي، عن سفيان، عن سعد بن إبراهيم، عن ابن لكعب بن مالك، عن أبيه، «أن النبي صلى الله عليه وسلم كان يلعق أصابعه ثلاثا» قال أبو عيسى: \" وروى غير محمد بن بشار هذا الحديث قال: يلعق أصابعه الثلاث \"\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 119).\n\n### H-SHM-0139 — كان النبي صلى الله عليه وسلم إذا أكل طعاما لعق أصابعه الثل…\nحدثنا الحسن بن علي الخلال قال: حدثنا عفان قال: حدثنا حماد بن سلمة، عن ثابت، عن أنس قال: «كان النبي صلى الله عليه وسلم إذا أكل طعاما لعق أصابعه الثلاث»\n\n- **الدرجة:** B — صححه الألباني (المختصر 120)، وله مطابقة لفظية في مسلم 2034.\n\n### H-SHM-0140 — أما أنا فلا آكل متكئا\nحدثنا الحسين بن علي بن يزيد الصدائي البغدادي قال: حدثنا يعقوب بن إسحاق يعني الحضرمي قال: حدثنا شعبة، عن سفيان الثوري، عن علي بن الأقمر، عن أبي جحيفة قال: قال النبي صلى الله عليه وسلم: «أما أنا فلا آكل متكئا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 106).\n\n### H-SHM-0141 — قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن علي بن …\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن علي بن الأقمر نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 106) (إسناد آخر للحديث السابق).\n\n### H-SHM-0142 — كان رسول الله صلى الله عليه وسلم يأكل بأصابعه الثلاث ويلعق…\nحدثنا هارون بن إسحاق الهمداني قال: حدثنا عبدة بن سليمان، عن هشام بن عروة، عن ابن لكعب بن مالك، عن أبيه قال: «كان رسول الله صلى الله عليه وسلم يأكل بأصابعه الثلاث ويلعقهن»\n\n- **الدرجة:** B — صححه الألباني (المختصر 121).\n\n### H-SHM-0143 — أتي رسول الله صلى الله عليه وسلم بتمر فرأيته يأكل وهو مقع …\nحدثنا أحمد بن منيع قال: حدثنا الفضل بن دكين قال: حدثنا مصعب بن سليم قال: سمعت أنس بن مالك يقول: «أتي رسول الله صلى الله عليه وسلم بتمر فرأيته يأكل وهو مقع من الجوع»\n\n- **الدرجة:** B — صححه الألباني (المختصر 122).\n\n\n## الباب 25: خبزه\n\n**خلاصة الباب (E):** «ما شبع آل محمد ﷺ من خبز الشعير يومين متتابعين حتى قُبض» (144، 150)، و«كان يبيت الليالي المتتابعة طاوياً هو وأهله» (146). وحديث مسروق عن بكاء عائشة (149) ضعيف. `T14`\n\n### H-SHM-0144 — ما شبع آل محمد صلى الله عليه وسلم من خبز الشعير يومين متتا…\nحدثنا محمد بن المثنى، ومحمد بن بشار، قالا: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن أبي إسحاق قال: سمعت عبد الرحمن بن يزيد، يحدث عن الأسود بن يزيد، عن عائشة، أنها قالت: «ما شبع آل محمد صلى الله عليه وسلم من خبز الشعير يومين متتابعين حتى قبض رسول الله صلى الله عليه وسلم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 123).\n\n### H-SHM-0145 — ما كان يفضل عن أهل بيت رسول الله صلى الله عليه وسلم خبز ال…\nحدثنا عباس بن محمد الدوري قال: حدثنا يحيى بن أبي بكير قال: حدثنا حريز بن عثمان، عن سليم بن عامر قال: سمعت أبا أمامة الباهلي يقول : «ما كان يفضل عن أهل بيت رسول الله صلى الله عليه وسلم خبز الشعير»\n\n- **الدرجة:** B — صححه الألباني (المختصر 124).\n\n### H-SHM-0146 — كان رسول الله صلى الله عليه وسلم يبيت الليالي المتتابعة طا…\nحدثنا عبد الله بن معاوية الجمحي قال: ‍ حدثنا ثابت بن زيد، عن هلال بن خباب، عن عكرمة، عن ابن عباس قال: «كان رسول الله صلى الله عليه وسلم يبيت الليالي المتتابعة طاويا هو وأهله لا يجدون عشاء وكان أكثر خبزهم خبز الشعير»\n\n- **الدرجة:** B — صححه الألباني (المختصر 125).\n\n### H-SHM-0147 — ما رأى رسول الله صلى الله عليه وسلم النقي حتى لقي الله عز …\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عبيد الله بن عبد المجيد الحنفي، حدثنا عبد الرحمن بن عبد الله بن دينار قال: حدثنا أبو حازم، عن سهل بن سعد، أنه قيل له: أكل رسول الله صلى الله عليه وسلم النقي؟ - يعني الحوارى - فقال سهل: «ما رأى رسول الله صلى الله عليه وسلم النقي حتى لقي الله عز وجل تعالى» ، فقيل له: هل كانت لكم مناخل على عهد رسول الله صلى الله عليه وسلم؟ قال: «ما كانت لنا مناخل» . قيل: كيف كنتم تصنعون بالشعير؟ قال: «كنا ننفخه فيطير منه ما طار ثم نعجنه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 126).\n\n### H-SHM-0148 — ما أكل نبي الله صلى الله عليه وسلم على خوان ولا في سكرجة، …\nحدثنا محمد بن بشار قال: حدثنا معاذ بن هشام قال: حدثني أبي، عن يونس، عن قتادة، عن أنس بن مالك قال: «ما أكل نبي الله صلى الله عليه وسلم على خوان ولا في سكرجة، ولا خبز له مرقق» قال: فقلت لقتادة: فعلام كانوا يأكلون؟ قال: «على هذه السفر» قال محمد بن بشار: «يونس هذا الذي روى عن قتادة هو يونس الإسكاف»\n\n- **الدرجة:** B — صححه الألباني (المختصر 127) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0149 — ما أشبع من طعام فأشاء أن أبكي إلا بكيت . قال: قلت لم؟ قالت…\nحدثنا أحمد بن منيع قال: حدثنا عباد بن عباد المهلبي، عن مجالد، عن الشعبي، عن مسروق قال: دخلت على عائشة، فدعت لي بطعام وقالت: «ما أشبع من طعام فأشاء أن أبكي إلا بكيت» . قال: قلت لم؟ قالت: «أذكر الحال التي فارق عليها رسول الله صلى الله عليه وسلم الدنيا، والله ما شبع من خبز ولحم مرتين في يوم»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 128).\n\n### H-SHM-0150 — ما شبع رسول الله صلى الله عليه وسلم من خبز الشعير يومين مت…\nحدثنا محمود بن غيلان قال: حدثنا أبو داود قال: حدثنا شعبة، عن أبي إسحاق قال: سمعت عبد الرحمن بن يزيد، يحدث، عن الأسود بن يزيد، عن عائشة، قالت: «ما شبع رسول الله صلى الله عليه وسلم من خبز الشعير يومين متتابعين حتى قبض»\n\n- **الدرجة:** B — صححه الألباني (المختصر 123).\n\n### H-SHM-0151 — ما أكل رسول الله صلى الله عليه وسلم على خوان ولا أكل خبزا …\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عبد الله بن عمرو أبو معمر ، حدثنا عبد الوارث، عن سعيد بن أبي عروبة، عن قتادة، عن أنس قال: «ما أكل رسول الله صلى الله عليه وسلم على خوان ولا أكل خبزا مرققا حتى مات»\n\n- **الدرجة:** B — صححه الألباني (المختصر 127) (مطابقة آلية ضعيفة، تُراجع).\n\n\n## الباب 26: إدامه\n\n**خلاصة الباب (E):** «نعم الإدام الخل» (152، 173): الرضا بالموجود. كان يحب الدباء (161–163) والحلواء والعسل (164) والذراع (168–170). «مه يا علي، فإنك ناقه» (182، حسن): منع المريض الناقه مما يضره ووجّهه إلى ما يوافقه. «أعندك غداء؟» فإن قيل لا قال: «إني صائم» (183، حسن): لا تكلف في البيت. `D02` `T05` `T19`\n\n### H-SHM-0152 — نعم الإدام الخل قال عبد الله بن عبد الرحمن، في حديثه: نعم …\nحدثنا محمد بن سهل بن عسكر، وعبد الله بن عبد الرحمن، قالا: حدثنا يحيى بن حسان قال: حدثنا سليمان بن بلال، عن هشام بن عروة، عن أبيه، عن عائشة، أن رسول الله صلى الله عليه وسلم قال: «نعم الإدام الخل» قال عبد الله بن عبد الرحمن، في حديثه: «نعم الإدام أو الأدم الخل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 129).\n\n### H-SHM-0153 — ألستم في طعام وشراب ما شئتم؟ لقد رأيت نبيكم صلى الله عليه …\nحدثنا قتيبة قال: حدثنا أبو الأحوص، عن سماك بن حرب قال: سمعت النعمان بن بشير يقول: «ألستم في طعام وشراب ما شئتم؟ لقد رأيت نبيكم صلى الله عليه وسلم وما يجد من الدقل ما يملأ بطنه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 110).\n\n### H-SHM-0154 — نعم الإدام أو الأدم: الخل\nحدثنا عبدة بن عبد الله الخزاعي قال: حدثنا معاوية بن هشام، عن سفيان، عن محارب بن دثار، عن جابر بن عبد الله قال: قال رسول الله صلى الله عليه وسلم: \" نعم الإدام أو الأدم: الخل \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 130) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0155 — ادن فإني رأيت رسول الله صلى الله عليه وسلم يأكل لحم دجاج\nحدثنا هناد قال: حدثنا وكيع، عن سفيان، عن أيوب، عن أبي قلابة، عن زهدم الجرمي قال: كنا عند أبي موسى الأشعري، فأتي بلحم دجاج فتنحى رجل من القوم فقال: ما لك؟ فقال: إني رأيتها تأكل شيئا فحلفت أن لا آكلها قال: «ادن فإني رأيت رسول الله صلى الله عليه وسلم يأكل لحم دجاج»\n\n- **الدرجة:** B — صححه الألباني (المختصر 131).\n\n### H-SHM-0156 — أكلت مع رسول الله صلى الله عليه وسلم لحم حبارى\nحدثنا الفضل بن سهل الأعرج البغدادي قال: حدثنا إبراهيم بن عبد الرحمن بن مهدي، عن إبراهيم بن عمر بن سفينة، عن أبيه، عن جده قال: «أكلت مع رسول الله صلى الله عليه وسلم لحم حبارى»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 132).\n\n### H-SHM-0157 — ادن، فإني قد رأيت رسول الله صلى الله عليه وسلم أكل منه ، ف…\nحدثنا علي بن حجر قال: حدثنا إسماعيل بن إبراهيم، عن أيوب، عن القاسم التميمي، عن زهدم الجرمي قال: كنا عند أبي موسى الأشعري قال: فقدم طعامه وقدم في طعامه لحم دجاج وفي القوم رجل من بني تيم الله أحمر كأنه مولى قال: فلم يدن فقال له أبو موسى: «ادن، فإني قد رأيت رسول الله صلى الله عليه وسلم أكل منه» ، فقال: إني رأيته يأكل شيئا فقذرته فحلفت أن لا أطعمه أبدا\n\n- **الدرجة:** B — صححه الألباني (المختصر 131).\n\n### H-SHM-0158 — كلوا الزيت وادهنوا به؛ فإنه من شجرة مباركة\nحدثنا محمود بن غيلان قال: حدثنا أبو أحمد الزبيري، وأبو نعيم، قالا: حدثنا سفيان، عن عبد الله بن عيسى، عن رجل من أهل الشام يقال: له عطاء، عن أبي أسيد قال: قال رسول الله صلى الله عليه وسلم: «كلوا الزيت وادهنوا به؛ فإنه من شجرة مباركة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 133).\n\n### H-SHM-0159 — كلوا الزيت وادهنوا به؛ فإنه من شجرة مباركة قال أبو عيسى: و…\nحدثنا يحيى بن موسى قال: حدثنا عبد الرزاق قال: حدثنا معمر، عن زيد بن أسلم، عن أبيه، عن عمر بن الخطاب قال: قال رسول الله صلى الله عليه وسلم: «كلوا الزيت وادهنوا به؛ فإنه من شجرة مباركة» قال أبو عيسى: «وعبد الرزاق كان يضطرب في هذا الحديث فربما أسنده، وربما أرسله»\n\n- **الدرجة:** B — صححه الألباني (المختصر 133) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0160 — قال: حدثنا عبد الرزاق، عن معمر، عن زيد بن أسلم، عن أبيه، ع…\nحدثنا السنجي وهو أبو داود سليمان بن معبد السنجي قال: حدثنا عبد الرزاق، عن معمر، عن زيد بن أسلم، عن أبيه، عن النبي صلى الله عليه وسلم نحوه ولم يذكر فيه عن عمر\n\n- **الدرجة:** B — صححه الألباني (المختصر 135) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0161 — كان النبي صلى الله عليه وسلم يعجبه الدباء فأتي بطعام، أو د…\nحدثنا محمد بن بشار قال: حدثنا محمد بن جعفر، وعبد الرحمن بن مهدي، قالا: حدثنا شعبة، عن قتادة، عن أنس بن مالك قال: «كان النبي صلى الله عليه وسلم يعجبه الدباء فأتي بطعام، أو دعي له فجعلت أتتبعه فأضعه بين يديه لما أعلم أنه يحبه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 135).\n\n### H-SHM-0162 — نكثر به طعامنا قال أبو عيسى:  وجابر هو جابر بن طارق ويقال:…\nحدثنا قتيبة بن سعيد قال: حدثنا حفص بن غياث، عن إسماعيل بن أبي خالد، عن حكيم بن جابر، عن أبيه قال: دخلت على النبي صلى الله عليه وسلم فرأيت عنده دباء يقطع فقلت: ما هذا؟ قال: «نكثر به طعامنا» قال أبو عيسى: \" وجابر هو جابر بن طارق ويقال: ابن أبي طارق، وهو رجل من أصحاب رسول الله صلى الله عليه وسلم ولا نعرف له إلا هذا الحديث الواحد، وأبو خالد اسمه: سعد \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 136).\n\n### H-SHM-0163 — فرأيت النبي صلى الله عليه وسلم يتتبع الدباء حوالي القصعة ف…\nحدثنا قتيبة بن سعيد، عن مالك بن أنس، عن إسحاق بن عبد الله بن أبي طلحة، أنه سمع أنس بن مالك يقول: إن خياطا دعا رسول الله صلى الله عليه وسلم لطعام صنعه، قال أنس: فذهبت مع رسول الله صلى الله عليه وسلم إلى ذلك الطعام فقرب إلى رسول الله صلى الله عليه وسلم خبزا من شعير، ومرقا فيه دباء وقديد، قال أنس: «فرأيت النبي صلى الله عليه وسلم يتتبع الدباء حوالي القصعة» فلم أزل أحب الدباء من يومئذ\n\n- **الدرجة:** B — صححه الألباني (المختصر 135).\n\n### H-SHM-0164 — كان النبي صلى الله عليه وسلم يحب الحلواء والعسل\nحدثنا أحمد بن إبراهيم الدورقي، وسلمة بن شبيب، ومحمود بن غيلان، قالوا: حدثنا أبو أسامة، عن هشام بن عروة، عن أبيه، عن عائشة قالت: «كان النبي صلى الله عليه وسلم يحب الحلواء والعسل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 137).\n\n### H-SHM-0165 — قربت إلى رسول الله صلى الله عليه وسلم جنبا مشويا فأكل منه،…\nحدثنا الحسن بن محمد الزعفراني قال: حدثنا الحجاج بن محمد قال: قال ابن جريج: أخبرني محمد بن يوسف، أن عطاء بن يسار، أخبره أن أم سلمة، أخبرته أنها «قربت إلى رسول الله صلى الله عليه وسلم جنبا مشويا فأكل منه، ثم قام إلى الصلاة وما توضأ»\n\n- **الدرجة:** B — صححه الألباني (المختصر 138).\n\n### H-SHM-0166 — أكلنا مع رسول الله صلى الله عليه وسلم شواء في المسجد\nحدثنا قتيبة قال: حدثنا ابن لهيعة، عن سليمان بن زياد، عن عبد الله بن الحارث قال: «أكلنا مع رسول الله صلى الله عليه وسلم شواء في المسجد»\n\n- **الدرجة:** B — صححه الألباني (المختصر 139).\n\n### H-SHM-0167 — ما له تربت يداه؟ . قال: وكان شاربه قد وفى، فقال له: أقصه ل…\nحدثنا محمود بن غيلان قال: حدثنا وكيع قال: حدثنا مسعر، عن أبي صخرة جامع بن شداد، عن المغيرة بن عبد الله، عن المغيرة بن شعبة قال: ضفت مع رسول الله صلى الله عليه وسلم ذات ليلة فأتي بجنب مشوي، ثم أخذ الشفرة فجعل يحز، فحز لي بها منه قال: فجاء بلال يؤذنه بالصلاة فألقى الشفرة فقال: «ما له تربت يداه؟» . قال: وكان شاربه قد وفى، فقال له: «أقصه لك على سواك» أو «قصه على سواك»\n\n- **الدرجة:** B — صححه الألباني (المختصر 140).\n\n### H-SHM-0168 — أتي النبي صلى الله عليه وسلم بلحم فرفع إليه الذراع وكانت ت…\nحدثنا واصل بن عبد الأعلى قال: حدثنا محمد بن فضيل، عن أبي حيان التيمي، عن أبي زرعة، عن أبي هريرة قال: «أتي النبي صلى الله عليه وسلم بلحم فرفع إليه الذراع وكانت تعجبه فنهس منها»\n\n- **الدرجة:** B — صححه الألباني (المختصر 141)، وله مطابقة لفظية في البخاري 4712، مسلم 194.\n\n### H-SHM-0169 — كان النبي صلى الله عليه وسلم يعجبه الذراع قال: وسم في الذر…\nحدثنا محمد بن بشار قال: حدثنا أبو داود، عن زهير يعني ابن محمد، عن أبي إسحاق، عن سعد بن عياض، عن ابن مسعود قال: «كان النبي صلى الله عليه وسلم يعجبه الذراع» قال: «وسم في الذراع، وكان يرى أن اليهود سموه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 142).\n\n### H-SHM-0170 — ناولني الذراع ، فناولته ثم قال: ناولني الذراع فقلت: يا رسو…\nحدثنا محمد بن بشار قال: حدثنا مسلم بن إبراهيم قال: حدثنا أبان بن يزيد، عن قتادة، عن شهر بن حوشب، عن أبي عبيد قال: طبخت للنبي صلى الله عليه وسلم قدرا وقد كان يعجبه الذراع فناولته الذراع ثم قال: «ناولني الذراع» ، فناولته ثم قال: «ناولني الذراع» فقلت: يا رسول الله، وكم للشاة من ذراع فقال: «والذي نفسي بيده لو سكت لناولتني الذراع ما دعوت»\n\n- **الدرجة:** B — صححه الألباني (المختصر 143).\n\n### H-SHM-0171 — ما كانت الذراع أحب اللحم إلى رسول الله صلى الله عليه وسلم …\nحدثنا الحسن بن محمد الزعفراني قال: حدثنا يحيى بن عباد، عن فليح بن سليمان قال: حدثني رجل، من بني عباد يقال له: عبد الوهاب بن يحيى بن عباد، عن عبد الله بن الزبير، عن عائشة، قالت: «ما كانت الذراع أحب اللحم إلى رسول الله صلى الله عليه وسلم ولكنه كان لا يجد اللحم إلا غبا، وكان يعجل إليها لأنها أعجلها نضجا»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 144).\n\n### H-SHM-0172 — إن أطيب اللحم لحم الظهر\nحدثنا محمود بن غيلان قال: حدثنا أبو أحمد قال: حدثنا مسعر قال: سمعت شيخا، من فهم قال: سمعت عبد الله بن جعفر يقول: سمعت رسول الله صلى الله عليه وسلم يقول: «إن أطيب اللحم لحم الظهر»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 145).\n\n### H-SHM-0173 — نعم الإدام الخل\nحدثنا سفيان بن وكيع قال: حدثنا زيد بن الحباب، عن عبد الله بن المؤمل، عن ابن أبي مليكة، عن عائشة: أن النبي صلى الله عليه وسلم قال: «نعم الإدام الخل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 129).\n\n### H-SHM-0174 — أعندك شيء؟ فقلت: لا إلا خبز يابس وخل، فقال: هاتي، ما أقفر …\nحدثنا أبو كريب محمد بن العلاء قال: حدثنا أبو بكر بن عياش، عن ثابت أبي حمزة الثمالي، عن الشعبي، عن أم هانئ، قالت : دخل علي النبي صلى الله عليه وسلم فقال: «أعندك شيء؟» فقلت: لا إلا خبز يابس وخل، فقال: «هاتي، ما أقفر بيت من أدم فيه خل»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 146).\n\n### H-SHM-0175 — فضل عائشة على النساء كفضل الثريد على سائر الطعام\nحدثنا محمد بن المثنى قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن عمرو بن مرة، عن مرة الهمداني، عن أبي موسى الأشعري، عن النبي صلى الله عليه وسلم قال: «فضل عائشة على النساء كفضل الثريد على سائر الطعام»\n\n- **الدرجة:** B — صححه الألباني (المختصر 147)، وله مطابقة لفظية في البخاري 5419، مسلم 2431.\n\n### H-SHM-0176 — فضل عائشة على النساء كفضل الثريد على سائر الطعام\nحدثنا علي بن حجر قال: حدثنا إسماعيل بن جعفر قال: حدثنا عبد الله بن عبد الرحمن بن معمر الأنصاري أبو طوالة، أنه سمع أنس بن مالك يقول: قال رسول الله صلى الله عليه وسلم: «فضل عائشة على النساء كفضل الثريد على سائر الطعام»\n\n- **الدرجة:** B — صححه الألباني (المختصر 147)، وله مطابقة لفظية في البخاري 5419، مسلم 2431.\n\n### H-SHM-0177 — رأى رسول الله صلى الله عليه وسلم توضأ من أكل ثور أقط، ثم ر…\nحدثنا قتيبة بن سعيد قال: حدثنا عبد العزيز بن محمد، عن سهيل بن أبي صالح، عن أبيه، عن أبي هريرة ، أنه «رأى رسول الله صلى الله عليه وسلم توضأ من أكل ثور أقط، ثم رآه أكل من كتف شاة، ثم صلى ولم يتوضأ» حدثنا ابن أبي عمر قال: حدثنا سفيان بن عيينة، عن وائل بن داود، عن ابنه وهو بكر بن وائل، عن الزهري، عن أنس بن مالك قال: «أولم رسول الله صلى الله عليه وسلم على صفية بتمر وسويق»\n\n- **الدرجة:** B — صححه الألباني (المختصر 149) (مطابقة آلية ضعيفة، تُراجع).\n\n*الرقم 178 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0179 — هذا مما كان يعجب رسول الله صلى الله عليه وسلم ويحسن أكله\nحدثنا الحسين بن محمد البصري قال: حدثنا الفضيل بن سليمان قال: حدثني فائد، مولى عبيد الله بن علي بن أبي رافع مولى رسول الله صلى الله عليه وسلم قال: حدثني عبيد الله بن علي، عن جدته سلمى، أن الحسن بن علي، وابن عباس، وابن جعفر أتوها فقالوا لها: اصنعي لنا طعاما مما كان يعجب رسول الله صلى الله عليه وسلم ويحسن أكله. فقالت: يا بني لا تشتهيه اليوم قال: بلى اصنعيه لنا. قال: فقامت فأخذت من شعير فطحنته، ثم جعلته في قدر، وصبت عليه شيئا من زيت ودقت الفلفل والتوابل فقربته إليهم، فقالت: «هذا مما كان يعجب رسول الله صلى الله عليه وسلم ويحسن أكله»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 151).\n\n### H-SHM-0180 — كأنهم علموا أنا نحب اللحم وفي الحديث قصة\nحدثنا محمود بن غيلان قال: حدثنا أبو أحمد قال: حدثنا سفيان، عن الأسود بن قيس، عن نبيح العنزي، عن جابر بن عبد الله قال: أتانا النبي صلى الله عليه وسلم في منزلنا فذبحنا له شاة، فقال: «كأنهم علموا أنا نحب اللحم» وفي الحديث قصة \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 152).\n\n### H-SHM-0181 — خرج رسول الله صلى الله عليه وسلم وأنا معه فدخل على امرأة م…\nحدثنا ابن أبي عمر قال: حدثنا سفيان قال: حدثنا عبد الله بن محمد بن عقيل، أنه سمع جابرا، قال سفيان: وحدثنا محمد بن المنكدر، عن جابر قال: «خرج رسول الله صلى الله عليه وسلم وأنا معه فدخل على امرأة من الأنصار، فذبحت له شاة فأكل منها، وأتته بقناع من رطب، فأكل منه، ثم توضأ للظهر وصلى صلى الله عليه وسلم، ثم انصرف، فأتته بعلالة من علالة الشاة، فأكل ثم صلى العصر ولم يتوضأ»\n\n- **الدرجة:** B — صححه الألباني (المختصر 153).\n\n### H-SHM-0182 — مه يا علي، فإنك ناقه ، قالت: فجلس علي والنبي صلى الله عليه…\nحدثنا العباس بن محمد الدوري قال: حدثنا يونس بن محمد قال: حدثنا فليح بن سليمان، عن عثمان بن عبد الرحمن، عن يعقوب بن أبي يعقوب، عن أم المنذر، قالت: دخل علي رسول الله صلى الله عليه وسلم ومعه علي، ولنا دوال معلقة، قالت: فجعل رسول الله صلى الله عليه وسلم يأكل وعلي معه يأكل، فقال رسول الله صلى الله عليه وسلم لعلي: «مه يا علي، فإنك ناقه» ، قالت: فجلس علي والنبي صلى الله عليه وسلم يأكل، قالت: فجعلت لهم سلقا وشعيرا، فقال النبي صلى الله عليه وسلم لعلي: «من هذا فأصب فإن هذا أوفق لك»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 154).\n\n### H-SHM-0183 — أعندك غداء؟ فأقول: لا. قالت: فيقول: إني صائم . قالت: فأتان…\nحدثنا محمود بن غيلان قال: حدثنا بشر بن السري، عن سفيان، عن طلحة بن يحيى، عن عائشة بنت طلحة، عن عائشة، أم المؤمنين قالت: كان النبي صلى الله عليه وسلم يأتيني فيقول: «أعندك غداء؟» فأقول: لا. قالت: فيقول: «إني صائم» . قالت: فأتاني يوما، فقلت: يا رسول الله، إنه أهديت لنا هدية قال: «وما هي؟» قلت: حيس قال: «أما إني أصبحت صائما» قالت: ثم أكل\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 155).\n\n### H-SHM-0184 — هذه إدام هذه وأكل\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عمر بن حفص بن غياث قال : حدثنا أبي، عن محمد بن أبي يحيى الأسلمي، عن يزيد بن أبي أمية الأعور، عن يوسف بن عبد الله بن سلام قال: رأيت النبي صلى الله عليه وسلم أخذ كسرة من خبز الشعير فوضع عليها تمرة وقال: «هذه إدام هذه وأكل»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 156).\n\n### H-SHM-0185 — أن رسول الله صلى الله عليه وسلم كان يعجبه الثفل قال عبد ال…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا سعيد بن سليمان، عن عباد بن العوام، عن حميد، عن أنس: «أن رسول الله صلى الله عليه وسلم كان يعجبه الثفل» قال عبد الله: «يعني ما بقي من الطعام»\n\n- **الدرجة:** B — صححه الألباني (المختصر 157).\n\n\n## الباب 27: وضوؤه عند الطعام\n\n### H-SHM-0186 — إنما أمرت بالوضوء إذا قمت إلى الصلاة\nحدثنا أحمد بن منيع قال: حدثنا إسماعيل بن إبراهيم، عن أيوب، عن ابن أبي مليكة، عن ابن عباس، أن رسول الله صلى الله عليه وسلم خرج من الخلاء فقرب إليه الطعام فقالوا: ألا نأتيك بوضوء؟ قال: «إنما أمرت بالوضوء إذا قمت إلى الصلاة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 158).\n\n### H-SHM-0187 — أأصلي فأتوضأ\nحدثنا سعيد بن عبد الرحمن المخزومي قال: حدثنا سفيان بن عيينة، عن عمرو بن دينار، عن سعيد بن الحويرث، عن ابن عباس قال: خرج رسول الله صلى الله عليه وسلم من الغائط فأتي بطعام، فقيل له: ألا تتوضأ؟ فقال: «أأصلي فأتوضأ»\n\n- **الدرجة:** B — صححه الألباني (المختصر 158).\n\n### H-SHM-0188 — بركة الطعام الوضوء قبله والوضوء بعده\nحدثنا يحيى بن موسى قال: حدثنا عبد الله بن نمير قال: حدثنا قيس بن الربيع، (ح) وحدثنا قتيبة قال: حدثنا عبد الكريم الجرجاني، عن قيس بن الربيع، عن أبي هاشم، عن زاذان، عن سلمان قال: قرأت في التوراة أن بركة الطعام الوضوء بعده، فذكرت ذلك للنبي صلى الله عليه وسلم ، وأخبرته بما قرأت في التوراة، فقال رسول الله صلى الله عليه وسلم: «بركة الطعام الوضوء قبله والوضوء بعده»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 159).\n\n\n## الباب 28: قوله قبل الطعام وبعده\n\n**خلاصة الباب (E):** «ادنُ يا بني، فسمِّ الله تعالى، وكل بيمينك، وكل مما يليك» (191): تعليم الصغير بخطاب قريب وثلاثة توجيهات محددة. `T20` `C03`\n\n### H-SHM-0189 — إنا ذكرنا اسم الله حين أكلنا، ثم قعد من أكل ولم يسم الله ت…\nحدثنا قتيبة قال: حدثنا ابن لهيعة، عن يزيد بن أبي حبيب، عن راشد بن جندل اليافعي، عن حبيب بن أوس، عن أبي أيوب الأنصاري قال: كنا عند النبي صلى الله عليه وسلم يوما، فقرب طعاما، فلم أر طعاما كان أعظم بركة منه، أول ما أكلنا، ولا أقل بركة في آخره، فقلنا: يا رسول الله، كيف هذا؟ قال: «إنا ذكرنا اسم الله حين أكلنا، ثم قعد من أكل ولم يسم الله تعالى فأكل معه الشيطان»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 160).\n\n### H-SHM-0190 — إذا أكل أحدكم فنسي أن يذكر الله تعالى على طعامه فليقل: بسم…\nحدثنا يحيى بن موسى قال: حدثنا أبو داود قال: حدثنا هشام الدستوائي، عن بديل العقيلي، عن عبد الله بن عبيد بن عمير، عن أم كلثوم، عن عائشة، قالت: قال رسول الله صلى الله عليه وسلم: \" إذا أكل أحدكم فنسي أن يذكر الله تعالى على طعامه فليقل: بسم الله أوله وآخره \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 161) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0191 — ادن يا بني فسم الله تعالى وكل بيمينك وكل مما يليك\nحدثنا عبد الله بن الصباح الهاشمي البصري قال: حدثنا عبد الأعلى، عن معمر، عن هشام بن عروة، عن أبيه، عن عمر بن أبي سلمة، أنه دخل على رسول الله صلى الله عليه وسلم وعنده طعام فقال: «ادن يا بني فسم الله تعالى وكل بيمينك وكل مما يليك»\n\n- **الدرجة:** B — صححه الألباني (المختصر 162).\n\n### H-SHM-0192 — الحمد لله الذي أطعمنا وسقانا وجعلنا مسلمين\nحدثنا محمود بن غيلان قال: حدثنا أبو أحمد الزبيري قال: حدثنا سفيان الثوري، عن أبي هاشم، عن إسماعيل بن رياح، عن أبيه رياح بن عبيدة، عن أبي سعيد الخدري قال: كان رسول الله صلى الله عليه وسلم إذا فرغ من طعامه قال: «الحمد لله الذي أطعمنا وسقانا وجعلنا مسلمين»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 163).\n\n### H-SHM-0193 — الحمد لله حمدا كثيرا طيبا مباركا فيه غير مودع ولا مستغنى ع…\nحدثنا محمد بن بشار قال: حدثنا يحيى بن سعيد قال: حدثنا ثور بن يزيد، عن خالد بن معدان، عن أبي أمامة قال: كان رسول الله صلى الله عليه وسلم إذا رفعت المائدة من بين يديه يقول: «الحمد لله حمدا كثيرا طيبا مباركا فيه غير مودع ولا مستغنى عنه ربنا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 164).\n\n### H-SHM-0194 — لو سمى لكفاكم\nحدثنا أبو بكر محمد بن أبان قال: حدثنا وكيع، عن هشام الدستوائي، عن بديل بن ميسرة العقيلي، عن عبد الله بن عبيد بن عمير، عن أم كلثوم، عن عائشة، قالت: كان النبي صلى الله عليه وسلم يأكل الطعام في ستة من أصحابه فجاء أعرابي فأكله بلقمتين، فقال رسول الله صلى الله عليه وسلم: «لو سمى لكفاكم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 165).\n\n### H-SHM-0195 — إن الله ليرضى عن العبد أن يأكل الأكلة، أو يشرب الشربة فيحم…\nحدثنا هناد، ومحمود بن غيلان، قالا: حدثنا أبو أسامة، عن زكريا بن أبي زائدة، عن سعيد بن أبي بردة، عن أنس بن مالك قال: قال رسول الله صلى الله عليه وسلم: «إن الله ليرضى عن العبد أن يأكل الأكلة، أو يشرب الشربة فيحمده عليها»\n\n- **الدرجة:** B — صححه الألباني (المختصر 166)، وله مطابقة لفظية في مسلم 2734.\n\n\n## الباب 29: قدحه\n\n### H-SHM-0196 — يا ثابت، هذا قدح رسول الله صلى الله عليه وسلم\nحدثنا الحسين بن الأسود البغدادي قال: حدثنا عمرو بن محمد قال: حدثنا عيسى بن طهمان، عن ثابت قال: أخرج إلينا أنس بن مالك، قدح خشب غليظا مضببا بحديد فقال: «يا ثابت، هذا قدح رسول الله صلى الله عليه وسلم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 167).\n\n### H-SHM-0197 — لقد سقيت رسول الله صلى الله عليه وسلم بهذا القدح الشراب كل…\nحدثنا عبد الله بن عبد الرحمن قال: أنبأنا عمرو بن عاصم قال: أنبأنا حماد بن سلمة قال: أنبأنا حميد، وثابت، عن أنس قال: «لقد سقيت رسول الله صلى الله عليه وسلم بهذا القدح الشراب كله، الماء والنبيذ والعسل واللبن»\n\n- **الدرجة:** B — صححه الألباني (المختصر 168).\n\n\n## الباب 30: فاكهته\n\n### H-SHM-0198 — كان النبي صلى الله عليه وسلم يأكل القثاء بالرطب\nحدثنا إسماعيل بن موسى الفزاري قال: حدثنا إبراهيم بن سعد، عن أبيه، عن عبد الله قال: «كان النبي صلى الله عليه وسلم يأكل القثاء بالرطب»\n\n- **الدرجة:** B — صححه الألباني (المختصر 169).\n\n### H-SHM-0199 — أن النبي صلى الله عليه وسلم كان يأكل البطيخ بالرطب\nحدثنا عبدة بن عبد الله الخزاعي البصري قال: حدثنا معاوية بن هشام، عن سفيان، عن هشام بن عروة، عن أبيه، عن عائشة: «أن النبي صلى الله عليه وسلم كان يأكل البطيخ بالرطب»\n\n- **الدرجة:** B — صححه الألباني (المختصر 170).\n\n### H-SHM-0200 — رأيت رسول الله صلى الله عليه وسلم يجمع بين الخربز والرطب\nحدثنا إبراهيم بن يعقوب قال: حدثنا وهب بن جرير قال: حدثنا أبي قال: سمعت حميدا، أو قال: حدثني حميد - قال وهب: وكان صديقا له - عن أنس بن مالك قال: «رأيت رسول الله صلى الله عليه وسلم يجمع بين الخربز والرطب»\n\n- **الدرجة:** B — صححه الألباني (المختصر 171).\n\n### H-SHM-0201 — أن النبي صلى الله عليه وسلم أكل البطيخ بالرطب\nحدثنا محمد بن يحيى قال: حدثنا محمد بن عبد العزيز الرملي قال: حدثنا عبد الله بن يزيد بن الصلت، عن محمد بن إسحاق، عن يزيد بن رومان، عن عروة، عن عائشة: «أن النبي صلى الله عليه وسلم أكل البطيخ بالرطب»\n\n- **الدرجة:** B — صححه الألباني (المختصر 170).\n\n### H-SHM-0202 — اللهم بارك لنا في ثمارنا، وبارك لنا في مدينتنا، وبارك لنا …\nحدثنا قتيبة بن سعيد، عن مالك بن أنس، (ح) وحدثنا إسحاق بن موسى قال: حدثنا معن قال: حدثنا مالك، عن سهيل بن أبي صالح، عن أبيه، عن أبي هريرة قال : كان الناس إذا رأوا أول الثمر جاءوا به إلى رسول الله صلى الله عليه وسلم، فإذا أخذه رسول الله صلى الله عليه وسلم قال: «اللهم بارك لنا في ثمارنا، وبارك لنا في مدينتنا، وبارك لنا في صاعنا وفي مدنا، اللهم إن إبراهيم عبدك وخليلك ونبيك، وإني عبدك ونبيك، وإنه دعاك لمكة، وإني أدعوك للمدينة بمثل ما دعاك به لمكة ومثله معه» قال: ثم يدعو أصغر وليد يراه فيعطيه ذلك الثمر\n\n- **الدرجة:** B — صححه الألباني (المختصر 172)، وله مطابقة لفظية في مسلم 1373.\n\n### H-SHM-0203 — وكان النبي صلى الله عليه وسلم يحب القثاء، فأتيته به وعنده …\nحدثنا محمد بن حميد الرازي قال: حدثنا إبراهيم بن المختار، عن محمد بن إسحاق، عن أبي عبيدة بن محمد بن عمار بن ياسر، عن الربيع بنت معوذ بن عفراء، قالت : بعثني معاذ بن عفراء بقناع من رطب وعليه أجر من قثاء زغب، «وكان النبي صلى الله عليه وسلم يحب القثاء، فأتيته به وعنده حلية قد قدمت عليه من البحرين، فملأ يده منها فأعطانيه»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 173).\n\n### H-SHM-0204 — أتيت النبي صلى الله عليه وسلم بقناع من رطب وأجر زغب، فأعطا…\nحدثنا علي بن حجر قال: حدثنا شريك، عن عبد الله بن محمد بن عقيل، عن الربيع بنت معوذ بن عفراء، قالت: «أتيت النبي صلى الله عليه وسلم بقناع من رطب وأجر زغب، فأعطاني ملء كفه حليا» أو قالت: ذهبا\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 174).\n\n\n## الباب 31: شرابه\n\n**خلاصة الباب (E):** «الشربة لك، فإن شئت آثرت بها خالداً» (206، حسن): استأذن الغلام الذي عن يمينه في حقه قبل أن يعطي الأكبر. `T08` `C03`\n\n### H-SHM-0205 — كان أحب الشراب إلى رسول الله صلى الله عليه وسلم الحلو البا…\nحدثنا ابن أبي عمر قال: حدثنا سفيان، عن معمر، عن الزهري، عن عروة، عن عائشة، قالت: «كان أحب الشراب إلى رسول الله صلى الله عليه وسلم الحلو البارد»\n\n- **الدرجة:** B — صححه الألباني (المختصر 175).\n\n### H-SHM-0206 — الشربة لك، فإن شئت آثرت بها خالدا فقلت: ما كنت لأوثر على س…\nحدثنا أحمد بن منيع قال: حدثنا إسماعيل بن إبراهيم قال: حدثنا علي بن زيد، عن عمر هو ابن أبي حرملة، عن ابن عباس قال: دخلت مع رسول الله صلى الله عليه وسلم أنا وخالد بن الوليد على ميمونة فجاءتنا بإناء من لبن، فشرب رسول الله صلى الله عليه وسلم وأنا على يمينه وخالد على شماله، فقال لي: «الشربة لك، فإن شئت آثرت بها خالدا» فقلت: ما كنت لأوثر على سؤرك أحدا، ثم قال رسول الله صلى الله عليه وسلم: \" من أطعمه الله طعاما، فليقل: اللهم بارك لنا فيه وأطعمنا خيرا منه، ومن سقاه الله عز وجل لبنا، فليقل: اللهم بارك لنا فيه وزدنا منه \". ثم قال: قال رسول الله صلى الله عليه وسلم: «ليس شيء يجزئ مكان الطعام والشراب غير اللبن» قال أبو عيسى: هكذا روى سفيان بن عيينة، هذا الحديث، عن معمر، عن الزهري، عن عروة، عن عائشة، ورواه عبد الله بن المبارك، وعبد الرزاق، وغير واحد، عن معمر، عن الزهري، عن النبي صلى الله عليه وسلم «مرسلا ولم يذكروا فيه عن عروة، عن عائشة، وهكذا روى يونس وغير واحد، عن الزهري، عن النبي صلى الله عليه وسلم مرسلا» قال أبو عيسى: «إنما أسنده ابن عيينة من بين الناس» قال أبو عيسى: \" وميمونة بنت الحارث زوج النبي صلى الله عليه وسلم هي خالة خالد بن الوليد، وخالة ابن عباس، وخالة يزيد بن الأصم ، واختلف الناس في رواية هذا الحديث، عن علي بن زيد بن جدعان، فروى بعضهم عن علي بن زيد، عن عمر بن أبي حرملة، وروى شعبة، عن علي بن زيد، فقال: عن عمرو بن حرملة، والصحيح عمر بن أبي حرملة \"\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 176).\n\n\n## الباب 32: صفة شربه\n\n**خلاصة الباب (E):** ثبت شربه قائماً وقاعداً (207–210، 215). الجمع بينها وبين أحاديث النهي عن الشرب قائماً مسألة لم تُدرس `RG-054`.\n\n### H-SHM-0207 — أن النبي صلى الله عليه وسلم شرب من زمزم وهو قائم\nحدثنا أحمد بن منيع قال: حدثنا هشيم قال: حدثنا عاصم الأحول، ومغيرة، عن الشعبي، عن ابن عباس: «أن النبي صلى الله عليه وسلم شرب من زمزم وهو قائم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 183).\n\n### H-SHM-0208 — رأيت رسول الله صلى الله عليه وسلم يشرب قائما وقاعدا\nحدثنا قتيبة بن سعيد قال: حدثنا محمد بن جعفر، عن حسين المعلم، عن عمرو بن شعيب، عن أبيه، عن جده قال: «رأيت رسول الله صلى الله عليه وسلم يشرب قائما وقاعدا»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 177).\n\n### H-SHM-0209 — سقيت النبي صلى الله عليه وسلم من زمزم فشرب وهو قائم\nحدثنا علي بن حجر قال: حدثنا ابن المبارك، عن عاصم الأحول، عن الشعبي، عن ابن عباس قال: «سقيت النبي صلى الله عليه وسلم من زمزم فشرب وهو قائم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 178).\n\n### H-SHM-0210 — أتى علي، بكوز من ماء وهو في الرحبة فأخذ منه كفا فغسل يديه …\nحدثنا أبو كريب محمد بن العلاء، ومحمد بن طريف الكوفي، قالا: حدثنا ابن الفضيل، عن الأعمش، عن عبد الملك بن ميسرة، عن النزال بن سبرة قال: «أتى علي، بكوز من ماء وهو في الرحبة فأخذ منه كفا فغسل يديه ومضمض واستنشق ومسح وجهه وذراعيه ورأسه، ثم شرب وهو قائم» ، ثم قال: «هذا وضوء من لم يحدث، هكذا رأيت رسول الله صلى الله عليه وسلم فعل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 179).\n\n### H-SHM-0211 — هو أمرأ وأروى\nحدثنا قتيبة بن سعيد، ويوسف بن حماد، قالا: حدثنا عبد الوارث بن سعيد، عن أبي عصام، عن أنس بن مالك، أن النبي صلى الله عليه وسلم: كان يتنفس في الإناء ثلاثا إذا شرب، ويقول: «هو أمرأ وأروى»\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n### H-SHM-0212 — أن النبي صلى الله عليه وسلم كان إذا شرب تنفس مرتين حدثنا ا…\nحدثنا علي بن خشرم قال: حدثنا عيسى بن يونس، عن رشدين بن كريب، عن أبيه، عن ابن عباس: «أن النبي صلى الله عليه وسلم كان إذا شرب تنفس مرتين» حدثنا ابن أبي عمر قال: حدثنا سفيان، عن يزيد بن يزيد بن جابر، عن عبد الرحمن بن أبي عمرة، عن جدته كبشة، قالت: «دخل علي النبي صلى الله عليه وسلم فشرب من قربة معلقة قائما، فقمت إلى فيها فقطعته»\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n*الرقم 213 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0214 — أن النبي صلى الله عليه وسلم كان يتنفس في الإناء ثلاثا\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا عزرة بن ثابت الأنصاري، عن ثمامة بن عبد الله قال : كان أنس بن مالك، يتنفس في الإناء ثلاثا، وزعم أنس، «أن النبي صلى الله عليه وسلم كان يتنفس في الإناء ثلاثا»\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n### H-SHM-0215 — أن النبي صلى الله عليه وسلم دخل على أم سليم وقربة معلقة فش…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا أبو عاصم، عن ابن جريج، عن عبد الكريم، عن البراء بن زيد ابن ابنة أنس بن مالك، عن أنس بن مالك : «أن النبي صلى الله عليه وسلم دخل على أم سليم وقربة معلقة فشرب من فم القربة وهو قائم، فقامت أم سليم إلى رأس القربة فقطعتها»\n\n- **الدرجة:** B — صححه الألباني (المختصر 183).\n\n### H-SHM-0216 — أن النبي صلى الله عليه وسلم كان يشرب قائما قال: أبو عيسى: …\nحدثنا أحمد بن نصر النيسابوري قال: حدثنا إسحاق بن محمد الفروي قال: حدثتنا عبيدة بنت نائل، عن عائشة بنت سعد بن أبي وقاص، عن أبيها، «أن النبي صلى الله عليه وسلم كان يشرب قائما» قال: أبو عيسى: وقال بعضهم: عبيدة بنت نابل\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 119) (مطابقة آلية ضعيفة، تُراجع).\n\n\n## الباب 33: تعطره\n\n**خلاصة الباب (E):** «كان لا يرد الطيب» (218). `D03`\n\n### H-SHM-0217 — كان لرسول الله صلى الله عليه وسلم سكة يتطيب منها\nحدثنا محمد بن رافع، وغير واحد قالوا: حدثنا أبو أحمد الزبيري قال: حدثنا شيبان، عن عبد الله بن المختار، عن موسى بن أنس بن مالك، عن أبيه قال: «كان لرسول الله صلى الله عليه وسلم سكة يتطيب منها»\n\n- **الدرجة:** B — صححه الألباني (المختصر 185).\n\n### H-SHM-0218 — إن النبي صلى الله عليه وسلم كان لا يرد الطيب\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا عزرة بن ثابت، عن ثمامة بن عبد الله قال: كان أنس بن مالك، لا يرد الطيب، وقال أنس: «إن النبي صلى الله عليه وسلم كان لا يرد الطيب»\n\n- **الدرجة:** B — صححه الألباني (المختصر 186).\n\n### H-SHM-0219 — ثلاث لا ترد: الوسائد، والدهن، واللبن\nحدثنا قتيبة بن سعيد قال: حدثنا ابن أبي فديك، عن عبد الله بن مسلم بن جندب، عن أبيه، عن ابن عمر قال: قال رسول الله صلى الله عليه وسلم: \" ثلاث لا ترد: الوسائد، والدهن، واللبن \"\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 187) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0220 — طيب الرجال ما ظهر ريحه وخفي لونه، وطيب النساء ما ظهر لونه …\nحدثنا محمود بن غيلان قال: حدثنا أبو داود الحفري، عن سفيان، عن الجريري، عن أبي نضرة، عن رجل، عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «طيب الرجال ما ظهر ريحه وخفي لونه، وطيب النساء ما ظهر لونه وخفي ريحه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 188).\n\n### H-SHM-0221 — قال: أنبأنا إسماعيل بن إبراهيم، عن الجريري، عن أبي نضرة، ع…\nحدثنا علي بن حجر قال: أنبأنا إسماعيل بن إبراهيم، عن الجريري، عن أبي نضرة، عن الطفاوي، عن أبي هريرة، عن النبي صلى الله عليه وسلم مثله بمعناه\n\n- **الدرجة:** B — صححه الألباني (المختصر 188) (إسناد آخر للحديث السابق).\n\n### H-SHM-0222 — إذا أعطي أحدكم الريحان فلا يرده، فإنه خرج من الجنة قال أبو…\nحدثنا محمد بن خليفة، وعمرو بن علي، قالا: حدثنا يزيد بن زريع قال: حدثنا حجاج الصواف، عن حنان، عن أبي عثمان النهدي قال: قال رسول الله صلى الله عليه وسلم: «إذا أعطي أحدكم الريحان فلا يرده، فإنه خرج من الجنة» قال أبو عيسى: «ولا نعرف لحنان غير هذا الحديث»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 189) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0223 — ما رأيت رجلا أحسن صورة من جرير إلا ما بلغنا من صورة يوسف ع…\nحدثنا عمر بن إسماعيل بن مجالد بن سعيد الهمداني قال: حدثنا أبي، عن بيان، عن قيس بن أبي حازم، عن جرير بن عبد الله قال: عرضت بين يدي عمر بن الخطاب، فألقى جرير رداءه ومشى في إزار، فقال له: خذ رداءك. فقال عمر للقوم: «ما رأيت رجلا أحسن صورة من جرير إلا ما بلغنا من صورة يوسف عليه السلام»\n\n- **الدرجة:** X — ضعيف جداً عند الألباني (المختصر 190).\n\n\n## الباب 39: نومه\n\n**خلاصة الباب (E):** أذكار النوم والاستيقاظ (255–258)، والنوم على الشق الأيمن (261). `D06`\n\n### H-SHM-0255 — رب قني عذابك يوم تبعث عبادك\nحدثنا محمد بن المثنى قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا إسرائيل، عن أبي إسحاق، عن عبد الله بن يزيد، عن البراء بن عازب، أن النبي صلى الله عليه وسلم كان إذا أخذ مضجعه وضع كفه اليمنى تحت خده الأيمن، وقال: «رب قني عذابك يوم تبعث عبادك»\n\n- **الدرجة:** B — صححه الألباني (المختصر 216).\n\n### H-SHM-0256 — يوم تجمع عبادك\nحدثنا محمد بن المثنى قال: حدثنا عبد الرحمن قال: حدثنا إسرائيل، عن أبي إسحاق، عن أبي عبيدة، عن عبد الله، مثله وقال: «يوم تجمع عبادك»\n\n- **الدرجة:** B — صححه الألباني (المختصر 216).\n\n### H-SHM-0257 — اللهم باسمك أموت وأحيا ، وإذا استيقظ قال: الحمد لله الذي أ…\nحدثنا محمود بن غيلان قال: حدثنا عبد الرزاق قال: حدثنا سفيان، عن عبد الملك بن عمير، عن ربعي بن حراش، عن حذيفة قال: كان النبي صلى الله عليه وسلم إذا أوى إلى فراشه قال: «اللهم باسمك أموت وأحيا» ، وإذا استيقظ قال: «الحمد لله الذي أحيانا بعدما أماتنا وإليه النشور»\n\n- **الدرجة:** B — صححه الألباني (المختصر 217)، وله مطابقة لفظية في البخاري 6314.\n\n### H-SHM-0258 — كان رسول الله صلى الله عليه وسلم إذا أوى إلى فراشه كل ليلة…\nحدثنا قتيبة بن سعيد قال: حدثنا المفضل بن فضالة، عن عقيل، أراه عن الزهري، عن عروة، عن عائشة، قالت: «كان رسول الله صلى الله عليه وسلم إذا أوى إلى فراشه كل ليلة جمع كفيه فنفث فيهما، وقرأ فيهما قل هو الله أحد وقل أعوذ برب الفلق وقل أعوذ برب الناس ثم مسح بهما ما استطاع من جسده، يبدأ بهما رأسه ووجهه وما أقبل من جسده يصنع ذلك ثلاث مرات»\n\n- **الدرجة:** B — صححه الألباني (المختصر 218).\n\n### H-SHM-0259 — أن رسول الله صلى الله عليه وسلم نام حتى نفخ، وكان إذا نام …\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن سلمة بن كهيل، عن كريب، عن ابن عباس: «أن رسول الله صلى الله عليه وسلم نام حتى نفخ، وكان إذا نام نفخ فأتاه بلال فآذنه بالصلاة، فقام وصلى ولم يتوضأ» وفي الحديث قصة \" حدثنا إسحاق بن منصور قال: حدثنا عفان قال: حدثنا حماد بن سلمة، عن ثابت، عن أنس بن مالك، أن رسول الله صلى الله عليه وسلم كان إذا أوى إلى فراشه قال: «الحمد لله الذي أطعمنا وسقانا وكفانا وآوانا، فكم ممن لا كافي له ولا مؤوي»\n\n- **الدرجة:** ؟ — لم يُطابق آلياً في المختصر؛ يُراجع `RG-052`.\n\n*الرقم 260 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0261 — أن النبي صلى الله عليه وسلم كان إذا عرس بليل اضطجع على شقه…\nحدثنا الحسين بن محمد الجريري قال: حدثنا سليمان بن حرب قال: حدثنا حماد بن سلمة، عن حميد، عن بكر بن عبد الله المزني، عن عبد الله بن رباح، عن أبي قتادة: «أن النبي صلى الله عليه وسلم كان إذا عرس بليل اضطجع على شقه الأيمن، وإذا عرس قبيل الصبح نصب ذراعه، ووضع رأسه على كفه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 220).\n\n\n## الباب 40: عبادته\n\n**خلاصة الباب (E):** قام حتى تورمت قدماه، وجوابه: «أفلا أكون عبداً شكوراً» (262–264). ينام أول الليل ويقوم آخره (265). صلاته بالليل إحدى عشرة أو ثلاث عشرة ركعة (267، 270، 272). صلى ابن مسعود معه فأطال حتى همّ أن يقعد ويدعه (278). وكان يصلي النافلة جالساً أحياناً (280–282). وحديث الأمر «فليفتتح صلاته بركعتين خفيفتين» (269) ضعّفه الألباني هنا وله مطابقة لفظية في مسلم 768، فيُراجع `RG-052`. `T25`\n\n### H-SHM-0262 — أفلا أكون عبدا شكورا\nحدثنا قتيبة بن سعيد، وبشر بن معاذ، قالا: حدثنا أبو عوانة، عن زياد بن علاقة، عن المغيرة بن شعبة قال: صلى رسول الله صلى الله عليه وسلم حتى انتفخت قدماه فقيل له: أتتكلف هذا وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ قال: «أفلا أكون عبدا شكورا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 221).\n\n### H-SHM-0263 — أفلا أكون عبدا شكورا\nحدثنا أبو عمار الحسين بن حريث قال: حدثنا الفضل بن موسى، عن محمد بن عمرو، عن أبي سلمة، عن أبي هريرة قال: كان رسول الله صلى الله عليه وسلم يصلي حتى ترم قدماه قال: فقيل له: أتفعل هذا وقد جاءك أن الله قد غفر لك ما تقدم من ذنبك وما تأخر؟ قال: «أفلا أكون عبدا شكورا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 221).\n\n### H-SHM-0264 — أفلا أكون عبدا شكورا\nحدثنا عيسى بن عثمان بن عيسى بن عبد الرحمن الرملي قال: حدثنا عمي يحيى بن عيسى الرملي، عن الأعمش عن أبي صالح، عن أبي هريرة قال: كان رسول الله صلى الله عليه وسلم يقوم يصلي حتى تنتفخ قدماه فيقال له: يا رسول الله، تفعل هذا وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ قال: «أفلا أكون عبدا شكورا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 221).\n\n### H-SHM-0265 — كان ينام أول الليل ثم يقوم، فإذا كان من السحر أوتر، ثم أتى…\nحدثنا محمد بن بشار قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن أبي إسحاق، عن الأسود بن يزيد قال: سألت عائشة، عن صلاة رسول الله صلى الله عليه وسلم بالليل؟ فقالت: «كان ينام أول الليل ثم يقوم، فإذا كان من السحر أوتر، ثم أتى فراشه، فإذا كان له حاجة ألم بأهله، فإذا سمع الأذان وثب، فإن كان جنبا أفاض عليه من الماء، وإلا توضأ وخرج إلى الصلاة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 223).\n\n### H-SHM-0266 — فاضطجعت في عرض الوسادة، واضطجع رسول الله صلى الله عليه وسل…\nحدثنا قتيبة بن سعيد، عن مالك بن أنس، ح وحدثنا إسحاق بن موسى الأنصاري قال: حدثنا معن، عن مالك، عن مخرمة بن سليمان، عن كريب، عن ابن عباس، أنه أخبره أنه بات عند ميمونة وهي خالته قال: «فاضطجعت في عرض الوسادة، واضطجع رسول الله صلى الله عليه وسلم في طولها، فنام رسول الله صلى الله عليه وسلم حتى إذا انتصف الليل أو قبله بقليل أو بعده بقليل، فاستيقظ رسول الله صلى الله عليه وسلم فجعل يمسح النوم عن وجهه، ثم قرأ العشر الآيات الخواتيم من سورة آل عمران، ثم قام إلى شن معلق فتوضأ منها، فأحسن الوضوء، ثم قام يصلي» قال عبد الله بن عباس: \" فقمت إلى جنبه فوضع رسول الله صلى الله عليه وسلم يده اليمنى على رأسي ثم أخذ بأذني اليمنى ففتلها فصلى ركعتين، ثم ركعتين، ثم ركعتين، ثم ركعتين، ثم ركعتين، ثم ركعتين - قال معن: ست مرات - ثم أوتر، ثم اضطجع حتى جاءه المؤذن فقام فصلى ركعتين خفيفتين، ثم خرج فصلى الصبح \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 224).\n\n### H-SHM-0267 — كان النبي صلى الله عليه وسلم يصلي من الليل ثلاث عشرة ركعة\nحدثنا أبو كريب محمد بن العلاء قال: حدثنا وكيع، عن شعبة، عن أبي جمرة، عن ابن عباس قال: «كان النبي صلى الله عليه وسلم يصلي من الليل ثلاث عشرة ركعة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 225)، وله مطابقة لفظية في البخاري 1140، مسلم 764.\n\n### H-SHM-0268 — أن النبي صلى الله عليه وسلم كان إذا لم يصل بالليل منعه من …\nحدثنا قتيبة بن سعيد قال: حدثنا أبو عوانة، عن قتادة، عن زرارة بن أوفى، عن سعد بن هشام، عن عائشة: «أن النبي صلى الله عليه وسلم كان إذا لم يصل بالليل منعه من ذلك النوم، أو غلبته عيناه صلى من النهار ثنتي عشرة ركعة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 226).\n\n### H-SHM-0269 — إذا قام أحدكم من الليل فليفتتح صلاته بركعتين خفيفتين\nحدثنا محمد بن العلاء قال: حدثنا أبو أسامة، عن هشام يعني ابن حسان، عن محمد بن سيرين، عن أبي هريرة، عن النبي صلى الله عليه وسلم قال: «إذا قام أحدكم من الليل فليفتتح صلاته بركعتين خفيفتين»\n\n- **الدرجة:** ؟ — ضعّفه الألباني في المختصر (227)، وله مطابقة لفظية في مسلم 768؛ تعارض يُراجع `RG-052`.\n\n### H-SHM-0270 — فصلى رسول الله صلى الله عليه وسلم ركعتين خفيفتين، ثم صلى ر…\nحدثنا قتيبة بن سعيد، عن مالك بن أنس، ح وحدثنا إسحاق بن موسى قال: حدثنا معن قال: حدثنا مالك، عن عبد الله بن أبي بكر، عن أبيه، أن عبد الله بن قيس بن مخرمة، أخبره عن زيد بن خالد الجهني، أنه قال: لأرمقن صلاة النبي صلى الله عليه وسلم، فتوسدت عتبته، أو فسطاطه «فصلى رسول الله صلى الله عليه وسلم ركعتين خفيفتين، ثم صلى ركعتين طويلتين، طويلتين، طويلتين، ثم صلى ركعتين وهما دون اللتين قبلهما، ثم صلى ركعتين وهما دون اللتين قبلهما، ثم صلى ركعتين وهما دون اللتين قبلهما، ثم صلى ركعتين وهما دون اللتين قبلهما، ثم أوتر فذلك ثلاث عشرة ركعة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 228)، وله مطابقة لفظية في مسلم 765.\n\n### H-SHM-0271 — يا عائشة، إن عيني تنامان ولا ينام قلبي\nحدثنا إسحاق بن موسى قال: حدثنا معن قال: حدثنا مالك، عن سعيد بن أبي سعيد المقبري، عن أبي سلمة بن عبد الرحمن، أنه أخبره أنه سأل عائشة، كيف كانت صلاة رسول الله صلى الله عليه وسلم في رمضان؟ فقالت: ما كان رسول الله صلى الله عليه وسلم ليزيد في رمضان ولا في غيره على إحدى عشرة ركعة، يصلي أربعا لا تسأل عن حسنهن وطولهن، ثم يصلي أربعا لا تسأل عن حسنهن وطولهن، ثم يصلي ثلاثا، قالت عائشة: قلت: يا رسول الله، أتنام قبل أن توتر؟ فقال: «يا عائشة، إن عيني تنامان ولا ينام قلبي»\n\n- **الدرجة:** B — صححه الألباني (المختصر 229)، وله مطابقة لفظية في البخاري 1147، مسلم 738.\n\n### H-SHM-0272 — أن رسول الله صلى الله عليه وسلم كان يصلي من الليل إحدى عشر…\nحدثنا إسحاق بن موسى قال: حدثنا معن قال: حدثنا مالك، عن ابن شهاب، عن عروة، عن عائشة: «أن رسول الله صلى الله عليه وسلم كان يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة، فإذا فرغ منها اضطجع على شقه الأيمن»\n\n- **الدرجة:** B — صححه الألباني (المختصر 230)، وله مطابقة لفظية في مسلم 736.\n\n### H-SHM-0273 — قال: حدثنا معن، عن مالك، عن ابن شهاب، نحوه (ح) وحدثنا قتيب…\nحدثنا ابن أبي عمر قال: حدثنا معن، عن مالك، عن ابن شهاب، نحوه (ح) وحدثنا قتيبة، عن مالك، عن ابن شهاب، نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 230) (إسناد آخر للحديث السابق).\n\n*الرقم 274 مدمج في الرقم السابق في النسخة الرقمية.*\n\n### H-SHM-0275 — كان رسول الله صلى الله عليه وسلم يصلي من الليل تسع ركعات ح…\nحدثنا هناد قال: حدثنا أبو الأحوص، عن الأعمش، عن إبراهيم، عن الأسود، عن عائشة، قالت: «كان رسول الله صلى الله عليه وسلم يصلي من الليل تسع ركعات» حدثنا محمود بن غيلان قال: حدثنا يحيى بن آدم قال: حدثنا سفيان الثوري، عن الأعمش، نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 231) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0276 — الله أكبر ذو الملكوت والجبروت والكبرياء والعظمة قال: ثم قر…\nحدثنا محمد بن المثنى قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن عمرو بن مرة، عن أبي حمزة، رجل من الأنصار، عن رجل من بني عبس، عن حذيفة بن اليمان، أنه صلى مع النبي صلى الله عليه وسلم من الليل قال : فلما دخل في الصلاة قال: «الله أكبر ذو الملكوت والجبروت والكبرياء والعظمة» قال: ثم قرأ البقرة، ثم ركع ركوعه نحوا من قيامه وكان يقول: «سبحان ربي العظيم، سبحان ربي العظيم» ثم رفع رأسه فكان قيامه نحوا من ركوعه، وكان يقول: «لربي الحمد، لربي الحمد» ثم سجد فكان سجوده نحوا من قيامه، وكان يقول: «سبحان ربي الأعلى، سبحان ربي الأعلى» ثم رفع رأسه، فكان ما بين السجدتين نحوا من السجود، وكان يقول: «رب اغفر لي، رب اغفر لي» حتى قرأ البقرة وآل عمران والنساء والمائدة أو الأنعام «شعبة الذي شك في المائدة والأنعام» قال أبو عيسى: \" وأبو حمزة اسمه: طلحة بن زيد، وأبو حمزة الضبعي اسمه: نصر بن عمران \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 232).\n\n### H-SHM-0277 — قام رسول الله صلى الله عليه وسلم بآية من القرآن ليلة\nحدثنا أبو بكر محمد بن نافع البصري قال: حدثنا عبد الصمد بن عبد الوارث، عن إسماعيل بن مسلم العبدي، عن أبي المتوكل، عن عائشة، قالت: «قام رسول الله صلى الله عليه وسلم بآية من القرآن ليلة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 233).\n\n### H-SHM-0278 — صليت ليلة مع رسول الله صلى الله عليه وسلم فلم يزل قائما حت…\nحدثنا محمود بن غيلان قال: حدثنا سليمان بن حرب قال: حدثنا شعبة، عن الأعمش، عن أبي وائل، عن عبد الله بن مسعود قال: «صليت ليلة مع رسول الله صلى الله عليه وسلم فلم يزل قائما حتى هممت بأمر سوء» قيل له: وما هممت به؟ قال: «هممت أن أقعد وأدع النبي صلى الله عليه وسلم»\n\n- **الدرجة:** B — صححه الألباني (المختصر 234).\n\n### H-SHM-0279 — قال: حدثنا جرير، عن الأعمش، نحوه\nحدثنا سفيان بن وكيع قال: حدثنا جرير، عن الأعمش، نحوه\n\n- **الدرجة:** B — صححه الألباني (المختصر 234) (إسناد آخر للحديث السابق).\n\n### H-SHM-0280 — أن النبي صلى الله عليه وسلم كان يصلي جالسا فيقرأ وهو جالس،…\nحدثنا إسحاق بن موسى الأنصاري قال: حدثنا معن قال: حدثنا مالك، عن أبي النضر، عن أبي سلمة، عن عائشة: «أن النبي صلى الله عليه وسلم كان يصلي جالسا فيقرأ وهو جالس، فإذا بقي من قراءته قدر ما يكون ثلاثين أو أربعين آية، قام فقرأ وهو قائم، ثم ركع وسجد، ثم صنع في الركعة الثانية مثل ذلك»\n\n- **الدرجة:** B — صححه الألباني (المختصر 235)، وله مطابقة لفظية في مسلم 731.\n\n### H-SHM-0281 — كان يصلي ليلا طويلا قائما، وليلا طويلا قاعدا، فإذا قرأ وهو…\nحدثنا أحمد بن منيع قال: حدثنا هشيم قال: حدثنا خالد الحذاء، عن عبد الله بن شقيق قال: سألت عائشة، عن صلاة رسول الله صلى الله عليه وسلم عن تطوعه، فقالت: «كان يصلي ليلا طويلا قائما، وليلا طويلا قاعدا، فإذا قرأ وهو قائم ركع وسجد وهو قائم، وإذا قرأ وهو جالس ركع وسجد وهو جالس»\n\n- **الدرجة:** B — صححه الألباني (المختصر 236).\n\n### H-SHM-0282 — كان رسول الله صلى الله عليه وسلم يصلي في سبحته قاعدا ويقرأ…\nحدثنا إسحاق بن موسى الأنصاري قال: حدثنا معن قال: حدثنا مالك، عن ابن شهاب، عن السائب بن يزيد، عن المطلب بن أبي وداعة السهمي، عن حفصة، زوج النبي صلى الله عليه وسلم قالت: «كان رسول الله صلى الله عليه وسلم يصلي في سبحته قاعدا ويقرأ بالسورة ويرتلها حتى تكون أطول من أطول منها» حدثنا
