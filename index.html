خطاب المباشر للنبي ﷺ في هذا الجزء أعلى منها في جزء عمّ (21 من 40 مجموعة، مقابل 20 من 70).\n\n---\n\n## 3. ما أضافه الجزء إلى محاور المشروع (مستوى E)\n\n1. **الصبر أكثر توجيه مكرر للنبي ﷺ في هذا الجزء:** «فاصبر لحكم ربك» (68:48، 76:24)، «فاصبر صبراً جميلاً» (70:5)، «واصبر على ما يقولون» (73:10)، «ولربك فاصبر» (74:7). خمسة مواضع في ست سور متتالية، والسياق في كلها أذى المكذبين.\n2. **الهجر الجميل `T13`:** «واهجرهم هجراً جميلاً» (73:10). أول نص في القاعدة يحدد طريقة الانفصال عن المؤذي، لا مجرد الصبر عليه. معنى «الجميل» عند المفسرين يُوثق `RG-037`.\n3. **الثبات وعدم المداهنة `T03` `T24`:** «ودّوا لو تدهن فيدهنون» (68:9). يُقابل بنص سورة الكافرون في الجزء 30. يُدرس معه ما ثبت من مرونته في الوسائل.\n4. **التوازن بين العبادة والعمل `T25`:** المزمل تجمع قيام الليل مع «إن لك في النهار سبحاً طويلاً»، ثم تخفف القيام لأجل المرضى والمسافرين في طلب الرزق والمجاهدين (73:20). نص صريح في مراعاة ظروف الناس المعيشية في العبادة.\n5. **حدود علمه وقدرته ﷺ `T05` `T22`:** «لا أملك لكم ضراً ولا رشداً» (72:21)، «إنما العلم عند الله» (67:26)، «قل إن أدري» (72:25)، و«أم تسألهم أجراً» (68:46). نصوص صريحة تمنع المبالغة في وصفه ﷺ بما ليس له.\n6. **الأمانة في البلاغ `T07`:** «ولو تقوّل علينا بعض الأقاويل لأخذنا منه باليمين» (69:44–46).\n7. **التخطيط مع استثناء المشيئة `T23`:** قصة أصحاب الجنة (68:17–33) أول نص في القاعدة لموضوع التخطيط.\n8. **الرحمة بالأسير `C10` `T02`:** الإطعام «مسكيناً ويتيماً وأسيراً» (76:8).\n\n---\n\n## 4. التفسير المقروء في الدفعة 4 (السعدي وابن كثير، tafsir_api)\n\nالأقوال هنا **E** منسوبة إلى قائليها، والآيات **A**.\n\n### Q-68:8-9 — «فلا تطع المكذبين، ودوا لو تدهن فيدهنون» `T03` `T24`\n- **السعدي:** النهي عام في كل مكذب وكل طاعة ناشئة عن التكذيب، «وإن كان السياق في شيء خاص، وهو أن المشركين طلبوا من النبي ﷺ أن يسكت عن عيب آلهتهم ودينهم ويسكتوا عنه». والإدهان عنده: أن يوافقهم على بعض ما هم عليه «إما بالقول، أو بالفعل، أو بالسكوت عما يتعين الكلام فيه».\n- **صلته:** يتسق مع رواية ابن إسحاق في أن عداوة قريش اشتدت حين عاب آلهتهم (`E-S03-014`).\n- **حدّ مهم من كلام السعدي:** السكوت المذموم هو السكوت «عما يتعين الكلام فيه»، لا كل سكوت.\n\n### Q-70:5 — «فاصبر صبراً جميلاً» `T04`\n- **السعدي:** اصبر على دعوتك لقومك صبراً «لا تضجر فيه ولا ملل»، واستمر على أمر الله، ولا يمنعك عنهم ما ترى من عدم انقيادهم.\n\n### Q-72:21 — «قل إني لا أملك لكم ضراً ولا رشداً» `T22`\n- **السعدي:** «فإني عبد ليس لي من الأمر والتصرف شيء». وإذا كان الرسول، وهو أكمل الخلق، لا يملك ذلك ولا يمنع نفسه من الله، فغيره أولى. وفي 72:23: ليس له مزية على الناس إلا أن الله خصه بإبلاغ رسالاته.\n\n### Q-73:10 — «واهجرهم هجراً جميلاً» `T13` — يغلق `RG-037`\n- **السعدي:** الهجر الجميل هو الهجر «حيث اقتضت المصلحة الهجر، الذي لا أذية فيه»، بالإعراض عن أقوالهم المؤذية، مع الأمر بجدالهم بالتي هي أحسن.\n- **ابن كثير:** «هجراً جميلاً، وهو الذي لا عتاب معه».\n- **الحاصل (E):** القولان متكاملان: هجر لا أذى فيه ولا عتاب، ولا يمنع الجدال بالتي هي أحسن. وقيد السعدي «حيث اقتضت المصلحة» يجعله أداة تُستعمل بحسب المصلحة، لا قاعدة دائمة.\n\n### Q-73:20 — تخفيف قيام الليل `T25` `T21`\n- **السعدي:** خُفف التقدير لمشقة تحرير الوقت، فالمصلي بالليل يصلي «ما دام نشيطاً؛ فإذا فتر أو كسل أو نعس فليسترح». والأعذار المذكورة: المرض، والسفر للتجارة «ليستغنوا عن الخلق ويتكففوا عنهم»، والجهاد. «فلله الحمد... حيث لم يجعل علينا في الدين من حرج، بل سهّل شرعه، وراعى أحوال عباده ومصالح دينهم وأبدانهم ودنياهم».\n- **قيمته (E):** السعي في الرزق ذُكر في القرآن نفسه عذراً معتبراً في تخفيف عبادة نافلة.\n"}, {"code": "QKB-05", "slug": "qkb-05", "sec": "02", "title": "القرآن — التوسيم الموضوعي للجزء الثامن والعشرين (قد سمع)", "short": "توسيم جزء قد سمع (28)", "md": "# القرآن — التوسيم الموضوعي للجزء الثامن والعشرين (قد سمع)\n\n- **القسم:** 02 — قاعدة المعرفة القرآنية\n- **الدفعة:** 4 — 15 نوفمبر 2026\n- **النطاق:** السور 58–66، وعدد آياتها **137 آية، قُرئت كلها** من نص المصحف (quran-api).\n- **طبيعة الملف:** نص الآيات **A**، والتوسيم والربط **E**. قُرئ في هذه الدفعة تفسير ثلاث آيات (البند 4).\n- **قاعدة التوسيم:** لا يُذكر حدث أو شخص إلا إن كان في لفظ الآية، **أو ثبت في كتاب التفسير من صحيح البخاري** (`HKB-BKH-04`، مقروء في الدفعة نفسها).\n- **مفتاح الوسوم:** كما في `QKB-03`: ن خطاب للنبي ﷺ أو وصف له، س واقع السيرة، خ توجيه أخلاقي أو اجتماعي أو تشريعي، ع عقيدة وجزاء، ك آيات الخلق، ق قصص الأمم.\n- **طبيعة الجزء:** كل سوره مدنية في لفظها وموضوعها: البيت النبوي، والمنافقون، وبنو النضير، والعلاقة بالمخالفين، والجمعة، والطلاق. هذا يكمل الجزأين 29 و30 المكيين.\n\n---\n\n## 1. التوسيم\n\n| السورة | الآيات | المضمون | الوسم | الربط |\n|---|---|---|---|---|\n| 58 المجادلة | 1 | **«قد سمع الله قول التي تجادلك في زوجها وتشتكي إلى الله والله يسمع تحاوركما»** | ن، س | `T26` `C05`: امرأة تجادله في شأن زوجها، والقرآن يسمي الحوار «تحاوركما». هوية المرأة غير مذكورة في الآية، ولا حديث مسند في البخاري للسورة `RG-048` |\n| | 2–4 | حكم الظهار: «منكراً من القول وزوراً»؛ الكفارة: عتق، ثم صيام شهرين، ثم إطعام ستين مسكيناً | خ | `T19`؛ التدرج بحسب الاستطاعة |\n| | 5–6 | المحادّون لله ورسوله | ع | — |\n| | 7–10 | النجوى: «ما يكون من نجوى ثلاثة إلا هو رابعهم»؛ المنافقون «إذا جاءوك حيوك بما لم يحيك به الله»؛ «إنما النجوى من الشيطان ليحزن الذين آمنوا» | خ، س | `T13` الإساءة في التحية؛ `C11` |\n| | 11 | **«إذا قيل لكم تفسحوا في المجالس فافسحوا... يرفع الله الذين آمنوا منكم والذين أوتوا العلم درجات»** | خ | `D05` آداب المجلس |\n| | 12–13 | تقديم صدقة بين يدي مناجاة الرسول، ثم التخفيف | ن، خ | `T22`: تنظيم الوصول إليه؛ التخفيف بعد التكليف |\n| | 14–21 | الذين تولوا قوماً غضب الله عليهم، «اتخذوا أيمانهم جنة»؛ «لأغلبن أنا ورسلي» | ع، س | `C11` |\n| | 22 | لا يوادّون من حاد الله ورسوله ولو كانوا آباءهم أو أبناءهم | خ، ع | `C10` |\n| 59 الحشر | 1–4 | **إخراج الذين كفروا من أهل الكتاب من ديارهم «لأول الحشر»** | س | `S06`: بنو النضير، بنص ابن عباس (`H-BKH-4882`) |\n| | 5 | **«ما قطعتم من لينة أو تركتموها قائمة... فبإذن الله»** | س | `H-BKH-4884`: تحريق نخل البويرة |\n| | 6–7 | **الفيء: لله وللرسول ولذي القربى واليتامى والمساكين وابن السبيل «كي لا يكون دولة بين الأغنياء منكم»؛ «وما آتاكم الرسول فخذوه»** | ن، خ | `T21` `T08`: توزيع المال وعدم حصره في الأغنياء؛ `H-BKH-4885` نفقة السنة |\n| | 8 | الفقراء المهاجرون «أولئك هم ا  (`PD-010` و`PD-011`).\n4. **المال `T21` `T23`:** توزيع الفيء «كي لا يكون دولة بين الأغنياء»، ونفقة السنة للأهل (`H-BKH-4885`)، و«ولتنظر نفس ما قدمت لغد»، وترك البيع وقت الجمعة ثم الانتشار في طلب الرزق.\n5. **مطابقة القول للفعل `T07`:** «لم تقولون ما لا تفعلون» (61:2–3).\n6. **الأسرة:** أعداء من الأزواج والأولاد مع الأمر بالعفو (64:14)، والطلاق بمعروف وبلا إضرار (65:1–7)، والنفقة بقدر الوسع (65:7)، ومسؤولية الرجل عن أهله (66:6).\n7. **الحزم واللين `T03`:** «جاهد الكفار والمنافقين واغلظ عليهم» (66:9)، وفي الجزء نفسه الاستغفار للمنافقين (63:5–6)، وترك قتل ابن أبي (البخاري 4905). وقد فرّق السعدي في الآية بين مرتبة الحجة «بالتي هي أحسن» ومرتبة القتال، وجعل ابن كثير جهاد المنافقين بإقامة الحدود (البند 4، `SD-019`).\n\n---\n\n## 4. التفسير المقروء في الدفعة 4 (السعدي وابن كثير)\n\n### Q-60:8-9 — البر والقسط مع غير المحارب `C09` `C10` `T08`\n- **السعدي:** لما نزلت آيات أول السورة «تأثّموا من صلة بعض أقاربهم المشركين»، فأخبرهم الله أن ذلك لا يدخل في المحرم: «لا ينهاكم الله عن البر والصلة والمكافأة بالمعروف والقسط للمشركين من أقاربكم وغيرهم» ما داموا لم ينتصبوا لقتالهم وإخراجهم. والمنهي عنه في 60:9 هو التولي «بالنصرة والمودة بالقول والفعل»، «وأما بركم وإحسانكم الذي ليس بتولٍّ للمشركين فلم ينهكم الله عنه».\n- **ابن كثير:** «لا ينهاكم عن الإحسان إلى الكفرة الذين لا يقاتلونكم في الدين، كالنساء والضعفة منهم»، و«تقسطوا إليهم: تعدلوا».\n- **الحديث الذي أورده ابن كثير، وهو في الصحيحين (B):** قالت أسماء بنت أبي بكر: قدمت عليّ أمي وهي مشركة في عهد قريش، فاستفتيت رسول الله ﷺ: إن أمي قدمت وهي راغبة، أفأصل أمي؟ قال: **«نعم، صلي أمك»** (البخاري 2620 و5978، مسلم 1003). وفي البخاري 5978 قال ابن عيينة: فأنزل الله فيها «لا ينهاكم الله عن الذين لم يقاتلوكم في الدين».\n- **وأورد ابن كثير أيضاً (B):** «إن المقسطين عند الله على منابر من نور... الذين يعدلون في حكمهم وأهليهم وما ولوا» (مسلم 1827، وقرأته من النص). `T08` `T18` `T19`: العدل في الحكم والأهل والولاية بلفظ واحد.\n- **ما لم يُعتمد:** رواية البزار أن الأم أم عائشة وأسماء معاً، قال ابن كثير: «وهو منكر بهذا السياق»، لأن أم عائشة كانت مسلمة مهاجرة. **X**.\n\n### Q-66:3 — «عرّف بعضه وأعرض عن بعض» `T11` `T19`\n- **السعدي:** «قال كثير من المفسرين» إن التي أُسرّ إليها حفصة، فحدثت به عائشة، فأخبره الله، «فعرّفها ﷺ ببعض ما قالت وأعرض عن بعضه، كرماً منه ﷺ وحلماً».\n- **وفي أول السورة ذكر السعدي سببين للتحريم:** «سريته مارية أو شرب العسل... في قصة معروفة»، دون ترجيح ولا إسناد. والثابت في البخاري 4912 قصة العسل `SD-018`.\n\n### Q-66:9 — «جاهد الكفار والمنافقين واغلظ عليهم» `T03`\n- **السعدي:** يشمل جهادهم بإقامة الحجة والموعظة الحسنة وإبطال ما هم عليه، وجهادهم بالسلاح لمن أبى، «فإن هذا يجاهَد ويُغلظ له، وأما المرتبة الأولى فتكون بالتي هي أحسن».\n- **ابن كثير:** الكفار بالسلاح والقتال، والمنافقون بإقامة الحدود عليهم، «واغلظ عليهم: أي في الدنيا».\n- **الخلاف:** `SD-019`.\n"}, {"code": "HKB-BKH-01", "slug": "hkb-bkh-01", "sec": "03", "title": "الأحاديث — صحيح البخاري: كتاب بدء الوحي (دراسة كاملة)", "short": "البخاري: كتاب بدء الوحي", "md": "# الأحاديث — صحيح البخاري: كتاب بدء الوحي (دراسة كاملة)\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 1 — 15 نوفمبر 2026\n- **نطاق الدراسة:** كتاب بدء الوحي كاملاً، الأحاديث 1 إلى 7 (7 من 7). ومعه الحديث 6982 لأنه رواية أخرى لحديث بدء الوحي فيها زيادات.\n- **النص:** منقول آلياً بحروفه من مستودع hadith-api. الترقيم يوافق ترقيم فتح الباري في هذه المواضع.\n- **التخريج في صحيح مسلم:** بالبحث النصي الآلي في نسخة hadith-api من صحيح مسلم، والرقم المذكور ترقيم محمد فؤاد عبد الباقي.\n- **الشرح:** لم يُقرأ شرح فتح الباري على أحاديث الكتاب 1–7 بعد. قُرئ منه فقط موضع شرح زيادة «فيما بلغنا» في الحديث 6982 (ج12 ص359–360 من طبعة دار المعرفة).\n\n---\n\n## H-BKH-0001 — إنما الأعمال بالنيات\n\nحَدَّثَنَا الْحُمَيْدِيُّ عَبْدُ اللَّهِ بْنُ الزُّبَيْرِ ، قَالَ : حَدَّثَنَا سُفْيَانُ ، قَالَ : حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ الْأَنْصَارِيُّ ، قَالَ : أَخْبَرَنِي مُحَمَّدُ بْنُ إِبْرَاهِيمَ التَّيْمِيُّ ، أَنَّهُ سَمِعَ عَلْقَمَةَ بْنَ وَقَّاصٍ اللَّيْثِيَّ ، يَقُولُ : سَمِعْتُ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ عَلَى الْمِنْبَرِ، قَالَ : سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، يَقُولُ : \" إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوْ إِلَى امْرَأَةٍ يَنْكِحُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ\n\n- **الراوي:** عمر بن الخطاب رضي الله عنه، على المنبر.\n- **التخريج:** مسلم 1907. **الدرجة: B** (متفق عليه).\n- **ملاحظة على اللفظ:** رواية البخاري في هذا الموضع ليس فيها جملة «فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله»، وهي موجودة في رواية مسلم 1907. سبب ذلك عند الشراح لم يُقرأ بعد (فجوة بحثية).\n- **الموضوعات:** `T25` التوازن بين العبادة والحياة، الأخلاق العامة (النية أساس تقويم العمل).\n- **مستوى E — مبدأ:** قيمة العمل الواحد في ظاهره تتحدد بنية صاحبه؛ الهجرة نفسها تكون لله أو لدنيا أو لامرأة. المبدأ منصوص، وتطبيقاته اجتهادية.\n\n---\n\n## H-BKH-0002 — كيف يأتيه الوحي\n\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ ـ رضى الله عنها ـ أَنَّ الْحَارِثَ بْنَ هِشَامٍ ـ رضى الله عنه ـ سَأَلَ رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ كَيْفَ يَأْتِيكَ الْوَحْىُ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم  \" أَحْيَانًا يَأْتِينِي مِثْلَ صَلْصَلَةِ الْجَرَسِ ـ وَهُوَ أَشَدُّهُ عَلَىَّ ـ فَيُفْصَمُ عَنِّي وَقَدْ وَعَيْتُ عَنْهُ مَا قَالَ، وَأَحْيَانًا يَتَمَثَّلُ لِيَ الْمَلَكُ رَجُلاً فَيُكَلِّمُنِي فَأَعِي مَا يَقُولُ \". قَالَتْ عَائِشَةُ رضى الله عنها وَلَقَدْ رَأَيْتُهُ يَنْزِلُ عَلَيْهِ الْوَحْىُ فِي الْيَوْمِ الشَّدِيدِ الْبَرْدِ، فَيَفْصِمُ عَنْهُ وَإِنَّ جَبِينَهُ لَيَتَفَصَّدُ عَرَقًا.\n\n- **الراوي:** عائشة رضي الله عنها، عن سؤال الحارث بن هشام.\n- **التخريج في مسلم:** لم يُبحث عنه في هذه الدفعة. **الدرجة: B** (في صحيح البخاري).\n- **مضمونه:** صورتان للوحي: مثل صلصلة الجرس وهي الأشد عليه، وتمثّل الملك رجلاً يكلمه. وشهادة عائشة أنه كان يتصبب عرقاً عند نزول الوحي في اليوم الشديد البرد.\n- **الموضوعات:** صفة الوحي، `T04` الصبر والتحمل.\n- **مستوى E:** النص يصف الوحي بأنه شاق عليه بدنياً. يرتبط بالحديث 5 (معالجة الشدة عند التنزيل).\n\n---\n\n## H-BKH-0003 — حديث بدء الوحي\n\nحَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، قَالَ حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ، أَنَّهَا قَالَتْ أَوَّلُ مَا بُدِئَ بِهِ رَسُولُ اللَّهِ صلى الله عليه وسلم مِنَ الْوَحْىِ الرُّؤْيَا الصَّالِحَةُ فِي النَّوْمِ، فَكَانَ لاَ يَرَى رُؤْيَا إِلاَّ جَاءَتْ مِثْلَ فَلَقِ الصُّبْحِ، ثُمَّ حُبِّبَ إِلَيْهِ الْخَلاَءُ، وَكَانَ يَخْلُو بِغَارِ حِرَاءٍ فَيَتَحَنَّثُ فِيهِ ـ وَهُوَ التَّعَبُّدُ ـ اللَّيَالِيَ ذَوَاتِ الْعَدَدِ قَبْلَ أَنْ يَنْزِعَ إِلَى أَهْلِهِ، وَيَتَزَوَّدُ لِذَلِكَ، ثُمَّ يَرْجِعُ إِلَى خَدِيجَةَ، فَيَتَزَوَّدُ لِمِثْلِهَا، حَتَّى جَاءَهُ الْحَقُّ وَهُوَ فِي غَارِ حِرَاءٍ، فَجَاءَهُ الْمَلَكُ فَقَالَ اقْرَأْ. قَالَ \" مَا أَنَا بِقَارِئٍ \". قَالَ \" فَأَخَذَنِي فَغَطَّنِي حَتَّى بَلَغَ مِنِّي الْجَهْدَ، ثُمَّ أَرْسَلَنِي فَقَالَ اقْرَأْ. قُلْتُ مَا أَنَا بِقَارِئٍ. فَأَخَذَنِي فَغَطَّنِي الثَّانِيَةَ حَتَّى بَلَغَ مِنِّي الْجَهْدَ، ثُمَّ أَرْسَلَنِي فَقَالَ اقْرَأْ. فَقُلْتُ مَا أَنَا بِقَارِئٍ. فَأَخَذَنِي فَغَطَّنِي الثَّالِثَةَ، ثُمَّ أَرْسَلَنِي فَقَالَ {اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ * خَلَقَ الإِنْسَانَ مِنْ عَلَقٍ * اقْرَأْ وَرَبُّكَ الأَكْرَمُ} \". فَرَجَعَ بِهَا رَسُولُ اللَّهِ صلى الله عليه وسلم يَرْجُفُ فُؤَادُهُ، فَدَخَلَ عَلَى خَدِيجَةَ بِنْتِ خُوَيْلِدٍ رضى الله عنها فَقَالَ \" زَمِّلُونِي زَمِّلُونِي \". فَزَمَّلُوهُ حَتَّى ذَهَبَ عَنْهُ الرَّوْعُ، فَقَالَ لِخَدِيجَةَ وَأَخْبَرَهَا الْخَبَرَ \" لَقَدْ خَشِيتُ عَلَى نَفْسِي \". فَقَالَتْ خَدِيجَةُ كَلاَّ وَاللَّهِ مَا يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ، وَتَحْمِلُ الْكَلَّ، وَتَكْسِبُ الْمَعْدُومَ، وَتَقْرِي الضَّيْفَ، وَتُعِينُ عَلَى نَوَائِبِ الْحَقِّ. فَانْطَلَقَتْ بِهِ خَدِيجَةُ حَتَّى أَتَتْ بِهِ وَرَقَةَ بْنَ نَوْفَلِ بْنِ أَسَدِ بْنِ عَبْدِ الْعُزَّى ابْنَ عَمِّ خَدِيجَةَ ـ وَكَانَ امْرَأً تَنَصَّرَ فِي الْجَاهِلِيَّةِ، وَكَانَ يَكْتُبُ الْكِتَابَ الْعِبْرَانِيَّ، فَيَكْتُبُ مِنَ الإِنْجِيلِ بِالْعِبْرَانِيَّةِ مَا شَاءَ اللَّهُ أَنْ يَكْتُبَ، وَكَانَ شَيْخًا كَبِيرًا قَدْ عَمِيَ ـ فَقَالَتْ لَهُ خَدِيجَةُ يَا ابْنَ عَمِّ اسْمَعْ مِنَ ابْنِ أَخِيكَ. فَقَالَ لَهُ وَرَقَةُ يَا ابْنَ أَخِي مَاذَا تَرَى فَأَخْبَرَهُ رَسُولُ اللَّهِ صلى الله عليه وسلم خَبَرَ مَا رَأَى. فَقَالَ لَهُ وَرَقَةُ هَذَا النَّامُوسُ الَّذِي نَزَّلَ اللَّهُ عَلَى مُوسَى صلى الله عليه وسلم يَا لَيْتَنِي فِيهَا جَذَعًا، لَيْتَنِي أَكُونُ حَيًّا إِذْ يُخْرِجُكَ قَوْمُكَ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" أَوَمُخْرِجِيَّ هُمْ \". قَالَ نَعَمْ، لَمْ يَأْتِ رَجُلٌ قَطُّ بِمِثْلِ مَا جِئْتَ بِهِ إِلاَّ عُودِيَ، وَإِنْ يُدْرِكْنِي يَوْمُكَ أَنْصُرْكَ نَصْرًا مُؤَزَّرًا. ثُمَّ لَمْ يَنْشَبْ وَرَقَةُ أَنْ تُوُفِّيَ وَفَتَرَ الْوَحْىُ.\n\n- **الراوي:** عائشة رضي الله عنها. **التخريج:** مسلم 160. **الدرجة: B** (متفق عليه).\n- **مضمونه بالتسلسل:**\n  1. أول ما بدئ به الرؤيا الصالحة في النوم، تقع كما رآها.\n  2. حُبب إليه الخلاء، فكان يتعبد في غار حراء الليالي ذوات العدد، ويرجع إلى خديجة فيتزود.\n  3. جاءه الملك وهو في الغار فقال «اقرأ» ثلاثاً، وغطّه في كل مرة، ثم أقرأه أول سورة العلق إلى «اقرأ وربك الأكرم».\n  4. رجع يرجف فؤاده، فقال لخديجة «زملوني»، ثم أخبرها وقال: «لقد خشيت على نفسي».\n  5. ردت خديجة بالنفي القاطع واستدلت بأخلاقه: صلة الرحم، وحمل الكَلّ، وكسب المعدوم، وقرى الضيف، والإعانة على نوائب الحق.\n  6. ذهبت به إلى ابن عمها ورقة بن نوفل، فأخبره أنه الناموس الذي نزل على موسى، وأن قومه سيخرجونه، فتعجب ﷺ: «أوَمخرجيّ هم؟».\n  7. توفي ورقة بعد قليل، وفتر الوحي.\n- **الأحداث المستخرجة:** `E-S02-001` إلى `E-S02-006` في قسم السيرة.\n- **الموضوعات:** `T16` الخوف والقلق، `T19` الحياة الزوجية، `T06` الكرم، `T07` الصدق والأمانة، `C01` الزوجات.\n- **الفروق مع الرواية 6982:** مسجلة في قسم الخلاف (`SD-007` و`SD-008` و`SD-009`).\n\n---\n\n## H-BKH-0004 — فترة الوحي ونزول المدثر\n\nقَالَ ابْنُ شِهَابٍ وَأَخْبَرَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ، أَنَّ جَابِرَ بْنَ عَبْدِ اللَّهِ الأَنْصَارِيَّ، قَالَ ـ وَهُوَ يُحَدِّثُ عَنْ فَتْرَةِ الْوَحْىِ، فَقَالَ ـ فِي حَدِيثِهِ \" بَيْنَا أَنَا أَمْشِي، إِذْ سَمِعْتُ صَوْتًا، مِنَ السَّمَاءِ، فَرَفَعْتُ بَصَرِي فَإِذَا الْمَلَكُ الَّذِي جَاءَنِي بِحِرَاءٍ جَالِسٌ عَلَى كُرْسِيٍّ بَيْنَ السَّمَاءِ وَالأَرْضِ، فَرُعِبْتُ مِنْهُ، فَرَجَعْتُ فَقُلْتُ زَمِّلُونِي. فَأَنْزَلَ اللَّهُ تَعَالَى {يَا أَيُّهَا الْمُدَّثِّرُ * قُمْ فَأَنْذِرْ} إِلَى قَوْلِهِ {وَالرُّجْزَ فَاهْجُرْ} فَحَمِيَ الْوَحْىُ وَتَتَابَعَ \". تَابَعَهُ عَبْدُ اللَّهِ بْنُ يُوسُفَ وَأَبُو صَالِحٍ. وَتَابَعَهُ هِلاَلُ بْنُ رَدَّادٍ عَنِ الزُّهْرِيِّ. وَقَالَ يُونُسُ وَمَعْمَرٌ \" بَوَادِرُهُ \".\n\n- **الراوي:** جابر بن عبد الله رضي الله عنهما (من طريق ابن شهاب عن أبي سلمة، متصلاً بإسناد الحديث السابق). **التخريج:** مسلم 161. **الدرجة: B** (متفق عليه).\n- **مضمونه:** بعد فترة الوحي رأى الملك الذي جاءه بحراء جالساً على كرسي بين السماء والأرض، فرعب منه ورجع يقول «زملوني»، فنزلت «يا أيها المدثر» إلى «والرجز فاهجر»، فحمي الوحي وتتابع.\n- **ملاحظة على اللفظ:** في آخر الحديث تنبيه البخاري نفسه على أن يونس ومعمراً رويا «بوادره» بدل «فؤاده» في الحديث السابق.\n- **الآيات:** 74:1–5.\n- **الحدث:** `E-S02-007`.\n- **الموضوعات:** `T16` الخوف، `T04` الصبر.\n\n---\n\n## H-BKH-0005 — «لا تحرك به لسانك»\n\nحَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، قَالَ حَدَّثَنَا أَبُو عَوَانَةَ، قَالَ حَدَّثَنَا مُوسَى بْنُ أَبِي عَائِشَةَ، قَالَ حَدَّثَنَا سَعِيدُ بْنُ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، فِي قَوْلِهِ تَعَالَى {لاَ تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِ} قَالَ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُعَالِجُ مِنَ التَّنْزِيلِ شِدَّةً، وَكَانَ مِمَّا يُحَرِّكُ شَفَتَيْهِ ـ فَقَالَ ابْنُ عَبَّاسٍ فَأَنَا أُحَرِّكُهُمَا لَكُمْ كَمَا كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُحَرِّكُهُمَا. وَقَالَ سَعِيدٌ أَنَا أُحَرِّكُهُمَا كَمَا رَأَيْتُ ابْنَ عَبَّاسٍ يُحَرِّكُهُمَا. فَحَرَّكَ شَفَتَيْهِ ـ فَأَنْزَلَ اللَّهُ تَعَالَى {لاَ تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِ* إِنَّ عَلَيْنَا جَمْعَهُ وَقُرْآنَهُ} قَالَ جَمْعُهُ لَهُ فِي صَدْرِكَ، وَتَقْرَأَهُ {فَإِذَا قَرَأْنَاهُ فَاتَّبِعْ قُرْآنَهُ} قَالَ فَاسْتَمِعْ لَهُ وَأَنْصِتْ {ثُمَّ إِنَّ عَلَيْنَا بَيَانَهُ} ثُمَّ إِنَّ عَلَيْنَا أَنْ تَقْرَأَهُ. فَكَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم بَعْدَ ذَلِكَ إِذَا أَتَاهُ جِبْرِيلُ اسْتَمَعَ، فَإِذَا انْطَلَقَ جِبْرِيلُ قَرَأَهُ النَّبِيُّ صلى الله عليه وسلم كَمَا قَرَأَهُ.\n\n- **الراوي:** ابن عباس رضي الله عنهما. **التخريج:** مسلم 448. **الدرجة: B** (متفق عليه).\n- **مضمونه:** كان يعالج من التنزيل شدة ويحرك شفتيه استعجالاً لحفظه، فنزلت 75:16–19: الله يتكفل بجمعه في صدره وبيانه، وعليه أن يستمع وينصت. فكان بعد ذلك إذا أتاه جبريل استمع، فإذا انطلق قرأه كما أقرأه.\n- **الآيات:** 75:16–19.\n- **الموضوعات:** `T26` الاستماع والإنصات، `T04` الصبر.\n- **مستوى E — ملاحظة:** هذا أوضح نص وقفنا عليه حتى الآن في «أدب الاستماع» عند النبي ﷺ: تعليم إلهي بأن الاستماع الكامل يسبق الترديد. يُبنى عليه مع أدلة أخرى عند دراسة `T26`، وهو الآن **دليل واحد**.\n\n---\n\n## H-BKH-0006 — أجود الناس، وأجود ما يكون في رمضان\n\nحَدَّثَنَا عَبْدَانُ، قَالَ أَخْبَرَنَا عَبْدُ اللَّهِ، قَالَ أَخْبَرَنَا يُونُسُ، عَنِ الزُّهْرِيِّ، ح وَحَدَّثَنَا بِشْرُ بْنُ مُحَمَّدٍ، قَالَ أَخْبَرَنَا عَبْدُ اللَّهِ، قَالَ أَخْبَرَنَا يُونُسُ، وَمَعْمَرٌ، عَنِ الزُّهْرِيِّ، نَحْوَهُ قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم أَجْوَدَ النَّاسِ، وَكَانَ أَجْوَدُ مَا يَكُونُ فِي رَمَضَانَ حِينَ يَلْقَاهُ جِبْرِيلُ، وَكَانَ يَلْقَاهُ فِي كُلِّ لَيْلَةٍ مِنْ رَمَضَانَ فَيُدَارِسُهُ الْقُرْآنَ، فَلَرَسُولُ اللَّهِ صلى الله عليه وسلم أَجْوَدُ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ.\n\n- **الراوي:** ابن عباس رضي الله عنهما. **التخريج:** مسلم 2308. **الدرجة: B** (متفق عليه).\n- **مواضع أخرى في البخاري (وُثق وجودها ورقمها، ولم يُقرأ نصها كاملاً):** 1902، 3220، 3554.\n- **مضمونه:** كان أجود الناس، وأجود ما يكون في رمضان حين يلقاه جبريل كل ليلة فيدارسه القرآن، فكان أجود بالخير من الريح المرسلة.\n- **الموضوعات:** `T06` الكرم، `T25` العبادة والحياة.\n- **مستوى E — ملاحظة:** النص يربط زيادة الجود بمدارسة القرآن في رمضان. الربط ملاحظ في النص نفسه، وتفسيره عند الشراح لم يُقرأ بعد.\n\n---\n\n## H-BKH-0007 — حديث هرقل وأبي سفيان\n\nحَدَّثَنَا أَبُو الْيَمَانِ الْحَكَمُ بْنُ نَافِعٍ، قَالَ أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ بْنِ عُتْبَةَ بْنِ مَسْعُودٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عَبَّاسٍ، أَخْبَرَهُ أَنَّ أَبَا سُفْيَانَ بْنَ حَرْبٍ أَخْبَرَهُ أَنَّ هِرَقْلَ أَرْسَلَ إِلَيْهِ فِي رَكْبٍ مِنْ قُرَيْشٍ ـ وَكَانُوا تُجَّارًا بِالشَّأْمِ ـ فِي الْمُدَّةِ الَّتِي كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم مَادَّ فِيهَا أَبَا سُفْيَانَ وَكُفَّارَ قُرَيْشٍ، فَأَتَوْهُ وَهُمْ بِإِيلِيَاءَ فَدَعَاهُمْ فِي مَجْلِسِهِ، وَحَوْلَهُ عُظَمَاءُ الرُّومِ ثُمَّ دَعَاهُمْ وَدَعَا بِتَرْجُمَانِهِ فَقَالَ أَيُّكُمْ أَقْرَبُ نَسَبًا بِهَذَا الرَّجُلِ الَّذِي يَزْعُمُ أَنَّهُ نَبِيٌّ فَقَالَ أَبُو سُفْيَانَ فَقُلْتُ أَنَا أَقْرَبُهُمْ نَسَبًا. فَقَالَ أَدْنُوهُ مِنِّي، وَقَرِّبُوا أَصْحَابَهُ، فَاجْعَلُوهُمْ عِنْدَ ظَهْرِهِ. ثُمَّ قَالَ لِتَرْجُمَانِهِ قُلْ لَهُمْ إِنِّي سَائِلٌ هَذَا عَنْ هَذَا الرَّجُلِ، فَإِنْ كَذَبَنِي فَكَذِّبُوهُ. فَوَاللَّهِ لَوْلاَ الْحَيَاءُ مِنْ أَنْ يَأْثِرُوا عَلَىَّ كَذِبًا لَكَذَبْتُ عَنْهُ، ثُمَّ كَانَ أَوَّلَ مَا سَأَلَنِي عَنْهُ أَنْ قَالَ كَيْفَ نَسَبُهُ فِيكُمْ قُلْتُ هُوَ فِينَا ذُو نَسَبٍ. قَالَ فَهَلْ قَالَ هَذَا الْقَوْلَ مِنْكُمْ أَحَدٌ قَطُّ قَبْلَهُ قُلْتُ لاَ. قَالَ فَهَلْ كَانَ مِنْ آبَائِهِ مِنْ مَلِكٍ قُلْتُ لاَ. قَالَ فَأَشْرَافُ النَّاسِ يَتَّبِعُونَهُ أَمْ ضُعَفَاؤُهُمْ فَقُلْتُ بَلْ ضُعَفَاؤُهُمْ. قَالَ أَيَزِيدُونَ أَمْ يَنْقُصُونَ قُلْتُ بَلْ يَزِيدُونَ. قَالَ فَهَلْ يَرْتَدُّ أَحَدٌ مِنْهُمْ سَخْطَةً لِدِينِهِ بَعْدَ أَنْ يَدْخُلَ فِيهِ قُلْتُ لاَ. قَالَ فَهَلْ كُنْتُمْ تَتَّهِمُونَهُ بِالْكَذِبِ قَبْلَ أَنْ يَقُولَ مَا قَالَ قُلْتُ لاَ. قَالَ فَهَلْ يَغْدِرُ قُلْتُ لاَ، وَنَحْنُ مِنْهُ فِي مُدَّةٍ لاَ نَدْرِي مَا هُوَ فَاعِلٌ فِيهَا. قَالَ وَلَمْ تُمْكِنِّي كَلِمَةٌ أُدْخِلُ فِيهَا شَيْئًا غَيْرُ هَذِهِ الْكَلِمَةِ. قَالَ فَهَلْ قَاتَلْتُمُوهُ قُلْتُ نَعَمْ. قَالَ فَكَيْفَ كَانَ قِتَالُكُمْ إِيَّاهُ قُلْتُ الْحَرْبُ بَيْنَنَا وَبَيْنَهُ سِجَالٌ، يَنَالُ مِنَّا وَنَنَالُ مِنْهُ. قَالَ مَاذَا يَأْمُرُكُمْ قُلْتُ يَقُولُ اعْبُدُوا اللَّهَ وَحْدَهُ، وَلاَ تُشْرِكُوا بِهِ شَيْئًا، وَاتْرُكُوا مَا يَقُولُ آبَاؤُكُمْ، وَيَأْمُرُنَا بِالصَّلاَةِ وَالصِّدْقِ وَالْعَفَافِ وَالصِّلَةِ. فَقَالَ لِلتَّرْجُمَانِ قُلْ لَهُ سَأَلْتُكَ عَنْ نَسَبِهِ، فَذَكَرْتَ أَنَّهُ فِيكُمْ ذُو نَسَبٍ، فَكَذَلِكَ الرُّسُلُ تُبْعَثُ فِي نَسَبِ قَوْمِهَا، وَسَأَلْتُكَ هَلْ قَالَ أَحَدٌ مِنْكُمْ هَذَا الْقَوْلَ فَذَكَرْتَ أَنْ لاَ، فَقُلْتُ لَوْ كَانَ أَحَدٌ قَالَ هَذَا الْقَوْلَ قَبْلَهُ لَقُلْتُ رَجُلٌ يَأْتَسِي بِقَوْلٍ قِيلَ قَبْلَهُ، وَسَأَلْتُكَ هَلْ كَانَ مِنْ آبَائِهِ مِنْ مَلِكٍ فَذَكَرْتَ أَنْ لاَ، قُلْتُ فَلَوْ كَانَ مِنْ آبَائِهِ مِنْ مَلِكٍ قُلْتُ رَجُلٌ يَطْلُبُ مُلْكَ أَبِيهِ، وَسَأَلْتُكَ هَلْ كُنْتُمْ تَتَّهِمُونَهُ بِالْكَذِبِ قَبْلَ أَنْ يَقُولَ مَا قَالَ فَذَكَرْتَ أَنْ لاَ، فَقَدْ أَعْرِفُ أَنَّهُ لَمْ يَكُنْ لِيَذَرَ الْكَذِبَ عَلَى النَّاسِ وَيَكْذِبَ عَلَى اللَّهِ، وَسَأَلْتُكَ أَشْرَافُ النَّاسِ اتَّبَعُوهُ أَمْ ضُعَفَاؤُهُمْ فَذَكَرْتَ أَنَّ ضُعَفَاءَهُمُ اتَّبَعُوهُ، وَهُمْ أَتْبَاعُ الرُّسُلِ، وَسَأَلْتُكَ أَيَزِيدُونَ أَمْ يَنْقُصُونَ فَذَكَرْتَ أَنَّهُمْ يَزِيدُونَ، وَكَذَلِكَ أَمْرُ الإِيمَانِ حَتَّى يَتِمَّ، وَسَأَلْتُكَ أَيَرْتَدُّ أَحَدٌ سَخْطَةً لِدِينِهِ بَعْدَ أَنْ يَدْخُلَ فِيهِ فَذَكَرْتَ أَنْ لاَ، وَكَذَلِكَ الإِيمَانُ حِينَ تُخَالِطُ بَشَاشَتُهُ الْقُلُوبَ، وَسَأَلْتُكَ هَلْ يَغْدِرُ فَذَكَرْتَ أَنْ لاَ، وَكَذَلِكَ الرُّسُلُ لاَ تَغْدِرُ، وَسَأَلْتُكَ بِمَا يَأْمُرُكُمْ، فَذَكَرْتَ أَنَّهُ يَأْمُرُكُمْ أَنْ تَعْبُدُوا اللَّهَ، وَلاَ تُشْرِكُوا بِهِ شَيْئًا، وَيَنْهَاكُمْ عَنْ عِبَادَةِ الأَوْثَانِ، وَيَأْمُرُكُمْ بِالصَّلاَةِ وَالصِّدْقِ وَالْعَفَافِ. فَإِنْ كَانَ مَا تَقُولُ حَقًّا فَسَيَمْلِكُ مَوْضِعَ قَدَمَىَّ هَاتَيْنِ، وَقَدْ كُنْتُ أَعْلَمُ أَنَّهُ خَارِجٌ، لَمْ أَكُنْ أَظُنُّ أَنَّهُ مِنْكُمْ، فَلَوْ أَنِّي أَعْلَمُ أَنِّي أَخْلُصُ إِلَيْهِ لَتَجَشَّمْتُ لِقَاءَهُ، وَلَوْ كُنْتُ عِنْدَهُ لَغَسَلْتُ عَنْ قَدَمِهِ. ثُمَّ دَعَا بِكِتَابِ رَسُولِ اللَّهِ صلى الله عليه وسلم الَّذِي بَعَثَ بِهِ دِحْيَةُ إِلَى عَظِيمِ بُصْرَى، فَدَفَعَهُ إِلَى هِرَقْلَ فَقَرَأَهُ فَإِذَا فِيهِ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ. مِنْ مُحَمَّدٍ عَبْدِ اللَّهِ وَرَسُولِهِ إِلَى هِرَقْلَ عَظِيمِ الرُّومِ. سَلاَمٌ عَلَى مَنِ اتَّبَعَ الْهُدَى، أَمَّا بَعْدُ فَإِنِّي أَدْعُوكَ بِدِعَايَةِ الإِسْلاَمِ، أَسْلِمْ تَسْلَمْ، يُؤْتِكَ اللَّهُ أَجْرَكَ مَرَّتَيْنِ، فَإِنْ تَوَلَّيْتَ فَإِنَّ عَلَيْكَ إِثْمَ الأَرِيسِيِّينَ وَ{يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَى كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ أَنْ لاَ نَعْبُدَ إِلاَّ اللَّهَ وَلاَ نُشْرِكَ بِهِ شَيْئًا وَلاَ يَتَّخِذَ بَعْضُنَا بَعْضًا أَرْبَابًا مِنْ دُونِ اللَّهِ فَإِنْ تَوَلَّوْا فَقُولُوا اشْهَدُوا بِأَنَّا مُسْلِمُونَ} قَالَ أَبُو سُفْيَانَ فَلَمَّا قَالَ مَا قَالَ، وَفَرَغَ مِنْ قِرَاءَةِ الْكِتَابِ كَثُرَ عِنْدَهُ الصَّخَبُ، وَارْتَفَعَتِ الأَصْوَاتُ وَأُخْرِجْنَا، فَقُلْتُ لأَصْحَابِي حِينَ أُخْرِجْنَا لَقَدْ أَمِرَ أَمْرُ ابْنِ أَبِي كَبْشَةَ، إِنَّهُ يَخَافُهُ مَلِكُ بَنِي الأَصْفَرِ. فَمَا زِلْتُ مُوقِنًا أَنَّهُ سَيَظْهَرُ حَتَّى أَدْخَلَ اللَّهُ عَلَىَّ الإِسْلاَمَ. وَكَانَ ابْنُ النَّاظُورِ صَاحِبُ إِيلِيَاءَ وَهِرَقْلَ سُقُفًّا عَلَى نَصَارَى الشَّأْمِ، يُحَدِّثُ أَنَّ هِرَقْلَ حِينَ قَدِمَ إِيلِيَاءَ أَصْبَحَ يَوْمًا خَبِيثَ النَّفْسِ، فَقَالَ بَعْضُ بَطَارِقَتِهِ قَدِ اسْتَنْكَرْنَا هَيْئَتَكَ. قَالَ ابْنُ النَّاظُورِ وَكَانَ هِرَقْلُ حَزَّاءً يَنْظُرُ فِي النُّجُومِ، فَقَالَ لَهُمْ حِينَ سَأَلُوهُ إِنِّي رَأَيْتُ اللَّيْلَةَ حِينَ نَظَرْتُ فِي النُّجُومِ مَلِكَ الْخِتَانِ قَدْ ظَهَرَ، فَمَنْ يَخْتَتِنُ مِنْ هَذِهِ الأُمَّةِ قَالُوا لَيْسَ يَخْتَتِنُ إِلاَّ الْيَهُودُ فَلاَ يُهِمَّنَّكَ شَأْنُهُمْ وَاكْتُبْ إِلَى مَدَايِنِ مُلْكِكَ، فَيَقْتُلُوا مَنْ فِيهِمْ مِنَ الْيَهُودِ. فَبَيْنَمَا هُمْ عَلَى أَمْرِهِمْ أُتِيَ هِرَقْلُ بِرَجُلٍ أَرْسَلَ بِهِ مَلِكُ غَسَّانَ، يُخْبِرُ عَنْ خَبَرِ رَسُولِ اللَّهِ صلى الله عليه وسلم فَلَمَّا اسْتَخْبَرَهُ هِرَقْلُ قَالَ اذْهَبُوا فَانْظُرُوا أَمُخْتَتِنٌ هُوَ أَمْ لاَ. فَنَظَرُوا إِلَيْهِ، فَحَدَّثُوهُ أَنَّهُ مُخْتَتِنٌ، وَسَأَلَهُ عَنِ الْعَرَبِ فَقَالَ هُمْ يَخْتَتِنُونَ. فَقَالَ هِرَقْلُ هَذَا مَلِكُ هَذِهِ الأُمَّةِ قَدْ ظَهَرَ. ثُمَّ كَتَبَ هِرَقْلُ إِلَى صَاحِبٍ لَهُ بِرُومِيَةَ، وَكَانَ نَظِيرَهُ فِي الْعِلْمِ، وَسَارَ هِرَقْلُ إِلَى حِمْصَ، فَلَمْ يَرِمْ حِمْصَ حَتَّى أَتَاهُ كِتَابٌ مِنْ صَاحِبِهِ يُوَافِقُ رَأْىَ هِرَقْلَ عَلَى خُرُوجِ النَّبِيِّ صلى الله عليه وسلم وَأَنَّهُ نَبِيٌّ، فَأَذِنَ هِرَقْلُ لِعُظَمَاءِ الرُّومِ فِي دَسْكَرَةٍ لَهُ بِحِمْصَ ثُمَّ أَمَرَ بِأَبْوَابِهَا فَغُلِّقَتْ، ثُمَّ اطَّلَعَ فَقَالَ يَا مَعْشَرَ الرُّومِ، هَلْ لَكُمْ فِي الْفَلاَحِ وَالرُّشْدِ وَأَنْ يَثْبُتَ مُلْكُكُمْ فَتُبَايِعُوا هَذَا النَّبِيَّ، فَحَاصُوا حَيْصَةَ حُمُرِ الْوَحْشِ إِلَى الأَبْوَابِ، فَوَجَدُوهَا قَدْ غُلِّقَتْ، فَلَمَّا رَأَى هِرَقْلُ نَفْرَتَهُمْ، وَأَيِسَ مِنَ الإِيمَانِ قَالَ رُدُّوهُمْ عَلَىَّ. وَقَالَ إِنِّي قُلْتُ مَقَالَتِي آنِفًا أَخْتَبِرُ بِهَا شِدَّتَكُمْ عَلَى دِينِكُمْ، فَقَدْ رَأَيْتُ. فَسَجَدُوا لَهُ وَرَضُوا عَنْهُ، فَكَانَ ذَلِكَ آخِرَ شَأْنِ هِرَقْلَ. رَوَاهُ صَالِحُ بْنُ كَيْسَانَ وَيُونُسُ وَمَعْمَرٌ عَنِ الزُّهْرِيِّ.\n\n- **الراوي:** ابن عباس عن أبي سفيان بن حرب رضي الله عنهم. **التخريج:** مسلم 1773. **الدرجة: B** (متفق عليه).\n- **زمن الحدث بنص الحديث:** «في المدة التي كان رسول الله ﷺ مادّ فيها أبا سفيان وكفار قريش»، أي زمن الهدنة. تحديد السنة لم يُوثق بعد (فجوة بحثية).\n- **عناصره:**\n  1. **شهادة الخصم:** أبو سفيان، وهو يومئذ على الشرك، شهد أمام هرقل بأنهم ما كانوا يتهمونه بالكذب قبل النبوة، وأنه لا يغدر، وأن أتباعه يزيدون ولا يرتد منهم أحد سخطة لدينه. وصرح بأنه لولا خوفه أن يؤثر عنه الكذب لكذب عليه.\n  2. **مضمون الدعوة على لسان خصمها:** «يقول: اعبدوا الله وحده ولا تشركوا به شيئاً، واتركوا ما يقول آباؤكم، ويأمرنا بالصلاة والصدق والعفاف والصلة».\n  3. **نص الكتاب النبوي إلى هرقل:** يبدأ بالبسملة، ثم «من محمد عبد الله ورسوله إلى هرقل عظيم الروم»، ثم «سلام على من اتبع الهدى»، ثم دعوة موجزة «أسلم تسلم يؤتك الله أجرك مرتين»، ثم تحميله إثم رعيته إن تولى، ثم آية آل عمران 3:64 «تعالوا إلى كلمة سواء».\n  4. **ما بعد الكتاب:** خبر ابن الناظور عن هرقل وأهل مملكته. هذا الجزء خبر عن هرقل لا عن النبي ﷺ، وكلام الشراح على اتصاله لم يُقرأ بعد.\n- **الحدث:** `E-S07-001`.\n- **الموضوعات:** `T07` الصدق والأمانة، `T18` القيادة، `S07` العلاقات مع الدول، `C09` أهل الكتاب.\n\n---\n\n## H-BKH-6982 — رواية أخرى لحديث بدء الوحي فيها زيادة\n\nحَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ،. وَحَدَّثَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، حَدَّثَنَا مَعْمَرٌ، قَالَ الزُّهْرِيُّ فَأَخْبَرَنِي عُرْوَةُ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ أَنَّهَا قَالَتْ أَوَّلُ مَا بُدِئَ بِهِ رَسُولُ اللَّهِ صلى الله عليه وسلم مِنَ الْوَحْىِ الرُّؤْيَا الصَّادِقَةُ فِي النَّوْمِ، فَكَانَ لاَ يَرَى رُؤْيَا إِلاَّ جَاءَتْ مِثْلَ فَلَقِ الصُّبْحِ، فَكَانَ يَأْتِي حِرَاءً فَيَتَحَنَّثُ فِيهِ ـ وَهْوَ التَّعَبُّدُ ـ اللَّيَالِيَ ذَوَاتِ الْعَدَدِ، وَيَتَزَوَّدُ لِذَلِكَ ثُمَّ يَرْجِعُ إِلَى خَدِيجَةَ فَتُزَوِّدُهُ لِمِثْلِهَا، حَتَّى فَجِئَهُ الْحَقُّ وَهْوَ فِي غَارِ حِرَاءٍ فَجَاءَهُ الْمَلَكُ فِيهِ فَقَالَ اقْرَأْ. فَقَالَ لَهُ النَّبِيُّ صلى الله عليه وسلم \" فَقُلْتُ مَا أَنَا بِقَارِئٍ فَأَخَذَنِي فَغَطَّنِي حَتَّى بَلَغَ مِنِّي الْجَهْدَ ثُمَّ أَرْسَلَنِي. فَقَالَ اقْرَأْ. فَقُلْتُ مَا أَنَا بِقَارِئٍ. فَأَخَذَنِي فَغَطَّنِي الثَّانِيَةَ حَتَّى بَلَغَ مِنِّي الْجَهْدَ، ثُمَّ أَرْسَلَنِي فَقَالَ اقْرَأْ. فَقُلْتُ مَا أَنَا بِقَارِئٍ. فَغَطَّنِي الثَّالِثَةَ حَتَّى بَلَغَ مِنِّي الْجَهْدُ، ثُمَّ أَرْسَلَنِي فَقَالَ اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ \". حَتَّى بَلَغَ {مَا لَمْ يَعْلَمْ} فَرَجَعَ بِهَا تَرْجُفُ بَوَادِرُهُ حَتَّى دَخَلَ عَلَى خَدِيجَةَ فَقَالَ \" زَمِّلُونِي زَمِّلُونِي \". فَزَمَّلُوهُ حَتَّى ذَهَبَ عَنْهُ الرَّوْعُ فَقَالَ \" يَا خَدِيجَةُ مَا لِي \". وَأَخْبَرَهَا الْخَبَرَ وَقَالَ \" قَدْ خَشِيتُ عَلَى نَفْسِي \". فَقَالَتْ لَهُ كَلاَّ أَبْشِرْ، فَوَاللَّهِ لاَ يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ، وَتَصْدُقُ الْحَدِيثَ، وَتَحْمِلُ الْكَلَّ، وَتَقْرِي الضَّيْفَ، وَتُعِينُ عَلَى نَوَائِبِ الْحَقِّ. ثُمَّ انْطَلَقَتْ بِهِ خَدِيجَةُ حَتَّى أَتَتْ بِهِ وَرَقَةَ بْنَ نَوْفَلِ بْنِ أَسَدِ بْنِ عَبْدِ الْعُزَّى بْنِ قُصَىٍّ ـ وَهْوَ ابْنُ عَمِّ خَدِيجَةَ أَخُو أَبِيهَا، وَكَانَ امْرَأً تَنَصَّرَ فِي الْجَاهِلِيَّةِ، وَكَانَ يَكْتُبُ الْكِتَابَ الْعَرَبِيَّ فَيَكْتُبُ بِالْعَرَبِيَّةِ مِنَ الإِنْجِيلِ مَا شَاءَ اللَّهُ أَنْ يَكْتُبَ، وَكَانَ شَيْخًا كَبِيرًا قَدْ عَمِيَ ـ فَقَالَتْ لَهُ خَدِيجَةُ أَىِ ابْنَ عَمِّ اسْمَعْ مِنِ ابْنِ أَخِيكَ. فَقَالَ وَرَقَةُ ابْنَ أَخِي مَاذَا تَرَى فَأَخْبَرَهُ النَّبِيُّ صلى الله عليه وسلم مَا رَأَى فَقَالَ وَرَقَةُ هَذَا النَّامُوسُ الَّذِي أُنْزِلَ عَلَى مُوسَى، يَا لَيْتَنِي فِيهَا جَذَعًا أَكُونُ حَيًّا، حِينَ يُخْرِجُكَ قَوْمُكَ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" أَوَمُخْرِجِيَّ هُمْ \". فَقَالَ وَرَقَةُ نَعَمْ، لَمْ يَأْتِ رَجُلٌ قَطُّ بِمَا جِئْتَ بِهِ إِلاَّ عُودِيَ، وَإِنْ يُدْرِكْنِي يَوْمُكَ أَنْصُرْكَ نَصْرًا مُؤَزَّرًا. ثُمَّ لَمْ يَنْشَبْ وَرَقَةُ أَنْ تُوُفِّيَ، وَفَتَرَ الْوَحْىُ فَتْرَةً حَتَّى حَزِنَ النَّبِيُّ صلى الله عليه وسلم فِيمَا بَلَغَنَا حُزْنًا غَدَا مِنْهُ مِرَارًا كَىْ يَتَرَدَّى مِنْ رُءُوسِ شَوَاهِقِ الْجِبَالِ، فَكُلَّمَا أَوْفَى بِذِرْوَةِ جَبَلٍ لِكَىْ يُلْقِيَ مِنْهُ نَفْسَهُ، تَبَدَّى لَهُ جِبْرِيلُ فَقَالَ يَا مُحَمَّدُ إِنَّكَ رَسُولُ اللَّهِ حَقًّا. فَيَسْكُنُ لِذَلِكَ جَأْشُهُ وَتَقِرُّ نَفْسُهُ فَيَرْجِعُ، فَإِذَا طَالَتْ عَلَيْهِ فَتْرَةُ الْوَحْىِ غَدَا لِمِثْلِ ذَلِكَ، فَإِذَا أَوْفَى بِذِرْوَةِ جَبَلٍ تَبَدَّى لَهُ جِبْرِيلُ فَقَالَ لَهُ مِثْلَ ذَلِكَ. قَالَ ابْنُ عَبَّاسٍ {فَالِقُ الإِصْبَاحِ} ضَوْءُ الشَّمْسِ بِالنَّهَارِ، وَضَوْءُ الْقَمَرِ بِاللَّيْلِ.\n\n- **الموضع:** كتاب التعبير. **الدرجة:** الحديث المسند حتى قوله «وفتر الوحي فترة» **B**. أما ما بعد «فيما بلغنا» فحكمه في البند التالي.\n- **زيادة «فيما بلغنا» (خبر الحزن وإرادة التردي من رءوس الجبال):**\n  - **نص ابن حجر (فتح الباري، ط دار المعرفة 1379هـ، ج12 ص359–360)، مقروء من النص الكامل:** الزيادة من رواية معمر خاصة لا من رواية عقيل، وصنيع البخاري يوهم دخولها في رواية عقيل. والقائل «فيما بلغنا» هو الزهري، والمعنى أنها مما بلغه من خبر هذه القصة، «وهو من بلاغات الزهري وليس موصولاً». ونقل عن الكرماني أن هذا هو الظاهر، مع احتمال أن يكون بلغه بالإسناد المذكور. وذكر أن رواية ابن مردويه أسقطت «فيما بلغنا» فصار الكلام مدرجاً، وقال: «والأول هو المعتمد».\n  - **حكم آخر (نقل ثانوي):** نُقل عن الشيخ محمد عوامة في كتابه «من منهج الإمام مسلم في عرض الحديث المعلل» (ص34–35) أنه من بلاغات الزهري وليس موصولاً، وأن مراسيل الزهري ضعيفة عند الشافعي ويحيى القطان وابن معين. لم يُفتح الكتاب نفسه.\n  - **الدرجة: D** (بلاغ منقطع، لا يُبنى عليه مبدأ ولا وصف نفسي).\n- **فروق لفظية مع الحديث 3 (موثقة بقراءة النصين):** «الرؤيا الصادقة» هنا و«الرؤيا الصالحة» هناك؛ «ترجف بوادره» هنا و«يرجف فؤاده» هناك؛ القراءة هنا «حتى بلغ: ما لم يعلم» وهناك إلى «اقرأ وربك الأكرم»؛ وفي قول خديجة هنا «وتصدق الحديث» وليس فيه «وتكسب المعدوم»؛ وورقة هنا «يكتب الكتاب العربي... بالعربية» وهناك «العبراني... بالعبرانية». التفاصيل في قسم الخلاف.\n"}, {"code": "HKB-BKH-02", "slug": "hkb-bkh-02", "sec": "03", "title": "الأحاديث — صحيح البخاري: باب صفة النبي ﷺ وباب «تنام عينه ولا ينام قلبه» (دراسة كاملة)", "short": "البخاري: باب صفة النبي ﷺ", "md": "# الأحاديث — صحيح البخاري: باب صفة النبي ﷺ وباب «تنام عينه ولا ينام قلبه» (دراسة كاملة)\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 2 — 15 نوفمبر 2026؛ وحُدّث في الدفعة 3 بشرح ابن حجر على حديثي السدل (3558) ورواية شريك (3570)، وبحسم `SD-011`\n- **نطاق الدراسة:** كتاب المناقب، باب صفة النبي ﷺ (الأحاديث 3542–3568، وعددها 27) والباب الذي يليه (3569–3570). المجموع 29 حديثاً، قُرئت كلها.\n- **حدود الباب:** حُددت من نسخة الشاملة 1681 في مدونة OpenITI، وهي طبعة دار طوق النجاة بتحقيق محمد زهير الناصر، مصورة عن السلطانية بترقيم محمد فؤاد عبد الباقي: **ج4 ص187–191**.\n- **النص المنقول أدناه:** من مستودع hadith-api، بعد التحقق من أن أرقامه في هذا الباب تطابق ترقيم طبعة طوق النجاة.\n- **التخريج في مسلم:** بالبحث النصي، وترقيم عبد الباقي.\n- **الدرجة:** كل أحاديث الباب **B**، لأنها مسندة في صحيح البخاري. ويُذكر «متفق عليه» حيث وُجد الحديث نفسه في مسلم.\n\n---\n\n## أولاً: الصفة الخَلقية `D01`\n\n### H-BKH-3542 — شبه الحسن بالنبي ﷺ\nحَدَّثَنَا أَبُو عَاصِمٍ، عَنْ عُمَرَ بْنِ سَعِيدِ بْنِ أَبِي حُسَيْنٍ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عُقْبَةَ بْنِ الْحَارِثِ، قَالَ صَلَّى أَبُو بَكْرٍ ـ رضى الله عنه ـ الْعَصْرَ، ثُمَّ خَرَجَ يَمْشِي فَرَأَى الْحَسَنَ يَلْعَبُ مَعَ الصِّبْيَانِ، فَحَمَلَهُ عَلَى عَاتِقِهِ وَقَالَ بِأَبِي شَبِيهٌ بِالنَّبِيِّ لاَ شَبِيهٌ بِعَلِيٍّ. وَعَلِيٌّ يَضْحَكُ.\n- **مسلم:** لم يُعثر عليه بالبحث النصي.\n- **ملاحظة (E):** المشهد نفسه لا يخص النبي ﷺ، وفيه مزاح أبي بكر مع الحسن، وضحك علي رضي الله عنهم.\n\n### H-BKH-3543 و3544 — أبو جحيفة: الحسن يشبهه، وكان أبيض قد شمط\nحَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا إِسْمَاعِيلُ، عَنْ أَبِي جُحَيْفَةَ ـ رضى الله عنه ـ قَالَ رَأَيْتُ النَّبِيَّ صلى الله عليه وسلم وَكَانَ الْحَسَنُ يُشْبِهُهُ.\n\nحَدَّثَنِي عَمْرُو بْنُ عَلِيٍّ، حَدَّثَنَا ابْنُ فُضَيْلٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبِي خَالِدٍ، قَالَ سَمِعْتُ أَبَا جُحَيْفَةَ ـ رضى الله عنه ـ قَالَ رَأَيْتُ النَّبِيَّ صلى الله عليه وسلم وَكَانَ الْحَسَنُ بْنُ عَلِيٍّ ـ عَلَيْهِمَا السَّلاَمُ ـ يُشْبِهُهُ قُلْتُ لأَبِي جُحَيْفَةَ صِفْهُ لِي. قَالَ كَانَ أَبْيَضَ قَدْ شَمِطَ. وَأَمَرَ لَنَا النَّبِيُّ صلى الله عليه وسلم بِثَلاَثَ عَشْرَةَ قَلُوصًا قَالَ فَقُبِضَ النَّبِيُّ صلى الله عليه وسلم قَبْلَ أَنْ نَقْبِضَهَا.\n- **زيادة مهمة في 3544:** «وأمر لنا النبي ﷺ بثلاث عشرة قلوصاً، فقُبض النبي ﷺ قبل أن نقبضها». شاهد على عطاء أمر به في آخر حياته `T06`.\n\n### H-BKH-3545 و3546 — بياض في العنفقة\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ رَجَاءٍ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ وَهْبٍ أَبِي جُحَيْفَةَ السُّوَائِيِّ، قَالَ رَأَيْتُ النَّبِيَّ صلى الله عليه وسلم وَرَأَيْتُ بَيَاضًا مِنْ تَحْتِ شَفَتِهِ السُّفْلَى الْعَنْفَقَةَ.\n\nحَدَّثَنَا عِصَامُ بْنُ خَالِدٍ، حَدَّثَنَا حَرِيزُ بْنُ عُثْمَانَ، أَنَّهُ سَأَلَ عَبْدَ اللَّهِ بْنَ بُسْرٍ صَاحِبَ النَّبِيِّ صلى الله عليه وسلم قَالَ أَرَأَيْتَ النَّبِيَّ صلى الله عليه وسلم كَانَ شَيْخًا قَالَ كَانَ فِي عَنْفَقَتِهِ شَعَرَاتٌ بِيضٌ.\n\n### H-BKH-3547 و3548 — وصف أنس، ومدة الإقامة بمكة\nحَدَّثَنِي ابْنُ بُكَيْرٍ، قَالَ حَدَّثَنِي اللَّيْثُ، عَنْ خَالِدٍ، عَنْ سَعِيدِ بْنِ أَبِي هِلاَلٍ، عَنْ رَبِيعَةَ بْنِ أَبِي عَبْدِ الرَّحْمَنِ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يَصِفُ النَّبِيَّ صلى الله عليه وسلم قَالَ كَانَ رَبْعَةً مِنَ الْقَوْمِ، لَيْسَ بِالطَّوِيلِ وَلاَ بِالْقَصِيرِ، أَزْهَرَ اللَّوْنِ لَيْسَ بِأَبْيَضَ أَمْهَقَ وَلاَ آدَمَ، لَيْسَ بِجَعْدٍ قَطَطٍ وَلاَ سَبْطٍ رَجِلٍ، أُنْزِلَ عَلَيْهِ وَهْوَ ابْنُ أَرْبَعِينَ، فَلَبِثَ بِمَكَّةَ عَشْرَ سِنِينَ يُنْزَلُ عَلَيْهِ وَبِالْمَدِينَةِ عَشْرَ سِنِينَ، وَلَيْسَ فِي رَأْسِهِ وَلِحْيَتِهِ عِشْرُونَ شَعَرَةً بَيْضَاءَ. قَالَ رَبِيعَةُ فَرَأَيْتُ شَعَرًا مِنْ شَعَرِهِ، فَإِذَا هُوَ أَحْمَرُ فَسَأَلْتُ فَقِيلَ احْمَرَّ مِنَ الطِّيبِ.\n\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكُ بْنُ أَنَسٍ، عَنْ رَبِيعَةَ بْنِ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضى الله عنه ـ أَنَّهُ سَمِعَهُ يَقُولُ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم لَيْسَ بِالطَّوِيلِ الْبَائِنِ وَلاَ بِالْقَصِيرِ، وَلاَ بِالأَبْيَضِ الأَمْهَقِ، وَلَيْسَ بِالآدَمِ وَلَيْسَ بِالْجَعْدِ الْقَطَطِ وَلاَ بِالسَّبْطِ، بَعَثَهُ اللَّهُ عَلَى رَأْسِ أَرْبَعِينَ سَنَةً، فَأَقَامَ بِمَكَّةَ عَشْرَ سِنِينَ، وَبِالْمَدِينَةِ عَشْرَ سِنِينَ، فَتَوَفَّاهُ اللَّهُ، وَلَيْسَ فِي رَأْسِهِ وَلِحْيَتِهِ عِشْرُونَ شَعْرَةً بَيْضَاءَ.\n- **مسلم:** 2347 (متفق عليه).\n- **تنبيه مهم:** في هاتين الروايتين عن أنس أنه أقام بمكة بعد البعثة **عشر سنين**، بينما في البخاري 3902 عن ابن عباس **ثلاث عشرة سنة**. الخلاف مسجل في `SD-011`.\n\n### H-BKH-3549 — أحسن الناس وجهاً وخلقاً\nحَدَّثَنَا أَحْمَدُ بْنُ سَعِيدٍ أَبُو عَبْدِ اللَّهِ، حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، قَالَ سَمِعْتُ الْبَرَاءَ، يَقُولُ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم أَحْسَنَ النَّاسِ وَجْهًا وَأَحْسَنَهُ خَلْقًا، لَيْسَ بِالطَّوِيلِ الْبَائِنِ وَلاَ بِالْقَصِيرِ.\n- مدخل سابق في `HKB-CHR-01`.\n\n### H-BKH-3550 — هل خضب؟\nحَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا هَمَّامٌ، عَنْ قَتَادَةَ، قَالَ سَأَلْتُ أَنَسًا هَلْ خَضَبَ النَّبِيُّ صلى الله عليه وسلم قَالَ لاَ، إِنَّمَا كَانَ شَىْءٌ فِي صُدْغَيْهِ.\n\n### H-BKH-3551 — مربوع بعيد ما بين المنكبين\nحَدَّثَنَا حَفْصُ بْنُ عُمَرَ، حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ ـ رضى الله عنهما ـ قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم مَرْبُوعًا، بَعِيدَ مَا بَيْنَ الْمَنْكِبَيْنِ، لَهُ شَعَرٌ يَبْلُغُ شَحْمَةَ أُذُنِهِ، رَأَيْتُهُ فِي حُلَّةٍ حَمْرَاءَ، لَمْ أَرَ شَيْئًا قَطُّ أَحْسَنَ مِنْهُ. قَالَ يُوسُفُ بْنُ أَبِي إِسْحَاقَ عَنْ أَبِيهِ إِلَى مَنْكِبَيْهِ.\n- **مسلم:** 2337 (متفق عليه).\n\n### H-BKH-3552 — وجهه مثل القمر\nحَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا زُهَيْرٌ، عَنْ أَبِي إِسْحَاقَ، قَالَ سُئِلَ الْبَرَاءُ أَكَانَ وَجْهُ النَّبِيِّ صلى الله عليه وسلم مِثْلَ السَّيْفِ قَالَ لاَ بَلْ مِثْلَ الْقَمَرِ.\n- **شاهد في مسلم 2344** عن جابر بن سمرة: «لا، بل كان مثل الشمس والقمر». حديث آخر في المعنى نفسه، لا تخريج للحديث ذاته.\n\n### H-BKH-3553 — الماء والتبرك بيده\nحَدَّثَنَا الْحَسَنُ بْنُ مَنْصُورٍ أَبُو عَلِيٍّ، حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ الأَعْوَرُ، بِالْمَصِّيصَةِ حَدَّثَنَا شُعْبَةُ، عَنِ الْحَكَمِ، قَالَ سَمِعْتُ أَبَا جُحَيْفَةَ، قَالَ خَرَجَ رَسُولُ اللَّهِ صلى الله عليه وسلم بِالْهَاجِرَةِ إِلَى الْبَطْحَاءِ فَتَوَضَّأَ ثُمَّ صَلَّى الظُّهْرَ رَكْعَتَيْنِ، وَالْعَصْرَ رَكْعَتَيْنِ، وَبَيْنَ يَدَيْهِ عَنَزَةٌ. {قَالَ شُعْبَةُ} وَزَادَ فِيهِ عَوْنٌ عَنْ أَبِيهِ أَبِي جُحَيْفَةَ قَالَ كَانَ يَمُرُّ مِنْ وَرَائِهَا الْمَرْأَةُ، وَقَامَ النَّاسُ فَجَعَلُوا يَأْخُذُونَ يَدَيْهِ، فَيَمْسَحُونَ بِهَا وُجُوهَهُمْ، قَالَ فَأَخَذْتُ بِيَدِهِ، فَوَضَعْتُهَا عَلَى وَجْهِي، فَإِذَا هِيَ أَبْرَدُ مِنَ الثَّلْجِ، وَأَطْيَبُ رَائِحَةً مِنَ الْمِسْكِ.\n- **ملاحظة منهجية:** تبرك الصحابة بيده ووضوئه هنا وفي 3566 من المسائل التي يُبحث فيها هل هي من خصوصياته ﷺ. مسجل فجوة بحثية `RG-027`، ولا يُبنى عليه حكم عام قبل توثيق أقوال العلماء.\n\n### H-BKH-3561 — لين الكف وطيب الريح\nحَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، حَدَّثَنَا حَمَّادٌ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ مَا مَسِسْتُ حَرِيرًا وَلاَ دِيبَاجًا أَلْيَنَ مِنْ كَفِّ النَّبِيِّ صلى الله عليه وسلم، وَلاَ شَمِمْتُ رِيحًا قَطُّ أَوْ عَرْفًا قَطُّ أَطْيَبَ مِنْ رِيحِ أَوْ عَرْفِ النَّبِيِّ صلى الله عليه وسلم.\n- **مسلم:** 2330 (متفق عليه).\n\n### H-BKH-3564 و3565 — بياض الإبطين في السجود والدعاء\nحَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا بَكْرُ بْنُ مُضَرَ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنِ الأَعْرَجِ، عَنْ عَبْدِ اللَّهِ بْنِ مَالِكٍ ابْنِ بُحَيْنَةَ الأَسْدِيِّ، قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا سَجَدَ فَرَّجَ بَيْنَ يَدَيْهِ حَتَّى نَرَى إِبْطَيْهِ. قَالَ وَقَالَ ابْنُ بُكَيْرٍ حَدَّثَنَا بَكْرٌ بَيَاضَ إِبْطَيْهِ.\n\nحَدَّثَنَا عَبْدُ الأَعْلَى بْنُ حَمَّادٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ، أَنَّ أَنَسًا ـ رضى الله عنه ـ حَدَّثَهُمْ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ لاَ يَرْفَعُ يَدَيْهِ فِي شَىْءٍ مِنْ دُعَائِهِ، إِلاَّ فِي الاِسْتِسْقَاءِ، فَإِنَّهُ كَانَ يَرْفَعُ يَدَيْهِ حَتَّى يُرَى بَيَاضُ إِبْطَيْهِ. وَقَالَ أَبُو مُوسَى دَعَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَرَفَعَ يَدَيْهِ وَرَأَيْتُ بَيَاضَ إِبْطَيْهِ\n\n### H-BKH-3566 — وبيص ساقيه بالأبطح\nحَدَّثَنَا الْحَسَنُ بْنُ الصَّبَّاحِ، حَدَّثَنَا مُحَمَّدُ بْنُ سَابِقٍ، حَدَّثَنَا مَالِكُ بْنُ مِغْوَلٍ، قَالَ سَمِعْتُ عَوْنَ بْنَ أَبِي جُحَيْفَةَ، ذَكَرَ عَنْ أَبِيهِ، قَالَ دُفِعْتُ إِلَى النَّبِيِّ صلى الله عليه وسلم وَهْوَ بِالأَبْطَحِ فِي قُبَّةٍ كَانَ بِالْهَاجِرَةِ، خَرَجَ بِلاَلٌ فَنَادَى بِالصَّلاَةِ، ثُمَّ دَخَلَ فَأَخْرَجَ فَضْلَ وَضُوءِ رَسُولِ اللَّهِ صلى الله عليه وسلم، فَوَقَعَ النَّاسُ عَلَيْهِ يَأْخُذُونَ مِنْهُ، ثُمَّ دَخَلَ فَأَخْرَجَ الْعَنَزَةَ، وَخَرَجَ رَسُولُ اللَّهِ صلى الله عليه وسلم كَأَنِّي أَنْظُرُ إِلَى وَبِيصِ سَاقَيْهِ فَرَكَزَ الْعَنَزَةَ، ثُمَّ صَلَّى الظُّهْرَ رَكْعَتَيْنِ وَالْعَصْرَ رَكْعَتَيْنِ، يَمُرُّ بَيْنَ يَدَيْهِ الْحِمَارُ وَالْمَرْأَةُ.\n\n---\n\n## ثانياً: الخُلق والطباع\n\n### H-BKH-3554 — الجود في رمضان\nحَدَّثَنَا عَبْدَانُ، حَدَّثَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا يُونُسُ، عَنِ الزُّهْرِيِّ، قَالَ حَدَّثَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم أَجْوَدَ النَّاسِ، وَأَجْوَدُ مَا يَكُونُ فِي رَمَضَانَ، حِينَ يَلْقَاهُ جِبْرِيلُ، وَكَانَ جِبْرِيلُ ـ عَلَيْهِ السَّلاَمُ ـ يَلْقَاهُ فِي كُلِّ لَيْلَةٍ مِنْ رَمَضَانَ، فَيُدَارِسُهُ الْقُرْآنَ فَلَرَسُولُ اللَّهِ صلى الله عليه وسلم أَجْوَدُ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ.\n- موضع آخر لحديث `H-BKH-0006`. **مسلم:** 2308.\n\n### H-BKH-3555 و3556 — ظهور السرور في وجهه `T01`\nحَدَّثَنَا يَحْيَى، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، حَدَّثَنَا ابْنُ جُرَيْجٍ، قَالَ أَخْبَرَنِي ابْنُ شِهَابٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم دَخَلَ عَلَيْهَا مَسْرُورًا تَبْرُقُ أَسَارِيرُ وَجْهِهِ، فَقَالَ  \" أَلَمْ تَسْمَعِي مَا قَالَ الْمُدْلِجِيُّ لِزَيْدٍ وَأُسَامَةَ ـ وَرَأَى أَقْدَامَهُمَا ـ إِنَّ بَعْضَ هَذِهِ الأَقْدَامِ مِنْ بَعْضٍ \".\n\nحَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَبْدِ اللَّهِ بْنِ كَعْبٍ، أَنَّ عَبْدَ اللَّهِ بْنَ كَعْبٍ، قَالَ سَمِعْتُ كَعْبَ بْنَ مَالِكٍ، يُحَدِّثُ حِينَ تَخَلَّفَ عَنْ تَبُوكَ، قَالَ فَلَمَّا سَلَّمْتُ عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم وَهْوَ يَبْرُقُ وَجْهُهُ مِنَ السُّرُورِ، وَكَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِذَا سُرَّ اسْتَنَارَ وَجْهُهُ، حَتَّى كَأَنَّهُ قِطْعَةُ قَمَرٍ، وَكُنَّا نَعْرِفُ ذَلِكَ مِنْهُ.\n- **مسلم:** 3555 في مسلم 1459؛ و3556 جزء من حديث كعب بن مالك الطويل في مسلم، ولم يظهر رقمه في قاعدة البيانات.\n- **ملاحظة (E):** شاهدان مستقلان (عائشة، وكعب بن مالك) على أن مشاعره ﷺ كانت تظهر على وجهه، وأن الصحابة كانوا يعرفون ذلك: «وكنا نعرف ذلك منه».\n\n### H-BKH-3557 — خير القرون\nحَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا يَعْقُوبُ بْنُ عَبْدِ الرَّحْمَنِ، عَنْ عَمْرٍو، عَنْ سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ  \" بُعِثْتُ مِنْ خَيْرِ قُرُونِ بَنِي آدَمَ قَرْنًا فَقَرْنًا، حَتَّى كُنْتُ مِنَ الْقَرْنِ الَّذِي كُنْتُ فِيهِ \".\n- **مسلم:** لم يُعثر عليه بالبحث النصي.\n\n### H-BKH-3558 — موافقة أهل الكتاب فيما لم يؤمر فيه `C09` `T24`\nحَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ يَسْدِلُ شَعَرَهُ، وَكَانَ الْمُشْرِكُونَ يَفْرُقُونَ رُءُوسَهُمْ فَكَانَ أَهْلُ الْكِتَابِ يَسْدِلُونَ رُءُوسَهُمْ، وَكَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُحِبُّ مُوَافَقَةَ أَهْلِ الْكِتَابِ فِيمَا لَمْ يُؤْمَرْ فِيهِ بِشَىْءٍ، ثُمَّ فَرَقَ رَسُولُ اللَّهِ صلى الله عليه وسلم رَأْسَهُ.\n- **مسلم:** 2336 (متفق عليه).\n- **أهميته المنهجية:** النص يصرح بقاعدة: «كان يحب موافقة أهل الكتاب فيما لم يؤمر فيه بشيء»، ثم ترك ذلك بفرق شعره. هذا يتصل مباشرة بالقاعدة السابعة في تعليمات المشروع (التفريق بين العادة والتشريع)، وبمسألة مخالفة أهل الكتاب. **شرح ابن حجر (فتح الباري ج6 ص574، الدفعة 3، مقروء من الأصل):** كانت موافقتهم أحب إليه حين كان عبّاد الأوثان كثيرين، لأن أهل الكتاب في زمانه كانوا متمسكين ببقايا من شرائع الرسل، و«فيما لم يؤمر فيه بشيء» أي فيما لم يخالف شرعه. فلما أسلم غالب عبّاد الأوثان أحب حينئذ مخالفة أهل الكتاب. ونقل عن النووي أن السدل إرسال الشعر على الجبين، والفرق إلقاؤه إلى جانبي الرأس.\n\n### H-BKH-3559 — لم يكن فاحشاً ولا متفحشاً `D05` `T09`\nحَدَّثَنَا عَبْدَانُ، عَنْ أَبِي حَمْزَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي وَائِلٍ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو ـ رضى الله عنهما ـ قَالَ لَمْ يَكُنِ النَّبِيُّ صلى الله عليه وسلم فَاحِشًا وَلاَ مُتَفَحِّشًا وَكَانَ يَقُولُ  \" إِنَّ مِنْ خِيَارِكُمْ أَحْسَنَكُمْ أَخْلاَقًا \".\n- **مسلم:** 2321 (متفق عليه).\n- **فيه قول نبوي:** «إن من خياركم أحسنكم أخلاقاً».\n\n### H-BKH-3560 — الأيسر، وعدم الانتقام للنفس\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ أَنَّهَا قَالَتْ مَا خُيِّرَ رَسُولُ اللَّهِ صلى الله عليه وسلم بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا، مَا لَمْ يَكُنْ إِثْمًا، فَإِنْ كَانَ إِثْمًا كَانَ أَبْعَدَ النَّاسِ مِنْهُ، وَمَا انْتَقَمَ رَسُولُ اللَّهِ صلى الله عليه وسلم لِنَفْسِهِ، إِلاَّ أَنْ تُنْتَهَكَ حُرْمَةُ اللَّهِ فَيَنْتَقِمَ لِلَّهِ بِهَا.\n- مدخل سابق في `HKB-CHR-01`.\n\n### H-BKH-3562 — أشد حياء من العذراء، ويُعرف كرهه في وجهه `T12` `T01`\nحَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ شُعْبَةَ، عَنْ قَتَادَةَ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي عُتْبَةَ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ ـ رضى الله عنه ـ قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم أَشَدَّ حَيَاءً مِنَ الْعَذْرَاءِ فِي خِدْرِهَا.\n- **تنبيه على النص:** نسخة قاعدة البيانات أعلاه تقف عند «في خدرها». وفي طبعة طوق النجاة (ج4 ص190، مقروءة من OpenITI) بعدها رواية ثانية عن محمد بن بشار عن يحيى وابن مهدي عن شعبة مثله، وفيها: «وإذا كره شيئاً عُرف في وجهه». وفي مسلم 2320: «وكان إذا كره شيئاً عرفناه في وجهه».\n- **مسلم:** 2320 (متفق عليه).\n- **ملاحظة (E):** يجمع النص بطرقه بين شدة الحياء وبين ظهور الكره على الوجه. يتسق مع ما سبق من أن الانفعال كان يظهر على وجهه دون فحش في القول (3559).\n\n### H-BKH-3563 — ما عاب طعاماً قط `D02` `T05`\nحَدَّثَنِي عَلِيُّ بْنُ الْجَعْدِ، أَخْبَرَنَا شُعْبَةُ، عَنِ الأَعْمَشِ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ مَا عَابَ النَّبِيُّ صلى الله عليه وسلم طَعَامًا قَطُّ، إِنِ اشْتَهَاهُ أَكَلَهُ، وَإِلاَّ تَرَكَهُ.\n- **مسلم:** 2064 (متفق عليه).\n\n### H-BKH-3567 و3568 — طريقة حديثه `D05` `T26`\nحَدَّثَنِي الْحَسَنُ بْنُ صَبَّاحٍ الْبَزَّارُ، حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ ـ رضى الله عنها أَنَّ النَّبِيَّ صلى الله عليه وسلم كَانَ يُحَدِّثُ حَدِيثًا لَوْ عَدَّهُ الْعَادُّ لأَحْصَاهُ. وَقَالَ اللَّيْثُ حَدَّثَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، أَنَّهُ قَالَ أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، عَنْ عَائِشَةَ، أَنَّهَا قَالَتْ أَلاَ يُعْجِبُكَ أَبُو فُلاَنٍ جَاءَ فَجَلَسَ إِلَى جَانِبِ حُجْرَتِي يُحَدِّثُ عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم، يُسْمِعُنِي ذَلِكَ وَكُنْتُ أُسَبِّحُ فَقَامَ قَبْلَ أَنْ أَقْضِيَ سُبْحَتِي، وَلَوْ أَدْرَكْتُهُ لَرَدَدْتُ عَلَيْهِ، إِنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم لَمْ يَكُنْ يَسْرُدُ الْحَدِيثَ كَسَرْدِكُمْ.\n- **ملاحظة على النص:** نسخة قاعدة البيانات تضم تحت الرقم 3567 روايتين؛ والثانية في طبعة طوق النجاة برقم 3568، وهي تعليق عن الليث.\n- **مسلم:** 2493 (متفق عليه في المعنى).\n- **مضمونه:** كان يحدث حديثاً لو عدّه العادّ لأحصاه، ولم يكن يسرد الحديث سرداً متتابعاً.\n\n---\n\n## ثالثاً: باب «كان النبي ﷺ تنام عينه ولا ينام قلبه»\n\n### H-BKH-3569 — صلاة الليل، و«تنام عيني ولا ينام قلبي» `D06` `T25`\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ، أَنَّهُ سَأَلَ عَائِشَةَ ـ رضى الله عنها ـ كَيْفَ كَانَتْ صَلاَةُ رَسُولِ اللَّهِ صلى الله عليه وسلم فِي رَمَضَانَ قَالَتْ مَا كَانَ يَزِيدُ فِي رَمَضَانَ وَلاَ غَيْرِهِ عَلَى إِحْدَى عَشْرَةَ رَكْعَةً، يُصَلِّي أَرْبَعَ رَكَعَاتٍ فَلاَ تَسْأَلْ عَنْ حُسْنِهِنَّ وَطُولِهِنَّ، ثُمَّ يُصَلِّي أَرْبَعًا فَلاَ تَسْأَلْ عَنْ حُسْنِهِنَّ وَطُولِهِنَّ، ثُمَّ يُصَلِّي ثَلاَثًا فَقُلْتُ يَا رَسُولَ اللَّهِ تَنَامُ قَبْلَ أَنْ تُوتِرَ قَالَ  \" تَنَامُ عَيْنِي وَلاَ يَنَامُ قَلْبِي \".\n- **مسلم:** لم يُعثر عليه بالبحث النصي بلفظ «تنام عيني» (فجوة).\n- **ملاحظة منهجية:** «تنام عيني ولا ينام قلبي» وصف خاص به ﷺ، وفي 3570 تعميمه على الأنبياء. لا يُقاس عليه غيرهم.\n\n### H-BKH-3570 — رواية شريك في الإسراء\nحَدَّثَنَا إِسْمَاعِيلُ، قَالَ حَدَّثَنِي أَخِي، عَنْ سُلَيْمَانَ، عَنْ شَرِيكِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يُحَدِّثُنَا عَنْ لَيْلَةِ، أُسْرِيَ بِالنَّبِيِّ صلى الله عليه وسلم مِنْ مَسْجِدِ الْكَعْبَةِ جَاءَ ثَلاَثَةُ نَفَرٍ قَبْلَ أَنْ يُوحَى إِلَيْهِ، وَهُوَ نَائِمٌ فِي مَسْجِدِ الْحَرَامِ، فَقَالَ أَوَّلُهُمْ أَيُّهُمْ هُوَ فَقَالَ أَوْسَطُهُمْ هُوَ خَيْرُهُمْ وَقَالَ آخِرُهُمْ خُذُوا خَيْرَهُمْ. فَكَانَتْ تِلْكَ، فَلَمْ يَرَهُمْ حَتَّى جَاءُوا لَيْلَةً أُخْرَى، فِيمَا يَرَى قَلْبُهُ، وَالنَّبِيُّ صلى الله عليه وسلم نَائِمَةٌ عَيْنَاهُ وَلاَ يَنَامُ قَلْبُهُ وَكَذَلِكَ الأَنْبِيَاءُ تَنَامُ أَعْيُنُهُمْ وَلاَ تَنَامُ قُلُوبُهُمْ، فَتَوَلاَّهُ جِبْرِيلُ ثُمَّ عَرَجَ بِهِ إِلَى السَّمَاءِ.\n- **تنبيه من صحيح مسلم نفسه (مقروء بالبحث النصي):** ذكر مسلم رواية شريك عن أنس في الإسراء بعد رواية ثابت البناني، وقال عنها: «وقدّم فيه شيئاً وأخّر، وزاد ونقص» (مسلم 162).\n- **ما انتقده الأئمة (الدفعة 3):** لفظ «قبل أن يوحى إليه» أنكره الخطابي وابن حزم وعبد الحق والقاضي عياض والنووي، كما نقل ابن حجر في فتح الباري ج13 ص480. التفاصيل في `SD-012`.\n- **الدرجة:** B لأصل الحديث في الصحيح، مع التنبيه على كلام مسلم في ألفاظ شريك.\n\n---\n\n## خلاصة الباب (مستوى E)\n\n1. **في الكلام `D05` `T09`:** لا فحش (3559)، وكلام متمهل مفصل يمكن عدّه (3567)، لا سرد متتابع (3568). ثلاثة أوصاف من راويين، عبد الله بن عمرو وعائشة، تتفق على وضوح الكلام ونقائه.\n2. **في الانفعال `T01` `T12`:** السرور والكره يظهران على وجهه (3555، 3556، 3562). أربعة شهود: عائشة وكعب بن مالك وأبو سعيد، ومعهم في الصحفة أنس. الصورة: انفعال صادق ظاهر، بلا فحش في القول ولا انتقام للنفس.\n3. **في التواضع مع النعمة `T05` `D02`:** لم يعب طعاماً قط (3563).\n4. **في التعامل مع أهل الكتاب `C09`:** موافقتهم فيما لم يُؤمر فيه بشيء، ثم ترك ذلك (3558). يحتاج دراسة مع نصوص المخالفة.\n5. **فرق مهم في الأرقام:** أنس يجعل الإقامة بمكة عشر سنين، وابن عباس ثلاث عشرة. وكلاهما في الصحيح.\n"}, {"code": "HKB-BKH-03", "slug": "hkb-bkh-03", "sec": "03", "title": "الأحاديث — صحيح البخاري، كتاب التفسير: أسباب النزول وتفسير مواضع من جزأي عمّ وتبارك", "short": "البخاري: تفسير جزأي عمّ وتبارك", "md": "# الأحاديث — صحيح البخاري، كتاب التفسير: أسباب النزول وتفسير مواضع من جزأي عمّ وتبارك\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 3 — 15 نوفمبر 2026\n- **الغرض:** توثيق ما يتصل بآيات الجزأين 29 و30 من كتاب التفسير في صحيح البخاري، لسد الفجوة `RG-023`.\n- **التبويب:** تحقق من مواضعها في طبعة طوق النجاة (الشاملة 1681، OpenITI)، ج6 ص159–179.\n- **النص:** من hadith-api، وكلها مقروءة كاملة.\n- **الدرجة:** كلها **B** (مسندة في صحيح البخاري).\n\n---\n\n## سورة القلم\n\n### H-BKH-4917 — «عتل بعد ذلك زنيم»\nحَدَّثَنَا مَحْمُودٌ، حَدَّثَنَا عُبَيْدُ اللَّهِ، عَنْ إِسْرَائِيلَ، عَنْ أَبِي حَصِينٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ {عُتُلٍّ بَعْدَ ذَلِكَ زَنِيمٍ} قَالَ رَجُلٌ مِنْ قُرَيْشٍ لَهُ زَنَمَةٌ مِثْلُ زَنَمَةِ الشَّاةِ.\n- **التبويب:** باب {عتل بعد ذلك زنيم}، ج6 ص159.\n- **المستفاد:** ابن عباس فسر «زنيم» برجل من قريش له علامة مميزة، ولم يسمّه. الآية تصف شخصاً بعينه دون أن يُعرف من هذه الرواية.\n\n---\n\n## سورة الجن\n\n### H-BKH-4921 — استماع الجن للقرآن بنخلة\nحَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ انْطَلَقَ رَسُولُ اللَّهِ صلى الله عليه وسلم فِي طَائِفَةٍ مِنْ أَصْحَابِهِ عَامِدِينَ إِلَى سُوقِ عُكَاظٍ، وَقَدْ حِيلَ بَيْنَ الشَّيَاطِينِ وَبَيْنَ خَبَرِ السَّمَاءِ، وَأُرْسِلَتْ عَلَيْهِمُ الشُّهُبُ فَرَجَعَتِ الشَّيَاطِينُ فَقَالُوا مَا لَكُمْ فَقَالُوا حِيلَ بَيْنَنَا وَبَيْنَ خَبَرِ السَّمَاءِ وَأُرْسِلَتْ عَلَيْنَا الشُّهُبُ. قَالَ مَا حَالَ بَيْنَكُمْ وَبَيْنَ خَبَرِ السَّمَاءِ إِلاَّ مَا حَدَثَ، فَاضْرِبُوا مَشَارِقَ الأَرْضِ وَمَغَارِبَهَا فَانْظُرُوا مَا هَذَا الأَمْرُ الَّذِي حَدَثَ. فَانْطَلَقُوا فَضَرَبُوا مَشَارِقَ الأَرْضِ وَمَغَارِبَهَا يَنْظُرُونَ مَا هَذَا الأَمْرُ الَّذِي حَالَ بَيْنَهُمْ وَبَيْنَ خَبَرِ السَّمَاءِ. قَالَ فَانْطَلَقَ الَّذِينَ تَوَجَّهُوا نَحْوَ تِهَامَةَ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم بِنَخْلَةَ، وَهْوَ عَامِدٌ إِلَى سُوقِ عُكَاظٍ، وَهْوَ يُصَلِّي بِأَصْحَابِهِ صَلاَةَ الْفَجْرِ، فَلَمَّا سَمِعُوا الْقُرْآنَ تَسَمَّعُوا لَهُ فَقَالُوا هَذَا الَّذِي حَالَ بَيْنَكُمْ وَبَيْنَ خَبَرِ السَّمَاءِ. فَهُنَالِكَ رَجَعُوا إِلَى قَوْمِهِمْ فَقَالُوا يَا قَوْمَنَا إِنَّا سَمِعْنَا قُرْآنًا عَجَبًا يَهْدِي إِلَى الرُّشْدِ فَآمَنَّا بِهِ، وَلَنْ نُشْرِكَ بِرَبِّنَا أَحَدًا. وَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ عَلَى نَبِيِّهِ صلى الله عليه وسلم {قُلْ أُوحِيَ إِلَىَّ أَنَّهُ اسْتَمَعَ نَفَرٌ مِنَ الْجِنِّ} وَإِنَّمَا أُوحِيَ إِلَيْهِ قَوْلُ الْجِنِّ.\n- **التبويب:** سورة «قل أوحي إلي»، ج6 ص160.\n- **المستفاد:**\n  - كان النبي ﷺ في طائفة من أصحابه عامدين إلى سوق عكاظ، فصلى بهم الفجر بنخلة، فاستمع نفر من الجن القرآن.\n  - قال ابن عباس: «وإنما أوحي إليه قول الجن»، أي أنه ﷺ لم يرهم في هذه الواقعة، وإنما أُخبر بها بالوحي.\n- **الحدث:** `E-S03-006`. زمن الحدث غير مذكور في النص.\n\n---\n\n## سورة الضحى\n\n### H-BKH-4950 و4951 — سبب نزول «ما ودعك ربك وما قلى»\nحَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا الأَسْوَدُ بْنُ قَيْسٍ، قَالَ سَمِعْتُ جُنْدُبَ بْنَ سُفْيَانَ ـ رضى الله عنه ـ قَالَ اشْتَكَى رَسُولُ اللَّهِ صلى الله عليه وسلم فَلَمْ يَقُمْ لَيْلَتَيْنِ أَوْ ثَلاَثًا، فَجَاءَتِ امْرَأَةٌ فَقَالَتْ يَا مُحَمَّدُ إِنِّي لأَرْجُو أَنْ يَكُونَ شَيْطَانُكَ قَدْ تَرَكَكَ، لَمْ أَرَهُ قَرِبَكَ مُنْذُ لَيْلَتَيْنِ أَوْ ثَلاَثًا. فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ {وَالضُّحَى * وَاللَّيْلِ إِذَا سَجَى * مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى}\n\nحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، غُنْدَرٌ حَدَّثَنَا شُعْبَةُ، عَنِ الأَسْوَدِ بْنِ قَيْسٍ، قَالَ سَمِعْتُ جُنْدَبًا الْبَجَلِيَّ، قَالَتِ امْرَأَةٌ يَا رَسُولَ اللَّهِ مَا أُرَى صَاحِبَكَ إِلاَّ أَبْطَأَكَ. فَنَزَلَتْ {مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى}\n- **التبويب:** باب {ما ودعك ربك وما قلى}، ج6 ص172.\n- **المستفاد:** اشتكى ﷺ، أي مرض، فلم يقم ليلتين أو ثلاثاً، فقالت امرأة: «يا محمد إني لأرجو أن يكون شيطانك قد تركك»، فنزلت الآيات 1–3.\n- **فرق بين الروايتين:** في 4950 خطاب المرأة شامت صريح «شيطانك»، وفي 4951 «يا رسول الله ما أرى صاحبك إلا أبطأك». توجيه ذلك عند الشراح لم يُقرأ `RG-034`.\n- **مقارنة بابن هشام:** ابن إسحاق ربط نزول الضحى بفترة الوحي حتى شق ذلك عليه (ابن هشام ج1 ص225). الخلاف في `SD-013`.\n\n---\n\n## سورة العلق\n\n### H-BKH-4958 — تهديد أبي جهل\nحَدَّثَنَا يَحْيَى، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنْ عَبْدِ الْكَرِيمِ الْجَزَرِيِّ، عَنْ عِكْرِمَةَ، قَالَ ابْنُ عَبَّاسٍ قَالَ أَبُو جَهْلٍ لَئِنْ رَأَيْتُ مُحَمَّدًا يُصَلِّي عِنْدَ الْكَعْبَةِ لأَطَأَنَّ عَلَى عُنُقِهِ. فَبَلَغَ النَّبِيَّ صلى الله عليه وسلم فَقَالَ  \" لَوْ فَعَلَهُ لأَخَذَتْهُ الْمَلاَئِكَةُ \". تَابَعَهُ عَمْرُو بْنُ خَالِدٍ عَنْ عُبَيْدِ اللَّهِ عَنْ عَبْدِ الْكَرِيمِ.\n- **التبويب:** أورده البخاري تحت باب {كلا لئن لم ينته لنسفعن بالناصية، ناصية كاذبة خاطئة}، ج6 ص174–175.\n- **المستفاد:** أبو جهل توعد أن يطأ عنق النبي ﷺ إن رآه يصلي عند الكعبة. وتبويب البخاري يربط الآيات 15–16 بأبي جهل، والنص نفسه لا يذكر نزول الآية.\n- **الحدث:** `E-S03-007`.\n\n---\n\n## سورة الكوثر\n\n### H-BKH-4964 و4965 و4966 — معنى الكوثر\nحَدَّثَنَا آدَمُ، حَدَّثَنَا شَيْبَانُ، حَدَّثَنَا قَتَادَةُ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ لَمَّا عُرِجَ بِالنَّبِيِّ صلى الله عليه وسلم إِلَى السَّمَاءِ قَالَ  \" أَتَيْتُ عَلَى نَهَرٍ حَافَتَاهُ قِبَابُ اللُّؤْلُؤِ مُجَوَّفًا فَقُلْتُ مَا هَذَا يَا جِبْرِيلُ قَالَ هَذَا الْكَوْثَرُ \".\n\nحَدَّثَنَا خَالِدُ بْنُ يَزِيدَ الْكَاهِلِيُّ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ أَبِي عُبَيْدَةَ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ قَالَ سَأَلْتُهَا عَنْ قَوْلِهِ تَعَالَى {إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ} قَالَتْ نَهَرٌ أُعْطِيَهُ نَبِيُّكُمْ صلى الله عليه وسلم شَاطِئَاهُ عَلَيْهِ دُرٌّ مُجَوَّفٌ آنِيَتُهُ كَعَدَدِ النُّجُومِ. رَوَاهُ زَكَرِيَّاءُ وَأَبُو الأَحْوَصِ وَمُطَرِّفٌ عَنْ أَبِي إِسْحَاقَ.\n\nحَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا هُشَيْمٌ، حَدَّثَنَا أَبُو بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ أَنَّهُ قَالَ فِي الْكَوْثَرِ هُوَ الْخَيْرُ الَّذِي أَعْطَاهُ اللَّهُ إِيَّاهُ. قَالَ أَبُو بِشْرٍ قُلْتُ لِسَعِيدِ بْنِ جُبَيْرٍ فَإِنَّ النَّاسَ يَزْعُمُونَ أَنَّهُ نَهَرٌ فِي الْجَنَّةِ. فَقَالَ سَعِيدٌ النَّهَرُ الَّذِي فِي الْجَنَّةِ مِنَ الْخَيْرِ الَّذِي أَعْطَاهُ اللَّهُ إِيَّاهُ.\n- **التبويب:** سورة «إنا أعطيناك الكوثر»، ج6 ص178.\n- **المستفاد:** الكوثر نهر في الجنة (أنس في حديث المعراج، وعائشة)، وعند ابن عباس هو «الخير الذي أعطاه الله إياه»، وجمع سعيد بن جبير بأن النهر من ذلك الخير.\n- **سبب نزول «إن شانئك هو الأبتر»:** لم يرد في هذه الأحاديث. يبقى في `RG-023`.\n\n---\n\n## سورة النصر\n\n### H-BKH-4967 — تطبيقه ﷺ لسورة النصر في صلاته\nحَدَّثَنَا الْحَسَنُ بْنُ الرَّبِيعِ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنِ الأَعْمَشِ، عَنْ أَبِي الضُّحَى، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ قَالَتْ مَا صَلَّى النَّبِيُّ صلى الله عليه وسلم صَلاَةً بَعْدَ أَنْ نَزَلَتْ عَلَيْهِ {إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ} إِلاَّ يَقُولُ فِيهَا \" سُبْحَانَكَ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي \".\n- **التبويب:** سورة «إذا جاء نصر الله»، ج6 ص178.\n- **المستفاد:** بعد نزول السورة كان يقول في كل صلاة: «سبحانك ربنا وبحمدك، اللهم اغفر لي». هذا تطبيق عملي ثابت لقوله تعالى «فسبح بحمد ربك واستغفره».\n- **الموضوع:** `T15` التعامل مع النجاح، `T25`.\n\n### H-BKH-4969 و4970 — السورة إشارة إلى قرب أجله ﷺ\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ عُمَرَ ـ رضى الله عنه ـ سَأَلَهُمْ عَنْ قَوْلِهِ تَعَالَى {إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ} قَالُوا فَتْحُ الْمَدَائِنِ وَالْقُصُورِ قَالَ مَا تَقُولُ يَا ابْنَ عَبَّاسٍ قَالَ أَجَلٌ أَوْ مَثَلٌ ضُرِبَ لِمُحَمَّدٍ صلى الله عليه وسلم نُعِيَتْ لَهُ نَفْسُهُ.\n\nحَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ كَانَ عُمَرُ يُدْخِلُنِي مَعَ أَشْيَاخِ بَدْرٍ، فَكَأَنَّ بَعْضَهُمْ وَجَدَ فِي نَفْسِهِ فَقَالَ لِمَ تُدْخِلُ هَذَا مَعَنَا وَلَنَا أَبْنَاءٌ مِثْلُهُ فَقَالَ عُمَرُ إِنَّهُ مِنْ حَيْثُ عَلِمْتُمْ. فَدَعَا ذَاتَ يَوْمٍ ـ فَأَدْخَلَهُ مَعَهُمْ ـ فَمَا رُئِيتُ أَنَّهُ دَعَانِي يَوْمَئِذٍ إِلاَّ لِيُرِيَهُمْ. قَالَ مَا تَقُولُونَ فِي قَوْلِ اللَّهِ تَعَالَى {إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ} فَقَالَ بَعْضُهُمْ أُمِرْنَا نَحْمَدُ اللَّهَ وَنَسْتَغْفِرُهُ، إِذَا نُصِرْنَا وَفُتِحَ عَلَيْنَا. وَسَكَتَ بَعْضُهُمْ فَلَمْ يَقُلْ شَيْئًا فَقَالَ لِي أَكَذَاكَ تَقُولُ يَا ابْنَ عَبَّاسٍ فَقُلْتُ لاَ. قَالَ فَمَا تَقُولُ قُلْتُ هُوَ أَجَلُ رَسُولِ اللَّهِ صلى الله عليه وسلم أَعْلَمَهُ لَهُ، قَالَ {إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ} وَذَلِكَ عَلاَمَةُ أَجَلِكَ {فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا}. فَقَالَ عُمَرُ مَا أَعْلَمُ مِنْهَا إِلاَّ مَا تَقُولُ.\n- **المستفاد:**\n  - قال بعض أشياخ بدر: أُمرنا أن نحمد الله ونستغفره إذا نُصرنا وفُتح علينا. وقال ابن عباس: هو أجل رسول الله ﷺ أعلمه له، فالنصر والفتح علامة أجله. فقال عمر: ما أعلم منها إلا ما تقول.\n  - **موقف إداري من عمر رضي الله عنه:** كان يُدخل ابن عباس مع أشياخ بدر، فاعترض بعضهم لصغر سنه، فأراهم علمه بسؤال عملي. هذا تصرف صحابي لا نبوي، ويُسجل في القيادة بوسمه.\n- **الخلاف:** `SD-015`.\n\n---\n\n## سورة المسد\n\n### H-BKH-4971 و4972 و4973 — النداء على الصفا وقول أبي لهب\nحَدَّثَنَا يُوسُفُ بْنُ مُوسَى، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا الأَعْمَشُ، حَدَّثَنَا عَمْرُو بْنُ مُرَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ لَمَّا نَزَلَتْ {وَأَنْذِرْ عَشِيرَتَكَ الأَقْرَبِينَ} وَرَهْطَكَ مِنْهُمُ الْمُخْلَصِينَ، خَرَجَ رَسُولُ اللَّهِ صلى الله عليه وسلم حَتَّى صَعِدَ الصَّفَا فَهَتَفَ \" يَا صَبَاحَاهْ \". فَقَالُوا مَنْ هَذَا، فَاجْتَمَعُوا إِلَيْهِ. فَقَالَ \" أَرَأَيْتُمْ إِنْ أَخْبَرْتُكُمْ أَنَّ خَيْلاً تَخْرُجُ مِنْ سَفْحِ هَذَا الْجَبَلِ أَكُنْتُمْ مُصَدِّقِيَّ \". قَالُوا مَا جَرَّبْنَا عَلَيْكَ كَذِبًا. قَالَ \" فَإِنِّي نَذِيرٌ لَكُمْ بَيْنَ يَدَىْ عَذَابٍ شَدِيدٍ \". قَالَ أَبُو لَهَبٍ تَبًّا لَكَ مَا جَمَعْتَنَا إِلاَّ لِهَذَا ثُمَّ قَامَ فَنَزَلَتْ {تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ} وَقَدْ تَبَّ هَكَذَا قَرَأَهَا الأَعْمَشُ يَوْمَئِذٍ.\n\nحَدَّثَنَا مُحَمَّدُ بْنُ سَلاَمٍ، أَخْبَرَنَا أَبُو مُعَاوِيَةَ، حَدَّثَنَا الأَعْمَشُ، عَنْ عَمْرِو بْنِ مُرَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم خَرَجَ إِلَى الْبَطْحَاءِ فَصَعِدَ إِلَى الْجَبَلِ فَنَادَى \" يَا صَبَاحَاهْ \". فَاجْتَمَعَتْ إِلَيْهِ قُرَيْشٌ فَقَالَ \" أَرَأَيْتُمْ إِنْ حَدَّثْتُكُمْ أَنَّ الْعَدُوَّ مُصَبِّحُكُمْ أَوْ مُمَسِّيكُمْ، أَكُنْتُمْ تُصَدِّقُونِي \". قَالُوا نَعَمْ. قَالَ \" فَإِنِّي نَذِيرٌ لَكُمْ بَيْنَ يَدَىْ عَذَابٍ شَدِيدٍ \". فَقَالَ أَبُو لَهَبٍ أَلِهَذَا جَمَعْتَنَا تَبًّا لَكَ. فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ {تَبَّتْ يَدَا أَبِي لَهَبٍ} إِلَى آخِرِهَا.\n\nحَدَّثَنَا عُمَرُ بْنُ حَفْصٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا الأَعْمَشُ، حَدَّثَنِي عَمْرُو بْنُ مُرَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ أَبُو لَهَبٍ تَبًّا لَكَ أَلِهَذَا جَمَعْتَنَا فَنَزَلَتْ {تَبَّتْ يَدَا أَبِي لَهَبٍ}.\n- **التبويب:** سورة «تبت يدا أبي لهب»، ج6 ص179.\n- **المستفاد:**\n  - لما نزلت «وأنذر عشيرتك الأقربين» صعد ﷺ الصفا ونادى «يا صباحاه»، فلما اجتمعوا سألهم: لو أخبرتكم أن خيلاً تخرج من سفح هذا الجبل أكنتم مصدقيّ؟ قالوا: **«ما جربنا عليك كذباً»**. فقال: «فإني نذير لكم بين يدي عذاب شديد». فقال أبو لهب: «تباً لك، ما جمعتنا إلا لهذا؟»، فنزلت السورة.\n  - **أسلوب الخطاب (E):** بدأ بسؤال يستخرج من السامعين اعترافاً بصدقه، ثم بنى عليه الإنذار.\n- **مواضع أخرى للحدث نفسه في البخاري (وُثق رقمها):** 2752، 2753، 3525، 3526، 4770، 4771.\n- **الحدث:** `E-S03-005`.\n- **الموضوعات:** `T07` الصدق (شهادة قريش مجتمعة)، `T09` أسلوب الخطاب، `C10` عداوة القريب.\n"}, {"code": "HKB-BKH-04", "slug": "hkb-bkh-04", "sec": "03", "title": "الأحاديث — صحيح البخاري، كتاب التفسير: سور الجزء الثامن والعشرين (قد سمع)", "short": "البخاري: تفسير الجزء 28", "md": "# الأحاديث — صحيح البخاري، كتاب التفسير: سور الجزء الثامن والعشرين (قد سمع)\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 4 — 15 نوفمبر 2026\n- **النطاق:** كل ما أسنده البخاري في كتاب التفسير لسور الجزء 28 (58–66): الأحاديث **4882–4916، وعددها 35، قُرئت كلها**. ومعها حديثان من كتاب مناقب الأنصار (3799 و3801) لصلتهما بالحديث 4888.\n- **التبويب:** طبعة طوق النجاة (الشاملة 1681، OpenITI)، **ج6 ص147–159**. ليس في كتاب التفسير حديث مسند لسورة المجادلة (فيها تفسير لغوي عن مجاهد فقط)، ولا لسورة التغابن (فيها أثر معلق عن علقمة عن ابن مسعود).\n- **النص:** من hadith-api.\n- **الدرجة:** كلها **B** (مسندة في صحيح البخاري)، إلا ما نُص عليه أنه قول صحابي أو تابعي، فهو قوله، لا حديث نبوي.\n\n---\n\n## سورة الحشر `S06`\n\n### H-BKH-4882 و4883 — سورة الحشر نزلت في بني النضير\nحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحِيمِ، حَدَّثَنَا سَعِيدُ بْنُ سُلَيْمَانَ، حَدَّثَنَا هُشَيْمٌ، أَخْبَرَنَا أَبُو بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ قُلْتُ لاِبْنِ عَبَّاسٍ سُورَةُ التَّوْبَةِ قَالَ التَّوْبَةُ هِيَ الْفَاضِحَةُ، مَا زَالَتْ تَنْزِلُ وَمِنْهُمْ وَمِنْهُمْ، حَتَّى ظَنُّوا أَنَّهَا لَمْ تُبْقِ أَحَدًا مِنْهُمْ إِلاَّ ذُكِرَ فِيهَا. قَالَ قُلْتُ سُورَةُ الأَنْفَالِ. قَالَ نَزَلَتْ فِي بَدْرٍ. قَالَ قُلْتُ سُورَةُ الْحَشْرِ. قَالَ نَزَلَتْ فِي بَنِي النَّضِيرِ.\n\nحَدَّثَنَا الْحَسَنُ بْنُ مُدْرِكٍ، حَدَّثَنَا يَحْيَى بْنُ حَمَّادٍ، أَخْبَرَنَا أَبُو عَوَانَةَ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدٍ، قَالَ قُلْتُ لاِبْنِ عَبَّاسٍ ـ رضى الله عنهما ـ سُورَةُ الْحَشْرِ قَالَ قُلْ سُورَةُ النَّضِيرِ.\n- **الصفحة:** ج6 ص147.\n- **المستفاد:** نص ابن عباس على أن السورة نزلت في بني النضير، وكان يقول: «قل سورة النضير». هذا يثبت سياق آيات الحشر 2–17.\n\n### H-BKH-4884 — تحريق نخل بني النضير وقطعه\nحَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا لَيْثٌ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ ـ رضى الله عنهما ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم حَرَّقَ نَخْلَ بَنِي النَّضِيرِ وَقَطَعَ، وَهْىَ الْبُوَيْرَةُ، فَأَنْزَلَ اللَّهُ تَعَالَى {مَا قَطَعْتُمْ مِنْ لِينَةٍ أَوْ تَرَكْتُمُوهَا قَائِمَةً عَلَى أُصُولِهَا فَبِإِذْنِ اللَّهِ وَلِيُخْزِيَ الْفَاسِقِينَ}\n- **الصفحة:** ج6 ص147.\n- **المستفاد:** فعل حربي أقرّه القرآن نصاً في 59:5 «فبإذن الله». حكم قطع الشجر في الحرب عموماً مسألة فقهية لها أقوال لم تُقرأ بعد `RG-044`، فلا يُعمم من هذا الموضع.\n\n### H-BKH-4885 — نفقة سنته لأهله من فيء بني النضير، والباقي عُدة في سبيل الله `T23` `T21` `T19`\nحَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَان ُ ـ غَيْرَ مَرَّةٍ ـ عَنْ عَمْرٍو، عَنِ الزُّهْرِيِّ، عَنْ مَالِكِ بْنِ أَوْسِ بْنِ الْحَدَثَانِ، عَنْ عُمَرَ ـ رضى الله عنه ـ قَالَ كَانَتْ أَمْوَالُ بَنِي النَّضِيرِ مِمَّا أَفَاءَ اللَّهُ عَلَى رَسُولِهِ صلى الله عليه وسلم مِمَّا لَمْ يُوجِفِ الْمُسْلِمُونَ عَلَيْهِ بِخَيْلٍ وَلاَ رِكَابٍ، فَكَانَتْ لِرَسُولِ اللَّهِ صلى الله عليه وسلم خَاصَّةً، يُنْفِقُ عَلَى أَهْلِهِ مِنْهَا نَفَقَةَ سَنَتِهِ، ثُمَّ يَجْعَلُ مَا بَقِيَ فِي السِّلاَحِ وَالْكُرَاعِ، عُدَّةً فِي سَبِيلِ اللَّهِ.\n- **الصفحة:** ج6 ص147.\n- **المستفاد:** كانت أموال بني النضير خاصة له ﷺ لأنها فيء لم يُقاتل عليه، **فكان ينفق منها على أهله نفقة سنتهم، ويجعل ما بقي في السلاح والكراع عُدة في سبيل الله**.\n- **صلته:** هذا من طريق مالك بن أوس عن عمر، وهو طريق البخاري 5357 نفسه. وهو دليل `SD-016` على ادخار قوت السنة للأهل، وفيه تخطيط مالي صريح: نفقة الأهل لسنة، ثم الإعداد للمستقبل.\n\n### H-BKH-4886 و4887 — ابن مسعود وأم يعقوب: «وما آتاكم الرسول فخذوه»\nحَدَّثَنَا مُحَمَّدُ بْنُ يُوسُفَ، حَدَّثَنَا سُفْيَانُ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنْ عَبْدِ اللَّهِ، قَالَ لَعَنَ اللَّهُ الْوَاشِمَاتِ وَالْمُوتَشِمَاتِ وَالْمُتَنَمِّصَاتِ وَالْمُتَفَلِّجَاتِ لِلْحُسْنِ الْمُغَيِّرَاتِ خَلْقَ اللَّهِ. فَبَلَغَ ذَلِكَ امْرَأَةً مِنْ بَنِي أَسَدٍ يُقَالُ لَهَا أُمُّ يَعْقُوبَ، فَجَاءَتْ فَقَالَتْ إِنَّهُ بَلَغَنِي أَنَّكَ لَعَنْتَ كَيْتَ وَكَيْتَ. فَقَالَ وَمَا لِي لاَ أَلْعَنُ مَنْ لَعَنَ رَسُولُ اللَّهِ صلى الله عليه وسلم وَمَنْ هُوَ فِي كِتَابِ اللَّهِ فَقَالَتْ لَقَدْ قَرَأْتُ مَا بَيْنَ اللَّوْحَيْنِ فَمَا وَجَدْتُ فِيهِ مَا تَقُولُ. قَالَ لَئِنْ كُنْتِ قَرَأْتِيهِ لَقَدْ وَجَدْتِيهِ، أَمَا قَرَأْتِ {وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانْتَهُوا}. قَالَتْ بَلَى. قَالَ فَإِنَّهُ قَدْ نَهَى عَنْهُ. قَالَتْ فَإِنِّي أَرَى أَهْلَكَ يَفْعَلُونَهُ. قَالَ فَاذْهَبِي فَانْظُرِي. فَذَهَبَتْ فَنَظَرَتْ فَلَمْ تَرَ مِنْ حَاجَتِهَا شَيْئًا، فَقَالَ لَوْ كَانَتْ كَذَلِكَ مَا جَامَعْتُها\n\nحَدَّثَنَا عَلِيٌّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، قَالَ ذَكَرْتُ لِعَبْدِ الرَّحْمَنِ بْنِ عَابِسٍ حَدِيثَ مَنْصُورٍ عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنْ عَبْدِ اللَّهِ ـ رضى الله عنه ـ قَالَ لَعَنَ رَسُولُ اللَّهِ صلى الله عليه وسلم الْوَاصِلَةَ فَقَالَ سَمِعْتُهُ مِنِ امْرَأَةٍ يُقَالُ لَهَا أُمُّ يَعْقُوبَ عَنْ عَبْدِ اللَّهِ مِثْلَ حَدِيثِ مَنْصُورٍ.\n- **الصفحة:** ج6 ص148.\n- **طبيعته:** الحوار كله من فعل ابن مسعود رضي الله عنه، لا من فعل النبي ﷺ.\n- **المستفاد المنهجي:** استدل ابن مسعود بالآية 59:7 على أن ما نهى عنه الرسول ﷺ داخل في «كتاب الله». ولما قالت المرأة إن أهله يفعلونه، أرسلها لتنظر بنفسها.\n\n### H-BKH-4888 — وصية عمر بالمهاجرين والأنصار، وأصلها النبوي\nحَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا أَبُو بَكْرٍ، عَنْ حُصَيْنٍ، عَنْ عَمْرِو بْنِ مَيْمُونٍ، قَالَ قَالَ عُمَرُ رضى الله عنه أُوصِي الْخَلِيفَةَ بِالْمُهَاجِرِينَ الأَوَّلِينَ أَنْ يَعْرِفَ لَهُمْ حَقَّهُمْ، وَأُوصِي الْخَلِيفَةَ بِالأَنْصَارِ الَّذِينَ تَبَوَّءُوا الدَّارَ وَالإِيمَانَ مِنْ قَبْلِ أَنْ يُهَاجِرَ النَّبِيُّ صلى الله عليه وسلم أَنْ يَقْبَلَ مِنْ مُحْسِنِهِمْ وَيَعْفُوَ عَنْ مُسِيئِهِمْ.\n- **الصفحة:** ج6 ص148.\n- **طبيعته:** وصية عمر رضي الله عنه. وأصل عبارتها في الأنصار وصية نبوية ثابتة:\n\nحَدَّثَنِي مُحَمَّدُ بْنُ يَحْيَى أَبُو عَلِيٍّ، حَدَّثَنَا شَاذَانُ، أَخُو عَبْدَانَ حَدَّثَنَا أَبِي، أَخْبَرَنَا شُعْبَةُ بْنُ الْحَجَّاجِ، عَنْ هِشَامِ بْنِ زَيْدٍ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يَقُولُ مَرَّ أَبُو بَكْرٍ وَالْعَبَّاسُ ـ رضى الله عنهما ـ بِمَجْلِسٍ مِنْ مَجَالِسِ الأَنْصَارِ وَهُمْ يَبْكُونَ، فَقَالَ مَا يُبْكِيكُمْ قَالُوا ذَكَرْنَا مَجْلِسَ النَّبِيِّ صلى الله عليه وسلم مِنَّا. فَدَخَلَ عَلَى النَّبِيِّ صلى الله عليه وسلم فَأَخْبَرَهُ بِذَلِكَ ـ قَالَ ـ فَخَرَجَ النَّبِيُّ صلى الله عليه وسلم وَقَدْ عَصَبَ عَلَى رَأْسِهِ حَاشِيَةَ بُرْدٍ ـ قَالَ ـ فَصَعِدَ الْمِنْبَرَ وَلَمْ يَصْعَدْهُ بَعْدَ ذَلِكَ الْيَوْمِ، فَحَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ، ثُمَّ قَالَ  \" أُوصِيكُمْ بِالأَنْصَارِ، فَإِنَّهُمْ كَرِشِي وَعَيْبَتِي، وَقَدْ قَضَوُا الَّذِي عَلَيْهِمْ، وَبَقِيَ الَّذِي لَهُمْ، فَاقْبَلُوا مِنْ مُحْسِنِهِمْ، وَتَجَاوَزُوا عَنْ مُسِيئِهِمْ \".\n\nحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ  \" الأَنْصَارُ كَرِشِي وَعَيْبَتِي، وَالنَّاسُ سَيَكْثُرُونَ وَيَقِلُّونَ، فَاقْبَلُوا مِنْ مُحْسِنِهِمْ، وَتَجَاوَزُوا عَنْ مُسِيئِهِمْ \".\n- **المستفاد من 3799 (B):** في آخر خطبة له على المنبر، وقد عصب رأسه، أوصى بالأنصار: «قد قضوا الذي عليهم، وبقي الذي لهم، فاقبلوا من محسنهم، وتجاوزوا عن مسيئهم». `C04` `T18`: حفظ حق من أدى ما عليه، والتجاوز عن مسيئهم.\n\n### H-BKH-4889 — الأنصاري الذي آثر ضيف رسول الله ﷺ `C07` `T06` `T14`\nحَدَّثَنِي يَعْقُوبُ بْنُ إِبْرَاهِيمَ بْنِ كَثِيرٍ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا فُضَيْلُ بْنُ غَزْوَانَ، حَدَّثَنَا أَبُو حَازِمٍ الأَشْجَعِيُّ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ أَتَى رَجُلٌ رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ أَصَابَنِي الْجَهْدُ فَأَرْسَلَ إِلَى نِسَائِهِ فَلَمْ يَجِدْ عِنْدَهُنَّ شَيْئًا، فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" أَلاَ رَجُلٌ يُضَيِّفُ هَذِهِ اللَّيْلَةَ يَرْحَمُهُ اللَّهُ \". فَقَامَ رَجُلٌ مِنَ الأَنْصَارِ فَقَالَ أَنَا يَا رَسُولَ اللَّهِ. فَذَهَبَ إِلَى أَهْلِهِ فَقَالَ لاِمْرَأَتِهِ ضَيْفُ رَسُولِ اللَّهِ صلى الله عليه وسلم لاَ تَدَّخِرِيهِ شَيْئًا. قَالَتْ وَاللَّهِ مَا عِنْدِي إِلاَّ قُوتُ الصِّبْيَةِ. قَالَ فَإِذَا أَرَادَ الصِّبْيَةُ الْعَشَاءَ فَنَوِّمِيهِمْ، وَتَعَالَىْ فَأَطْفِئِي السِّرَاجَ وَنَطْوِي بُطُونَنَا اللَّيْلَةَ. فَفَعَلَتْ ثُمَّ غَدَا الرَّجُلُ عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ \" لَقَدْ عَجِبَ اللَّهُ عَزَّ وَجَلَّ ـ أَوْ ضَحِكَ ـ مِنْ فُلاَنٍ وَفُلاَنَةَ \". فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ {وَيُؤْثِرُونَ عَلَى أَنْفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ}\n- **الصفحة:** ج6 ص149.\n- **المستفاد:**\n  - جاءه رجل أصابه الجهد، **فأرسل إلى نسائه فلم يجد عندهن شيئاً**. شاهد جديد على حال بيته `T14`.\n  - لم يرد السائل، فطلب علناً من يضيفه، ودعا له: «يرحمه الله».\n  - نزلت 59:9 في الأنصاري وامرأته.\n\n---\n\n## سورة الممتحنة\n\n### H-BKH-4890 — حاطب بن أبي بلتعة `PD-009`\nحَدَّثَنَا الْحُمَيْدِيُّ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا عَمْرُو بْنُ دِينَارٍ، قَالَ حَدَّثَنِي الْحَسَنُ بْنُ مُحَمَّدِ بْنِ عَلِيٍّ، أَنَّهُ سَمِعَ عُبَيْدَ اللَّهِ بْنَ أَبِي رَافِعٍ، كَاتِبَ عَلِيٍّ يَقُولُ سَمِعْتُ عَلِيًّا ـ رضى الله عنه ـ يَقُولُ بَعَثَنِي رَسُولُ اللَّهِ صلى الله عليه وسلم أَنَا وَالزُّبَيْرَ وَالْمِقْدَادَ فَقَالَ \" انْطَلِقُوا حَتَّى تَأْتُوا رَوْضَةَ خَاخٍ فَإِنَّ بِهَا ظَعِينَةً مَعَهَا كِتَابٌ فَخُذُوهُ مِنْهَا \". فَذَهَبْنَا تَعَادَى بِنَا خَيْلُنَا حَتَّى أَتَيْنَا الرَّوْضَةَ فَإِذَا نَحْنُ بِالظَّعِينَةِ فَقُلْنَا أَخْرِجِي الْكِتَابَ فَقَالَتْ مَا مَعِي مِنْ كِتَابٍ. فَقُلْنَا لَتُخْرِجِنَّ الْكِتَابَ أَوْ لَنُلْقِيَنَّ الثِّيَابَ. فَأَخْرَجَتْهُ مِنْ عِقَاصِهَا فَأَتَيْنَا بِهِ النَّبِيَّ صلى الله عليه وسلم فَإِذَا فِيهِ مِنْ حَاطِبِ بْنِ أَبِي بَلْتَعَةَ إِلَى أُنَاسٍ مِنَ الْمُشْرِكِينَ مِمَّنْ بِمَكَّةَ يُخْبِرُهُمْ بِبَعْضِ أَمْرِ النَّبِيِّ صلى الله عليه وسلم فَقَالَ النَّبِيُّ صلى الله عليه وسلم \" مَا هَذَا يَا حَاطِبُ \". قَالَ لاَ تَعْجَلْ عَلَىَّ يَا رَسُولَ اللَّهِ إِنِّي كُنْتُ امْرَأً مِنْ قُرَيْشٍ وَلَمْ أَكُنْ مِنْ أَنْفُسِهِمْ وَكَانَ مَنْ مَعَكَ مِنَ الْمُهَاجِرِينَ لَهُمْ قَرَابَاتٌ يَحْمُونَ بِهَا أَهْلِيهِمْ وَأَمْوَالَهُمْ بِمَكَّةَ فَأَحْبَبْتُ إِذْ فَاتَنِي مِنَ النَّسَبِ فِيهِمْ أَنْ أَصْطَنِعَ إِلَيْهِمْ يَدًا يَحْمُونَ قَرَابَتِي وَمَا فَعَلْتُ ذَلِكَ كُفْرًا وَلاَ ارْتِدَادًا عَنْ دِينِي. فَقَالَ النَّبِيُّ صلى الله عليه وسلم \" إِنَّهُ قَدْ صَدَقَكُمْ \". فَقَالَ عُمَرُ دَعْنِي يَا رَسُولَ اللَّهِ فَأَضْرِبَ عُنُقَهُ. فَقَالَ \" إِنَّهُ شَهِدَ بَدْرًا وَمَا يُدْرِيكَ لَعَلَّ اللَّهَ ـ عَزَّ وَجَلَّ ـ اطَّلَعَ عَلَى أَهْلِ بَدْرٍ فَقَالَ اعْمَلُوا مَا شِئْتُمْ فَقَدْ غَفَرْتُ لَكُمْ \". قَالَ عَمْرٌو وَنَزَلَتْ فِيهِ {يَا أَيُّهَا الَّذِينَ آمَنُوا لاَ تَتَّخِذُوا عَدُوِّي وَعَدُوَّكُمْ} قَالَ لاَ أَدْرِي الآيَةَ فِي الْحَدِيثِ أَوْ قَوْلُ عَمْرٍو. حَدَّثَنَا عَلِيٌّ قِيلَ لِسُفْيَانَ فِي هَذَا فَنَزَلَتْ {لاَ تَتَّخِذُوا عَدُوِّي} قَالَ سُفْيَانُ هَذَا فِي حَدِيثِ النَّاسِ حَفِظْتُهُ مِنْ عَمْرٍو وَمَا تَرَكْتُ مِنْهُ حَرْفًا وَمَا أُرَى أَحَدًا حَفِظَهُ غَيْرِي.\n- **الصفحة:** ج6 ص149–150.\n- **تسلسل التصرف النبوي كما في النص:**\n  1. أرسل علياً والزبير والمقداد فاستخرجوا الكتاب.\n  2. واجه حاطباً بسؤال مفتوح: «ما هذا يا حاطب؟».\n  3. سمع عذره كاملاً: لم يكن له في قريش قرابة تحمي أهله، فأراد أن يتخذ عندهم يداً، «وما فعلت ذلك كفراً ولا ارتداداً عن ديني».\n  4. حكم بصدقه أمام الحاضرين: «إنه قد صدقكم».\n  5. ردّ طلب عمر بقتله، وعلل ذلك بسابقته: «إنه شهد بدراً».\n- **الآية:** نزلت فيه 60:1، مع تردد سفيان في كون ذكر الآية من الحديث أو من قول عمرو بن دينار.\n- **القرار:** `PD-009`.\n\n### H-BKH-4891 — امتحان المهاجرات، والمبايعة بالكلام `C05`\nحَدَّثَنَا إِسْحَاقُ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا ابْنُ أَخِي ابْنِ شِهَابٍ، عَنْ عَمِّهِ، أَخْبَرَنِي عُرْوَةُ، أَنَّ عَائِشَةَ ـ رضى الله عنها ـ زَوْجَ النَّبِيِّ صلى الله عليه وسلم أَخْبَرَتْهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ يَمْتَحِنُ مَنْ هَاجَرَ إِلَيْهِ مِنَ الْمُؤْمِنَاتِ بِهَذِهِ الآيَةِ، بِقَوْلِ اللَّهِ {يَا أَيُّهَا النَّبِيُّ إِذَا جَاءَكَ الْمُؤْمِنَاتُ يُبَايِعْنَكَ} إِلَى قَوْلِهِ {غَفُورٌ رَحِيمٌ}. قَالَ عُرْوَةُ قَالَتْ عَائِشَةُ فَمَنْ أَقَرَّ بِهَذَا الشَّرْطِ مِنَ الْمُؤْمِنَاتِ قَالَ لَهَا رَسُولُ اللَّهِ صلى الله عليه وسلم \" قَدْ بَايَعْتُكِ \". كَلاَمًا وَلاَ وَاللَّهِ مَا مَسَّتْ يَدُهُ يَدَ امْرَأَةٍ قَطُّ فِي الْمُبَايَعَةِ، مَا يُبَايِعُهُنَّ إِلاَّ بِقَوْلِهِ \" قَدْ بَايَعْتُكِ عَلَى ذَلِكَ \". تَابَعَهُ يُونُسُ وَمَعْمَرٌ وَعَبْدُ الرَّحْمَنِ بْنُ إِسْحَاقَ عَنِ الزُّهْرِيِّ. وَقَالَ إِسْحَاقُ بْنُ رَاشِدٍ عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ وَعَمْرَةَ.\n- **الصفحة:** ج6 ص150.\n- **المستفاد:** كان يمتحن المهاجرات بآية 60:12، ومن أقرت قال لها: «قد بايعتك» كلاماً. قالت عائشة: «ولا والله ما مست يده يد امرأة قط في المبايعة».\n\n### H-BKH-4892 — المرأة التي قبضت يدها في البيعة `T02` `T20`\nحَدَّثَنَا أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا أَيُّوبُ، عَنْ حَفْصَةَ بِنْتِ سِيرِينَ، عَنْ أُمِّ عَطِيَّةَ ـ رضى الله عنها ـ قَالَتْ بَايَعْنَا رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَرَأَ عَلَيْنَا {أَنْ لاَ يُشْرِكْنَ بِاللَّهِ شَيْئًا} وَنَهَانَا عَنِ النِّيَاحَةِ، فَقَبَضَتِ امْرَأَةٌ يَدَهَا فَقَالَتْ أَسْعَدَتْنِي فُلاَنَةُ أُرِيدُ أَنْ أَجْزِيَهَا. فَمَا قَالَ لَهَا النَّبِيُّ صلى الله عليه وسلم شَيْئًا فَانْطَلَقَتْ وَرَجَعَتْ فَبَايَعَهَا.\n- **الصفحة:** ج6 ص151.\n- **المستفاد:** لما نهاهن عن النياحة قبضت امرأة يدها وقالت إن فلانة أسعدتها فتريد أن تجزيها. **«فما قال لها النبي ﷺ شيئاً، فانطلقت ورجعت فبايعها»**. لم يوبخها، وتركها حتى رجعت. توجيه الشراح لهذا السكوت لم يُقرأ بعد `RG-045`.\n\n### H-BKH-4893 — «ولا يعصينك في معروف»\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ حَدَّثَنَا أَبِي قَالَ، سَمِعْتُ الزُّبَيْرَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، فِي قَوْلِهِ تَعَالَى {وَلاَ يَعْصِينَكَ فِي مَعْرُوفٍ} قَالَ إِنَّمَا هُوَ شَرْطٌ شَرَطَهُ اللَّهُ لِلنِّسَاءِ.\n- **الصفحة:** ج6 ص151.\n- **المستفاد:** قال ابن عباس: إنما هو شرط شرطه الله للنساء. والقيد «في معروف» وارد في لفظ الآية في حق النبي ﷺ نفسه.\n\n### H-BKH-4894 — بيعة عبادة بن الصامت على مثل آية النساء\n{حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، قَالَ الزُّهْرِيُّ حَدَّثَنَاهُ قَالَ حَدَّثَنِي أَبُو إِدْرِيسَ، سَمِعَ عُبَادَةَ بْنَ الصَّامِتِ ـ رضى الله عنه ـ قَالَ كُنَّا عِنْدَ النَّبِيِّ صلى الله عليه وسلم فَقَالَ \" أَتُبَايِعُونِي عَلَى أَنْ لاَ تُشْرِكُوا بِاللَّهِ شَيْئًا وَلاَ تَزْنُوا وَلاَ تَسْرِقُوا \". وَقَرَأَ آيَةَ النِّسَاءِ ـ وَأَكْثَرُ لَفْظِ سُفْيَانَ قَرَأَ الآيَةَ ـ \" فَمَنْ وَفَى مِنْكُمْ فَأَجْرُهُ عَلَى اللَّهِ، وَمَنْ أَصَابَ مِنْ ذَلِكَ شَيْئًا فَعُوقِبَ فَهُوَ كَفَّارَةٌ لَهُ، وَمَنْ أَصَابَ مِنْهَا شَيْئًا مِنْ ذَلِكَ فَسَتَرَهُ اللَّهُ فَهْوَ إِلَى اللَّهِ، إِنْ شَاءَ عَذَّبَهُ وَإِنْ شَاءَ غَفَرَ لَهُ} \". تَابَعَهُ عَبْدُ الرَّزَّاقِ عَنْ مَعْمَرٍ فِي الآيَةِ.\n- **الصفحة:** ج6 ص151.\n- **المستفاد:** «ومن أصاب من ذلك شيئاً فعوقب فهو كفارة له، ومن أصاب منها شيئاً من ذلك فستره الله فهو إلى الله، إن شاء عذبه وإن شاء غفر له».\n\n### H-BKH-4895 — خطبة العيد وتعليم النساء خاصة `C05` `T20`\nحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحِيمِ، حَدَّثَنَا هَارُونُ بْنُ مَعْرُوفٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، قَالَ وَأَخْبَرَنِي ابْنُ جُرَيْجٍ، أَنَّ الْحَسَنَ بْنَ مُسْلِمٍ، أَخْبَرَهُ عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ شَهِدْتُ الصَّلاَةَ يَوْمَ الْفِطْرِ مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم وَأَبِي بَكْرٍ وَعُمَرَ وَعُثْمَانَ فَكُلُّهُمْ يُصَلِّيهَا قَبْلَ الْخُطْبَةِ ثُمَّ يَخْطُبُ بَعْدُ، فَنَزَلَ نَبِيُّ اللَّهِ صلى الله عليه وسلم فَكَأَنِّي أَنْظُرُ إِلَيْهِ حِينَ يُجَلِّسُ الرِّجَالَ بِيَدِهِ، ثُمَّ أَقْبَلَ يَشُقُّهُمْ حَتَّى أَتَى النِّسَاءَ مَعَ بِلاَلٍ فَقَالَ {يَا أَيُّهَا النَّبِيُّ إِذَا جَاءَكَ الْمُؤْمِنَاتُ يُبَايِعْنَكَ عَلَى أَنْ لاَ يُشْرِكْنَ بِاللَّهِ شَيْئًا وَلاَ يَسْرِقْنَ وَلاَ يَزْنِينَ وَلاَ يَقْتُلْنَ أَوْلاَدَهُنَّ وَلاَ يَأْتِينَ بِبُهْتَانٍ يَفْتَرِينَهُ بَيْنَ أَيْدِيهِنَّ وَأَرْجُلِهِنَّ} حَتَّى فَرَغَ مِنَ الآيَةِ كُلِّهَا ثُمَّ قَالَ حِينَ فَرَغَ \" أَنْتُنَّ عَلَى ذَلِكَ \". وَقَالَتِ امْرَأَةٌ وَاحِدَةٌ لَمْ يُجِبْهُ غَيْرُهَا نَعَمْ يَا رَسُولَ اللَّهِ، لاَ يَدْرِي الْحَسَنُ مَنْ هِيَ. قَالَ \" فَتَصَدَّقْنَ \" وَبَسَطَ بِلاَلٌ ثَوْبَهُ فَجَعَلْنَ يُلْقِينَ الْفَتَخَ وَالْخَوَاتِيمَ فِي ثَوْبِ بِلاَلٍ.\n- **الصفحة:** ج6 ص151.\n- **المستفاد:** بعد خطبة العيد شق الصفوف حتى أتى النساء ومعه بلال، فقرأ عليهن آية البيعة، ثم سألهن: «أنتن على ذلك؟»، ثم أمرهن بالصدقة. تخصيص النساء بمجلس تعليم مستقل.\n\n---\n\n## سورة الصف\n\n### H-BKH-4896 — «إن لي أسماء»\nحَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، أَخْبَرَنِي مُحَمَّدُ بْنُ جُبَيْرِ بْنِ مُطْعِمٍ، عَنْ أَبِيهِ ـ رضى الله عنه ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ  \" إِنَّ لِي أَسْمَاءً، أَنَا مُحَمَّدٌ، وَأَنَا أَحْمَدُ، وَأَنَا الْمَاحِي الَّذِي يَمْحُو اللَّهُ بِيَ الْكُفْرَ، وَأَنَا الْحَاشِرُ الَّذِي يُحْشَرُ النَّاسُ عَلَى قَدَمِي، وَأَنَا الْعَاقِبُ \".\n- **الصفحة:** ج6 ص151.\n- **المستفاد:** خمسة أسماء من قوله ﷺ: محمد، وأحمد، والماحي، والحاشر، والعاقب. أورده البخاري تحت 61:6 «اسمه أحمد».\n\n---\n\n## سورة الجمعة\n\n### H-BKH-4897 و4898 — «وآخرين منهم لما يلحقوا بهم» وسلمان الفارسي `C08`\nحَدَّثَنِي عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ ثَوْرٍ، عَنْ أَبِي الْغَيْثِ، عَنْ أَبِي هُرَيْرَةَ، رضى الله عنه قَالَ كُنَّا جُلُوسًا عِنْدَ النَّبِيِّ صلى الله عليه وسلم فَأُنْزِلَتْ عَلَيْهِ سُورَةُ الْجُمُعَةِ {وَآخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا بِهِمْ} قَالَ قُلْتُ مَنْ هُمْ يَا رَسُولَ اللَّهِ فَلَمْ يُرَاجِعْهُ حَتَّى سَأَلَ ثَلاَثًا، وَفِينَا سَل
