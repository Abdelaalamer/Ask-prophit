<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إسأل النبي ﷺ">
<title>إسأل النبي محمد ﷺ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#25438C">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: desktop = fixed library column on the right (RTL) + reading column ≤ 70ch; phone = one column, sticky search bar on top, tab bar at the bottom */
:root{
  --paper:#F1F2EE;
  --surface:#FBFBF9;
  --ink:#172127;
  --muted:#5A6570;
  --rule:#D8DCD6;
  --lapis:#25438C;
  --lapis-soft:#E2E7F3;
  --font-display:"Reem Kufi","Noto Naskh Arabic",serif;
  --font-read:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --font-ui:"IBM Plex Sans Arabic","Segoe UI","Geeza Pro",system-ui,sans-serif;
  --gA:#1D5E46; --gB:#2C7A4B; --gC:#6A7A1C; --gD:#A35F06; --gE:#4D5866; --gF:#6D3FB5; --gX:#B42318;
  --s-strong:var(--lapis); --s-start:#7F96C9; --s-tent:#C9D2E6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161B; --surface:#171E25; --ink:#E6E9EC; --muted:#9AA5B0; --rule:#2A333C;
    --lapis:#8FA8E8; --lapis-soft:#1E2A44;
    --gA:#5FBF95; --gB:#6CCB8E; --gC:#C2CF62; --gD:#E5A64B; --gE:#A7B1BD; --gF:#B596EE; --gX:#F27B6F;
    --s-strong:#8FA8E8; --s-start:#4F659A; --s-tent:#2B3A57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161B; --surface:#171E25; --ink:#E6E9EC; --muted:#9AA5B0; --rule:#2A333C;
  --lapis:#8FA8E8; --lapis-soft:#1E2A44;
  --gA:#5FBF95; --gB:#6CCB8E; --gC:#C2CF62; --gD:#E5A64B; --gE:#A7B1BD; --gF:#B596EE; --gX:#F27B6F;
  --s-strong:#8FA8E8; --s-start:#4F659A; --s-tent:#2B3A57;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--lapis)}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1280px;margin:0 auto}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand b{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.2;letter-spacing:0}
.brand span{font-size:.72rem;color:var(--muted);line-height:1.3}
.searchbox{flex:1;position:relative;max-width:560px}
.searchbox input{width:100%;font:inherit;font-size:1rem;padding:9px 40px 9px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink)}
.searchbox input:focus{outline:none;border-color:var(--lapis);box-shadow:0 0 0 3px var(--lapis-soft)}
.searchbox svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;max-width:1280px;margin:0 auto}
.side{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;border-left:1px solid var(--rule);padding:18px 14px 40px}
.main{padding:22px 28px 120px;min-width:0}
.tabs{display:none}

/* library */
.lib-sec{margin-bottom:14px}
.lib-sec h4{margin:0 0 4px;font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:0}
.lib-sec h4 bdi{font-variant-numeric:tabular-nums}
.lib-sec a{display:block;padding:5px 9px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.9rem;line-height:1.45}
.lib-sec a:hover{background:var(--lapis-soft)}
.lib-sec a.on{background:var(--lapis-soft);color:var(--lapis);font-weight:600}
.lib-sec a small{display:block;color:var(--muted);font-size:.72rem;direction:ltr;text-align:right;unicode-bidi:isolate}

/* home */
.hero{padding:6px 0 18px;border-bottom:3px double var(--rule);margin-bottom:22px}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.25;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.block{margin:0 0 30px}
.block>h2{font-family:var(--font-display);font-weight:500;font-size:1.3rem;margin:0 0 4px}
.block>.sub{color:var(--muted);font-size:.86rem;margin:0 0 14px}
.meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.meter{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.meter .n{font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.meter .l{font-size:.82rem;color:var(--muted)}
.bar{height:6px;background:var(--lapis-soft);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lapis);border-radius:6px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;text-align:right;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:86px;position:relative}
.tile:hover{border-color:var(--lapis)}
.tile .c{font-size:.72rem;color:var(--muted);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tile .t{font-size:.9rem;font-weight:600;line-height:1.4}
.tile .st{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid var(--s-strong)}
.dot.strong{background:var(--s-strong)}
.dot.start{background:linear-gradient(90deg,var(--s-strong) 50%,transparent 50%)}
.dot.tent{background:transparent}
.dot.none{border-style:dashed;border-color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}

.scale{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.scale div{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.86rem;line-height:1.55}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.card:hover{border-color:var(--lapis)}
.card b{display:block;font-size:.95rem}
.card span{font-size:.8rem;color:var(--muted)}
.card.warn{border-inline-start:4px solid var(--gX)}
.note{font-size:.84rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;max-width:70ch}

/* grade chip */
.g{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.45em;padding:0 .35em;border-radius:5px;font-family:var(--font-ui);font-weight:600;font-size:.78em;line-height:1;color:#fff;vertical-align:.12em;direction:ltr;unicode-bidi:isolate}
.g-A{background:var(--gA)}.g-B{background:var(--gB)}.g-C{background:var(--gC)}.g-D{background:var(--gD)}.g-E{background:var(--gE)}.g-F{background:var(--gF)}.g-X{background:var(--gX)}
:root[data-theme="dark"] .g{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g{color:#111}}

/* reader */
.crumb{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
.toc{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.toc a{flex-shrink:0;font-size:.8rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;white-space:nowrap}
.toc a:hover{border-color:var(--lapis);color:var(--lapis)}
.doc{max-width:72ch;font-family:var(--font-read);font-size:1.06rem;line-height:2}
.doc h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.45rem,3.6vw,1.9rem);line-height:1.45;margin:6px 0 14px;text-wrap:balance}
.doc h2{font-family:var(--font-display);font-weight:500;font-size:1.32rem;line-height:1.5;margin:34px 0 10px;padding-top:12px;border-top:1px solid var(--rule);text-wrap:balance}
.doc h3{font-family:var(--font-ui);font-weight:600;font-size:1.05rem;line-height:1.6;margin:26px 0 6px;color:var(--lapis);text-wrap:balance}
.doc h4{font-family:var(--font-ui);font-weight:600;font-size:.98rem;margin:20px 0 4px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-inline-start:1.4em}
.doc li{margin:2px 0}
.doc li>ul,.doc li>ol{margin:2px 0}
.doc hr{border:0;border-top:3px double var(--rule);margin:26px 0}
.doc blockquote{margin:0 0 12px;padding:6px 14px;border-inline-start:3px solid var(--lapis);background:var(--lapis-soft);border-radius:4px}
.doc strong{font-weight:600}
.tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.doc table{border-collapse:collapse;font-family:var(--font-ui);font-size:.86rem;line-height:1.6;min-width:100%}
.doc th,.doc td{padding:7px 10px;text-align:right;vertical-align:top;border-bottom:1px solid var(--rule)}
.doc th{font-weight:600;background:var(--lapis-soft);white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.saw{font-family:"Noto Naskh Arabic","Geeza Pro","SF Arabic",serif;font-weight:400}
code,.ref{font-family:var(--font-ui);font-size:.8em;direction:ltr;unicode-bidi:isolate;white-space:nowrap;background:var(--lapis-soft);border-radius:4px;padding:.05em .4em}
.ref{color:var(--lapis);text-decoration:none;cursor:pointer}
.ref:hover{text-decoration:underline}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--lapis-soft)}100%{background:transparent}}

/* search */
.res{display:flex;flex-direction:column;gap:8px;max-width:76ch}
.hit{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.hit:hover{border-color:var(--lapis)}
.hit .w{font-size:.75rem;color:var(--muted)}
.hit .h{font-weight:600;font-size:.95rem;line-height:1.5}
.hit .s{font-family:var(--font-read);font-size:.95rem;line-height:1.9;color:var(--ink)}
.hit mark{background:var(--lapis-soft);color:var(--lapis);border-radius:3px;padding:0 2px}
.empty{color:var(--muted);max-width:60ch}
/* ask */
.ask{max-width:780px}
.ask-intro{border-bottom:3px double var(--rule);padding-bottom:14px;margin-bottom:16px}
.ask-intro h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.3;margin:0 0 6px;text-wrap:balance}
.ask-intro p{margin:0 0 6px;color:var(--muted);font-size:.92rem;max-width:66ch}
.examples{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.examples button{text-align:right;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:.92rem;line-height:1.6}
.examples button:hover{border-color:var(--lapis);color:var(--lapis)}
.msgs{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.msg-u{align-self:flex-end;max-width:88%;background:var(--lapis-soft);border-radius:14px 14px 4px 14px;padding:10px 14px;white-space:pre-wrap;font-size:.98rem;line-height:1.75}
.msg-a{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:4px 18px 12px}
.msg-a .doc{max-width:none;font-size:1.02rem}
.msg-a .doc h3{margin-top:16px}
.thinking{color:var(--muted);font-size:.9rem;padding:12px 0;display:flex;gap:8px;align-items:center}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--lapis);animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.used{border-top:1px solid var(--rule);margin-top:6px;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--muted)}
.used a{text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:.76rem}
.used a:hover{border-color:var(--lapis);color:var(--lapis)}
.err{color:var(--gX);font-size:.9rem;padding:10px 0}
.composer{position:sticky;bottom:14px;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:8px;box-shadow:0 6px 24px rgba(20,30,40,.08)}
.composer textarea{flex:1;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1rem;line-height:1.6;padding:6px 8px;max-height:170px;min-height:40px}
.composer textarea:focus{outline:none}
.composer:focus-within{border-color:var(--lapis)}
.btn{cursor:pointer;border:0;border-radius:11px;padding:9px 16px;font-weight:600;font-size:.92rem;background:var(--lapis);color:var(--paper);flex-shrink:0}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule);font-weight:500}
.ask-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px;font-size:.76rem;color:var(--muted)}
.view-title{font-family:var(--font-display);font-weight:500;font-size:1.45rem;margin:0 0 4px}
.view-sub{color:var(--muted);font-size:.88rem;margin:0 0 16px;max-width:70ch}
.topic-ev{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-family:var(--font-read);line-height:2;max-width:76ch}

@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .main{padding:16px 16px 110px}
  .brand span{display:none}
  .brand b{font-size:1.1rem}
  .tabs{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:30;background:var(--surface);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;padding:4px 0}
  .tabs a.on{color:var(--lapis);font-weight:600}
  .tabs svg{width:22px;height:22px}
  .doc{font-size:1.04rem}
  .composer{bottom:calc(72px + env(safe-area-inset-bottom))}
  .tabs a{font-size:.7rem}
}
@media (prefers-reduced-motion: reduce){.flash{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#ask"><b>إسأل النبي <span class="saw">ﷺ</span></b><span>قاعدة المعرفة · حتى الدفعة 4</span></a>
    <form class="searchbox" id="sf" role="search">
      <input id="q" type="search" placeholder="ابحث: الإنصات، حاطب، H-BKH-4890، T26…" autocomplete="off" aria-label="البحث في قاعدة المعرفة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </form>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="الفهرس"></nav>
  <main class="main" id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="التنقل">
  <a href="#ask" data-v="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h6"/></svg>اسأل</a>
  <a href="#home" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>المعرفة</a>
  <a href="#library" data-v="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8-1 3 15.5-3.8 1z"/></svg>الفهرس</a>
  <a href="#search" data-v="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>البحث</a>

const DATA = {"docs": [{"code": "GOV-00", "slug": "gov-00", "sec": "00", "title": "الخطة الرئيسية — مشروع «إسأل النبي محمد ﷺ»", "short": "الخطة الرئيسية", "md": "# الخطة الرئيسية — مشروع «إسأل النبي محمد ﷺ»\n\n- **الإصدار:** 1.0 — مسودة بانتظار الاعتماد\n- **التاريخ:** 15 نوفمبر 2026\n- **الوثائق المرافقة في مجلد الحوكمة:** سجل المصادر، منهج التحقق\n\n---\n\n## تحديث الإصدار 1.1 — 15 نوفمبر 2026 (بتوجيه صاحب المشروع)\n\nهذا التحديث يتقدم على ما يخالفه في بقية الوثيقة:\n\n1. **هيكل قاعدة المعرفة:** صار ثلاثة عشر قسماً كما حددها صاحب المشروع (البند 6.2 بعد التعديل). يحل محل هيكل المجلدات السابق.\n2. **سلم الثقة المعروض:** اعتُمد السلم A–F لكل معلومة، وتبقى الأوسمة التفصيلية في منهج التحقق تحته (البند 10 من منهج التحقق).\n3. **ترتيب العمل:** القرآن، ثم السنة بدءاً بالصحيحين، ثم السيرة، ثم الشمائل والأخلاق، بدفعات متوازية لا متعاقبة. الدراسة التجريبية للشمائل نُقلت إلى قسم الشمائل.\n4. **سجل الإنجاز:** انتقل إلى القسم 13 (تقدم البحث)، ومعه سجل التغطية الحي.\n5. **موضوعات مضافة:** أُضيفت ثلاثة جوانب طلبها صاحب المشروع صراحة: `T26` الاستماع والإنصات، `T27` التعامل مع النقد، `T28` التعامل مع المواقف المحرجة.\n6. **خريطة الإتاحة تغيرت:** ثبت في الدفعة الأولى أن مدونة OpenITI على GitHub متاحة من بيئة العمل، وفيها النص الكامل الحرفي لأغلب المصادر التراثية ذات الأولوية مع أرقام صفحات الطبعات. التفاصيل في سجل المصادر (البند 11).\n7. **قيد جديد:** أداة جلب الصفحات لا تعيد النص الحرفي (حد الاقتباس فيها 125 حرفاً للمصدر)، فلا تصلح لقراءة الكتب، وتبقى للاكتشاف فقط.\n\n---\n\n## 1. الغاية والنطاق\n\nبناء قاعدة معرفية موثقة ومترابطة عن سيرة النبي ﷺ وشمائله وهديه، قادرة بعد اكتمال مراحلها الأساسية على استحضار المواقف الثابتة المتعلقة بأي سؤال، وفهم سياقها، واستخلاص المبادئ منها، مع التمييز الصريح بين النص والاستنتاج.\n\n**خارج نطاق المشروع:**\n- إصدار الفتاوى في النوازل الفقهية؛ المشروع يعرض الأدلة وأقوال العلماء، والفتوى لأهلها.\n- الحكم المستقل على الأسانيد؛ المشروع ينقل أحكام الأئمة والمحققين ويوثق مصدرها.\n- التحدث بلسان النبي ﷺ، أو افتراض ما كان سيقوله في موقف لم يرد فيه نص.\n\n---\n\n## 2. الأسئلة الخمسة الحاكمة لكل مدخل\n\nكل نص أو موقف يدخل القاعدة يمر على هذه الأسئلة بالترتيب:\n\n1. **الثبوت:** هل ثبت؟ بأي درجة؟ ومن حكم بذلك؟\n2. **السياق:** متى وأين ولماذا؟ من كان حاضراً؟ وما الظرف العام؟\n3. **نوع التصرف:** تشريع عام، أم خصوصية نبوية، أم فعل جبلي أو عادي، أم تصرف بالإمامة أو القضاء، أم رأي في شأن دنيوي؟ (يُنقل تصنيف العلماء، ولا يُجتهد فيه من عندنا).\n4. **المبدأ:** ما المبدأ المستخلص؟ هل هو منصوص أم مستنبط؟ ومن سبق إلى استنباطه؟\n5. **التنزيل:** كيف يُطبق اليوم؟ وما حدوده وشروطه؟\n\n---\n\n## 3. هيكل المعرفة\n\n### 3.1 المحاور الثمانية\n\n| المحور | المحتوى | الرمز |\n|---|---|---|\n| 1. السيرة الزمنية | الأحداث مرتبة بالتاريخ ومجمعة في 11 مرحلة | `E` و `S` |\n| 2. الشخصية والمنهج | 25 موضوعاً، وفئات الناس، والحياة اليومية | `T` و `C` و `D` |\n| 3. القرآن والسيرة | فهرس موضوعي للآيات، وأسباب النزول الثابتة | `Q` |\n| 4. الأحاديث والآثار | كل نص مدروس بتخريجه ودرجته وسياقه | `H` |\n| 5. المبادئ العملية | المبادئ المستخلصة بأدلتها ودرجة قوتها | `P` |\n| 6. أدوات الفهم | تصنيف التصرفات النبوية، الخصوصيات، أسباب الخلاف | — |\n| 7. قائمة التحذير | الأحاديث المشهورة الضعيفة والموضوعة | `W` |\n| 8. الأسئلة المفتوحة | ما لم يُحسم بحثياً بعد | `OQ` |\n\n### 3.2 مراحل السيرة\n\n| الرمز | المرحلة |\n|---|---|\n| `S01` | ما قبل البعثة |\n| `S02` | نزول الوحي وبداية الدعوة |\n| `S03` | المرحلة المكية |\n| `S04` | الهجرة إلى المدينة |\n| `S05` | تأسيس المجتمع والدولة في المدينة |\n| `S06` | الغزوات والأحداث الكبرى |\n| `S07` | العلاقات مع القبائل والدول |\n| `S08` | صلح الحديبية |\n| `S09` | فتح مكة |\n| `S10` | حجة الوداع |\n| `S11` | السنوات والأيام الأخيرة |\n\n**ملاحظة منهجية:** المرحلتان السادسة والسابعة موضوعيتان تمتدان عبر السنوات المدنية كلها، وبقية المراحل زمنية. لذلك يُبنى الخط الزمني على التاريخ نفسه (ما قبل البعثة، ثم سنوات البعثة في مكة، ثم السنوات الهجرية من 1 إلى 11)، ويُوسم كل حدث بمرحلة أو أكثر. بهذا لا يتكرر الحدث ولا يضيع ترتيبه.\n\n### 3.3 موضوعات الشخصية والمنهج\n\n| الرمز | الموضوع | الرمز | الموضوع |\n|---|---|---|---|\n| `T01` | شخصيته الإنسانية | `T14` | التعامل مع الفقر والغنى |\n| `T02` | الرحمة والرفق واللين | `T15` | التعامل مع النجاح والفشل |\n| `T03` | الحزم والقوة عند الحاجة | `T16` | التعامل مع الخوف والقلق والحزن |\n| `T04` | الصبر والتحمل | `T17` | التعامل مع الأصدقاء والأعداء |\n| `T05` | التواضع | `T18` | القيادة وإدارة الجماعات |\n| `T06` | الكرم والعطاء | `T19` | إدارة الأسرة والحياة الزوجية |\n| `T07` | الصدق والأمانة | `T20` | التربية وبناء الإنسان |\n| `T08` | العدل والإنصاف | `T21` | التجارة والعمل والحقوق المالية |\n| `T09` | الذكاء الاجتماعي | `T22` | المسؤولية والسلطة |\n| `T10` | الحكمة في اتخاذ القرارات | `T23` | التخطيط والاستعداد للمستقبل |\n| `T11` | إدارة الخلافات | `T24` | التعامل مع الاختلاف في الرأي |\n| `T12` | التعامل مع الغضب | `T25` | التوازن بين العبادة والحياة اليومية |\n| `T13` | التعامل مع الإساءة والاستفزاز | | |\n\n### 3.4 فئات الناس (فهرس عرضي)\n\n| الرمز | الفئة | الرمز | الفئة |\n|---|---|---|---|\n| `C01` | الزوجات | `C07` | الضعفاء والفقراء والمرضى |\n| `C02` | الأبناء والبنات والأحفاد | `C08` | الغرباء والأعراب والوفود |\n| `C03` | الأطفال عامة | `C09` | أهل الكتاب وغير المسلمين |\n| `C04` | الأصحاب | `C10` | الأعداء والمحاربون |\n| `C05` | النساء | `C11` | المنافقون |\n| `C06` | الخدم والعمال | `C12` | المخطئون وأصحاب الذنوب |\n\n### 3.5 الحياة اليومية (فهرس عرضي)\n\n| الرمز | الجانب | الرمز | الجانب |\n|---|---|---|---|\n| `D01` | الصفة الخَلقية | `D05` | الكلام والضحك والمزاح |\n| `D02` | الطعام والشراب | `D06` | العبادة اليومية |\n| `D03` | اللباس والزينة | `D07` | المعاش والنفقة والبيت |\n| `D04` | النوم والفراش والمسكن | `D08` | المرض والوفاة |\n\n---\n\n## 4. منهج الدراسة: أساس كامل وتوسع موجّه\n\nالمصادر المذكورة في تعليمات المشروع تتجاوز في مجموعها عشرات الآلاف من الصفحات: تفسير الطبري وحده أكثر من عشرين مجلداً في طبعته المحققة، وفتح الباري ثلاثة عشر مجلداً، والمسند قرابة سبعة وعشرين ألف حديث. قراءة ذلك كله من الغلاف إلى الغلاف قبل أي تركيب ليست واقعية ولا لازمة. المنهج المقترح ثلاث طبقات:\n\n1. **نصوص أساس تُدرس كاملة (المستوى L4):** المصحف (مسح موضوعي لكل الآيات)، الشمائل المحمدية، الأدب المفرد، الكتب المختارة من الصحيحين ثم بقيتهما، سيرة ابن هشام، الأقسام المختارة من زاد المعاد، جامع العلوم والحكم، الصحيح المسند من أسباب النزول، السيرة النبوية الصحيحة للعمري، كتاب القرافي في تمييز التصرفات النبوية.\n2. **مصادر تُدرس موجهةً (L3):** التفاسير والشروح والسنن وكتب التاريخ. يُقرأ منها كاملاً كل موضع يتعلق بحديث أو حدث أو آية دخلت القاعدة، مع تسجيل نسبة التغطية بدقة.\n3. **مراجع (L1 و L2):** كتب الرجال والتخريج والفقه المقارن. تُفهرس ويُرجع إليها عند الحاجة.\n\n**قاعدة:** لا يوصف أي مصدر من الطبقة الثانية أو الثالثة بأنه «مدروس». يُذكر مستواه ونسبة ما قُرئ منه فقط.\n\n---\n\n## 5. المراحل البحثية\n\n### 5.1 ملخص المراحل\n\n| المرحلة | الهدف | الجلسات التقديرية |\n|---|---|---|\n| 0 | التأسيس المنهجي | جلسة واحدة (هذه) |\n| 1 | البنية التحتية والدراسة التجريبية | 8–12 |\n| 2 | القرآن الكريم | 10–15 |\n| 3 | الحديث الموضوعي: الأخلاق والشمائل والمعاملة | 20–30 |\n| 4 | السيرة التفصيلية | 20–30 |\n| 5 | الفهم الأصولي والمقاصدي | 10–15 |\n| 6 | التركيب والاختبار | 8–12 |\n| 7 | التوسع المستمر | مفتوحة |\n\n**الجلسة** = محادثة عمل واحدة داخل المشروع، تبدأ بقراءة سجل الإنجاز وتنتهي بتحديثه (انظر البند 6.6).\n\n### 5.2 تفاصيل المراحل\n\n#### المرحلة 0 — التأسيس المنهجي\n- **الأهداف:** الخطة الرئيسية، سجل المصادر، منهج التحقق، نظام الحفظ، آلية قياس التغطية، اختبار الأدوات.\n- **المخرجات:** وثائق الحوكمة الأربع في مجلد `00-governance`.\n- **معيار الإكمال:** اعتمادك للهيكل، مع أي تعديلات تطلبها.\n\n#### المرحلة 1 — البنية التحتية والدراسة التجريبية\n- **1أ. حسم أدوات الوصول:** ربط موصل المكتبة الشاملة واختباره، اختبار مدونات النصوص المفتوحة، تحديد النسخة المعتمدة لكل مصدر من الأولوية (أ): الطبعة والمحقق ونظام الترقيم والعدد الكلي للوحدات. **المخرج:** رفع مصادر الأولوية (أ) إلى المستوى L1 في سجل المصادر.\n- **1ب. الخط الزمني الهيكلي:** نحو 150 حدثاً مرتبة بالتاريخ. لكل حدث: التاريخ وما فيه من خلاف، موضعه في الصحيحين إن وُجد، موضعه في سيرة ابن هشام، الآيات المرتبطة. **المخرج:** النسخة الأولى من مجلد `10-timeline`.\n- **1ج. الدراسة التجريبية الكاملة للشمائل المحمدية:** في طبعة الجليمي 56 باباً و415 نصاً بالمكرر بين مرفوع وموقوف (والعدد يختلف بين الطبعات، ويُحسم عند اعتماد النسخة). كل نص: المتن، التخريج، الحكم (الألباني في مختصر الشمائل مع حكم ثانٍ عند الحاجة)، التصنيف الموضوعي. **المخرج:** قاعدة الشمائل في مجلد `30-hadith-db`، وتغذية أولى لملفات الموضوعات.\n- **1د. نواة قائمة التحذير:** نحو 50 حديثاً مشهوراً على الألسنة، ضعيفاً أو موضوعاً، موثقة الحكم.\n- **1هـ. مراجعة المنهج بعد التجربة:** تعديل القوالب وقواعد التحقق بناءً على المشكلات الفعلية، وقياس الإنتاجية الحقيقية للجلسة لإعادة معايرة الجدول الزمني.\n- **معيار الإكمال:** الشمائل في المستوى L5، الخط الزمني بنسخته الأولى مع مصدر لكل حدث، مصادر (أ) في L1 على الأقل، وتقرير مرحلة.\n\n#### المرحلة 2 — القرآن الكريم\n- مسح كامل للمصحف (6236 آية) وتوسيم الآيات المتعلقة بشخص النبي ﷺ وصفاته، وأحداث السيرة، والأخلاق والمنهج، والأسرة والمعاملات، والقيادة والمسؤولية.\n- أسباب النزول الثابتة للآيات الموسومة، من الصحيح المسند من أسباب النزول، والمحرر في أسباب نزول القرآن، مع الرجوع إلى أسباب النزول للواحدي.\n- تفسير الآيات الأساسية من التفاسير الستة (دراسة موجهة L3).\n- **المخرجات:** الفهرس الموضوعي للقرآن في مجلد `40-quran`، وربط الآيات بالأحداث والموضوعات.\n- **معيار الإكمال:** المصحف L4 (كل آية مرّت وسُجلت)، والتفاسير L3 بنسبة مسجلة.\n\n#### المرحلة 3 — الحديث الموضوعي\n- الأدب المفرد كاملاً، مع أحكام الألباني في صحيح الأدب المفرد وضعيفه.\n- من صحيح البخاري: كتب بدء الوحي، المناقب، فضائل الصحابة، الأدب، الاستئذان، الدعوات، الرقاق، الأحكام.\n- من صحيح مسلم: كتب الفضائل، فضائل الصحابة، البر والصلة والآداب، الزهد والرقائق، الإمارة، السلام.\n- شرح الأحاديث المختارة من فتح الباري وشرح النووي وجامع العلوم والحكم.\n- رياض الصالحين فهرساً موضوعياً مساعداً.\n- **المخرجات:** نسخة أولى مكتملة الأدلة لملفات الموضوعات الخمسة والعشرين.\n\n#### المرحلة 4 — السيرة التفصيلية\n- سيرة ابن هشام كاملة (L4).\n- زاد المعاد: أقسام الهدي والسيرة والمغازي (L4 للأقسام المحددة).\n- كتاب المغازي في صحيح البخاري، وكتاب الجهاد والسير في صحيح مسلم (L4).\n- مقارنة الأحداث الكبرى مع ابن سعد والطبري والبداية والنهاية (L3)، والترجيح بمعونة السيرة النبوية الصحيحة للعمري.\n- تحليل كل مرحلة وفق البنود التسعة في تعليمات المشروع.\n- **تنبيه:** «البدائل الممكنة» لا تُبحث إلا حيث ذكرتها المصادر نفسها (كالمشاورات التي طُرحت فيها آراء متعددة)، ولا تُصنع سيناريوهات افتراضية.\n- **المخرجات:** الخط الزمني الكامل، ودراسة تحليلية لكل مرحلة.\n\n#### المرحلة 5 — الفهم الأصولي والمقاصدي\n- تصنيف التصرفات النبوية من كتب القرافي ومقاصد ابن عاشور وكتاب الأشقر في أفعال الرسول ﷺ.\n- الخصائص النبوية الثابتة بأدلتها.\n- المقاصد والمصالح من الموافقات وقواعد الأحكام.\n- منهج الفتوى وتغيرها من إعلام الموقعين، وأسباب الخلاف من بداية المجتهد.\n- **المخرجات:** دليل تنزيل المبادئ على الواقع وضوابطه في مجلد `60-principles`.\n\n#### المرحلة 6 — التركيب والاختبار\n- الدراسات المتعمقة للموضوعات الخمسة والعشرين بنسختها النهائية الأولى.\n- مكتبة المبادئ العملية، مع درجة قوة كل مبدأ.\n- اختبار المشروع بثلاثين سؤالاً واقعياً من مجالات مختلفة، وتقييم الإجابات وفق معايير النجاح في تعليمات المشروع.\n- **معيار الإكمال:** إعلان جاهزية وضع الإجابة الكامل.\n\n#### المرحلة 7 — التوسع المستمر\n- إكمال الصحيحين، والسنن الأربع، وتخريج المسند، وابن سعد والطبري والشروح.\n- تقرير دوري بعد كل عشر جلسات.\n\n### 5.3 التقدير الزمني\n\nمجموع المراحل من 1 إلى 6 بين 76 و114 جلسة. بمعدل ثلاث جلسات أسبوعياً: **نحو 6 إلى 9 أشهر.** هذا تقدير أولي يُعاد ضبطه بعد قياس الإنتاجية الفعلية في الدراسة التجريبية للشمائل.\n\n### 5.4 متى تبدأ الإجابة عن الأسئلة؟\n\nالتزاماً بتعليماتك، لا إجابة عن الأسئلة اليومية قبل اكتمال الأساس. المقترح بوابتان:\n- **البوابة الأولى (بعد المرحلة 3):** وضع محدود. الإجابة مسبوقة بإفصاح صريح عن مدى تغطية القاعدة للموضوع.\n- **البوابة الثانية (بعد المرحلة 6):** الوضع الكامل.\n\n---\n\n## 6. نظام حفظ المعرفة\n\n### 6.1 أين تُحفظ المعرفة\n\n| المستوى | الوسيلة | الدور |\n|---|---|---|\n| دائم ورسمي | وثائق المشروع | المستودع الوحيد المعتمد. تقرؤه كل محادثات المشروع وتبحث فيه |\n| مساعد | ذاكرة المشروع | ملاحظات قصيرة فقط، مثل نقطة التوقف |\n| مؤقت | مساحة العمل داخل الجلسة | تُمحى بانتهاء المحادثة. لا يُعتمد عليها |\n\n**قاعدة:** ما لم يُحفظ في وثائق المشروع يُعتبر غير منجز.\n\n### 6.2 هيكل المجلدات\n\n**الهيكل المعتمد منذ الإصدار 1.1:**\n\n```\n00-governance/                     الخطة، سجل المصادر، منهج التحقق\n01-master-knowledge-index/         الفهرس الرئيسي لكل المعرفة والمعرفات\n02-quran-knowledge-base/           القرآن والتفسير وأسباب النزول\n03-hadith-knowledge-base/          الأحاديث ودرجاتها وشروحها\n04-seerah-chronology/              التسلسل الزمني للسيرة\n05-prophetic-character/            الشخصية والصفات والأخلاق (T01–T28)\n06-prophetic-decisions/            القرارات والمواقف النبوية\n07-family-and-social-relations/    العلاقات الأسرية والاجتماعية\n08-leadership-and-management/      القيادة والإدارة والتخطيط\n09-human-behavior-and-ethics/      الأخلاق والتعامل الإنساني والمبادئ\n10-daily-life-applications/        التطبيقات المعاصرة (مستوى F)\n11-scholarly-differences/          الخلاف بين العلماء وبين الروايات\n12-research-gaps/                  ما يحتاج مزيد بحث\n13-research-progress/              التغطية، تقارير الدفعات، سجل الجلسات\n```\n\nقائمة التحذير (الأحاديث الضعيفة والموضوعة المشهورة) تُحفظ داخل قسم الأحاديث. يُقسم أي ملف يتجاوز نحو 150 مدخلاً إلى أجزاء مرقمة.\n\n### 6.3 نظام المعرفات\n\n| النوع | صيغة المعرّف | مثال |\n|---|---|---|\n| حديث أو أثر | رمز المصدر ثم الرقم | `H-SHM-0012` |\n| حدث | رمز المرحلة ثم تسلسل | `E-S04-007` |\n| آية | السورة ثم الآية | `Q-68:4` |\n| موضوع | رقم الموضوع | `T13` |\n| مبدأ | الموضوع ثم تسلسل | `P-T13-02` |\n| تحذير | تسلسل | `W-0031` |\n| سؤال مفتوح | تسلسل | `OQ-0004` |\n\nرموز المصادر مثبتة في سجل المصادر.\n\n### 6.4 قوالب المداخل\n\n**مدخل الحديث:**\n- المعرّف\n- النص (بلفظ المصدر المعتمد)\n- الراوي\n- المصدر الأصلي (الكتاب، الباب، الرقم، النسخة المعتمدة)\n- التخريج (مواضعه الأخرى بالترقيم المعتمد)\n- الدرجة (من سلم الدرجات في منهج التحقق)\n- مصدر الحكم (اسم المحدث، الكتاب، الموضع)\n- السياق وسبب الورود\n- نوع التصرف ومن صنّفه\n- الموضوعات والفئات المرتبطة\n- الروابط (أحداث، آيات، مبادئ)\n- رابط التحقق\n- حالة التحقق: موثق أو مسودة، مع تاريخ الجلسة\n\n**مدخل الحدث:**\n- المعرّف والاسم\n- التاريخ، مع الأقوال المخالفة\n- المكان، والأشخاص\n- الملخص الموثق\n- المصادر بمراتبها (صحيح، سيرة، تاريخ)\n- درجة الثبوت\n- الآيات والأحاديث المرتبطة\n- القرار أو الموقف النبوي\n- البدائل المذكورة في المصادر فقط\n- النتائج\n- الدروس، موسومة بأنها تحليل، مع من سبق إليها من العلماء\n\n**مدخل الآية:**\n- المعرّف والنص\n- المرحلة (مكية أو مدنية) والحدث المرتبط\n- سبب النزول الثابت إن وُجد، ودرجته\n- خلاصة التفسير من التفاسير المعتمدة، منسوبة لكل مفسر\n- الموضوعات المرتبطة\n\n**مدخل المبدأ:**\n- المعرّف ونص المبدأ\n- الأدلة (معرّفاتها)\n- نوع الاستدلال: نص صريح، أو استنباط قريب، أو استنباط اجتهادي\n- من قال به من العلماء\n- الحدود والضوابط وما لا يدخل فيه\n- أمثلة تطبيقية معاصرة\n\n### 6.5 قواعد الربط\n- كل مدخل يحمل معرّفات ما يرتبط به، ويُحدَّث الطرف الآخر في الجلسة نفسها.\n- ملفات الموضوعات تعمل فهارس: تجمع معرّفات الأحاديث والأحداث والآيات والمبادئ الخاصة بكل موضوع.\n- لا يُنسخ النص في أكثر من موضع؛ يُذكر في مدخله الأصلي ويُشار إليه بالمعرّف في غيره.\n\n### 6.6 بروتوكول الجلسة\n\n**في البداية:**\n1. قراءة سجل الإنجاز وسجل التغطية.\n2. تحديد هدف الجلسة بنطاق محدد، مثل: الشمائل، الأبواب من 1 إلى 5.\n\n**أثناء العمل:**\n3. فتح النص من المصدر المعتمد، والتحقق، وإنشاء المداخل.\n\n**في النهاية:**\n4. حفظ المداخل في وثائق المشروع.\n5. تحديث سجل القراءة بالوحدات بدقة، وسجل التغطية، وسجل الإنجاز.\n6. تسجيل المشكلات وما بقي معلقاً.\n\n---\n\n## 7. قياس اكتمال دراسة المصادر\n\n### 7.1 المستويات\n\n| المستوى | الاسم | الشرط |\n|---|---|---|\n| L0 | لم يبدأ | — |\n| L1 | تحديد النسخة | نسخة رقمية موثوقة محددة: الطبعة، والمحقق، ونظام الترقيم، والعدد الكلي للوحدات |\n| L2 | الفهرسة | فهرس كامل للكتب والأبواب، وتحديد المواضع المتعلقة بمحاور المشروع |\n| L3 | دراسة جزئية | قراءة النص الكامل لوحدات محددة من الأصل واستخراج مداخلها، مع ذكر النسبة المئوية |\n| L4 | دراسة كاملة | قراءة جميع وحدات الكتاب من النص الأصلي، وتسجيل كل وحدة في سجل القراءة، حتى ما لم يُستخرج منه مدخل |\n| L5 | مراجعة | تدقيق عينة عشوائية لا تقل عن 10% من المداخل، وبحد أدنى 20 مدخلاً، مقابل الأصل، وتصحيح الأخطاء، وإكمال الروابط |\n\n### 7.2 وحدة القياس\n- **كتب الحديث:** الحديث برقمه في النسخة المعتمدة.\n- **كتب السيرة والتاريخ والشروح:** الصفحة من الطبعة المعتمدة، مع رقم الجزء.\n- **التفاسير:** تفسير الآية الواحدة.\n- **المصحف:** الآية.\n\n### 7.3 قواعد ملزمة\n1. لا يُرفع مستوى أي مصدر بناءً على ملخص، أو مقال عنه، أو فهرسه وحده، أو مقدمة محققه، أو معرفتي المسبقة.\n2. لا تُحسب الوحدة مقروءة إلا إذا فُتح نصها الكامل من النسخة المحددة في L1.\n3. نسبة التغطية = الوحدات المقروءة فعلاً ÷ إجمالي وحدات النسخة المعتمدة.\n4. كل وحدة مقروءة تُسجل في سجل القراءة: المصدر، والوحدة، وتاريخ الجلسة، والنسخة، والرابط، والمداخل الناتجة أو عبارة «لا مدخل».\n5. الوحدة التي تعذر فتحها تُسجل «متعذرة» مع السبب، ولا تُحسب.\n6. إذا تجاوزت الأخطاء الجوهرية في عينة التدقيق 5%، يُراجَع المصدر كله.\n7. سجل الإنجاز يذكر ما قُرئ بأرقام الوحدات، لا بعبارات عامة.\n\n---\n\n## 8. الأدوات والإمكانيات والقيود\n\nنتائج اختبار فعلي أُجري في جلسة التأسيس بتاريخ 15 نوفمبر 2026.\n\n### 8.1 ما يعمل الآن\n\n| الأداة | نتيجة الاختبار | الاستخدام | الحدود |\n|---|---|---|---|\n| البحث على الويب | يعمل | اكتشاف المواضع والطبعات والأحكام | المقتطفات للاكتشاف لا للاستشهاد |\n| جلب صفحات الويب | يعمل مع صفحات المكتبة الشاملة (اختُبر على مقدمة الشمائل بتحقيق الجليمي) | الاكتشاف وتحديد الطبعات وأرقام الصفحات فقط | ثبت في الدفعة الأولى أن الأداة لا تعيد أكثر من 125 حرفاً مقتبساً من المصدر، فهي تلخص ولا تنقل. لا تُحتسب بها قراءة |\n| الدرر السنية | الجلب المباشر فشل | أحكام العلماء تظهر جزئياً في مقتطفات البحث وفي مواقع ناقلة | مصدر استرشاد فقط حتى يُفتح الحكم في أصله |\n| موقع sunnah.com | الرابط المباشر مرفوض | يمكن فتح صفحاته إذا ظهرت في نتائج البحث | — |\n| نصوص الحديث المفتوحة على GitHub | متاحة من بيئة العمل | نصوص كاملة بالأسانيد لسبعة من الكتب التسعة: البخاري، ومسلم، وأبو داود، والترمذي، والنسائي، وابن ماجه، والموطأ | لا تشمل المسند ولا الأدب المفرد ولا الشمائل. ترقيمها يختلف عن المعتمد (البخاري 7589 مدخلاً مقابل 7563 في ترقيم فتح الباري، والترمذي 3998 مقابل 3956)، فتحتاج مطابقة. لا يُقتبس منها إلا بعد المطابقة مع الشاملة |\n| نصوص التفسير المفتوحة على GitHub | متاحة | التفاسير الستة المطلوبة كلها نصاً لكل آية، ومعها موسوعة التفسير المأثور، والدر المنثور، وتفسير ابن أبي حاتم، وأضواء البيان، وغيرها | الطبعة غير محددة، فتُطابق المواضع المقتبسة |\n| نص المصحف المفتوح على GitHub | متاح | النص الكامل، ومنه طبعة مجمع الملك فهد | — |\n| مدونة OpenITI للنصوص التراثية | **متاحة** (ثبت في الدفعة الأولى عبر git) | النص الكامل الحرفي لأغلب المصادر التراثية، مأخوذاً من نسخ الشاملة الرقمية مع علامات صفحات الطبعة | النسخة الرقمية قد تحمل أخطاء إدخال؛ يُذكر رقم نسخة الشاملة والطبعة مع كل استشهاد |\n| وثائق المشروع | تعمل | المستودع الدائم للمعرفة | — |\n| ذاكرة المشروع | تعمل | ملاحظات قصيرة | — |\n\n### 8.2 ما يحتاج تدخلك: موصل المكتبة الشاملة\n\nللمكتبة الشاملة خدمة رسمية عامة للقراءة فقط، لا تحتاج حساباً ولا تسجيل دخول. تتيح: البحث في المكتبة، وفتح الصفحات الأصلية، وتصفح الفهارس، والإحالة إلى أرقام صفحات المطبوع، والتحقق الآلي من وجود اقتباس في صفحة بعينها. شروط الخدمة تنص على أن مقتطفات البحث للاكتشاف فقط، ولا تصلح دليلاً حتى تُفتح الصفحة الأصلية، وهذا يطابق منهج المشروع تماماً.\n\n**هذه أهم أداة للمشروع، وأوصي بربطها قبل بدء المرحلة الأولى.** الخطوات بحسب دليل الشاملة (من متصفح على الكمبيوتر):\n1. ادخل إلى claude.ai، ثم «تخصيص» ثم «الوصلات».\n2. اضغط علامة الإضافة واختر «إضافة موصل مخصص».\n3. الاسم: المكتبة الشاملة. وعنوان الخادم:\n\n```\nhttps://mcp.shamela.ws\n```\n\n4. اترك خيارات المصادقة المتقدمة فارغة، ثم «إضافة»، ثم «ربط».\n5. في كل محادثة جديدة داخل المشروع: علامة الإضافة بجوار مربع الكتابة ← الوصلات ← فعّل «المكتبة الشاملة».\n\n### 8.3 القيود الجوهرية\n1. **الاستمرارية:** لا أحتفظ بشيء بين المحادثات إلا ما يُكتب في وثائق المشروع أو ذاكرته.\n2. **سعة السياق:** لا يمكن قراءة كتاب كبير دفعة واحدة، فالعمل بدفعات محددة النطاق.\n3. **المعرفة المسبقة:** معرفتي من التدريب بالسيرة والحديث واسعة، لكنها قد تخطئ في الأرقام والألفاظ والأحكام. تُستعمل لتوجيه البحث فقط، ولا تُعد دراسة، ولا يُستشهد بها.\n4. **لست محدّثاً مجتهداً:** لا أصدر أحكاماً مستقلة على الأسانيد. أنقل أحكام الأئمة والمحققين وأوثق مصادرها.\n5. **حقوق النشر:** الكتب المعاصرة محفوظة الحقوق (الرحيق المختوم، فقه السيرة، سيرة الندوي، كتاب العمري). أقرأ ما يتاح منها وألخص وأحلل دون نقل نصوص طويلة. إن كانت لديك نسخ منها فيمكنك رفعها للمشروع لدراستها.\n6. **حجب بعض المواقع:** الدرر السنية تحجب الجلب الآلي حالياً.\n7. **اختلاف الطبعات:** مثال من الاختبار نفسه: عدد نصوص الشمائل يُذكر 397 و399 و415 و417 بحسب الطبعة والترجمة، وعدد الأبواب 55 أو 56. لهذا تُحسم النسخة المعتمدة قبل أي عدّ أو استشهاد.\n8. **الإنتاجية:** لا أعرف بعد عدد الأحاديث التي يمكن تحقيقها بدقة في الجلسة الواحدة. ستُقاس في المرحلة الأولى.\n\n---\n\n## 9. قواعد الأمانة التشغيلية\n\n1. صيغة نسبة القول أو الفعل إلى النبي ﷺ تتبع درجته حرفياً، وفق الجدول في منهج التحقق.\n2. كل جملة في أي إجابة لاحقة واحدة من ثلاث: نص موثق بمعرّفه، أو قول عالم منسوب إليه، أو تحليل موسوم بأنه تحليل.\n3. عبارة «لا يوجد نص مباشر في هذه المسألة» تُقال صراحة عند غياب النص.\n4. لا تحدث بلسانه ﷺ، ولا صيغ من قبيل «لو كان النبي ﷺ بيننا لقال».\n5. تُعرض الروايات المخالفة ولا تُنتقى الروايات المؤيدة لنتيجة مسبقة.\n6. التمييز بين العادة والتشريع والخصوصية يتبع تصنيف العلماء ويعرض خلافهم.\n7. كل مبدأ يُعرض مع حدوده وضوابطه، حتى لا تُستعمل السيرة لتبرير تصرف خاطئ أو متعسف.\n8. كل إجابة لاحقة تُفصح عن مدى تغطية القاعدة لموضوعها.\n\n---\n\n## 10. قرارات مطلوبة للاعتماد\n\n1. **الهيكل وترتيب المراحل:** هل يبقى القرآن مرحلة ثانية مستقلة، أم يُدمج تدريجياً مع المراحل الموضوعية؟\n2. **المصادر المضافة:** في سجل المصادر 31 مصدراً و19 أداة تحقق موسومة «إضافة مقترحة» لم تكن في التعليمات الأصلية، أهمها: السيرة النبوية الصحيحة للعمري، وجامع العلوم والحكم لابن رجب، وكتاب القرافي في تمييز التصرفات النبوية. تُعتمد كلها أو بعضها؟\n3. **موصل المكتبة الشاملة:** ربطه قبل بدء المرحلة الأولى.\n4. **مرجعية الأحكام:** المتقدمون من الأئمة، ومن المعاصرين الألباني والأرنؤوط وأحمد شاكر، مع عرض الخلاف بينهم عند وجوده.\n5. **بوابات الإجابة:** الموافقة على البوابتين المقترحتين في البند 5.4.\n"}, {"code": "GOV-01", "slug": "gov-01", "sec": "00", "title": "سجل المصادر والتغطية", "short": "سجل المصادر", "md": "# سجل المصادر والتغطية\n\n- **الإصدار:** 1.0 — مسودة بانتظار الاعتماد\n- **التاريخ:** 15 نوفمبر 2026\n- **الحالة العامة:** لم يُدرس أي مصدر بعد. كل المصادر في المستوى L0.\n\n---\n\n## 1. مفاتيح التصنيف\n\n### الأولوية\n- **أ — أساسي:** يُدرس مبكراً، وغالباً كاملاً أو في أقسامه المحددة كاملة.\n- **ب — مهم:** يُدرس موجهاً بحسب الأحداث والموضوعات.\n- **ج — مرجعي:** يُرجع إليه عند الحاجة للتحقق أو التوسع.\n\n### الطبيعة والموثوقية (من الأعلى إلى الأدنى في قوة الاحتجاج بنصوصه)\n1. **نص الوحي:** القرآن الكريم.\n2. **أصل مسند صحيح:** كتاب التزم مؤلفه الصحة وتلقته الأمة بالقبول (الصحيحان).\n3. **أصل مسند يحتاج حكماً:** كتاب مسند يجمع المقبول والمردود، فيُحكم على كل نص فيه.\n4. **سيرة أو تاريخ مسند:** روايات بأسانيد متفاوتة القوة، تُعامل بمنهج روايات السيرة.\n5. **مصنف جامع متأخر:** قيمته في الجمع والنقد والترتيب، والحكم على النص يعود إلى أصله المسند.\n6. **شرح أو تفسير:** للفهم والسياق وأقوال العلماء، لا لإثبات النص.\n7. **فقه وأصول ومقاصد:** لفهم الدلالة وتصنيف التصرفات وعرض الخلاف.\n8. **دراسة معاصرة:** للتنظيم والتحليل والترجيح، لا مصدراً للنص.\n9. **أداة تحقق:** كتب الأحكام والرجال والتخريج والموضوعات.\n\n### المستوى المستهدف\nمستويات L0 إلى L5 معرّفة في الخطة الرئيسية (البند 7).\n\n### الأعداد\nالأعداد المسبوقة بعلامة ≈ تقريبية بحسب الترقيم الشائع، وتُضبط من النسخة المعتمدة في المرحلة الأولى.\n\n### الإضافات\nما وُسم بعلامة ✚ إضافة مقترحة لم تكن في تعليمات المشروع الأصلية، وتنتظر اعتمادك.\n\n---\n\n## 2. القرآن الكريم وعلومه\n\n| الرمز | المصدر | المؤلف (ت هـ) | الطبيعة | الأولوية | الهدف | ملاحظة منهجية |\n|---|---|---|---|---|---|---|\n| `QRN` | المصحف الشريف (رواية حفص، طبعة مجمع الملك فهد) | — | نص الوحي | أ | L4 | النص المرجعي لكل استشهاد، ومسح موضوعي لكل آية |\n| `TBR` | جامع البيان عن تأويل آي القرآن | الطبري (310) | تفسير بالمأثور مسند | أ | L3 | أوسع مصادر المأثور بأسانيده؛ تُفحص الأسانيد، وفيه إسرائيليات |\n| `IKT` | تفسير القرآن العظيم | ابن كثير (774) | تفسير بالمأثور مع نقد | أ | L3 | ينقد الأسانيد كثيراً، فيعين على التمييز |\n| `SAD` | تيسير الكريم الرحمن | السعدي (1376) | تفسير معانٍ ومقاصد | أ | L3 | للمعنى الإجمالي والفوائد العملية |\n| `QRT` | الجامع لأحكام القرآن | القرطبي (671) | تفسير أحكام | ب | L3 | للأحكام والخلاف الفقهي |\n| `BGW` | معالم التنزيل | البغوي (516) | تفسير بالمأثور مختصر | ب | L3 | مأثور منتقى بعبارة موجزة |\n| `TNW` | التحرير والتنوير | ابن عاشور (1393) | تفسير لغوي مقاصدي | ب | L3 | للبلاغة والمقاصد والسياق |\n| `MTM` | ✚ موسوعة التفسير المأثور | مركز الدراسات القرآنية بمعهد الإمام الشاطبي | جمع للمأثور | ج | L2 | يجمع المأثور مرتباً على الآيات |\n| `SMA` | ✚ الصحيح المسند من أسباب النزول | مقبل الوادعي (1422) | أسباب نزول منتقاة | أ | L4 | يقتصر على ما صح سنده؛ حجمه صغير |\n| `MHR` | ✚ المحرر في أسباب نزول القرآن | خالد المزيني (معاصر) | دراسة نقدية | ب | L3 | يدرس روايات أسباب النزول دراسة نقدية |\n| `TSH` | ✚ التفسير الصحيح | حكمت بشير ياسين (معاصر) | موسوعة المأثور الصحيح | ب | L3 | يقتصر على ما صح من التفسير بالمأثور |\n| `WAH` | أسباب النزول | الواحدي (468) | أسباب نزول | ب | L3 | فيه الضعيف، فيُتحقق من كل رواية |\n| `LBN` | ✚ لباب النقول في أسباب النزول | السيوطي (911) | أسباب نزول | ج | L2 | جامع، وفيه الضعيف |\n\n---\n\n## 3. متون الحديث\n\n| الرمز | المصدر | المؤلف (ت هـ) | الطبيعة | الأولوية | الهدف | ملاحظة منهجية |\n|---|---|---|---|---|---|---|\n| `BKH` | الجامع الصحيح (صحيح البخاري) | البخاري (256) | أصل مسند صحيح | أ | L4 على مراحل | ≈7563 بالمكرر (ترقيم فتح الباري). المعلقات ليست كلها على شرط الصحيح |\n| `MSL` | صحيح مسلم | مسلم (261) | أصل مسند صحيح | أ | L4 على مراحل | ≈3033 أصلاً (ترقيم محمد فؤاد عبد الباقي) |\n| `LUL` | ✚ اللؤلؤ والمرجان فيما اتفق عليه الشيخان | محمد فؤاد عبد الباقي (1388) | منتقى المتفق عليه | أ | L4 | نواة أعلى درجات الثبوت؛ مدخل سريع إلى الصحيحين |\n| `SHM` | الشمائل المحمدية | الترمذي (279) | أصل مسند يحتاج حكماً | أ | L5 في المرحلة 1 | 56 باباً و415 نصاً بالمكرر في طبعة الجليمي، والعدد يختلف بين الطبعات |\n| `ADM` | `AWN` | عون المعبود | شمس الحق العظيم آبادي (1329) | ب | L3 | شرح سنن أبي داود |\n| `JWS` | ✚ جمع الوسائل في شرح الشمائل | علي القاري (1014) | ب | L3 في المرحلة 1 | للدراسة التجريبية للشمائل |\n| `IBT` | ✚ شرح صحيح البخاري | ابن بطال (449) | ج | L2 | غني في أبواب الأخلاق والآداب |\n\n---\n\n## 5. السيرة والتاريخ\n\n| الرمز | المصدر | المؤلف (ت هـ) | الطبيعة | الأولوية | الهدف | ملاحظة منهجية |\n|---|---|---|---|---|---|---|\n| `IHS` | السيرة النبوية | ابن هشام (213 أو 218) | سيرة مسندة جزئياً | أ | L4 | الرواية الأساسية لسيرة ابن إسحاق، من طريق البكائي |\n| `ZAD` | زاد المعاد في هدي خير العباد | ابن القيم (751) | مصنف جامع تحليلي | أ | L4 للأقسام المختارة | أقرب المصادر إلى فكرة «المنهج النبوي»؛ يُعتمد تخريج الأرنؤوط لأحاديثه |\n| `BDN` | البداية والنهاية (قسم السيرة) | ابن كثير (774) | مصنف جامع ناقد | أ | L3 | ينقد الروايات كثيراً. «السيرة النبوية» لابن كثير مستلّة من هذا الكتاب، فتُدرس مرة واحدة |\n| `IIS` | سيرة ابن إسحاق (القطعة المطبوعة) | ابن إسحاق (151) | سيرة مسندة جزئياً | ب | L3 | الأصل لم يصل كاملاً؛ تُعرف من روايات ابن هشام والطبري وغيرهما، والقطعة المطبوعة من رواية يونس بن بكير |\n| `ISD` | الطبقات الكبرى (قسم السيرة) | ابن سعد (230) | سيرة مسندة | ب | L3 | كثير من مادته عن الواقدي |\n| `TRK` | تاريخ الرسل والملوك (قسم السيرة) | الطبري (310) | تاريخ مسند | ب | L3 | يورد الروايات بأسانيدها دون التزام الصحة |\n| `SHF` | ✚ الشفا بتعريف حقوق المصطفى | القاضي عياض (544) | شمائل وخصائص | ب | L3 | فيه أحاديث ضعيفة؛ يُستعان بتخريج السيوطي «مناهل الصفا» |\n| `AKH` | أخلاق النبي ﷺ وآدابه | أبو الشيخ الأصبهاني (369) | شمائل مسندة | ب | L3 | فيه ضعيف كثير، فيُتحقق من كل نص |\n| `WQD` | ✚ المغازي | الواقدي (207) | سيرة | ج | L2 | واسع التفاصيل، والواقدي متروك عند جمهور المحدثين؛ لا يُعتمد منفرداً |\n| `RWD` | ✚ الروض الأنف | السهيلي (581) | شرح سيرة | ج | L2 | شرح لسيرة ابن هشام |\n| `UYN` | ✚ عيون الأثر | ابن سيد الناس (734) | سيرة جامعة | ج | L2 | — |\n| `SBL` | ✚ سبل الهدى والرشاد | الصالحي (942) | موسوعة سيرة | ج | L2 | أوسع الجوامع، وفيه الضعيف |\n| `DLN` | ستقلة على الأسانيد.\n3. اللفظ يُؤخذ من المصدر الأصلي في نسخته المعتمدة، لا من مقال أو منشور أو من الذاكرة.\n4. يُفرَّق بين المرفوع (المنسوب إلى النبي ﷺ)، والموقوف (على الصحابي)، والمقطوع (على التابعي). لا يُقدَّم الموقوف بصيغة المرفوع.\n5. الثبوت شيء والدلالة شيء آخر: صحة الحديث لا تعني أن فهماً معيناً له صحيح، ولا أنه حكم عام لكل الأمة.\n6. عند اختلاف المحدثين في الحكم: تُعرض الأحكام كلها، ويُوسم الحديث «مختلف فيه»، ولا يُبنى عليه وحده مبدأ أساسي.\n7. إذا لم يوجد حكم معتبر على حديث خارج الصحيحين، يُوسم «لم يُوقف على حكم»، ويُعامل معاملة غير الثابت.\n\n---\n\n## 2. سلم الدرجات وصيغ النسبة\n\n| الوسم | المعنى | الصيغة المسموحة في الإجابة |\n|---|---|---|\n| [قرآن] | نص قرآني | قال الله تعالى |\n| [متفق عليه] | رواه البخاري ومسلم | ثبت عن النبي ﷺ / قال ﷺ / رواه الشيخان |\n| [صحيح: أحد الصحيحين] | رواه البخاري أو مسلم | ثبت عن النبي ﷺ / رواه البخاري (أو مسلم) |\n| [صحيح] | خارج الصحيحين، صححه إمام معتبر أو أكثر | ثبت عن النبي ﷺ، مع ذكر من صححه |\n| [حسن] | حسّنه إمام معتبر أو أكثر | ورد بإسناد حسن، مع ذكر من حسّنه |\n| [مختلف فيه] | اختلف المحدثون في تصحيحه وتضعيفه | ورد في حديث اختلف العلماء في صحته، مع عرض الأحكام |\n| [ضعيف] | ضعّفه المحدثون | لا يُستدل به. إن ذُكر لبيان حاله: «رُوي... وهو ضعيف» |\n| [ضعيف جداً] | شديد الضعف | لا يُذكر إلا لبيان حاله |\n| [موضوع] أو [لا أصل له] | مكذوب أو لا إسناد له | لا يُذكر إلا في قائمة التحذير |\n| [سيرة: مسندة مقبولة] | رواية سيرة إسنادها صحيح أو حسن | تُروى بالجزم مع ذكر مصدرها |\n| [سيرة: مرسلة] | من مراسيل أهل المغازي | «ذكر أهل السير...» مع التنبيه على الإرسال |\n| [سيرة: بلا إسناد] | بلاغ أو «زعموا» | «ذُكر...» مع التنبيه، وللسياق فقط |\n| [سيرة: طريق متروك] | من طريق راوٍ متروك أو متهم | لا يُعتمد عليه |\n| [قول عالم] | تفسير أو رأي فقهي أو ترجيح | يُنسب إلى قائله باسمه |\n| [تحليل] | استنتاج المشروع | «يمكن استخلاص...» / «تشير هذه الحادثة إلى...» |\n\n**أصل قاعدة صيغة التمريض:** قرر العلماء، ومنهم النووي، أن الحديث الضعيف لا يُذكر بصيغة الجزم مثل «قال رسول الله ﷺ»، وإنما بصيغة التمريض مثل «رُوي» و«يُذكر».\n\n---\n\n## 3. خطوات التحقق من الحديث\n\n### الخطوة 1 — تحديد المتن من الأصل\n- يُفتح النص من النسخة المعتمدة للمصدر (عبر المكتبة الشاملة أو نص مطابَق).\n- يُسجل: الكتاب، والباب، والرقم، والجزء والصفحة إن لزم، والنسخة.\n\n### الخطوة 2 — التخريج\n- جمع مواضع الحديث في الكتب التسعة على الأقل، بالترقيم المعتمد لكل كتاب.\n- عند وجود الحديث في الصحيحين أو أحدهما، يُكتفى بذلك أصلاً، وتُذكر المواضع الأخرى للفائدة.\n\n### الخطوة 3 — تحديد الحكم\n- **في الصحيحين أو أحدهما:** يُقبل. إن كان من الأحرف القليلة التي انتقدها بعض الحفاظ، كالدارقطني، يُنبه على ذلك؛ والانتقاد في أكثره متعلق بالأسانيد لا بأصل المتن.\n- **معلقات البخاري:** ليست كلها على شرط الصحيح. ما جزم به البخاري يختلف عما ذكره بصيغة التمريض، فيُرجع إلى فتح الباري في كل معلق.\n- **خارج الصحيحين:** حكمان معتبران على الأقل، أحدهما من المتقدمين إن وُجد.\n  - المتقدمون: الترمذي، وابن خزيمة، وابن حبان، والحاكم مع تعقب الذهبي، والبيهقي، وابن عبد البر، والنووي، والذهبي، وابن كثير، وابن حجر، والهيثمي، والسخاوي.\n  - المعاصرون: أحمد شاكر، والألباني، وشعيب الأرنؤوط، ومن في طبقتهم من المحققين.\n- **تنبيهات:**\n  - تصحيح الحاكم وحده لا يكفي لتساهله المعروف.\n  - مصطلح «حسن» عند الترمذي له معنى خاص عنده، فيحتاج نظراً في كلام الشراح.\n  - سكوت أبي داود عن الحديث ليس حكماً قاطعاً بقبوله؛ اختلف العلماء في معناه.\n  - أحكام الموسوعات الرقمية تُستعمل للاسترشاد، ثم يُفتح الحكم في كتاب صاحبه.\n\n### الخطوة 4 — فحص المتن والألفاظ\n- مقارنة ألفاظ الروايات المختلفة.\n- اعتماد لفظ أصح الطرق.\n- التنبيه على الزيادات التي حكم الحفاظ بشذوذها أو إدراجها.\n\n### الخطوة 5 — السياق\n- سبب الورود والمناسبة.\n- الزمن (مكي أو مدني، قبل حدث معين أو بعده).\n- المصادر: الروايات الأخرى للحديث، والشروح.\n\n### الخطوة 6 — الدلالة\n- عام أم خاص، ناسخ أم منسوخ، مطلق أم مقيد.\n- نوع الفعل ومقام التصرف (البند 6 أدناه).\n- كل ذلك منقول من الشروح وكتب الأصول، لا من اجتهادي.\n\n### الخطوة 7 — التسجيل\n- يُسجل المدخل بالقالب المعتمد في الخطة الرئيسية، مع رابط التحقق.\n\n### الخطوة 8 — حالة التحقق\n- **موثق:** فُتح النص من الأصل، ووُثق الحكم من مصدره.\n- **مسودة:** ينقصه شيء مما سبق.\n- **قاعدة:** لا يُستعمل مدخل «مسودة» في أي إجابة على أنه ثابت.\n\n---\n\n## 4. روايات السيرة والتاريخ\n\n### 4.1 مراتب الروايات\n\n| المرتبة | الوصف |\n|---|---|\n| م1 | ما في الصحيحين، أو صح إسناده عند المحدثين |\n| م2 | ما حسن إسناده، مثل رواية ابن إسحاق إذا صرح بالتحديث وسلم باقي الإسناد |\n| م3 | مراسيل كبار أهل المغازي، كعروة بن الزبير والزهري وموسى بن عقبة: ضعيفة اصطلاحاً، ولها قيمة تاريخية، وتتقوى بتعدد المخارج |\n| م4 | ما ذُكر بلا إسناد، أو بصيغ مثل «زعموا» و«بلغني» |\n| م5 | ما جاء من طريق متروك أو متهم، كالواقدي عند جمهور المحدثين، ومحمد بن السائب الكلبي، وسيف بن عمر |\n\n### 4.2 قواعد الاستعمال\n- نُقل عن جمع من الأئمة التفريق بين التشدد في روايات الأحكام والعقائد، والتساهل النسبي في تفاصيل المغازي والأحداث. يأخذ المشروع بذلك في **وصف الإطار العام للأحداث فقط**.\n- أي قول أو فعل يُنسب إلى النبي ﷺ ويُبنى عليه مبدأ يجب أن يكون من المرتبة الأولى أو الثانية.\n- ما دون ذلك يُذكر للسياق، بوسمه، ولا يُبنى عليه مبدأ.\n\n### 4.3 عند تعارض الروايات\n1. يُقدم ما في الصحيح.\n2. ثم الأقوى إسناداً.\n3. ثم الأقدم والأقرب إلى الحدث.\n4. يُنقل ترجيح المحققين (ابن حجر في الفتح، وابن كثير، وابن القيم، والعمري) مع ذكر الخلاف.\n5. التواريخ المختلف فيها تُسجل بأقوالها كلها. من مواضع الخلاف المعروفة: يوم المولد النبوي، وتاريخ الإسراء والمعراج، وتواريخ بعض الغزوات.\n\n### 4.4 الحدث وتفسيره\n- الحدث يُنقل بدرجة ثبوته.\n- الحكمة والدرس المستنبط يُوسمان [تحليل]، ويُذكر من سبق إليهما من العلماء إن وُجد.\n\n### 4.5 البدائل\n- لا تُبحث «البدائل الممكنة» إلا حيث ذكرتها المصادر نفسها، كالمشاورات التي طُرحت فيها آراء متعددة.\n- لا تُصنع سيناريوهات افتراضية، ولا يُنسب إلى النبي ﷺ تفكير لم يرد به نص.\n\n---\n\n## 5. أسباب النزول والتفسير\n\n- لا يُعتمد سبب نزول إلا بإسناد مقبول.\n- قول الصحابي «نزلت هذه الآية في كذا» قد يُراد به السبب المباشر، وقد يُراد به أن الآية تشمل هذه الحالة. نبه على ذلك ابن تيمية والزركشي، فيُحرر المراد من كلام المفسرين.\n- ترتيب مصادر التفسير: القرآن بالقرآن، ثم السنة الصحيحة، ثم أقوال الصحابة، ثم التابعين، ثم لغة العرب. هذا المنهج قرره ابن تيمية في مقدمته في أصول التفسير، وسار عليه ابن كثير في مقدمة تفسيره.\n- الإسرائيليات لا يُبنى عليها شيء.\n- كل قول تفسيري يُنسب إلى مفسره باسمه.\n\n---\n\n## 6. التمييز بين أنواع الأفعال ومقامات التصرف\n\nيخدم هذا البند القاعدتين السابعة والثامنة في تعليمات المشروع.\n\n### 6.1 أنواع الأفعال النبوية\n\n| النوع | المعنى | مثال توضيحي |\n|---|---|---|\n| جبلي | ما يفعله بمقتضى الطبيعة البشرية | الأكل والشرب والنوم من حيث هي |\n| عادي | ما جرى على عادة قومه وزمانه | هيئة اللباس ونوع الطعام؛ وفي حكم الاقتداء به خلاف بين العلماء |\n| تشريعي | ما فعله بياناً لحكم | صفة الصلاة والحج |\n| خاص به | ما ثبتت خصوصيته بدليل | الزيادة على أربع زوجات، والوصال في الصوم الذي نهى عنه غيره |\n\n### 6.2 مقامات التصرف (بحسب تقسيم القرافي)\n\n| المقام | الأثر |\n|---|---|\n| التبليغ والفتيا | حكم عام للأمة |\n| القضاء | يُتبع في جنسه بحكم قاضٍ |\n| الإمامة والسياسة | تصرف بالمصلحة، يُحتاج فيه إلى إذن الإمام |\n| الرأي في شأن دنيوي | ليس تشريعاً؛ أصله قصة تأبير النخل في صحيح مسلم |\n\n**مثال على الخلاف في التصنيف:** حديث «من أحيا أرضاً ميتة فهي له». ذهب بعض الفقهاء إلى أنه فتيا، فيملك المحيي الأرض دون إذن الإمام، وذهب آخرون إلى أنه تصرف بالإمامة، فيُشترط الإذن. يُعرض الخلاف ولا يُرجح من عندنا. (مثال توضيحي للمنهج؛ تُوثق درجة الحديث وأقوال المذاهب فيه عند إدخاله القاعدة.)\n\n### 6.3 قاعدة\nلا يُصنف فعل من عندي. يُنقل تصنيف العلماء، ويُعرض خلافهم إن وُجد.\n\n---\n\n## 7. قائمة التحذير\n\n- **المجلد:** `90-warnings`\n- **محتوى كل مدخل:** النص المشتهر، والحكم، ومن حكم به ومصدره، والبديل الصحيح في معناه إن وُجد.\n- **المصادر:** المقاصد الحسنة للسخاوي، وكشف الخفاء للعجلوني، وسلسلة الأحاديث الضعيفة للألباني، والموضوعات لابن الجوزي مع ملاحظة تشدده وتعقبات العلماء عليه.\n- **قاعدة:** لا يُدخل حديث إلى القائمة إلا بحكم موثق من مصدره، كأي مدخل آخر.\n\n---\n\n## 8. حالات خاصة\n\n- **الضعيف في فضائل الأعمال:** أجاز بعض العلماء العمل به بشروط، نقلها السخاوي عن ابن حجر: ألا يكون شديد الضعف، وأن يندرج تحت أصل عام ثابت، وألا يُعتقد ثبوته. ومنع ذلك آخرون. **سياسة المشروع:** لا يُستخلص منه مبدأ، ويُذكر إن ذُكر بحاله.\n- **الأحاديث القدسية:** تخضع لقواعد التحقق نفسها.\n- **الآثار الموقوفة:** تُسجل بوسم واضح، وتُستعمل في فهم النص وتطبيق الصحابة له، لا على أنها قول النبي ﷺ.\n- **الشمائل الخَلقية (الصفات الجسدية):** تخضع للتحقق نفسه، ولا يُبنى عليها حكم إلا بدليل.\n\n---\n\n## 9. نقاط تراجَع بعد الدراسة التجريبية\n\nتُختبر هذه البنود في المرحلة الأولى ويُعدل المنهج بناءً على النتيجة:\n- هل يكفي حكمان معتبران خارج الصحيحين، أم يُرفع الحد إلى ثلاثة عند الخلاف؟\n- آلية مطابقة الترقيم بين النصوص المفتوحة والترقيم المعتمد.\n- معالجة الحالات التي لا يتاح فيها الحكم إلا عبر موسوعة رقمية محجوبة.\n\n---\n\n## 10. سلم الثقة المعروض (A–F) — معتمد منذ الإصدار 1.1\n\nكل معلومة في قاعدة المعرفة تحمل حرفاً واحداً من هذا السلم، ليعرف القارئ دائماً هل يقرأ نصاً ثابتاً أم تفسيراً أم استنتاجاً.\n\n| الحرف | المعنى | يقابله من الأوسمة التفصيلية (البند 2) |\n|---|---|---|\n| **A** | نص قرآني واضح | [قرآن] |\n| **B** | حديث صحيح ثابت | [متفق عليه]، [صحيح: أحد الصحيحين]، [صحيح] بحكم موثق |\n| **C** | حديث حسن أو رواية مقبولة وفق حكم علمي موثق | [حسن]، [سيرة: مسندة مقبولة] |\n| **D** | رواية تاريخية تحتاج بيان درجة ثبوتها | [سيرة: مرسلة]، [سيرة: بلا إسناد]، [مختلف فيه] مع عرض الأحكام، وكل رواية لم يُوثق حكمها بعد |\n| **E** | استنتاج أو تحليل مبني على مصادر موثقة | [تحليل]، وأقوال المفسرين والشراح منسوبة إلى قائليها |\n| **F** | تطبيق معاصر أو اجتهاد تحليلي | — |\n\n### إضافتان معتمدتان (اعتمدهما صاحب المشروع في 15 نوفمبر 2026)\n- **X — مردود:** للحديث الضعيف المنسوب إلى النبي ﷺ، والضعيف جداً، والموضوع، وما لا أصل له، وما جاء من طريق متروك. لا يُستعمل في أي استدلال، ولا يظهر إلا في قائمة التحذير أو في عرض الخلاف لبيان حاله. السلم الأصلي لا يحوي موضعاً لهذا النوع، ووضعه تحت D يوهم أنه قابل للاستعمال بعد البيان.\n- **علامة الاستفهام بعد الحرف (مثل C؟):** حكم مؤقت؛ الحكم منقول من مصدر ثانوي ولم يُفتح في كتاب صاحبه بعد.\n\n### قواعد\n- لا تُرفع درجة رواية لشهرتها.\n- الحرف يصف المعلومة لا المصدر: نص من صحيح البخاري B، وتعليق ابن حجر عليه E منسوباً إليه، وتطبيقه على العمل اليوم F.\n- كل استنتاج من نوع E عن صفة نفسية أو سلوكية يُذكر معه عدد الأدلة المستقلة التي بُني عليها. إن كان مبنياً على رواية واحدة يوسم «مبدئي».\n"}, {"code": "GOV-03", "slug": "gov-03", "sec": "00", "title": "بروتوكول الإجابة عن الأسئلة", "short": "بروتوكول الإجابة", "md": "# بروتوكول الإجابة عن الأسئلة\n\n- **القسم:** 00 — الحوكمة\n- **الإصدار:** 1.0 — 15 نوفمبر 2026\n- **القرار:** طلب صاحب المشروع في 15 نوفمبر 2026 تفعيل وضع الإجابة: كل سؤال يُطرح على التطبيق أو في محادثات المشروع يُجاب عنه من فهم سيرة النبي ﷺ ومنهجه. يُفعَّل الوضع من الآن مع وسم مصدر كل معلومة، ويستمر بناء قاعدة المعرفة بالتوازي. كلما زادت التغطية زادت نسبة المعلومات الموثقة في الإجابات.\n- **يُطبق على:** تطبيق «إسأل النبي محمد ﷺ»، وكل محادثة داخل المشروع.\n\n---\n\n## 1. ما لا يُفعل أبداً\n\n1. **لا يُتكلم بلسان النبي ﷺ.** لا صيغة متكلم على لسانه، ولا «لو سألته لقال لك...». الأصل في ذلك قوله ﷺ: «من يقل علي ما لم أقل فليتبوأ مقعده من النار» (البخاري 109)، و«من كذب علي متعمداً فليتبوأ مقعده من النار» (البخاري 110). الإجابة تنقل ما ثبت عنه، وتستنبط من منهجه بعبارة المجيب.\n2. لا يُنسب إليه قول أو فعل أو رأي بلا مصدر.\n3. لا يُستدل بما درجته **X**. وإن ذكر السائل حديثاً ضعيفاً أو مشهوراً لا يثبت، يُبيَّن حاله بلطف.\n4. لا تُقدَّم فتوى قاطعة في مسألة فقهية مختلف فيها. تُعرض الأقوال المعتبرة، ويُنصح بسؤال عالم موثوق في الحكم الشخصي.\n\n## 2. بنية الإجابة الافتراضية\n\n1. **الإجابة المباشرة:** جملتان أو ثلاث تجيبان السؤال.\n2. **المنهج النبوي:** المبدأ أو المبادئ المتصلة بالموقف.\n3. **الدليل:** من القرآن أو الحديث أو السيرة، **مع حرف الدرجة والمصدر لكل دليل**.\n4. **التطبيق على حالتك:** خطوات عملية محددة.\n\nوإن لم يوجد نص مباشر: «لا يوجد نص مباشر في هذه الحالة، لكن يمكن الاسترشاد بالمبادئ التالية...».\n\n## 3. وسم المصدر\n\n| الوسم | المعنى |\n|---|---|\n| حرف الدرجة A–F | سلم الثقة في منهج التحقق (البند 10) |\n| معرّف من القاعدة، مثل `H-BKH-4890` | المعلومة موثقة في قاعدة المعرفة ومقروءة من مصدرها |\n| **؟** بعد الحرف، مع عبارة «من خارج القاعدة» | المعلومة من المعرفة العامة بالسيرة والحديث، ولم تُوثق في القاعدة بعد. تُذكر بمصدرها المشهور إن عُرف، ولا يُبنى عليها وحدها حكم |\n\n**قاعدة الترجيح:** يُقدَّم ما في القاعدة على ما خارجها. وإذا تعارض قول من خارج القاعدة مع ما فيها، يُعتمد ما فيها ويُذكر التعارض.\n\n## 4. تمييزات لازمة في كل إجابة\n\n- بين النص (A، B، C) وبين الاستنتاج (E) والتطبيق المعاصر (F).\n- بين عادة النبي ﷺ الشخصية (طعام، لباس، هيئة) وبين الحكم الشرعي العام.\n- بين خصوصياته ﷺ وبين ما يعم الأمة.\n- بين فعل النبي ﷺ وفعل الصحابي.\n\n## 5. الأسلوب\n\n- لغة عربية سهلة. إن كتب السائل بالعامية المصرية يكون الشرح قريباً منها، وتبقى النصوص بألفاظها.\n- الإيجاز أولاً، والتوسع عند الحاجة أو الطلب.\n- السؤال الشخصي يُفهم أولاً: ما المشكلة الحقيقية وراءه؟\n\n## 6. حالات خاصة\n\n- **الأزمات النفسية أو خطر على النفس:** يُقدَّم الدعم الإنساني أولاً، ويُوجَّه السائل إلى مختص أو جهة طوارئ، ولا يُكتفى بالموعظة.\n- **المسائل الطبية والقانونية والمالية:** يُذكر المنهج النبوي العام، ويُحال التفصيل إلى المختص.\n- **الأسئلة عن الغيب أو عن مصير أشخاص بأعيانهم:** لا يُجزم إلا بنص.\n"}, {"code": "MKI-00", "slug": "mki-00", "sec": "01", "title": "الفهرس الرئيسي لقاعدة المعرفة", "short": "الفهرس الرئيسي", "md": "# الفهرس الرئيسي لقاعدة المعرفة\n\n- **القسم:** 01 — الفهرس الرئيسي\n- **آخر تحديث:** 15 نوفمبر 2026، نهاية الدفعة 4\n- **طريقة الاستعمال:** ابدأ من هنا. كل معرّف في الجداول أدناه يدل على مدخل في ملف محدد. سلم الثقة A–F مشروح في منهج التحقق (البند 10).\n\n---\n\n## 1. خريطة الأقسام والملفات\n\n| القسم | الملفات الحالية |\n|---|---|\n| 00 الحوكمة | الخطة الرئيسية، سجل المصادر، منهج التحقق |\n| 01 الفهرس الرئيسي | هذا الملف |\n| 02 القرآن | `QKB-01` الفهرس اللفظي؛ `QKB-02` الصورة القرآنية للنبي ﷺ؛ `QKB-03` التوسيم الموضوعي لجزء عمّ؛ `QKB-05` التوسيم الموضوعي للجزء 28؛ `QKB-04` التوسيم الموضوعي لجزء تبارك |\n| 03 الأحاديث | `HKB-BKH-01` كتاب بدء الوحي؛ `HKB-BKH-02` باب صفة النبي ﷺ؛ `HKB-BKH-03` أسباب النزول من كتاب التفسير لجزأي عمّ وتبارك؛ `HKB-BKH-04` كتاب التفسير لسور الجزء 28؛ `HKB-SHM-01` الشمائل: أبواب الكلام والضحك والمزاح والشعر والسمر والتواضع والخلق والحياء؛ `HKB-CHR-01` شواهد الخلق |\n| 04 السيرة | "title": "القرآن — الفهرس اللفظي للمواضع المتعلقة بالنبي ﷺ", "short": "الفهرس اللفظي في القرآن", "md": "# القرآن — الفهرس اللفظي للمواضع المتعلقة بالنبي ﷺ\n\n- **القسم:** 02 — قاعدة المعرفة القرآنية\n- **الدفعة:** 1 — 15 نوفمبر 2026\n- **المصدر:** نص المصحف الكامل (6236 آية) بالرسم الإملائي المبسط، من مستودع quran-api\n- **الحالة:** المسح اللفظي مكتمل للمعايير المذكورة أدناه. التوسيم الموضوعي الكامل للمصحف لم يبدأ بعد.\n\n---\n\n## 1. المنهج\n\nمُرّ على **كل آيات المصحف (6236 آية)** آلياً بعد تجريد النص من الحركات وتوحيد صور الهمزة، وبُحث فيه عن ستة معايير لفظية محددة. ثم قُرئ سياق كل نتيجة ملتبسة لتحديد المقصود بها.\n\n**حدود هذا الفهرس:** هو فهرس لفظي فقط. لا يشمل الآيات التي تخاطب النبي ﷺ بضمير المخاطب دون نداء (مثل الأمر «قل» أو قوله «وإنك لعلى خلق عظيم»)، ولا الآيات التي تتحدث عن أحداث السيرة دون ذكره بلفظ صريح. هذه تُغطى بالتوسيم الموضوعي في الدفعات القادمة.\n\n---\n\n## 2. النتائج\n\n| المعيار | العدد | المواضع |\n|---|---|---|\n| النداء «يا أيها النبي» | 13 | 8:64، 8:65، 8:70، 9:73، 33:1، 33:28، 33:45، 33:50، 33:59، 60:12، 65:1، 66:1، 66:9 |\n| النداء «يا أيها الرسول» | 2 | 5:41، 5:67 |\n| النداء بوصف الحال | 2 | 73:1 (المزمل)، 74:1 (المدثر) |\n| الاسم «محمد» | 4 | 3:144، 33:40، 47:2، 48:29 |\n| الاسم «أحمد» | 1 | 61:6، في بشارة عيسى عليه السلام |\n| «النبي» معرّفاً | 30 | 3:68، 5:81، 7:157، 7:158، 8:64، 8:65، 8:70، 9:61، 9:73، 9:113، 9:117، 33:1، 33:6، 33:13، 33:28، 33:30، 33:32، 33:38، 33:45، 33:50، 33:53، 33:56، 33:59، 49:2، 60:12، 65:1، 66:1، 66:3، 66:8، 66:9 |\n| «رسول الله» | 18 | انظر التمييز في البند 3 |\n| «الرسول» معرّفاً | 53 | انظر التمييز في البند 3 |\n\n---\n\n## 3. التمييز: من المقصود؟\n\n### «رسول الله» (18 آية)\n- **المقصود النبي ﷺ (13):** 7:158، 9:61، 9:81، 9:120، 33:21، 33:40، 33:53، 48:29، 49:3، 49:7، 63:1، 63:5، 63:7.\n- **المقصود غيره (5)، بقراءة نص الآية نفسها:** 4:157 و4:171 (عيسى عليه السلام)، 61:5 (موسى عليه السلام)، 61:6 (عيسى عليه السلام)، 91:13 (صالح عليه السلام).\n\n### «الرسول» معرّفاً (53 آية)\n- **المقصود النبي ﷺ بدلالة السياق (47):** 2:143، 2:285، 3:32، 3:86، 3:132، 3:153، 3:172، 4:42، 4:59، 4:61، 4:64، 4:69، 4:80، 4:83، 4:115، 4:170، 5:41، 5:67، 5:83، 5:92، 5:99، 5:104، 7:157، 8:1، 8:24، 8:27، 8:41، 9:13، 9:88، 9:99، 22:78، 24:54، 24:56، 24:63، 25:7، 25:27، 25:30، 47:32، 47:33، 48:12، 57:8، 58:8، 58:9، 58:12، 59:7، 60:1، 64:12.\n- **المقصود غيره (5):** 2:214 (رسول الأمم السابقة عامة)، 3:53 (عيسى عليه السلام، على لسان الحواريين)، 12:50 (رسول الملك في قصة يوسف)، 20:96 (في قول السامري، والمراد عند المفسرين جبريل أو موسى عليهما السلام)، 73:16 (موسى عليه السلام).\n- **موضع يحتاج تحريراً (1):** 29:18، فهو في سياق قصة إبراهيم عليه السلام، والمفسرون مختلفون هل هو من كلام إبراهيم أم اعتراض في خطاب النبي ﷺ. مسجل في الفجوات البحثية.\n\n**مستوى هذا التمييز:** E (تحليل). بُني على قراءة نص الآية وسياقها القريب فقط. تأكيده من التفاسير مسجل فجوة بحثية.\n\n### «النبي» معرّفاً (30 آية)\nكلها في النبي ﷺ بدلالة السياق، إلا **5:81** «ولو كانوا يؤمنون بالله والنبي وما أنزل إليه»، ففي المراد بالنبي فيها قولان للمفسرين (النبي ﷺ أو موسى عليه السلام) بحسب ما هو معروف، ولم يُوثق ذلك من التفاسير في هذه الدفعة. مسجل فجوة بحثية.\n\n---\n\n## 4. ملاحظات أولية (مستوى E)\n\n1. **ندرة ذكر الاسم الصريح:** الاسم «محمد» ورد في أربع آيات فقط، و«أحمد» في واحدة، بينما جاء الخطاب بالوصف (النبي، الرسول) في عشرات المواضع. ملاحظة لفظية لا يُبنى عليها حكم.\n2. **النداء «يا أيها النبي» كله في سور مدنية** (الأنفال، التوبة، الأحزاب، الممتحنة، الطلاق، التحريم). أكثره في الأحزاب (5 من 13)، ثم الأنفال (3)، ثم التحريم (2)، وكثير منه في شؤون الأسرة والجماعة والحرب. ملاحظة تستحق المتابعة عند دراسة البيت النبوي.\n3. **نحو ربع مواضع «الرسول» المعرّف (12 من 47) في الأمر بطاعته أو الاستجابة له أو الأخذ بما جاء به:** 3:32، 3:132، 4:59، 4:69، 4:80، 5:92، 8:24، 24:54، 24:56، 47:33، 59:7، 64:12. هي مادة أساسية لبحث حجية السنة.\n\n---\n\n## 5. ما يليه في القسم القرآني\n- التوسيم الموضوعي الكامل للمصحف وفق الموضوعات `T01–T28` والفئات `C` والمراحل `S`.\n- ربط كل موضع في هذا الفهرس بأحداث السيرة وأسباب النزول.\n"}, {"code": "QKB-02", "slug": "qkb-02", "sec": "02", "title": "القرآن — الصورة القرآنية للنبي ﷺ: النصوص الأساسية (الدفعة 1)", "short": "الصورة القرآنية للنبي ﷺ", "md": "# القرآن — الصورة القرآنية للنبي ﷺ: النصوص الأساسية (الدفعة 1)\n\n- **القسم:** 02 — قاعدة المعرفة القرآنية\n- **الدفعة:** 1 — 15 نوفمبر 2026\n- **نص الآيات:** منقول آلياً بحروفه من مستودع quran-api (الرسم الإملائي المبسط)، ورقم الآية بين قوسين.\n- **التفاسير المقروءة فعلاً في هذه الدفعة:** تفسير السعدي لكل الآيات أدناه، وتفسير ابن كثير للآيات 68:4 و80:1–10 فقط. ما لم يُقرأ مذكور صراحة في كل مدخل.\n- **الرموز:** A نص قرآني، C رواية مقبولة بحكم موثق، E تفسير أو تحليل منسوب إلى قائله.\n\n---\n\n## Q-68:4 — الخلق العظيم\n\n﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ (4)﴾ [68:4]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):** المعنى أنه ﷺ مستعلٍ بخلقه الذي منّ الله به عليه، وحاصله ما فسرته به عائشة رضي الله عنها: «كان خلقه القرآن». ومثّل لذلك بآيات: الأمر بالعفو والإعراض عن الجاهلين، وآية اللين (3:159)، وآية الحرص والرأفة (9:128). ثم فصّل صفاته في المعاشرة: سهل لين قريب، يجيب من دعاه، ويقضي حاجة من استقضاه، ولا يرد سائله خائباً، ويوافق أصحابه فيما لا محذور فيه، ويشاورهم ولا يستبد بالأمر دونهم، ويقبل من محسنهم ويعفو عن مسيئهم، ولا يعبس في وجه جليسه ولا يغلظ له، ولا يؤاخذه بجفوته.\n- **تفسير ابن كثير (E):** نقل في معنى «خلق عظيم» قولين: «دين عظيم وهو الإسلام» (ابن عباس من طريق العوفي، ومجاهد وأبو مالك والسدي وغيرهم)، و«أدب عظيم» (عطية). ثم ساق حديث سعد بن هشام عن عائشة وعزاه إلى صحيح مسلم برقم 746، وبيّن معناه: أن امتثال القرآن أمراً ونهياً صار له سجية وطبعاً، مع ما جبله الله عليه من الحياء والكرم والشجاعة والصفح والحلم. واستشهد بأحاديث من الصحيحين: خدمة أنس عشر سنين، ووصف البراء له بأنه أحسن الناس وجهاً وخلقاً، وقول عائشة إنه ما ضرب بيده خادماً ولا امرأة.\n- **ما تحقق منه مقابل الأصل في هذه الدفعة:** قول عائشة موجود في صحيح مسلم برقم 746 بلفظ: «فإن خلق نبي الله ﷺ كان القرآن». وأحاديث أنس والبراء وعائشة التي أحال إليها ابن كثير موجودة بأرقامها (التفاصيل في قسم الأحاديث، ملف الشواهد الخُلقية).\n- **ما نقله ابن كثير ولم يُحكم عليه بعد:** حديث «إنما بعثت لأتمم صالح الأخلاق» (عزاه إلى المسند وقال: تفرد به)، وقصة الطعام الذي صنعته عائشة وحفصة (من المسند، وفي إسنادها «رجل من بني سواد» غير مسمى). كلاهما **D** حتى يُوثق الحكم.\n- **الموضوعات:** `T01` شخصيته الإنسانية، `T02` الرحمة والرفق، `T05` التواضع، `T09` الذكاء الاجتماعي، `T24` الاختلاف في الرأي.\n\n---\n\n## Q-3:159 — اللين والعفو والشورى\n\n﴿فَبِمَا رَحْمَةٍ مِنَ اللَّهِ لِنْتَ لَهُمْ ۖ وَلَوْ كُنْتَ فَظًّا غَلِيظَ الْقَلْبِ لَانْفَضُّوا مِنْ حَوْلِكَ ۖ فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِي الْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ (159)﴾ [3:159]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):**\n  - لينه ﷺ رحمة من الله به وبأصحابه، فاجتمعوا عليه وأحبوه وامتثلوا أمره. ولو كان سيئ الخلق قاسي القلب لنفروا.\n  - الأخلاق الحسنة من الرئيس في الدين تجذب الناس إليه، والسيئة تنفرهم. وإذا قيل هذا للرسول المعصوم فغيره أولى.\n  - جُمع له بين العفو عن تقصيرهم في حقه، والاستغفار لهم في تقصيرهم في حق الله.\n  - الشورى في الأمور التي تحتاج نظراً وفكراً. عدّد السعدي من فوائدها: أنها عبادة، وتطييب لنفوس المستشارين وإزالة لما في القلوب، وأن الناس إذا شوورا علموا أن صاحب الأمر لا يستبد عليهم فأحبوه وأطاعوه، وأنها تنير الأفكار، وأن المستشير لا يُلام إن أخطأ.\n  - العزم بعد الشورى يكون مع التوكل والتبرؤ من الحول والقوة.\n- **السياق:** تقع الآية في السياق الطويل لسورة آل عمران المتصل بغزوة أحد. توثيق ذلك من التفاسير لم يتم في هذه الدفعة (فجوة بحثية).\n- **لم يُقرأ بعد:** تفسير ابن كثير والطبري لهذه الآية.\n- **الموضوعات:** `T02` الرحمة، `T10` الحكمة في القرار، `T18` القيادة، `T24` الاختلاف في الرأي، `T13` العفو.\n\n---\n\n## Q-9:128 — الحرص والرأفة\n\n﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ (128)﴾ [9:128]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):** امتنان على المؤمنين بأن بعث فيهم رسولاً من أنفسهم يعرفون حاله ويتمكنون من الأخذ عنه. «عزيز عليه ما عنتم»: يشق عليه ما يشق عليهم. «حريص عليكم»: يحب لهم الخير ويسعى في إيصاله، ويكره لهم الشر ويسعى في إبعاده. «رءوف رحيم»: شديد الرأفة والرحمة بهم. وفي الآية التالية (9:129): إن أعرضوا فليمضِ في دعوته ويتوكل على الله.\n- **لم يُقرأ بعد:** تفسير ابن كثير لهذه الآية.\n- **الموضوعات:** `T02` الرحمة، `T18` القيادة، `T04` الصبر.\n\n---\n\n## Q-21:107 — رحمة للعالمين\n\n﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ (107)﴾ [21:107]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):** هو رحمة الله المهداة لعباده، فمن آمن قبلها وشكرها، ومن كفر ردها. ثم في الآيات بعدها (108–112) تعليم له ﷺ أن يبلغ التوحيد، فإن أعرضوا أعلمهم بالعاقبة على سواء، وأن يقر بأنه لا يعلم وقت العذاب، وأن يستعين بالرحمن.\n- **لم يُقرأ بعد:** تفسير ابن كثير لهذه الآية.\n- **الموضوعات:** `T02` الرحمة.\n\n---\n\n## Q-33:21 — الأسوة الحسنة\n\n﴿لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِمَنْ كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا (21)﴾ [33:21]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):** سياق الآية غزوة الأحزاب، حيث حضر ﷺ القتال بنفسه، فكيف يضن غيره بنفسه؟ ثم عمّم: استدل الأصوليون بالآية على الاحتجاج بأفعاله ﷺ، وأن الأصل اقتداء الأمة به في الأحكام **إلا ما دل الدليل على اختصاصه به**. ولا يوفق للتأسي إلا من يرجو الله واليوم الآخر.\n- **أهميتها للمشروع:** هذه الآية هي الأساس النصي لفكرة المشروع كلها. وقيد السعدي «إلا ما دل الدليل على الاختصاص» هو نفسه القاعدة الثامنة في تعليمات المشروع.\n- **لم يُقرأ بعد:** تفسير ابن كثير كاملاً لهذه الآية (قُرئ مقطع قصير منه فقط فلا يُحتسب).\n- **الموضوعات:** منهج المشروع، `T18` القيادة، `T03` الحزم والشجاعة.\n\n---\n\n## Q-33:45-46 — وظائف الرسالة الخمس\n\n﴿يَا أَيُّهَا النَّبِيُّ إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا وَنَذِيرًا (45) وَدَاعِيًا إِلَى اللَّهِ بِإِذْنِهِ وَسِرَاجًا مُنِيرًا (46)﴾ [33:45-46]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):** هذه خمسة أوصاف هي زبدة الرسالة: شاهد على أمته، ومبشر للمؤمنين، ونذير للمجرمين، وداعٍ إلى الله بإذنه، وسراج منير تُستضاء به الظلمات. ونبه في «داعياً إلى الله» على وجوب إخلاص الدعوة لله لا للنفس وتعظيمها.\n- **لم يُقرأ بعد:** تفسير ابن كثير لهذه الآية.\n- **الموضوعات:** `T18` القيادة، `T22` المسؤولية.\n\n---\n\n## Q-53:3-4 — مصدر كلامه\n\n﴿وَمَا يَنْطِقُ عَنِ الْهَوَىٰ (3) إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ (4)﴾ [53:3-4]\n\n- **الدرجة:** A\n- **تفسير السعدي (E):** ليس نطقه صادراً عن هوى نفسه. ودل هذا على أن السنة وحي من الله، وأنه معصوم فيما يخبر به عن الله وعن شرعه.\n- **ملاحظة منهجية:** يجب الجمع بين هذه الآية وبين ما ثبت في قصة تأبير النخل ونحوها من التفريق بين التبليغ والرأي في أمور الدنيا. يُدرس في قسم الخلاف وفي منهج التحقق (البند 6).\n- **الموضوعات:** منهج المشروع (حجية السنة وحدودها).\n\n---\n\n## Q-80:1-10 — عتاب «عبس»\n\n﴿عَبَسَ وَتَوَلَّىٰ (1) أَنْ جَاءَهُ الْأَعْمَىٰ (2) وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّىٰ (3) أَوْ يَذَّكَّرُ فَتَنْفَعَهُ الذِّكْرَىٰ (4) أَمَّا مَنِ اسْتَغْنَىٰ (5) فَأَنْتَ لَهُ تَصَدَّىٰ (6) وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ (7) وَأَمَّا مَنْ جَاءَكَ يَسْعَىٰ (8) وَهُوَ يَخْشَىٰ (9) فَأَنْتَ عَنْهُ تَلَهَّىٰ (10)﴾ [80:1-10]\n\n- **الدرجة:** A\n- **سبب النزول:**\n  - حديث عائشة: نزلت «عبس وتولى» في ابن أم مكتوم الأعمى، جاء يقول: يا رسول الله أرشدني، وعند النبي ﷺ رجل من عظماء المشركين، فجعل يعرض عنه ويقبل على الآخر. رواه الترمذي برقم 3331 وقال: «هذا حديث حسن غريب»، وذكر أن بعضهم رواه عن عروة مرسلاً دون ذكر عائشة. **الدرجة: C** بحكم الترمذي المقروء في نص الحديث نفسه. وفي قاعدة البيانات أن الألباني قال: صحيح الإسناد، وهذا يُنقل بعلامة الحكم المؤقت حتى يُفتح في كتابه.\n  - نقل ابن كثير القول بنزولها في ابن أم مكتوم عن عروة ومجاهد وأبي مالك وقتادة والضحاك وابن زيد وغير واحد.\n- **تفسير السعدي (E):** كان ﷺ حريصاً على هداية الخلق، فمال إلى الغني رجاء هدايته وأعرض عن الأعمى الفقير، فعاتبه الله عتاباً لطيفاً. واستخرج قاعدة: لا يُترك أمر معلوم لأمر موهوم، ولا مصلحة متحققة لمصلحة متوهمة، وينبغي الإقبال على طالب العلم المفتقر إليه الحريص عليه.\n- **تفسير ابن كثير (E):** من هنا أُمر ﷺ ألا يخص بالإنذار أحداً، بل يساوي فيه بين الشريف والضعيف، والفقير والغني، والسادة والعبيد، والرجال والنساء، والصغار والكبار.\n- **ما بعد العتاب:** نقل ابن كثير من رواية قتادة عند أبي يعلى أنه ﷺ «كان بعد ذلك يكرمه». الدرجة **D** حتى يُوثق الحكم، ونبه محقق التفسير على أن «عن أنس» في إسنادها مقحم.\n- **تعيين الرجل المشرك:** مسألة خلاف بين الروايات. التفاصيل في قسم الخلاف، `SD-004`.\n- **الموضوعات:** `C07` الضعفاء وذوو الإعاقة، `T05` التواضع، `T10` القرار، `T27` تلقي التصحيح.\n\n---\n\n## Q-93:6-11 — اليتم والفقر والهداية\n\n﴿أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ (6) وَوَجَدَكَ ضَالًّا فَهَدَىٰ (7) وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ (8) فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ (9) وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ (10) وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ (11)﴾ [93:6-11]\n\n- **الدرجة:** A\n- **المقروء:** تفسير السعدي للآيات 6–10 فقط.\n- **تفسير السعدي (E):** وجده يتيماً لا أب له ولا أم فآواه، فكفله جده عبد المطلب ثم عمه أبو طالب. ووجده لا يدري ما الكتاب ولا الإيمان فعلّمه. ووجده فقيراً فأغناه. ثم أُمر ألا يقهر اليتيم بل يكرمه ويصنع به ما يحب أن يُصنع بولده، وألا ينهر السائل بل يعطيه أو يرده بمعروف. ويدخل فيه سائل العلم، ولذلك كان المعلم مأموراً بحسن الخلق مع المتعلم.\n- **ملاحظة:** ما ذكره السعدي من كفالة عبد المطلب ثم أبي طالب معلومة تاريخية تُوثق من مصادر السيرة في المرحلة الأولى من الخط الزمني.\n- **الموضوعات:** `T14` الفقر والغنى، `C07` الضعفاء، `C03` الأطفال (اليتيم)، `T20` التربية والتعليم.\n\n---\n\n## Q-18:6 و Q-6:33 — حزنه على من لا يؤمن\n\n﴿فَلَعَلَّكَ بَاخِعٌ نَفْسَكَ عَلَىٰ آثَارِهِمْ إِنْ لَمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا (6)﴾ [18:6]\n\n﴿قَدْ نَعْلَمُ إِنَّهُ لَيَحْزُنُكَ الَّذِي يَقُولُونَ ۖ فَإِنَّهُمْ لَا يُكَذِّبُونَكَ وَلَٰكِنَّ الظَّالِمِينَ بِآيَاتِ اللَّهِ يَجْحَدُونَ (33)﴾ [6:33]\n\n- **الدرجة:** A\n- **تفسير السعدي لآية الكهف (E):** «باخع نفسك»: مهلكها غماً وأسفاً عليهم. والعبرة: أن الداعي عليه البلاغ وبذل الأسباب مع التوكل، فإن لم يستجيبوا فلا يحزن ولا يأسف، لأن ذلك يضعف النفس ولا فائدة فيه.\n- **تفسير السعدي لآية الأنعام (E):** الله يعلم أن قول المكذبين يحزنه، وهم لا يكذبونه في نفسه لأنهم يعرفون صدقه، ولكنهم يجحدون آيات الله. وذكر السعدي أنهم كانوا يسمونه قبل البعثة «الأمين»؛ وهذه معلومة تاريخية تحتاج توثيقاً من مصادر السيرة (فجوة بحثية).\n- **الموضوعات:** `T16` الحزن والقلق، `T04` الصبر، `T07` الصدق، `T13` الإساءة.\n\n---\n\n## الآيات المرتبطة بأحاديث بدء الوحي\n\nنصوصها في قسم الأحاديث مع أحاديثها:\n- سورة العلق 96:1–5 ← البخاري 3 و6982.\n- سورة المدثر 74:1–5 ← البخاري 4.\n- سورة القيامة 75:16–19 ← البخاري 5.\n\n---\n\n## خلاصة الدفعة القرآنية (مستوى E)\n\n- **صورة متسقة من نصوص مستقلة:** آيات الخلق العظيم (68:4)، واللين (3:159)، والحرص والرأفة (9:128)، والرحمة للعالمين (21:107) تتفق على أن الرحمة واللين هما السمة الغالبة في تعامله ﷺ. هذا استنتاج من أربعة نصوص قرآنية مستقلة، لا من نص واحد.\n- **القرآن نفسه يسجل مشاعره ﷺ:** الحزن (6:33، 18:6)، والحرص الذي قد يرهقه. ويعالج ذلك بتوجيه: البلاغ عليك والهداية بيد الله.\n- **القرآن يسجل عتاباً لتصرف اجتهد فيه ﷺ** (عبس)، ونُقل إلى الأمة كما نزل. يوجب هذا الجمع بين هذه الآيات وآية 53:3–4 على ضوء ما قرره العلماء في مسألة اجتهاد النبي ﷺ وعصمته، وتوثيق أقوالهم فيها مسجل فجوة بحثية.\n"}, {"code": "QKB-03", "slug": "qkb-03", "sec": "02", "title": "القرآن — التوسيم الموضوعي للجزء الثلاثين (جزء عمّ)", "short": "توسيم جزء عمّ (30)", "md": "# القرآن — التوسيم الموضوعي للجزء الثلاثين (جزء عمّ)\n\n- **القسم:** 02 — قاعدة المعرفة القرآنية\n- **الدفعة:** 2 — 15 نوفمبر 2026؛ وحُدّث في الدفعة 3 بربط أسباب النزول الثابتة في كتاب التفسير من صحيح البخاري (`HKB-BKH-03`)\n- **النطاق:** السور 78–114، وعدد آياتها **564 آية، قُرئت كلها** من نص المصحف (quran-api).\n- **طبيعة هذا الملف:** نص الآيات **A**. أما التوسيم وربط الآيات بالمحاور فهو تحليل **E**. لم يُقرأ في هذه الدفعة تفسير لهذه الآيات، إلا ما سبق في سورتي عبس والضحى (`QKB-02`).\n- **قاعدة التوسيم:** لم يُذكر حدث تاريخي أو سبب نزول إلا إذا كان في لفظ الآية نفسها. أسباب النزول المشهورة غير الموثقة بعد مسجلة فجوة `RG-023`.\n\n---\n\n## 1. مفتاح الوسوم\n\n| الوسم | المعنى |\n|---|---|\n| **ن** | خطاب للنبي ﷺ أو وصف له أو لوظيفته |\n| **س** | إشارة في لفظ الآية إلى واقع السيرة أو أشخاصها |\n| **خ** | توجيه أخلاقي أو اجتماعي |\n| **ع** | عقيدة وبعث وجزاء |\n| **ك** | آيات الخلق والكون |\n| **ق** | قصص الأمم السابقة |\n\nرموز الموضوعات `T` والفئات `C` كما في الفهرس الرئيسي.\n\n--
