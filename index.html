ْمَانُ الْفَارِسِيُّ، وَضَعَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَدَهُ عَلَى سَلْمَانَ ثُمَّ قَالَ \" لَوْ كَانَ الإِيمَانُ عِنْدَ الثُّرَيَّا لَنَالَهُ رِجَالٌ ـ أَوْ رَجُلٌ ـ مِنْ هَؤُلاَءِ \".\n\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الْوَهَّابِ، حَدَّثَنَا عَبْدُ الْعَزِيزِ، أَخْبَرَنِي ثَوْرٌ، عَنْ أَبِي الْغَيْثِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم  \" لَنَالَهُ رِجَالٌ مِنْ هَؤُلاَءِ \".\n- **الصفحة:** ج6 ص152.\n- **المستفاد:** سأله أبو هريرة عن «الآخرين» فلم يجبه حتى سأل ثلاثاً، ثم وضع يده على سلمان الفارسي وقال: «لو كان الإيمان عند الثريا لناله رجال، أو رجل، من هؤلاء». سبب تأخير الجواب غير مذكور في النص.\n\n### H-BKH-4899 — الانفضاض إلى العير يوم الجمعة `T18`\nحَدَّثَنِي حَفْصُ بْنُ عُمَرَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا حُصَيْنٌ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، وَعَنْ أَبِي سُفْيَانَ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ ـ رضى الله عنهما ـ قَالَ أَقْبَلَتْ عِيرٌ يَوْمَ الْجُمُعَةِ وَنَحْنُ مَعَ النَّبِيِّ صلى الله عليه وسلم فَثَارَ النَّاسُ إِلاَّ اثْنَا عَشَرَ رَجُلاً فَأَنْزَلَ اللَّهُ {وَإِذَا رَأَوْا تِجَارَةً أَوْ لَهْوًا انْفَضُّوا إِلَيْهَا}\n- **الصفحة:** ج6 ص152.\n- **المستفاد:** أقبلت عير يوم الجمعة فخرج الناس إلا اثني عشر رجلاً، فنزلت 62:11 «وتركوك قائماً». الرواية لا تذكر رد فعل النبي ﷺ نفسه، والتوجيه جاء في القرآن.\n\n---\n\n## سورة المنافقين `C11`\n\n### H-BKH-4900 إلى 4904 — زيد بن أرقم وعبد الله بن أبي `PD-010`\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ رَجَاءٍ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ زَيْدِ بْنِ أَرْقَمَ، قَالَ كُنْتُ فِي غَزَاةٍ فَسَمِعْتُ عَبْدَ اللَّهِ بْنَ أُبَىٍّ، يَقُولُ لاَ تُنْفِقُوا عَلَى مَنْ عِنْدَ رَسُولِ اللَّهِ حَتَّى يَنْفَضُّوا مِنْ حَوْلِهِ وَلَوْ رَجَعْنَا مِنْ عِنْدِهِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا. الأَذَلَّ فَذَكَرْتُ ذَلِكَ لِعَمِّي أَوْ لِعُمَرَ فَذَكَرَهُ لِلنَّبِيِّ صلى الله عليه وسلم فَدَعَانِي فَحَدَّثْتُهُ فَأَرْسَلَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِلَى عَبْدِ اللَّهِ بْنِ أُبَىٍّ وَأَصْحَابِهِ فَحَلَفُوا مَا قَالُوا فَكَذَّبَنِي رَسُولُ اللَّهِ صلى الله عليه وسلم وَصَدَّقَهُ فَأَصَابَنِي هَمٌّ لَمْ يُصِبْنِي مِثْلُهُ قَطُّ، فَجَلَسْتُ فِي الْبَيْتِ فَقَالَ لِي عَمِّي مَا أَرَدْتَ إِلَى أَنْ كَذَّبَكَ رَسُولُ اللَّهِ صلى الله عليه وسلم وَمَقَتَكَ. فَأَنْزَلَ اللَّهُ تَعَالَى {إِذَا جَاءَكَ الْمُنَافِقُونَ} فَبَعَثَ إِلَىَّ النَّبِيُّ صلى الله عليه وسلم فَقَرَأَ فَقَالَ \" إِنَّ اللَّهَ قَدْ صَدَّقَكَ يَا زَيْدُ \".\n\nحَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ زَيْدِ بْنِ أَرْقَمَ ـ رضى الله عنه ـ قَالَ كُنْتُ مَعَ عَمِّي فَسَمِعْتُ عَبْدَ اللَّهِ بْنَ أُبَىٍّ ابْنَ سَلُولَ يَقُولُ لاَ تُنْفِقُوا عَلَى مَنْ عِنْدَ رَسُولِ اللَّهِ حَتَّى يَنْفَضُّوا. وَقَالَ أَيْضًا لَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ. فَذَكَرْتُ ذَلِكَ لِعَمِّي فَذَكَرَ عَمِّي لِرَسُولِ اللَّهِ صلى الله عليه وسلم فَأَرْسَلَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِلَى عَبْدِ اللَّهِ بْنِ أُبَىٍّ وَأَصْحَابِهِ، فَحَلَفُوا مَا قَالُوا، فَصَدَّقَهُمْ رَسُولُ اللَّهِ صلى الله عليه وسلم وَكَذَّبَنِي، فَأَصَابَنِي هَمٌّ لَمْ يُصِبْنِي مِثْلُهُ، فَجَلَسْتُ فِي بَيْتِي، فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ {إِذَا جَاءَكَ الْمُنَافِقُونَ} إِلَى قَوْلِهِ {هُمُ الَّذِينَ يَقُولُونَ لاَ تُنْفِقُوا عَلَى مَنْ عِنْدَ رَسُولِ اللَّهِ} إِلَى قَوْلِهِ {لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ} فَأَرْسَلَ إِلَىَّ رَسُولُ اللَّهِ صلى الله عليه وسلم فَقَرَأَهَا عَلَىَّ ثُمَّ قَالَ \" إِنَّ اللَّهَ قَدْ صَدَّقَكَ \".\n\nحَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، عَنِ الْحَكَمِ، قَالَ سَمِعْتُ مُحَمَّدَ بْنَ كَعْبٍ الْقُرَظِيَّ، قَالَ سَمِعْتُ زَيْدَ بْنَ أَرْقَمَ ـ رضى الله عنه ـ قَالَ لَمَّا قَالَ عَبْدُ اللَّهِ بْنُ أُبَىٍّ لاَ تُنْفِقُوا عَلَى مَنْ عِنْدَ رَسُولِ اللَّهِ. وَقَالَ أَيْضًا لَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ. أَخْبَرْتُ بِهِ النَّبِيَّ صلى الله عليه وسلم فَلاَمَنِي الأَنْصَارُ، وَحَلَفَ عَبْدُ اللَّهِ بْنُ أُبَىٍّ مَا قَالَ ذَلِكَ، فَرَجَعْتُ إِلَى الْمَنْزِلِ فَنِمْتُ فَدَعَانِي رَسُولُ اللَّهِ صلى الله عليه وسلم فَأَتَيْتُهُ فَقَالَ \" إِنَّ اللَّهَ قَدْ صَدَّقَكَ \". وَنَزَلَ {هُمُ الَّذِينَ يَقُولُونَ لاَ تُنْفِقُوا} الآيَةَ. وَقَالَ ابْنُ أَبِي زَائِدَةَ عَنِ الأَعْمَشِ عَنْ عَمْرٍو عَنِ ابْنِ أَبِي لَيْلَى عَنْ زَيْدٍ عَنِ النَّبِيِّ صلى الله عليه وسلم.\n\nحَدَّثَنَا عَمْرُو بْنُ خَالِدٍ، حَدَّثَنَا زُهَيْرُ بْنُ مُعَاوِيَةَ، حَدَّثَنَا أَبُو إِسْحَاقَ، قَالَ سَمِعْتُ زَيْدَ بْنَ أَرْقَمَ، قَالَ خَرَجْنَا مَعَ النَّبِيِّ صلى الله عليه وسلم فِي سَفَرٍ أَصَابَ النَّاسَ فِيهِ شِدَّةٌ، فَقَالَ عَبْدُ اللَّهِ بْنُ أُبَىٍّ لأَصْحَابِهِ لاَ تُنْفِقُوا عَلَى مَنْ عِنْدَ رَسُولِ اللَّهِ حَتَّى يَنْفَضُّوا مِنْ حَوْلِهِ. وَقَالَ لَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ. فَأَتَيْتُ النَّبِيَّ صلى الله عليه وسلم فَأَخْبَرْتُهُ فَأَرْسَلَ إِلَى عَبْدِ اللَّهِ بْنِ أُبَىٍّ فَسَأَلَهُ، فَاجْتَهَدَ يَمِينَهُ مَا فَعَلَ، قَالُوا كَذَبَ زَيْدٌ رَسُولَ اللَّهِ صلى الله عليه وسلم فَوَقَعَ فِي نَفْسِي مِمَّا قَالُوا شِدَّةٌ، حَتَّى أَنْزَلَ اللَّهُ عَزَّ وَجَلَّ تَصْدِيقِي فِي {إِذَا جَاءَكَ الْمُنَافِقُونَ} فَدَعَاهُمُ النَّبِيُّ صلى الله عليه وسلم لِيَسْتَغْفِرَ لَهُمْ فَلَوَّوْا رُءُوسَهُمْ. وَقَوْلُهُ {خُشُبٌ مُسَنَّدَةٌ} قَالَ كَانُوا رِجَالاً أَجْمَلَ شَىْءٍ.\n\nحَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ إِسْرَائِيلَ، عَنْ أَبِي إِسْحَاقَ، عَنْ زَيْدِ بْنِ أَرْقَمَ، قَالَ كُنْتُ مَعَ عَمِّي فَسَمِعْتُ عَبْدَ اللَّهِ بْنَ أُبَىٍّ ابْنَ سَلُولَ، يَقُولُ لاَ تُنْفِقُوا عَلَى مَنْ عِنْدَ رَسُولِ اللَّهِ حَتَّى يَنْفَضُّوا، وَلَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ. فَذَكَرْتُ ذَلِكَ لِعَمِّي، فَذَكَرَ عَمِّي لِلنَّبِيِّ صلى الله عليه وسلم {فَدَعَانِي فَحَدَّثْتُهُ، فَأَرْسَلَ إِلَى عَبْدِ اللَّهِ بْنِ أُبَىٍّ وَأَصْحَابِهِ فَحَلَفُوا مَا قَالُوا، وَكَذَّبَنِي النَّبِيُّ صلى الله عليه وسلم} وَصَدَّقَهُمْ، فَأَصَابَنِي غَمٌّ لَمْ يُصِبْنِي مِثْلُهُ قَطُّ، فَجَلَسْتُ فِي بَيْتِي وَقَالَ عَمِّي مَا أَرَدْتَ إِلَى أَنْ كَذَّبَكَ النَّبِيُّ صلى الله عليه وسلم وَمَقَتَكَ. فَأَنْزَلَ اللَّهُ تَعَالَى {إِذَا جَاءَكَ الْمُنَافِقُونَ قَالُوا نَشْهَدُ إِنَّكَ لَرَسُولُ اللَّهِ} وَأَرْسَلَ إِلَىَّ النَّبِيُّ صلى الله عليه وسلم فَقَرَأَهَا وَقَالَ \" إِنَّ اللَّهَ قَدْ صَدَّقَكَ \".\n- **الصفحات:** ج6 ص152–153.\n- **المستفاد:**\n  - نقل زيد كلام ابن أبي إلى عمه، فنقله عمه إلى النبي ﷺ.\n  - **دعا زيداً فسمع منه، ثم أرسل إلى ابن أبي وأصحابه فحلفوا ما قالوا، فصدّقهم وكذّب زيداً**. أي حكم بالظاهر من الأيمان.\n  - أصاب زيداً هم شديد، ولامه عمه، ولامه الأنصار (4902).\n  - ثم نزلت سورة المنافقين، فأرسل إلى زيد وقرأها عليه وقال: «إن الله قد صدقك يا زيد».\n  - في 4903: «فدعاهم النبي ﷺ ليستغفر لهم فلووا رءوسهم». عرض الاستغفار حتى على من كذبوا.\n  - وفي 4903 أن ذلك كان «في سفر أصاب الناس فيه شدة».\n\n### H-BKH-4905 و4907 — «دعوها فإنها منتنة»، و«دعه لا يتحدث الناس أن محمداً يقتل أصحابه» `PD-011`\nحَدَّثَنَا عَلِيٌّ، حَدَّثَنَا سُفْيَانُ، قَالَ عَمْرٌو سَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ ـ رضى الله عنهما ـ قَالَ كُنَّا فِي غَزَاةٍ ـ قَالَ سُفْيَانُ مَرَّةً فِي جَيْشٍ ـ فَكَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ فَقَالَ الأَنْصَارِيُّ يَا لَلأَنْصَارِ. وَقَالَ الْمُهَاجِرِيُّ يَا لَلْمُهَاجِرِينَ. فَسَمِعَ ذَاكَ رَسُولُ اللَّهِ صلى الله عليه وسلم فَقَالَ \" مَا بَالُ دَعْوَى جَاهِلِيَّةٍ \" قَالُوا يَا رَسُولَ اللَّهِ كَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ. فَقَالَ \" دَعُوهَا فَإِنَّهَا مُنْتِنَةٌ \". فَسَمِعَ بِذَلِكَ عَبْدُ اللَّهِ بْنُ أُبَىٍّ فَقَالَ فَعَلُوهَا، أَمَا وَاللَّهِ لَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ. فَبَلَغَ النَّبِيَّ صلى الله عليه وسلم فَقَامَ عُمَرُ فَقَالَ يَا رَسُولَ اللَّهِ دَعْنِي أَضْرِبْ عُنُقَ هَذَا الْمُنَافِقِ. فَقَالَ النَّبِيُّ صلى الله عليه وسلم \" دَعْهُ لاَ يَتَحَدَّثُ النَّاسُ أَنَّ مُحَمَّدًا يَقْتُلُ أَصْحَابَهُ \" وَكَانَتِ الأَنْصَارُ أَكْثَرَ مِنَ الْمُهَاجِرِينَ حِينَ قَدِمُوا الْمَدِينَةَ، ثُمَّ إِنَّ الْمُهَاجِرِينَ كَثُرُوا بَعْدُ. قَالَ سُفْيَانُ فَحَفِظْتُهُ مِنْ عَمْرٍو قَالَ عَمْرٌو سَمِعْتُ جَابِرًا كُنَّا مَعَ النَّبِيِّ صلى الله عليه وسلم.\n\nحَدَّثَنَا الْحُمَيْدِيُّ، حَدَّثَنَا سُفْيَانُ، قَالَ حَفِظْنَاهُ مِنْ عَمْرِو بْنِ دِينَارٍ قَالَ سَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ ـ رضى الله عنهما ـ يَقُولُ كُنَّا فِي غَزَاةٍ فَكَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ فَقَالَ الأَنْصَارِيُّ يَا لَلأَنْصَارِ. وَقَالَ الْمُهَاجِرِيُّ يَا لَلْمُهَاجِرِينَ. فَسَمَّعَهَا اللَّهُ رَسُولَهُ صلى الله عليه وسلم قَالَ \" مَا هَذَا \". فَقَالُوا كَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ فَقَالَ الأَنْصَارِيُّ يَا لَلأَنْصَارِ. وَقَالَ الْمُهَاجِرِيُّ يَالَلْمُهَاجِرِينَ. فَقَالَ النَّبِيُّ صلى الله عليه وسلم \" دَعُوهَا فَإِنَّهَا مُنْتِنَةٌ \". قَالَ جَابِرٌ وَكَانَتِ الأَنْصَارُ حِينَ قَدِمَ النَّبِيُّ صلى الله عليه وسلم أَكْثَرَ، ثُمَّ كَثُرَ الْمُهَاجِرُونَ بَعْدُ، فَقَالَ عَبْدُ اللَّهِ بْنُ أُبَىٍّ أَوَقَدْ فَعَلُوا، وَاللَّهِ لَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ. فَقَالَ عُمَرُ بْنُ الْخَطَّابِ رضى الله عنه دَعْنِي يَا رَسُولَ اللَّهِ أَضْرِبْ عُنُقَ هَذَا الْمُنَافِقِ. قَالَ النَّبِيُّ صلى الله عليه وسلم \" دَعْهُ لاَ يَتَحَدَّثُ النَّاسُ أَنَّ مُحَمَّدًا يَقْتُلُ أَصْحَابَهُ \".\n- **الصفحات:** ج6 ص154–155.\n- **المستفاد:**\n  - ضرب رجل من المهاجرين رجلاً من الأنصار، فتداعى الفريقان بالعصبية. قال: «ما بال دعوى جاهلية؟»، ثم: «دعوها فإنها منتنة».\n  - استغل ابن أبي الحادثة: «لئن رجعنا إلى المدينة ليخرجن الأعز منها الأذل».\n  - طلب عمر أن يضرب عنقه، **فقال: «دعه، لا يتحدث الناس أن محمداً يقتل أصحابه»**.\n\n### H-BKH-4906 — «هذا الذي أوفى الله له بأذنه»\nحَدَّثَنَا إِسْمَاعِيلُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ بْنِ عُقْبَةَ، عَنْ مُوسَى بْنِ عُقْبَةَ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ الْفَضْلِ، أَنَّهُ سَمِعَ أَنَسَ بْنَ مَالِكٍ، يَقُولُ حَزِنْتُ عَلَى مَنْ أُصِيبَ بِالْحَرَّةِ فَكَتَبَ إِلَىَّ زَيْدُ بْنُ أَرْقَمَ وَبَلَغَهُ شِدَّةُ حُزْنِي يَذْكُرُ أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ \" اللَّهُمَّ اغْفِرْ لِلأَنْصَارِ وَلأَبْنَاءِ الأَنْصَارِ \" ـ وَشَكَّ ابْنُ الْفَضْلِ فِي أَبْنَاءِ أَبْنَاءِ الأَنْصَارِ ـ فَسَأَلَ أَنَسًا بَعْضُ مَنْ كَانَ عِنْدَهُ فَقَالَ هُوَ الَّذِي يَقُولُ رَسُولُ اللَّهِ صلى الله عليه وسلم \" هَذَا الَّذِي أَوْفَى اللَّهُ لَهُ بِأُذُنِهِ \".\n- **الصفحة:** ج6 ص154.\n- **المستفاد:** فيه دعاؤه ﷺ: «اللهم اغفر للأنصار ولأبناء الأنصار»، ووصف زيد بن أرقم بأن الله صدّق سمعه.\n\n---\n\n## سورة الطلاق `T19`\n\n### H-BKH-4908 — ابن عمر طلّق امرأته وهي حائض `T12`\nحَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، قَالَ حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي سَالِمٌ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ ـ رضى الله عنهما ـ أَخْبَرَهُ أَنَّهُ، طَلَّقَ امْرَأَتَهُ وَهْىَ حَائِضٌ، فَذَكَرَ عُمَرُ لِرَسُولِ اللَّهِ صلى الله عليه وسلم فَتَغَيَّظَ فِيهِ رَسُولُ اللَّهِ صلى الله عليه وسلم ثُمَّ قَالَ  \" لِيُرَاجِعْهَا ثُمَّ يُمْسِكْهَا حَتَّى تَطْهُرَ، ثُمَّ تَحِيضَ فَتَطْهُرَ، فَإِنْ بَدَا لَهُ أَنْ يُطَلِّقَهَا فَلْيُطَلِّقْهَا طَاهِرًا قَبْلَ أَنْ يَمَسَّهَا فَتِلْكَ الْعِدَّةُ كَمَا أَمَرَهُ اللَّهُ \".\n- **الصفحة:** ج6 ص155.\n- **المستفاد:** «فتغيّظ فيه رسول الله ﷺ»، ثم بيّن الطريقة الصحيحة خطوة خطوة. ظهر الغضب لمخالفة حكم الله، ثم جاء التعليم.\n\n### H-BKH-4909 و4910 — عدة الحامل المتوفى عنها زوجها: سبيعة الأسلمية\nحَدَّثَنَا سَعْدُ بْنُ حَفْصٍ، حَدَّثَنَا شَيْبَانُ، عَنْ يَحْيَى، قَالَ أَخْبَرَنِي أَبُو سَلَمَةَ، قَالَ جَاءَ رَجُلٌ إِلَى ابْنِ عَبَّاسٍ وَأَبُو هُرَيْرَةَ جَالِسٌ عِنْدَهُ فَقَالَ أَفْتِنِي فِي امْرَأَةٍ وَلَدَتْ بَعْدَ زَوْجِهَا بِأَرْبَعِينَ لَيْلَةً. فَقَالَ ابْنُ عَبَّاسٍ آخِرُ الأَجَلَيْنِ. قُلْتُ أَنَا {وَأُولاَتُ الأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ} قَالَ أَبُو هُرَيْرَةَ أَنَا مَعَ ابْنِ أَخِي ـ يَعْنِي أَبَا سَلَمَةَ ـ فَأَرْسَلَ ابْنُ عَبَّاسٍ غُلاَمَهُ كُرَيْبًا إِلَى أُمِّ سَلَمَةَ يَسْأَلُهَا فَقَالَتْ قُتِلَ زَوْجُ سُبَيْعَةَ الأَسْلَمِيَّةِ وَهْىَ حُبْلَى، فَوَضَعَتْ بَعْدَ مَوْتِهِ بِأَرْبَعِينَ لَيْلَةً فَخُطِبَتْ فَأَنْكَحَهَا رَسُولُ اللَّهِ صلى الله عليه وسلم وَكَانَ أَبُو السَّنَابِلِ فِيمَنْ خَطَبَهَا.\n\nوَقَالَ سُلَيْمَانُ بْنُ حَرْبٍ وَأَبُو النُّعْمَانِ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ، عَنْ مُحَمَّدٍ، قَالَ كُنْتُ فِي حَلْقَةٍ فِيهَا عَبْدُ الرَّحْمَنِ بْنُ أَبِي لَيْلَى وَكَانَ أَصْحَابُهُ يُعَظِّمُونَهُ، فَذَكَرَ آخِرَ الأَجَلَيْنِ فَحَدَّثْتُ بِحَدِيثِ سُبَيْعَةَ بِنْتِ الْحَارِثِ عَنْ عَبْدِ اللَّهِ بْنِ عُتْبَةَ قَالَ فَضَمَّزَ لِي بَعْضُ أَصْحَابِهِ. قَالَ مُحَمَّدٌ فَفَطِنْتُ لَهُ فَقُلْتُ إِنِّي إِذًا لَجَرِيءٌ إِنْ كَذَبْتُ عَلَى عَبْدِ اللَّهِ بْنِ عُتْبَةَ وَهْوَ فِي نَاحِيَةِ الْكُوفَةِ. فَاسْتَحْيَا وَقَالَ لَكِنَّ عَمَّهُ لَمْ يَقُلْ ذَاكَ. فَلَقِيتُ أَبَا عَطِيَّةَ مَالِكَ بْنَ عَامِرٍ فَسَأَلْتُهُ فَذَهَبَ يُحَدِّثُنِي حَدِيثَ سُبَيْعَةَ فَقُلْتُ هَلْ سَمِعْتَ عَنْ عَبْدِ اللَّهِ فِيهَا شَيْئًا فَقَالَ كُنَّا عِنْدَ عَبْدِ اللَّهِ فَقَالَ أَتَجْعَلُونَ عَلَيْهَا التَّغْلِيظَ وَلاَ تَجْعَلُونَ عَلَيْهَا الرُّخْصَةَ. لَنَزَلَتْ سُورَةُ النِّسَاءِ الْقُصْرَى بَعْدَ الطُّولَى {وَأُولاَتُ الأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ}.\n- **الصفحة:** ج6 ص156.\n- **المستفاد:** اختلف ابن عباس وأبو سلمة، فأرسل ابن عباس إلى أم سلمة يسألها، فروت أن النبي ﷺ أنكح سبيعة بعد وضعها بأربعين ليلة. السنة الفعلية حسمت الخلاف. الخلاف الفقهي مسجل في `SD-017`.\n\n---\n\n## سورة التحريم `C01` `T19`\n\n### H-BKH-4911 — «في الحرام يكفّر»\nحَدَّثَنَا مُعَاذُ بْنُ فَضَالَةَ، حَدَّثَنَا هِشَامٌ، عَنْ يَحْيَى، عَنِ ابْنِ حَكِيمٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، أَنَّ ابْنَ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ فِي الْحَرَامِ يُكَفِّرُ. وَقَالَ ابْنُ عَبَّاسٍ {لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ إِسْوَةٌ حَسَنَةٌ}.\n- **الصفحة:** ج6 ص156.\n- **طبيعته:** فتوى ابن عباس، واستدل بالأسوة 33:21.\n\n### H-BKH-4912 — العسل عند زينب، و«لم تحرم ما أحل الله لك» `T27`\nحَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى، أَخْبَرَنَا هِشَامُ بْنُ يُوسُفَ، عَنِ ابْنِ جُرَيْجٍ، عَنْ عَطَاءٍ، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ قَالَتْ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَشْرَبُ عَسَلاً عِنْدَ زَيْنَبَ ابْنَةِ جَحْشٍ وَيَمْكُثُ عِنْدَهَا فَوَاطَيْتُ أَنَا وَحَفْصَةُ عَنْ أَيَّتُنَا دَخَلَ عَلَيْهَا فَلْتَقُلْ لَهُ أَكَلْتَ مَغَافِيرَ إِنِّي أَجِدُ مِنْكَ رِيحَ مَغَافِيرَ. قَالَ  \" لاَ وَلَكِنِّي كُنْتُ أَشْرَبُ عَسَلاً عِنْدَ زَيْنَبَ ابْنَةِ جَحْشٍ فَلَنْ أَعُودَ لَهُ وَقَدْ حَلَفْتُ لاَ تُخْبِرِي بِذَلِكِ أَحَدًا \".\n- **الصفحة:** ج6 ص156.\n- **المستفاد:**\n  - عائشة نفسها تروي أنها تواطأت مع حفصة على أن تقول كل منهما: «أجد منك ريح مغافير».\n  - كان جوابه: «لا، ولكني كنت أشرب عسلاً عند زينب ابنة جحش، فلن أعود له، وقد حلفت، لا تخبري بذلك أحداً».\n  - فنزل 66:1 يسأله: «لم تحرم ما أحل الله لك تبتغي مرضات أزواجك».\n- **قيمته:** موضع ثانٍ في القاعدة لتصحيح قرآني لتصرف نبوي، بعد عبس (`PD-004`). وهنا كان التصرف ترك مباح طلباً لرضا أزواجه.\n- **تنبيه:** ذُكر لنزول أول التحريم سبب آخر في غير الصحيحين لم يُوثق بعد `RG-046`.\n\n### H-BKH-4913 — رواية عمر الطويلة: التظاهر، واعتزاله نساءه، وحاله في المشربة `T14` `T05`\nحَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ يَحْيَى، عَنْ عُبَيْدِ بْنِ حُنَيْنٍ، أَنَّهُ سَمِعَ ابْنَ عَبَّاسٍ ـ رضى الله عنهما ـ يُحَدِّثُ أَنَّهُ قَالَ مَكَثْتُ سَنَةً أُرِيدُ أَنْ أَسْأَلَ عُمَرَ بْنَ الْخَطَّابِ عَنْ آيَةٍ، فَمَا أَسْتَطِيعُ أَنْ أَسْأَلَهُ هَيْبَةً لَهُ، حَتَّى خَرَجَ حَاجًّا فَخَرَجْتُ مَعَهُ فَلَمَّا رَجَعْتُ وَكُنَّا بِبَعْضِ الطَّرِيقِ عَدَلَ إِلَى الأَرَاكِ لِحَاجَةٍ لَهُ ـ قَالَ ـ فَوَقَفْتُ لَهُ حَتَّى فَرَغَ سِرْتُ مَعَهُ فَقُلْتُ يَا أَمِيرَ الْمُؤْمِنِينَ مَنِ اللَّتَانِ تَظَاهَرَتَا عَلَى النَّبِيِّ صلى الله عليه وسلم مِنْ أَزْوَاجِهِ فَقَالَ تِلْكَ حَفْصَةُ وَعَائِشَةُ. قَالَ فَقُلْتُ وَاللَّهِ إِنْ كُنْتُ لأُرِيدُ أَنْ أَسْأَلَكَ عَنْ هَذَا مُنْذُ سَنَةٍ، فَمَا أَسْتَطِيعُ هَيْبَةً لَكَ. قَالَ فَلاَ تَفْعَلْ مَا ظَنَنْتَ أَنَّ عِنْدِي مِنْ عِلْمٍ فَاسْأَلْنِي، فَإِنْ كَانَ لِي عِلْمٌ خَبَّرْتُكَ بِهِ ـ قَالَ ـ ثُمَّ قَالَ عُمَرُ وَاللَّهِ إِنْ كُنَّا فِي الْجَاهِلِيَّةِ مَا نَعُدُّ لِلنِّسَاءِ أَمْرًا، حَتَّى أَنْزَلَ اللَّهُ فِيهِنَّ مَا أَنْزَلَ وَقَسَمَ لَهُنَّ مَا قَسَمَ ـ قَالَ ـ فَبَيْنَا أَنَا فِي أَمْرٍ أَتَأَمَّرُهُ إِذْ قَالَتِ امْرَأَتِي لَوْ صَنَعْتَ كَذَا وَكَذَا ـ قَالَ ـ فَقُلْتُ لَهَا مَالَكِ وَلِمَا هَا هُنَا فِيمَا تَكَلُّفُكِ فِي أَمْرٍ أُرِيدُهُ. فَقَالَتْ لِي عَجَبًا لَكَ يَا ابْنَ الْخَطَّابِ مَا تُرِيدُ أَنْ تُرَاجَعَ أَنْتَ، وَإِنَّ ابْنَتَكَ لَتُرَاجِعُ رَسُولَ اللَّهِ صلى الله عليه وسلم حَتَّى يَظَلَّ يَوْمَهُ غَضْبَانَ. فَقَامَ عُمَرُ فَأَخَذَ رِدَاءَهُ مَكَانَهُ حَتَّى دَخَلَ عَلَى حَفْصَةَ فَقَالَ لَهَا يَا بُنَيَّةُ إِنَّكِ لَتُرَاجِعِينَ رَسُولَ اللَّهِ صلى الله عليه وسلم حَتَّى يَظَلَّ يَوْمَهُ غَضْبَانَ. فَقَالَتْ حَفْصَةُ وَاللَّهِ إِنَّا لَنُرَاجِعُهُ. فَقُلْتُ. تَعْلَمِينَ أَنِّي أُحَذِّرُكِ عُقُوبَةَ اللَّهِ وَغَضَبَ رَسُولِهِ صلى الله عليه وسلم يَا بُنَيَّةُ لاَ يَغُرَّنَّكِ هَذِهِ الَّتِي أَعْجَبَهَا حُسْنُهَا حُبُّ رَسُولِ اللَّهِ صلى الله عليه وسلم إِيَّاهَا ـ يُرِيدُ عَائِشَةَ ـ قَالَ ثُمَّ خَرَجْتُ حَتَّى دَخَلْتُ عَلَى أُمِّ سَلَمَةَ لِقَرَابَتِي مِنْهَا فَكَلَّمْتُهَا. فَقَالَتْ أُمُّ سَلَمَةَ عَجَبًا لَكَ يَا ابْنَ الْخَطَّابِ دَخَلْتَ فِي كُلِّ شَىْءٍ، حَتَّى تَبْتَغِي أَنْ تَدْخُلَ بَيْنَ رَسُولِ اللَّهِ صلى الله عليه وسلم وَأَزْوَاجِهِ. فَأَخَذَتْنِي وَاللَّهِ أَخْذًا كَسَرَتْنِي عَنْ بَعْضِ مَا كُنْتُ أَجِدُ، فَخَرَجْتُ مِنْ عِنْدِهَا، وَكَانَ لِي صَاحِبٌ مِنَ الأَنْصَارِ إِذَا غِبْتُ أَتَانِي بِالْخَبَرِ، وَإِذَا غَابَ كُنْتُ أَنَا آتِيهِ بِالْخَبَرِ، وَنَحْنُ نَتَخَوَّفُ مَلِكًا مِنْ مُلُوكِ غَسَّانَ، ذُكِرَ لَنَا أَنَّهُ يُرِيدُ أَنْ يَسِيرَ إِلَيْنَا، فَقَدِ امْتَلأَتْ صُدُورُنَا مِنْهُ، فَإِذَا صَاحِبِي الأَنْصَارِيُّ يَدُقُّ الْبَابَ فَقَالَ افْتَحِ افْتَحْ. فَقُلْتُ جَاءَ الْغَسَّانِيُّ فَقَالَ بَلْ أَشَدُّ مِنْ ذَلِكَ. اعْتَزَلَ رَسُولُ اللَّهِ صلى الله عليه وسلم أَزْوَاجَهُ. فَقُلْتُ رَغَمَ أَنْفُ حَفْصَةَ وَعَائِشَةَ. فَأَخَذْتُ ثَوْبِيَ فَأَخْرُجُ حَتَّى جِئْتُ فَإِذَا رَسُولُ اللَّهِ صلى الله عليه وسلم فِي مَشْرُبَةٍ لَهُ يَرْقَى عَلَيْهَا بِعَجَلَةٍ، وَغُلاَمٌ لِرَسُولِ اللَّهِ صلى الله عليه وسلم أَسْوَدُ عَلَى رَأْسِ الدَّرَجَةِ فَقُلْتُ لَهُ قُلْ هَذَا عُمَرُ بْنُ الْخَطَّابِ. فَأَذِنَ لِي ـ قَالَ عُمَرُ ـ فَقَصَصْتُ عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم هَذَا الْحَدِيثَ، فَلَمَّا بَلَغْتُ حَدِيثَ أُمِّ سَلَمَةَ تَبَسَّمَ رَسُولُ اللَّهِ صلى الله عليه وسلم وَإِنَّهُ لَعَلَى حَصِيرٍ مَا بَيْنَهُ وَبَيْنَهُ شَىْءٌ، وَتَحْتَ رَأْسِهِ وِسَادَةٌ مِنْ أَدَمٍ حَشْوُهَا لِيفٌ، وَإِنَّ عِنْدَ رِجْلَيْهِ قَرَظًا مَصْبُوبًا، وَعِنْدَ رَأْسِهِ أَهَبٌ مُعَلَّقَةٌ فَرَأَيْتُ أَثَرَ الْحَصِيرِ فِي جَنْبِهِ فَبَكَيْتُ فَقَالَ \" مَا يُبْكِيكَ \". فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّ كِسْرَى وَقَيْصَرَ فِيمَا هُمَا فِيهِ وَأَنْتَ رَسُولُ اللَّهِ. فَقَالَ \" أَمَا تَرْضَى أَنْ تَكُونَ لَهُمُ الدُّنْيَا وَلَنَا الآخِرَةُ \".\n- **الصفحة:** ج6 ص158.\n- **تصحيح نصي:** في نسخة hadith-api تلف في كلمة «تظاهرتا» من سؤال ابن عباس، فصُححت من طبعة طوق النجاة.\n- **المستفاد:**\n  - **المراجعة في البيت:** قالت امرأة عمر إن حفصة تراجع رسول الله ﷺ «حتى يظل يومه غضبان». وأقرت حفصة: «والله إنا لنراجعه».\n  - **أم سلمة تصد عمر:** «دخلت في كل شيء حتى تبتغي أن تدخل بين رسول الله ﷺ وأزواجه». ولما حكى عمر ذلك للنبي ﷺ تبسم.\n  - **اعتزل أزواجه** في مشربة. والنص لا يذكر في هذه الرواية سبباً صريحاً للاعتزال ولا مدته `RG-047`.\n  - **حال البيت:** على حصير ليس بينه وبينه شيء حتى أثّر في جنبه، ووسادة من أدم حشوها ليف. بكى عمر، فقال: «أما ترضى أن تكون لهم الدنيا ولنا الآخرة؟».\n  - ومن غير النبي ﷺ: صبر ابن عباس سنة هيبةً لعمر، وقول عمر: «ما ظننت أن عندي من علم فاسألني».\n\n### H-BKH-4914 و4915 — المتظاهرتان: عائشة وحفصة\nحَدَّثَنَا عَلِيٌّ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ سَمِعْتُ عُبَيْدَ بْنَ حُنَيْنٍ، قَالَ سَمِعْتُ ابْنَ عَبَّاسٍ ـ رضى الله عنهما ـ يَقُولُ أَرَدْتُ أَنْ أَسْأَلَ عُمَرَ فَقُلْتُ يَا أَمِيرَ الْمُؤْمِنِينَ مَنِ الْمَرْأَتَانِ اللَّتَانِ تَظَاهَرَتَا عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَمَا أَتْمَمْتُ كَلاَمِي حَتَّى قَالَ عَائِشَةُ وَحَفْصَةُ.\n\nحَدَّثَنَا الْحُمَيْدِيُّ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ سَمِعْتُ عُبَيْدَ بْنَ حُنَيْنٍ، يَقُولُ سَمِعْتُ ابْنَ عَبَّاسٍ، يَقُولُ أَرَدْتُ أَنْ أَسْأَلَ، عُمَرَ عَنِ الْمَرْأَتَيْنِ اللَّتَيْنِ، تَظَاهَرَتَا عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَمَكُثْتُ سَنَةً فَلَمْ أَجِدْ لَهُ مَوْضِعًا، حَتَّى خَرَجْتُ مَعَهُ حَاجًّا، فَلَمَّا كُنَّا بِظَهْرَانَ ذَهَبَ عُمَرُ لِحَاجَتِهِ فَقَالَ أَدْرِكْنِي بِالْوَضُوءِ فَأَدْرَكْتُهُ بِالإِدَاوَةِ، فَجَعَلْتُ أَسْكُبُ عَلَيْهِ وَرَأَيْتُ مَوْضِعًا فَقُلْتُ يَا أَمِيرَ الْمُؤْمِنِينَ مَنِ الْمَرْأَتَانِ اللَّتَانِ تَظَاهَرَتَا قَالَ ابْنُ عَبَّاسٍ فَمَا أَتْمَمْتُ كَلاَمِي حَتَّى قَالَ عَائِشَةُ وَحَفْصَةُ.\n- **الصفحة:** ج6 ص158.\n\n### H-BKH-4916 — «عسى ربه إن طلقكن...» من قول عمر ثم نزلت\nحَدَّثَنَا عَمْرُو بْنُ عَوْنٍ، حَدَّثَنَا هُشَيْمٌ، عَنْ حُمَيْدٍ، عَنْ أَنَسٍ، قَالَ قَالَ عُمَرُ ـ رضى الله عنه ـ اجْتَمَعَ نِسَاءُ النَّبِيِّ صلى الله عليه وسلم فِي الْغَيْرَةِ عَلَيْهِ فَقُلْتُ لَهُنَّ عَسَى رَبُّهُ إِنْ طَلَّقَكُنَّ أَنْ يُبَدِّلَهُ أَزْوَاجًا خَيْرًا مِنْكُنَّ. فَنَزَلَتْ هَذِهِ الآيَةُ.\n- **الصفحة:** ج6 ص158–159.\n- **المستفاد:** «اجتمع نساء النبي ﷺ في الغيرة عليه»، فقال عمر الكلمة، فنزلت الآية 66:5 بلفظها.\n\n---\n\n## خلاصة (مستوى E)\n\n1. **قرارات في التعامل مع المخطئ:** حاطب (سماع العذر ثم الحكم بالصدق وحفظ السابقة)، وابن أبي (ترك قتله مراعاة لأثر ذلك على صورة الدعوة)، وزيد بن أرقم (الحكم بالظاهر ثم ظهور الحق بالوحي). ثلاث روايات في الصحيح.\n2. **البيت النبوي:** مراجعة الزوجات له حتى يظل غضبان، وتواطؤ اثنتين منهن، وغيرتهن مجتمعات. ورده: ترك مباح لإرضائهن فعوتب، ثم اعتزال. ولم يرد في هذه النصوص ضرب ولا سب.\n3. **المال والتخطيط:** قوت السنة للأهل، والباقي عدة (4885)، مع بيت ليس فيه طعام لضيف (4889)، وفراش من حصير (4913). الصورة: تدبير منظم مع زهد شخصي.\n"}, {"code": "HKB-CHR-01", "slug": "hkb-chr-01", "sec": "03", "title": "الأحاديث — شواهد الخُلق النبوي (الدفعة 1)", "short": "شواهد الخُلق النبوي", "md": "# الأحاديث — شواهد الخُلق النبوي (الدفعة 1)\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 1 — 15 نوفمبر 2026\n- **منشأ هذا الملف:** الأحاديث التي أحال إليها ابن كثير في تفسير 68:4، وأحاديث ظهرت في البحث النصي داخل الصحيحين. كل حديث هنا فُتح نصه الكامل من نسخة hadith-api وقُرئ، إلا ما نُص على غيره.\n- **الترقيم:** البخاري بترقيم فتح الباري، ومسلم بترقيم عبد الباقي.\n\n---\n\n## H-BKH-6038 / H-MSL-2309 — خدمة أنس عشر سنين\n\n**رواية البخاري (كتاب الأدب):**\n\nحَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، سَمِعَ سَلاَّمَ بْنَ مِسْكِينٍ، قَالَ سَمِعْتُ ثَابِتًا، يَقُولُ حَدَّثَنَا أَنَسٌ ـ رضى الله عنه ـ قَالَ خَدَمْتُ النَّبِيَّ صلى الله عليه وسلم عَشْرَ سِنِينَ، فَمَا قَالَ لِي أُفٍّ. وَلاَ لِمَ صَنَعْتَ وَلاَ أَلاَّ صَنَعْتَ.\n\n**رواية مسلم (كتاب الفضائل):**\n\nحَدَّثَنَا سَعِيدُ بْنُ مَنْصُورٍ، وَأَبُو الرَّبِيعِ، قَالاَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ خَدَمْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم عَشْرَ سِنِينَ وَاللَّهِ مَا قَالَ لِي أُفًّا . قَطُّ وَلاَ قَالَ لِي لِشَىْءٍ لِمَ فَعَلْتَ كَذَا وَهَلاَّ فَعَلْتَ كَذَا زَادَ أَبُو الرَّبِيعِ لَيْسَ مِمَّا يَصْنَعُهُ الْخَادِمُ . وَلَمْ يَذْكُرْ قَوْلَهُ وَاللَّهِ .\n\n- **الدرجة: B** (متفق عليه).\n- **فرق بين الروايتين:** في مسلم زيادة القسم «والله»، وفي زيادة أبي الربيع: «ليس مما يصنعه الخادم»، أي أن عدم اللوم شمل ما ليس من عمل الخادم أصلاً.\n- **الموضوعات:** `C06` الخدم والعمال، `T12` الغضب، `T02` الرفق، `T20` التربية.\n\n---\n\n## H-BKH-3549 — أحسن الناس وجهاً وخلقاً\n\nحَدَّثَنَا أَحْمَدُ بْنُ سَعِيدٍ أَبُو عَبْدِ اللَّهِ، حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، قَالَ سَمِعْتُ الْبَرَاءَ، يَقُولُ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم أَحْسَنَ النَّاسِ وَجْهًا وَأَحْسَنَهُ خَلْقًا، لَيْسَ بِالطَّوِيلِ الْبَائِنِ وَلاَ بِالْقَصِيرِ.\n\n- **الراوي:** البراء بن عازب رضي الله عنه. **الدرجة: B** (في صحيح البخاري).\n- **الموضوعات:** `T01` الشخصية، `D01` الصفة الخَلقية.\n\n---\n\n## H-BKH-3560 / H-MSL-2328 — اختيار الأيسر، وعدم الانتقام للنفس\n\n**رواية البخاري (كتاب المناقب، وتكرر في الأدب برقم 6126):**\n\nحَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ أَنَّهَا قَالَتْ مَا خُيِّرَ رَسُولُ اللَّهِ صلى الله عليه وسلم بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا، مَا لَمْ يَكُنْ إِثْمًا، فَإِنْ كَانَ إِثْمًا كَانَ أَبْعَدَ النَّاسِ مِنْهُ، وَمَا انْتَقَمَ رَسُولُ اللَّهِ صلى الله عليه وسلم لِنَفْسِهِ، إِلاَّ أَنْ تُنْتَهَكَ حُرْمَةُ اللَّهِ فَيَنْتَقِمَ لِلَّهِ بِهَا.\n\n**رواية مسلم (كتاب الفضائل):**\n\nحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ مَا ضَرَبَ رَسُولُ اللَّهِ صلى الله عليه وسلم شَيْئًا قَطُّ بِيَدِهِ وَلاَ امْرَأَةً وَلاَ خَادِمًا إِلاَّ أَنْ يُجَاهِدَ فِي سَبِيلِ اللَّهِ وَمَا نِيلَ مِنْهُ شَىْءٌ قَطُّ فَيَنْتَقِمَ مِنْ صَاحِبِهِ إِلاَّ أَنْ يُنْتَهَكَ شَىْءٌ مِنْ مَحَارِمِ اللَّهِ فَيَنْتَقِمَ لِلَّهِ عَزَّ وَجَلَّ .\n\n- **الراوية:** عائشة رضي الله عنها. **الدرجة: B** (متفق عليه في معنى عدم الانتقام للنفس، وجملة التخيير في البخاري).\n- **ما في رواية مسلم زيادة على البخاري:** «ما ضرب رسول الله ﷺ شيئاً قط بيده، ولا امرأة، ولا خادماً، إلا أن يجاهد في سبيل الله».\n- **الموضوعات:** `T10` القرار (قاعدة الأيسر ما لم يكن إثماً)، `T12` الغضب، `T13` الإساءة، `T03` الحزم (الانتقام لحرمات الله)، `C01` الزوجات، `C06` الخدم.\n\n---\n\n## H-BKH-5225 — حادثة الصحفة المكسورة\n\nحَدَّثَنَا عَلِيٌّ، حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ حُمَيْدٍ، عَنْ أَنَسٍ، قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم عِنْدَ بَعْضِ نِسَائِهِ فَأَرْسَلَتْ إِحْدَى أُمَّهَاتِ الْمُؤْمِنِينَ بِصَحْفَةٍ فِيهَا طَعَامٌ، فَضَرَبَتِ الَّتِي النَّبِيُّ صلى الله عليه وسلم فِي بَيْتِهَا يَدَ الْخَادِمِ فَسَقَطَتِ الصَّحْفَةُ فَانْفَلَقَتْ، فَجَمَعَ النَّبِيُّ صلى الله عليه وسلم فِلَقَ الصَّحْفَةِ، ثُمَّ جَعَلَ يَجْمَعُ فِيهَا الطَّعَامَ الَّذِي كَانَ فِي الصَّحْفَةِ وَيَقُولُ  \" غَارَتْ أُمُّكُمْ \"، ثُمَّ حَبَسَ الْخَادِمَ حَتَّى أُتِيَ بِصَحْفَةٍ مِنْ عِنْدِ الَّتِي هُوَ فِي بَيْتِهَا، فَدَفَعَ الصَّحْفَةَ الصَّحِيحَةَ إِلَى الَّتِي كُسِرَتْ صَحْفَتُهَا، وَأَمْسَكَ الْمَكْسُورَةَ فِي بَيْتِ الَّتِي كَسَرَتْ فِيه.\n\n- **الراوي:** أنس رضي الله عنه. **الموضع:** كتاب النكاح. **الدرجة: B** (في صحيح البخاري).\n- **مضمونه:** كان ﷺ في بيت إحدى زوجاته، فأرسلت زوجة أخرى طعاماً في صحفة، فضربت صاحبة البيت يد الخادم فانكسرت. فجمع ﷺ الكسر والطعام بنفسه وقال «غارت أمكم»، ثم أعطى صاحبة الطعام صحفة صحيحة من البيت الذي كُسرت فيه، وأبقى المكسورة فيه.\n- **ملاحظة:** في المسند قصة قريبة رواها ابن كثير من طريق فيه رجل غير مسمى، وفيها تسمية عائشة وحفصة. لا تُخلط بهذا الحديث حتى يُدرس إسنادها (D).\n- **القرار:** `PD-002` في قسم القرارات.\n- **الموضوعات:** `T28` المواقف المحرجة، `T11` الخلافات، `T08` العدل، `T12` الغضب، `C01` الزوجات، `C06` الخدم.\n\n---\n\n## H-MSL-0746 — «كان خلقه القرآن» (مقتطف)\n\n- **النص الموثق بالبحث النصي:** «فإن خلق نبي الله ﷺ كان القرآن»، في حديث سعد بن هشام الطويل عن عائشة رضي الله عنها.\n- **الدرجة: B** (في صحيح مسلم، رقم 746). نص الحديث كاملاً (نحو أربعة آلاف حرف) لم يُقرأ في هذه الدفعة.\n- **الموضوعات:** `T01` الشخصية، وهو المفتاح التفسيري لآية 68:4.\n\n---\n\n## H-TRM-3331 — سبب نزول «عبس»\n\nحَدَّثَنَا سَعِيدُ بْنُ يَحْيَى بْنِ سَعِيدٍ الأُمَوِيُّ، حَدَّثَنِي أَبِي قَالَ، هَذَا مَا عَرَضْنَا عَلَى هِشَامِ بْنِ عُرْوَةَ عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ أُنْزِلَ : ( عبَسَ وَتَوَلَّى ) فِي ابْنِ أُمِّ مَكْتُومٍ الأَعْمَى أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَجَعَلَ يَقُولُ يَا رَسُولَ اللَّهِ أَرْشِدْنِي وَعِنْدَ رَسُولِ اللَّهِ صلى الله عليه وسلم رَجُلٌ مِنْ عُظَمَاءِ الْمُشْرِكِينَ فَجَعَلَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُعْرِضُ عَنْهُ وَيُقْبِلُ عَلَى الآخَرِ وَيَقُولُ أَتَرَى بِمَا أَقُولُ بَأْسًا فَيُقَالُ لاَ . فَفِي هَذَا أُنْزِلَ . قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ . وَرَوَى بَعْضُهُمْ هَذَا الْحَدِيثَ عَنْ هِشَامِ بْنِ عُرْوَةَ عَنْ أَبِيهِ قَالَ أُنْزِلََ : ( عبَسَ وَتَوَلَّى ) فِي ابْنِ أُمِّ مَكْتُومٍ . وَلَمْ يَذْكُرْ فِيهِ عَنْ عَائِشَةَ .\n\n- **الدرجة: C** بحكم الترمذي في النص نفسه: «حسن غريب». وفي قاعدة البيانات: الألباني «صحيح الإسناد» (حكم مؤقت حتى يُفتح في كتابه).\n- **تنبيه على حكم آخر في قاعدة البيانات:** القاعدة تنسب إلى أحمد شاكر حكماً على هذا الحديث. تحقيق شاكر لجامع الترمذي لم يشمل الكتاب كله بحسب المعروف عن تلك الطبعة، فنسبة الحكم إليه في هذا الموضع تحتاج تحققاً قبل الاعتماد.\n- **الموضوعات:** `C07` الضعفاء وذوو الإعاقة، `T27` تلقي التصحيح.\n\n---\n\n## مواضع مرتبطة وُثق رقمها ولم يُقرأ نصها كاملاً\n\n- **البخاري 2820 و3040** (أنس): يبدأ النص في الموضعين بوصفه ﷺ بأنه «أحسن الناس، وأجود الناس، وأشجع الناس»، ثم قصة فزع أهل المدينة. مرشح لموضوع `T03` (الشجاعة) في الدفعة القادمة.\n- **البخاري 1902 و3220 و3554:** مواضع أخرى لحديث ابن عباس في الجود.\n"}, {"code": "HKB-SHM-01", "slug": "hkb-shm-01", "sec": "03", "title": "الأحاديث — الشمائل المحمدية للترمذي: أبواب الكلام والضحك والمزاح والشعر والسمر والتواضع والخلق والحياء (دراسة كاملة)", "short": "الشمائل: أبواب الخلق والكلام", "md": "# الأحاديث — الشمائل المحمدية للترمذي: أبواب الكلام والضحك والمزاح والشعر والسمر والتواضع والخلق والحياء (دراسة كاملة)\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 4 — 15 نوفمبر 2026\n- **النطاق:** ثمانية أبواب كاملة من الشمائل: 34–38 و47–49 بترتيب الكتاب. أرقامها في طبعة الجليمي 224–254 و331–360، وعددها **61 رقماً، قُرئت كلها**. وفي الكتاب 56 باباً.\n- **النص:** طبعة سيد بن عباس الجليمي، المكتبة التجارية، مكة، الأولى 1413هـ (الشاملة 13037، مدونة OpenITI). الأرقام المذكورة أرقام هذه الطبعة. في النسخة الرقمية دُمج الرقمان 357 و358 تحت رقم واحد، ففُصلا هنا بحسب المتن.\n- **مصدر الأحكام:** «مختصر الشمائل المحمدية» للألباني، المكتبة الإسلامية، عمّان (الشاملة 700، OpenITI). **الأحكام مقروءة من كتابه نفسه**، فليست أحكاماً مؤقتة. ترقيم المختصر يختلف عن ترقيم الجليمي، ويُذكر بين قوسين. ولم يذكر المختصر وجه التصحيح أو التضعيف.\n- **التخريج:** بالبحث النصي في hadith-api: البخاري بترقيم عبد الباقي لطبعة طوق النجاة، ومسلم بترقيم عبد الباقي. وأحكام جامع الترمذي من بيانات المستودع نفسه.\n- **قاعدة الدرجة:** ما في الصحيحين، أو صححه الألباني في المختصر: **B**. ما حسّنه: **C**. ما ضعّفه أو ضعّفه جداً: **X**، ولا يظهر إلا في قائمة التحذير آخر الملف.\n\n## الحصيلة\n\n| الدرجة | عدد الأرقام |\n|---|---|\n| B | 45 |\n| C | 4 |\n| X | 12 |\n| **المجموع** | **61** |\n\n---\n\n## الباب 34: باب كيف كان كلام رسول الله ﷺ `D05` `T09` `T26`\n\n### H-SHM-0224 — لا يسرد، وكلامه بيّن فصل يحفظه من جلس إليه\nحدثنا حميد بن مسعدة البصري قال: حدثنا حميد بن الأسود، عن أسامة بن زيد، عن الزهري، عن عروة، عن عائشة، قالت: «ما كان رسول الله صلى الله عليه وسلم يسرد سردكم هذا، ولكنه كان يتكلم بكلام بين فصل، يحفظه من جلس إليه»\n\n- **الدرجة:** B — صححه الألباني (مختصر الشمائل 191)، وأصله في البخاري 3567 و3568 ومسلم 2493.\n- **ملاحظة:** الشاهد الثالث على هذا الوصف في القاعدة، بعد روايتي البخاري في `HKB-BKH-02`. وزيادة هذه الرواية: «يحفظه من جلس إليه».\n\n### H-SHM-0225 — يعيد الكلمة ثلاثاً لتُعقل عنه\nحدثنا محمد بن يحيى قال: حدثنا أبو قتيبة سلم بن قتيبة، عن عبد الله بن المثنى، عن ثمامة، عن أنس بن مالك قال: «كان رسول الله صلى الله عليه وسلم يعيد الكلمة ثلاثا لتعقل عنه»\n\n- **الدرجة:** B — صححه الألباني (192)، وهو في البخاري 95 من طريق ثمامة عن أنس، ولفظه: «كان إذا تكلم بكلمة أعادها ثلاثاً حتى تُفهم عنه». وفي جامع الترمذي 3640: حسن صحيح.\n- **ملاحظة:** الإعادة مقصدها منصوص في الروايتين: «لتعقل عنه»، «حتى تفهم عنه». ولفظ «إذا تكلم بكلمة» لا يلزم منه أن كل كلامه كان يُعاد؛ وتحرير ذلك من الشروح فجوة `RG-041`.\n\n\n## الباب 35: باب ما جاء في ضحك رسول الله ﷺ `T01` `D05`\n\n### H-SHM-0228 وH-SHM-0229 — ما رأيت أحداً أكثر تبسماً منه، وما كان ضحكه إلا تبسماً\nحدثنا قتيبة بن سعيد قال: أخبرنا ابن لهيعة، عن عبيد الله بن المغيرة، عن عبد الله بن الحارث بن جزء، أنه قال: «ما رأيت أحدا أكثر تبسما من رسول الله صلى الله عليه وسلم»\n\nحدثنا أحمد بن خالد الخلال قال: حدثنا يحيى بن إسحاق السيلحاني قال: حدثنا ليث بن سعد، عن يزيد بن أبي حبيب، عن عبد الله بن الحارث قال: «ما كان ضحك رسول الله صلى الله عليه وسلم إلا تبسما» قال أبو عيسى: «هذا حديث غريب من حديث ليث بن سعد»\n\n- **الدرجة:** B — صححه الألباني بالطريقين (194). وقال الترمذي في 229: «هذا حديث غريب من حديث ليث بن سعد». وفي جامع الترمذي 3641 و3642.\n- **ملاحظة:** في إسناد 228 ابن لهيعة، والطريق الثانية من غيره.\n\n### H-SHM-0230 — حديث أبي ذر في الرجل تُبدَّل سيئاته حسنات، فضحك حتى بدت نواجذه\nحدثنا أبو عمار الحسين بن حريث قال: حدثنا وكيع قال: حدثنا الأعمش، عن المعرور بن سويد، عن أبي ذر قال: قال رسول الله صلى الله عليه وسلم: \" إني لأعلم أول رجل يدخل الجنة وآخر رجل يخرج من النار، يؤتى بالرجل يوم القيامة فيقال: اعرضوا عليه صغار ذنوبه ويخبأ عنه كبارها، فيقال له: عملت يوم كذا وكذا كذا، وهو مقر لا ينكر، وهو مشفق من كبارها فيقال: أعطوه مكان كل سيئة عملها حسنة، فيقول: إن لي ذنوبا ما أراها ههنا \" قال أبو ذر: فلقد رأيت رسول الله صلى الله عليه وسلم ضحك حتى بدت نواجذه\n\n- **الدرجة:** B — مسلم 190، وصححه الألباني (195).\n\n### H-SHM-0231 وH-SHM-0232 — جرير: ما حجبني منذ أسلمت، ولا رآني إلا ضحك (أو: تبسم)\nحدثنا أحمد بن منيع قال: حدثنا معاوية بن عمرو قال: حدثنا زائدة، عن بيان ، عن قيس بن أبي حازم، عن جرير بن عبد الله قال: «ما حجبني رسول الله صلى الله عليه وسلم منذ أسلمت ولا رآني إلا ضحك»\n\nحدثنا أحمد بن منيع قال: حدثنا معاوية بن عمرو قال: حدثنا زائدة، عن إسماعيل بن أبي خالد، عن قيس، عن جرير قال: «ما حجبني رسول الله صلى الله عليه وسلم ولا رآني منذ أسلمت إلا تبسم»\n\n- **الدرجة:** B — البخاري 3035 و6089، ومسلم 2475، وصححه الألباني (196).\n- **ملاحظة:** في البخاري زيادة: شكا إليه جرير أنه لا يثبت على الخيل، «فضرب بيده في صدري وقال: اللهم ثبته واجعله هادياً مهدياً».\n\n### H-SHM-0233 — ابن مسعود: آخر أهل النار خروجاً، فضحك حتى بدت نواجذه\nحدثنا هناد بن السري قال: حدثنا أبو معاوية، عن الأعمش، عن إبراهيم، عن عبيدة السلماني، عن عبد الله بن مسعود قال: قال رسول الله صلى الله عليه وسلم: \" إني لأعرف آخر أهل النار خروجا، رجل يخرج منها زحفا، فيقال له: انطلق فادخل الجنة \" قال: \" فيذهب ليدخل الجنة، فيجد الناس قد أخذوا المنازل، فيرجع فيقول: يا رب، قد أخذ الناس المنازل، فيقال له: أتذكر الزمان الذي كنت فيه، فيقول: نعم \" قال: \" فيقال له: تمن \" قال: \" فيتمنى، فيقال له: فإن لك الذي تمنيت وعشرة أضعاف الدنيا ‍ \" قال: \" فيقول: تسخر بي وأنت الملك \" قال: فلقد رأيت رسول الله صلى الله عليه وسلم ضحك حتى بدت نواجذه\n\n- **الدرجة:** B — البخاري 6571، ومسلم 186، وصححه الألباني (197).\n\n### H-SHM-0234 — علي: دعاء الركوب، ثم ضحك، وقال: إن ربك ليعجب من عبده إذا قال: رب اغفر لي ذنوبي\nحدثنا قتيبة بن سعيد قال: حدثنا أبو الأحوص، عن أبي إسحاق، عن علي بن ربيعة قال : شهدت عليا، أتي بدابة ليركبها فلما وضع رجله في الركاب قال: بسم الله، فلما استوى على ظهرها قال: الحمد لله، ثم قال: {سبحان الذي سخر لنا هذا وما كنا له مقرنين} [الزخرف: 13] {وإنا إلى ربنا لمنقلبون} [الزخرف: 14] . ثم قال: الحمد لله ثلاثا، والله أكبر ثلاثا، سبحانك إني ظلمت نفسي، فاغفر لي فإنه لا يغفر الذنوب إلا أنت، ثم ضحك. فقلت له: من أي شيء ضحكت يا أمير المؤمنين؟ قال: رأيت رسول الله صلى الله عليه وسلم صنع كما صنعت ثم ضحك فقلت: من أي شيء ضحكت يا رسول الله؟ قال: \" إن ربك ليعجب من عبده إذا قال: رب اغفر لي ذنوبي، إنه لا يغفر الذنوب غيرك \"\n\n- **الدرجة:** B — صححه الألباني (198)، وفي جامع الترمذي 3446 صحيح بحكمه.\n- **ملاحظة:** فيه أن الصحابي سأله عن سبب ضحكه، فأجاب. يتصل بـ `T26` (السؤال عن سبب الفعل وتلقي الجواب).\n\n\n## الباب 36: باب ما جاء في صفة مزاح رسول الله ﷺ `T09` `D05` `C03` `C05` `C08`\n\n### H-SHM-0236 — «يا ذا الأذنين»، يعني يمازحه\nحدثنا محمود بن غيلان قال: حدثنا أبو أسامة، عن شريك، عن عاصم الأحول، عن أنس بن مالك أن النبي صلى الله عليه وسلم قال له: «يا ذا الأذنين» قال محمود: قال أبو أسامة: «يعني يمازحه»\n\n- **الدرجة:** B — صححه الألباني (200)، وفي جامع الترمذي 1992 و3828.\n\n### H-SHM-0237 — «يا أبا عمير، ما فعل النغير؟»\nحدثنا هناد بن السري قال: حدثنا وكيع، عن شعبة، عن أبي التياح، عن أنس بن مالك قال: إن كان رسول الله صلى الله عليه وسلم ليخالطنا حتى يقول لأخ لي صغير: «يا أبا عمير، ما فعل النغير؟» قال أبو عيسى: \" وفقه هذا الحديث أن النبي صلى الله عليه وسلم كان يمازح وفيه أنه كنى غلاما صغيرا فقال له: يا أبا عمير. وفيه أنه لا بأس أن يعطى الصبي الطير ليلعب به. وإنما قال له النبي صلى الله عليه وسلم: «يا أبا عمير، ما فعل النغير؟» لأنه كان له نغير يلعب به فمات، فحزن الغلام عليه فمازحه النبي صلى الله عليه وسلم: «يا أبا عمير، ما فعل النغير؟»\n\n- **الدرجة:** B — البخاري 6129 و6203، ومسلم 2150، وصححه الألباني (201).\n- **ملاحظة:** **كلام الترمذي في فقه الحديث (E، منسوب إليه):** فيه أنه ﷺ كان يمازح، وأنه كنّى غلاماً صغيراً، وأنه لا بأس أن يُعطى الصبي الطير يلعب به. وذكر أن الطائر مات فحزن الغلام، فمازحه بذلك. وفي مسلم 2150 أن أبا عمير كان فطيماً.\n\n### H-SHM-0238 — «إني لا أقول إلا حقاً»، جواباً لمن قال: إنك تداعبنا\nحدثنا عباس بن محمد الدوري قال: حدثنا علي بن الحسن بن شقيق قال: أنبأنا عبد الله بن المبارك، عن أسامة بن زيد، عن سعيد المقبري، عن أبي هريرة قال: قالوا: يا رسول الله إنك تداعبنا قال: «إني لا أقول إلا حقا»\n\n- **الدرجة:** B — صححه الألباني (202)، وفي جامع الترمذي 1990. ولفظ المختصر: «نعم، غير أني لا أقول إلا حقاً».\n- **ملاحظة:** هذا هو **الضابط المنصوص** للمزاح النبوي: لا كذب فيه.\n\n### H-SHM-0239 — «إني حاملك على ولد ناقة... وهل تلد الإبل إلا النوق؟»\nحدثنا قتيبة بن سعيد قال: حدثنا خالد بن عبد الله، عن حميد، عن أنس بن مالك، أن رجلا استحمل رسول الله صلى الله عليه وسلم فقال: «إني حاملك على ولد ناقة» فقال: يا رسول الله، ما أصنع بولد الناقة؟ فقال صلى الله عليه وسلم: «وهل تلد الإبل إلا النوق»\n\n- **الدرجة:** B — صححه الألباني (203)، وفي جامع الترمذي 1991.\n\n### H-SHM-0240 — زاهر: احتضنه من خلفه، و«من يشتري هذا العبد؟»، و«أنت عند الله غالٍ»\nحدثنا إسحاق بن منصور قال: حدثنا عبد الرزاق قال: حدثنا معمر، عن ثابت، عن أنس بن مالك ، أن رجلا من أهل البادية كان اسمه زاهرا وكان يهدي إلى النبي صلى الله عليه وسلم هدية من البادية، فيجهزه النبي صلى الله عليه وسلم إذا أراد أن يخرج، فقال النبي صلى الله عليه وسلم: «إن زاهرا باديتنا ونحن حاضروه» وكان صلى الله عليه وسلم يحبه وكان رجلا دميما فأتاه النبي صلى الله عليه وسلم يوما وهو يبيع متاعه فاحتضنه من خلفه وهو لا يبصره، فقال: من هذا؟ أرسلني. فالتفت فعرف النبي صلى الله عليه وسلم فجعل لا يألو ما ألصق ظهره بصدر النبي صلى الله عليه وسلم حين عرفه، فجعل النبي صلى الله عليه وسلم يقول: «من يشتري هذا العبد» فقال: يا رسول الله، إذا والله تجدني كاسدا، فقال النبي صلى الله عليه وسلم: «لكن عند الله لست بكاسد» أو قال: «أنت عند الله غال»\n\n- **الدرجة:** B — صححه الألباني (204).\n- **ملاحظة:** زاهر رجل من البادية «كان رجلاً دميماً»، ونص الحديث أنه ﷺ «كان يحبه». المزاح هنا انتهى بجبر خاطر صريح: «لكن عند الله لست بكاسد».\n\n### H-SHM-0241 — العجوز: «إن الجنة لا تدخلها عجوز»، ثم «أخبروها أنها لا تدخلها وهي عجوز»\nحدثنا عبد بن حميد قال: حدثنا مصعب بن المقدام قال: حدثنا المبارك بن فضالة، عن الحسن قال : أتت عجوز إلى النبي صلى الله عليه وسلم، فقالت: يا رسول الله، ادع الله أن يدخلني الجنة، فقال: «يا أم فلان، إن الجنة لا تدخلها عجوز» قال: فولت تبكي فقال: «أخبروها أنها لا تدخلها وهي عجوز» إن الله تعالى يقول: {إنا أنشأناهن إنشاء فجعلناهن أبكارا عربا أترابا} [الواقعة: 36]\n\n- **الدرجة:** C — حسّنه الألباني (205). والإسناد في الشمائل مرسل عن الحسن البصري، ولم يذكر المختصر وجه التحسين.\n- **ملاحظة:** لما بكت أرسل من يبين لها المعنى فوراً. المزاح لم يُترك يجرح.\n\n\n## الباب 37: باب ما جاء في صفة كلام رسول الله ﷺ في الشعر `T26` `T09` `T18`\n\n### H-SHM-0242 — كان يتمثل بشعر ابن رواحة، و«ويأتيك بالأخبار من لم تزود»\nحدثنا علي بن حجر قال: حدثنا شريك، عن المقدام بن شريح، عن أبيه، عن عائشة، قالت: قيل لها: هل كان النبي صلى الله عليه وسلم يتمثل بشيء من الشعر؟ قالت: كان يتمثل بشعر ابن رواحة، ويتمثل بقوله: « [البحر الطويل] ويأتيك بالأخبار من لم تزود»\n\n- **الدرجة:** B — صححه الألباني (206)، وفي جامع الترمذي 2848.\n\n### H-SHM-0243 وH-SHM-0249 — «أصدق كلمة قالها الشاعر كلمة لبيد: ألا كل شيء ما خلا الله باطل»\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان الثوري، عن عبد الملك بن عمير قال: حدثنا أبو سلمة، عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: \" إن أصدق كلمة قالها الشاعر كلمة لبيد: [البحر الطويل] ألا كل شيء ما خلا الله باطل، وكاد أمية بن أبي الصلت أن يسلم \"\n\nحدثنا علي بن حجر قال: حدثنا شريك، عن عبد الملك بن عمير، عن أبي سلمة، عن أبي هريرة، عن النبي صلى الله عليه وسلم قال: \" أشعر كلمة تكلمت بها العرب كلمة لبيد: [البحر الطويل] ألا كل شيء ما خلا الله باطل \"\n\n- **الدرجة:** B — البخاري 3841 و6147، ومسلم 2256، وصححه الألباني (207).\n\n### H-SHM-0244 وH-SHM-0245 — «هل أنت إلا إصبع دميت، وفي سبيل الله ما لقيت»\nحدثنا محمد بن المثنى قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن الأسود بن قيس، عن جندب بن سفيان البجلي قال: أصاب حجر أصبع رسول الله صلى الله عليه وسلم فدميت، فقال: «هل أنت إلا أصبع دميت، وفي سبيل الله ما لقيت»\n\nحدثنا ابن أبي عمر قال: حدثنا سفيان بن عيينة، عن الأسود بن قيس، عن جندب بن عبد الله البجلي، نحوه\n\n- **الدرجة:** B — البخاري 2802 و6146، ومسلم 1796، وصححه الألباني (208).\n\n### H-SHM-0246 — يوم حنين على بغلته: «أنا النبي لا كذب، أنا ابن عبد المطلب»\nحدثنا محمد بن بشار قال: حدثنا يحيى بن سعيد قال: حدثنا سفيان الثوري قال: أنبأنا أبو إسحاق، عن البراء بن عازب قال: قال له رجل: أفررتم عن رسول الله صلى الله عليه وسلم يا أبا عمارة؟ فقال: لا والله ما ولى رسول الله صلى الله عليه وسلم، ولكن ولى سرعان الناس تلقتهم هوازن بالنبل ورسول الله صلى الله عليه وسلم على بغلته، وأبو سفيان بن الحارث بن عبد المطلب آخذ بلجامها، ورسول الله يقول: «أنا النبي لا كذب، أنا ابن عبد المطلب»\n\n- **الدرجة:** B — البخاري 2864، ومسلم 1776، وصححه الألباني (209).\n- **ملاحظة:** `T18` `T03`: ثبت في موضعه حين ولّى «سرعان الناس». وفي البخاري 2864: «فلم يفر».\n\n### H-SHM-0247 — ابن رواحة يرتجز بين يديه في عمرة القضاء، فأنكر عمر، فقال: «خل عنه يا عمر»\nحدثنا إسحاق بن منصور قال: حدثنا عبد الرزاق قال: حدثنا جعفر بن سليمان قال: حدثنا ثابت، عن أنس: أن النبي صلى الله عليه وسلم دخل مكة في عمرة القضاء، وابن رواحة يمشي بين يديه، وهو يقول: [البحر الرجز] خلوا بني الكفار عن سبيله ... اليوم نضربكم على تنزيله ضربا يزيل الهام عن مقيله ... ويذهل الخليل عن خليله فقال له عمر: يا ابن رواحة، بين يدي رسول الله صلى الله عليه وسلم وفي حرم الله تقول الشعر، فقال صلى الله عليه وسلم: «خل عنه يا عمر، فلهي أسرع فيهم من نضح النبل»\n\n- **الدرجة:** B — صححه الألباني (210)، وفي جامع الترمذي 2847.\n- **ملاحظة:** `T24`: ردّ اعتراض عمر وأقر ابن رواحة، وعلّل ذلك بأثره.\n\n### H-SHM-0248 — جابر بن سمرة: جالسته أكثر من مائة مرة، وأصحابه يتناشدون الشعر ويتذاكرون أمر الجاهلية، وهو ساكت وربما تبسم معهم\nحدثنا علي بن حجر قال: حدثنا شريك، عن سماك بن حرب، عن جابر بن سمرة قال: «جالست النبي صلى الله عليه وسلم أكثر من مائة مرة وكان أصحابه يتناشدون الشعر ويتذاكرون أشياء من أمر الجاهلية وهو ساكت وربما تبسم معهم»\n\n- **الدرجة:** B — صححه الألباني (211)، وفي جامع الترمذي 2850.\n- **ملاحظة:** `T26` `C04`: نص على حضوره مجالس أصحابه في حديثهم المباح وإنصاته لهم.\n\n### H-SHM-0250 — الشريد: أنشدته مائة قافية من شعر أمية، وكلما أنشدته بيتاً قال: «هيه»، ثم قال: «إن كاد ليسلم»\nحدثنا أحمد بن منيع قال: حدثنا مروان بن معاوية، عن عبد الله بن عبد الرحمن الطائفي، عن عمرو بن الشريد، عن أبيه قال: كنت ردف النبي صلى الله عليه وسلم فأنشدته مائة قافية من قول أمية بن أبي الصلت الثقفي، كلما أنشدته بيتا قال لي النبي صلى الله عليه وسلم: «هيه» حتى أنشدته مائة - يعني بيتا - فقال النبي صلى الله عليه وسلم: «إن كاد ليسلم»\n\n- **الدرجة:** B — مسلم 2255، وصححه الألباني (212). وفي إحدى روايات مسلم: «استنشدني رسول الله ﷺ».\n- **ملاحظة:** `T26`: هو الذي طلب الإنشاد، واستزاد مائة بيت، ثم حكم على الشاعر بحكم منصف.\n\n### H-SHM-0251 وH-SHM-0252 — منبر حسان في المسجد: «إن الله يؤيد حسان بروح القدس ما ينافح عن رسول الله»\nحدثنا إسماعيل بن موسى الفزاري، وعلي بن حجر، والمعنى واحد، قالا: حدثنا عبد الرحمن بن أبي الزناد، عن هشام بن عروة، عن أبيه، عن عائشة، قالت: كان رسول الله صلى الله عليه وسلم يضع لحسان بن ثابت منبرا في المسجد يقوم عليه قائما يفاخر عن رسول الله صلى الله عليه وسلم - أو قال: ينافح عن رسول الله صلى الله عليه وسلم - ويقول صلى الله عليه وسلم: «إن الله يؤيد حسان بروح القدس ما ينافح أو يفاخر عن رسول الله صلى الله عليه وسلم»\n\nحدثنا إسماعيل بن موسى، وعلي بن حجر، قالا: حدثنا ابن أبي الزناد، عن أبيه، عن عروة، عن عائشة، عن النبي صلى الله عليه وسلم مثله\n\n- **الدرجة:** C — حسّنه الألباني (213)، وفي جامع الترمذي 2846 حسن بحكمه. وفي نسخة المختصر علامة ثانية «(صحيح)» داخل النص لم يتبين مقصودها. وفي مسلم 2490 قصة هجاء حسان، وفيها ذكر روح القدس.\n\n\n## الباب 38: باب ما جاء في كلام رسول الله ﷺ في السمر `C01` `T19` `D05`\n\n### H-SHM-0254 — حديث أم زرع، وفي آخره: «كنت لك كأبي زرع لأم زرع»\nحدثنا علي بن حجر قال: حدثنا عيسى بن يونس، عن هشام بن عروة، عن أخيه عبد الله بن عروة، عن عروة، عن عائشة، قالت: جلست إحدى عشرة امرأة فتعاهدن وتعاقدن أن لا يكتمن من أخبار أزواجهن شيئا: فقالت الأولى: زوجي لحم جمل غث على رأس جبل وعر، لا سهل فيرتقى، ولا سمين فينتقل . قالت الثانية: زوجي لا أبث خبره، إني أخاف أن لا أذره، إن أذكره أذكر عجره وبجره. قالت الثالثة: زوجي العشنق، إن أنطق أطلق، وإن أسكت أعلق. قالت الرابعة: زوجي كليل تهامة، لا حر ولا قر، ولا مخافة ولا سآمة . قالت الخامسة: زوجي إن دخل فهد، وإن خرج أسد، ولا يسأل عما عهد. قالت السادسة: زوجي إن أكل لف، وإن شرب اشتف، وإن اضطجع التف، ولا يولج الكف ليعلم البث. قالت السابعة: زوجي عياياء أو غياياء طباقاء كل داء له داء، شجك أو فلك أو جمع كلا لك. قالت الثامنة: زوجي المس مس أرنب والريح ريح زرنب. قالت التاسعة: زوجي رفيع العماد طويل النجاد عظيم الرماد قريب البيت من الناد. قالت العاشرة: زوجي مالك وما مالك مالك خير من ذلك، له إبل كثيرات المبارك، قليلات المسارح، إذا سمعن صوت المزهر أيقن أنهن هوالك. قالت الحادية عشرة: زوجي أبو زرع وما أبو زرع؟ أناس من حلي أذني، وملأ من شحم عضدي، وبجحني فبجحت إلي نفسي، وجدني في أهل غنيمة بشق فجعلني في أهل صهيل وأطيط ودائس ومنق، فعنده أقول فلا أقبح ، وأرقد فأتصبح وأشرب فأتقمح، أم أبي زرع فما أم أبي زرع، عكومها رداح، وبيتها فساح، ابن أبي زرع، فما ابن أبي زرع، مضجعه كمسل شطبة، وتشبعه ذراع الجفرة، بنت أبي زرع، فما بنت أبي زرع، طوع أبيها وطوع أمها، ملء كسائها، وغيظ جارتها، جارية أبي زرع، فما جارية أبي زرع، لا تبث حديثنا تبثيثا، ولا تنقث ميرتنا تنقيثا، ولا تملأ بيتنا تعشيشا، قالت: خرج أبو زرع والأوطاب تمخض، فلقي امرأة معها ولدان لها كالفهدين، يلعبان من تحت خصرها برمانتين، فطلقني ونكحها، فنكحت بعده رجلا سريا، ركب شريا، وأخذ خطيا، وأراح علي نعما ثريا، وأعطاني من كل رائحة زوجا، وقال: كلي أم زرع، وميري أهلك، فلو جمعت كل شيء أعطانيه، ما بلغ أصغر آنية أبي زرع. قالت عائشة: فقال لي رسول الله صلى الله عليه وسلم: «كنت لك كأبي زرع لأم زرع»\n\n- **الدرجة:** B — البخاري 5189، ومسلم 2448، وصححه الألباني (215).\n- **ملاحظة:** `C01` `T19`: استمع إلى حكاية عائشة الطويلة عن إحدى عشرة امرأة إلى آخرها، ثم ختمها بجملة تطمئنها.\n\n\n## الباب 47: باب ما جاء في تواضع رسول الله ﷺ `T05`\n\n### H-SHM-0331 — «لا تطروني كما أطرت النصارى ابن مريم، إنما أنا عبد، فقولوا: عبد الله ورسوله»\nحدثنا أحمد بن منيع، وسعيد بن عبد الرحمن المخزومي، وغير واحد قالوا: حدثنا سفيان بن عيينة، عن الزهري، عن عبيد الله، عن ابن عباس، عن عمر بن الخطاب قال: قال رسول الله صلى الله عليه وسلم: \" لا تطروني كما أطرت النصارى ابن مريم إنما أنا عبد فقولوا: عبد الله ورسوله \"\n\n- **الدرجة:** B — البخاري 3445 و6830، وصححه الألباني (284).\n\n### H-SHM-0332 — امرأة لها إليه حاجة: «اجلسي في أي طريق المدينة شئت أجلس إليك»\nحدثنا علي بن حجر قال: حدثنا سويد بن عبد العزيز، عن حميد، عن أنس بن مالك، أن امرأة جاءت إلى النبي صلى الله عليه وسلم فقالت له: إن لي إليك حاجة، فقال: «اجلسي في أي طريق المدينة شئت أجلس إليك»\n\n- **الدرجة:** B — صححه الألباني (285). وفي مسلم 2326 أن المرأة «كان في عقلها شيء»، وأنه قال: «يا أم فلان، انظري أي السكك شئت حتى أقضي لك حاجتك»، فخلا معها في بعض الطرق حتى فرغت من حاجتها.\n- **ملاحظة:** `C05` `C07`: رواية مسلم تحدد أنها امرأة في عقلها شيء. أعطاها الوقت والمكان الذي تختاره هي، حتى فرغت.\n\n### H-SHM-0334 — يُدعى إلى خبز الشعير والإهالة السنخة فيجيب، ومات ودرعه رهن عند يهودي\nحدثنا واصل بن عبد الأعلى الكوفي قال: حدثنا محمد بن فضيل، عن الأعمش، عن أنس بن مالك قال: «كان النبي صلى الله عليه وسلم يدعى إلى خبز الشعير والإهالة السنخة فيجيب. ولقد كان له درع عند يهودي فما وجد ما يفكها حتى مات»\n\n- **الدرجة:** B — صححه الألباني (287)، وفي البخاري 2069 نحوه، وفي البخاري 2916: توفي ودرعه مرهونة عند يهودي بثلاثين صاعاً من شعير.\n- **ملاحظة:** `T14` `T05`.\n\n### H-SHM-0335 وH-SHM-0341 — حج على رحل رث وقطيفة لا تساوي أربعة دراهم، وقال: «اللهم اجعله حجاً لا رياء فيه ولا سمعة»\nحدثنا محمود بن غيلان قال: حدثنا أبو داود الحفري، عن سفيان، عن الربيع بن صبيح، عن يزيد بن أبان، عن أنس بن مالك قال : حج رسول الله صلى الله عليه وسلم على رحل رث وعليه قطيفة لا تساوي أربعة دراهم فقال: «اللهم اجعله حجا لا رياء فيه ولا سمعة»\n\nحدثنا إسحاق بن منصور قال: حدثنا أبو داود الطيالسي قال: حدثنا الربيع وهو ابن صبيح قال: حدثنا يزيد الرقاشي، عن أنس بن مالك، أن رسول الله صلى الله عليه وسلم حج على رحل رث وقطيفة، كنا نرى ثمنها أربعة دراهم، فلما استوت به راحلته قال: «لبيك بحجة لا سمعة فيها ولا رياء»\n\n- **الدرجة:** B — صححه الألباني (288). والطريقان في الشمائل كلاهما من رواية يزيد بن أبان الرقاشي عن أنس، ولم يذكر المختصر وجه التصحيح.\n- **ملاحظة:** `T25`.\n\n### H-SHM-0336 — لم يكن شخص أحب إليهم منه، وكانوا إذا رأوه لم يقوموا لما يعلمون من كراهته لذلك\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا عفان قال: حدثنا حماد بن سلمة، عن حميد، عن أنس بن مالك قال: «لم يكن شخص أحب إليهم من رسول الله صلى الله عليه وسلم» قال: «وكانوا إذا رأوه لم يقوموا، لما يعلمون من كراهته لذلك»\n\n- **الدرجة:** B — صححه الألباني في المختصر (289). وفي بيانات جامع الترمذي 2754 نُسب إلى الألباني «ضعيف»، وهذا يخالف حكمه في المختصر؛ مسجل فجوة `RG-042`.\n- **ملاحظة:** الدرجة هنا مبنية على حكم الألباني المقروء في كتابه، لا على البيانات الآلية.\n\n### H-SHM-0338 — «لو أُهدي إليّ كراع لقبلت، ولو دُعيت عليه لأجبت»\nحدثنا محمد بن عبد الله بن بزيع قال: حدثنا بشر بن المفضل قال: حدثنا سعيد، عن قتادة، عن أنس بن مالك قال: قال رسول الله صلى الله عليه وسلم: «لو أهدي إلي كراع لقبلت، ولو دعيت عليه لأجبت»\n\n- **الدرجة:** B — صححه الألباني (290)، وفي جامع الترمذي 1338، وفي البخاري 2568 من حديث أبي هريرة.\n\n### H-SHM-0339 — جابر: جاءني ليس براكب بغل ولا برذون\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن قال: حدثنا سفيان، عن محمد بن المنكدر، عن جابر قال: «جاءني رسول الله صلى الله عليه وسلم ليس براكب بغل ولا برذون»\n\n- **الدرجة:** B — البخاري 5664، وصححه الألباني (291).\n- **ملاحظة:** في البخاري أن المجيء كان لعيادة جابر في مرضه: «جاءني النبي ﷺ يعودني». `C04`.\n\n### H-SHM-0340 — يوسف بن عبد الله بن سلام: سماني يوسف، وأقعدني في حجره، ومسح على رأسي\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا أبو نعيم قال: أنبأنا يحيى بن أبي الهيثم العطار قال : سمعت يوسف بن عبد الله بن سلام قال: «سماني رسول الله صلى الله عليه وسلم يوسف وأقعدني في حجره ومسح على رأسي»\n\n- **الدرجة:** B — صححه الألباني (292).\n- **ملاحظة:** `C03`: تسمية المولود، وحمله، والمسح على رأسه.\n\n### H-SHM-0342 — خياط دعاه إلى طعام فيه دباء، فكان يتتبع الدباء\nحدثنا إسحاق بن منصور قال: حدثنا عبد الرزاق قال: حدثنا معمر، عن ثابت البناني، وعاصم الأحول، عن أنس بن مالك ، أن رجلا خياطا دعا رسول الله صلى الله عليه وسلم فقرب منه ثريدا عليه دباء قال: «فكان رسول الله صلى الله عليه وسلم يأخذ الدباء وكان يحب الدباء» قال ثابت: فسمعت أنسا يقول: «فما صنع لي طعام أقدر على أن يصنع فيه دباء إلا صنع»\n\n- **الدرجة:** B — البخاري 2092 و5379، ومسلم 2041، وصححه الألباني في باب الإدام (135).\n- **ملاحظة:** `T05` `C06`: أجاب دعوة خياط.\n\n### H-SHM-0343 — عائشة: «كان بشراً من البشر، يفلي ثوبه، ويحلب شاته، ويخدم نفسه»\nحدثنا محمد بن إسماعيل قال: حدثنا عبد الله بن صالح قال: حدثنا معاوية بن صالح، عن يحيى بن سعيد، عن عمرة، قالت : قيل لعائشة: ماذا كان يعمل رسول الله صلى الله عليه وسلم في بيته؟ قالت: «كان بشرا من البشر، يفلي ثوبه، ويحلب شاته، ويخدم نفسه»\n\n- **الدرجة:** B — صححه الألباني (293). وفي البخاري 676 عن عائشة: «كان يكون في مهنة أهله، تعني خدمة أهله، فإذا حضرت الصلاة خرج إلى الصلاة».\n- **ملاحظة:** `T19` `T05` `D07`.\n\n\n## الباب 48: باب ما جاء في خلق رسول الله ﷺ `T02` `T09` `T12` `T13`\n\n### H-SHM-0345 — عمرو بن العاص: كان يقبل بوجهه وحديثه على أشر القوم يتألفهم، حتى ظننت أني خير القوم... فصدقني\nحدثنا إسحاق بن موسى قال: حدثنا يونس بن بكير، عن محمد بن إسحاق، عن زياد بن أبي زياد، عن محمد بن كعب القرظي، عن عمرو بن العاص قال: كان رسول الله صلى الله عليه وسلم يقبل بوجهه وحديثه على أشر القوم يتألفهم بذلك فكان يقبل بوجهه وحديثه علي، حتى ظننت أني خير القوم، فقلت: يا رسول الله، أنا خير أو أبو بكر؟ قال: «أبو بكر» فقلت: يا رسول الله، أنا خير أو عمر؟ فقال: «عمر» ، فقلت: يا رسول الله، أنا خير أو عثمان؟ قال: «عثمان» ، فلما سألت رسول الله صلى الله عليه وسلم فصدقني فلوددت أني لم أكن سألته\n\n- **الدرجة:** C — حسّنه الألباني (295). وفي إسناده محمد بن إسحاق.\n- **ملاحظة:** `T09` `C11`: إقبال للتأليف، ثم صدق في الجواب حين سُئل، ولو كان الجواب غير ما يحبه السائل.\n\n### H-SHM-0346 — أنس: خدمته عشر سنين فما قال لي أف قط\nحدثنا قتيبة بن سعيد قال: حدثنا جعفر بن سليمان الضبعي، عن ثابت، عن أنس بن مالك قال: «خدمت رسول الله صلى الله عليه وسلم عشر سنين فما قال لي أف قط، وما قال لشيء صنعته لم صنعته ولا لشيء تركته لم تركته، وكان رسول الله صلى الله عليه وسلم من أحسن الناس خلقا، ولا مسست خزا ولا حريرا ولا شيئا كان ألين من كف رسول الله صلى الله عليه وسلم، ولا شممت مسكا قط ولا عطرا كان أطيب من عرق النبي صلى الله عليه وسلم»\n\n- **الدرجة:** B — البخاري 6038، ومسلم 2309، وصححه الألباني (296).\n- **ملاحظة:** مدخل سابق في `HKB-CHR-01`. زيادة هذه الرواية: «ولا شممت مسكاً قط ولا عطراً كان أطيب من عرق النبي ﷺ».\n\n### H-SHM-0348 — عائشة: لم يكن فاحشاً ولا متفحشاً ولا صخاباً في الأسواق، ولا يجزي بالسيئة السيئة، ولكن يعفو ويصفح\nحدثنا محمد بن بشار قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن أبي إسحاق، عن أبي عبد الله الجدلي واسمه عبد بن عبد، عن عائشة، أنها قالت: «لم يكن رسول الله صلى الله عليه وسلم فاحشا ولا متفحشا ولا صخابا في الأسواق، ولا يجزىء بالسيئة السيئة، ولكن يعفو ويصفح»\n\n- **الدرجة:** B — صححه الألباني (298)، وفي جامع الترمذي 2016. وفي البخاري 2125 و4838 عن عبد الله بن عمرو صفته في التوراة: «ليس بفظ ولا غليظ ولا سخاب في الأسواق، ولا يدفع بالسيئة السيئة، ولكن يعفو ويغفر».\n\n### H-SHM-0349 — عائشة: ما ضرب بيده شيئاً قط إلا أن يجاهد في سبيل الله، ولا ضرب خادماً ولا امرأة\nحدثنا هارون بن إسحاق الهمداني قال: حدثنا عبدة، عن هشام بن عروة، عن أبيه، عن عائشة، قالت: «ما ضرب رسول الله صلى الله عليه وسلم بيده شيئا قط إلا أن يجاهد في سبيل الله، ولا ضرب خادما أو امرأة»\n\n- **الدرجة:** B — مسلم 2328، وصححه الألباني (299).\n\n### H-SHM-0350 — عائشة: ما رأيته منتصراً من مظلمة ظُلمها قط ما لم يُنتهك من محارم الله شيء... وما خُيّر بين أمرين إلا اختار أيسرهما\nحدثنا أحمد بن عبدة الضبي قال: حدثنا فضيل بن عياض، عن منصور، عن الزهري، عن عروة، عن عائشة، قالت: «ما رأيت رسول الله صلى الله عليه وسلم منتصرا من مظلمة ظلمها قط ما لم ينتهك من محارم الله تعالى شيء، فإذا انتهك من محارم الله شيء كان من أشدهم في ذلك غضبا، وما خير بين أمرين إلا اختار أيسرهما ما لم يكن مأثما»\n\n- **الدرجة:** B — البخاري 3560 و6786، ومسلم 2327، وصححه الألباني (300).\n\n### H-SHM-0351 — «بئس ابن العشيرة»، ثم ألان له القول، و«إن من شر الناس من تركه الناس اتقاء فحشه»\nحدثنا ابن أبي عمر قال: حدثنا سفيان، عن محمد بن المنكدر، عن عروة، عن عائشة، قالت: استأذن رجل على رسول الله صلى الله عليه وسلم وأنا عنده، فقال: «بئس ابن العشيرة» أو «أخو العشيرة» ، ثم أذن له، فألان له القول، فلما خرج قلت: يا رسول الله، قلت ما قلت ثم ألنت له القول؟ فقال: «يا عائشة، إن من شر الناس من تركه الناس أو ودعه الناس اتقاء فحشه»\n\n- **الدرجة:** B — البخاري 6032 و6131، ومسلم 2591، وصححه الألباني (301)، وفي جامع الترمذي 1996.\n- **ملاحظة:** في البخاري 6032 قال لعائشة: «متى عهدتني فحاشاً؟». `T09` `T24`: لين القول في المواجهة مع رجل يعرف سوء خلقه، والتحذير منه لمن يحتاج إلى معرفته.\n\n### H-SHM-0353 — جابر: ما سُئل شيئاً قط فقال: لا\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سفيان، عن محمد بن المنكدر قال: سمعت جابر بن عبد الله يقول: \" ما سئل رسول الله صلى الله عليه وسلم شيئا قط فقال: لا \"\n\n- **الدرجة:** B — البخاري 6034، ومسلم 2311، وصححه الألباني (302).\n\n### H-SHM-0354 — ابن عباس: أجود الناس بالخير، وأجود ما يكون في رمضان\nحدثنا عبد الله بن عمران أبو القاسم القرشي المكي قال: حدثنا إبراهيم بن سعد، عن ابن شهاب، عن عبيد الله، عن ابن عباس قال: «كان رسول الله صلى الله عليه وسلم أجود الناس بالخير وكان أجود ما يكون في شهر رمضان، حتى ينسلخ فيأتيه جبريل فيعرض عليه القرآن، فإذا لقيه جبريل كان رسول الله صلى الله عليه وسلم أجود بالخير من الريح المرسلة»\n\n- **الدرجة:** B — البخاري 6 و3554، ومسلم 2308، وصححه الألباني (303).\n\n### H-SHM-0355 — أنس: كان لا يدخر شيئاً لغد\nحدثنا قتيبة بن سعيد قال: أخبرنا جعفر بن سليمان، عن ثابت، عن أنس بن مالك قال: «كان النبي صلى الله عليه وسلم لا يدخر شيئا لغد»\n\n- **الدرجة:** B — صححه الألباني (304)، وفي جامع الترمذي 2362.\n- **ملاحظة:** **يعارضه في الظاهر** البخاري 5357: كان يحبس لأهله قوت سنتهم. الجمع في `SD-016`.\n\n### H-SHM-0358 — عائشة: كان يقبل الهدية ويثيب عليها\nحدثنا علي بن خشرم، وغير واحد قالوا: حدثنا عيسى بن يونس، عن هشام بن عروة، عن أبيه، عن عائشة : «أن النبي صلى الله عليه وسلم كان يقبل الهدية ويثيب عليها»\n\n- **الدرجة:** B — البخاري 2585، وصححه الألباني (306)، وفي جامع الترمذي 1953.\n\n\n## الباب 49: باب ما جاء في حياء رسول الله ﷺ `T01`\n\n### H-SHM-0359 — أبو سعيد: أشد حياء من العذراء في خدرها، وكان إذا كره شيئاً عرفناه في وجهه\nحدثنا محمود بن غيلان قال: حدثنا أبو داود قال: حدثنا شعبة، عن قتادة قال: سمعت عبد الله بن أبي عتبة، يحدث عن أبي سعيد الخدري قال: «كان النبي صلى الله عليه وسلم أشد حياء من العذراء في خدرها، وكان إذا كره شيئا عرفناه في وجهه»\n\n- **الدرجة:** B — البخاري 3562 و6102 و6119، ومسلم 2320، وصححه الألباني (307).\n- **ملاحظة:** مدخل سابق في `HKB-BKH-02`.\n\n---\n\n## قائمة التحذير: ما ضعّفه الألباني في هذه الأبواب (X)\n\nلا يُستدل بشيء منها، ولا يُبنى عليها وصف ولا مبدأ.\n\n| الرقم | المضمون | حكم الألباني وملاحظات |\n|---|---|---|\n| `H-SHM-0226` | وصف هند بن أبي هالة لمنطقه: «متواصل الأحزان، دائم الفكرة، ليست له راحة، طويل السكت...» | ضعيف جداً (المختصر 6) |\n| `H-SHM-0337` | تتمة الحديث نفسه: سؤال الحسين أباه عن دخوله وخروجه ومجلسه، ومنه «جزأ دخوله ثلاثة أجزاء...» | ضعيف جداً (المختصر 6) |\n| `H-SHM-0352` | تتمة الحديث نفسه: «كان دائم البشر، سهل الخلق، لين الجانب... يتغافل عما لا يشتهي... قد ترك نفسه من ثلاث...» | ضعيف جداً (المختصر 6) |\n| `H-SHM-0227` | جابر بن سمرة: «كان لا يضحك إلا تبسماً»، وفي ساقيه حموشة | ضعيف (193)، وفي جامع الترمذي 3645 ضعيف. وفي إسناده الحجاج بن أرطاة. ومعنى التبسم ثابت من حديث عبد الله بن الحارث (228–229) |\n| `H-SHM-0235` | سعد يوم الخندق: ضحك حتى بدت نواجذه من رمية سعد لرجل يتترس | ضعيف (199) |\n| `H-SHM-0253` | حديث خرافة | ضعيف (214) |\n| `H-SHM-0333` | «يعود المريض، ويشهد الجنائز، ويركب الحمار، ويجيب دعوة العبد»، وحمار بني قريظة | ضعيف (286، وفي النسخة: 268)، وفي جامع الترمذي 1017 ضعيف. وفي إسناده مسلم الأعور. وعيادته ﷺ للمريض ثابتة من غير هذا الطريق (البخاري 5664) |\n| `H-SHM-0344` | زيد بن ثابت: «إذا ذكرنا الدنيا ذكرها معنا، وإذا ذكرنا الآخرة ذكرها معنا...» | ضعيف (294) |\n| `H-SHM-0347` | «لا يكاد يواجه أحداً بشيء يكرهه»، وقصة أثر الصفرة | ضعيف (297). أما ترك تسمية المخطئ في الإنكار العام فله أصل صحيح من غير هذه القصة: «ما بال أقوام...» (البخاري 6101) |\n| `H-SHM-0356` | «أنفق ولا تخف من ذي العرش إقلالاً»، و«بهذا أُمرت» | ضعيف (305) |\n| `H-SHM-0357` | الربيع بنت معوذ: أعطاها ملء كفه حلياً وذهباً | ضعيف (174) |\n| `H-SHM-0360` | عائشة: ما نظرت إلى فرجه قط | ضعيف (308)، من رواية مولى لعائشة غير مسمى |\n\n**أهم نتيجة في هذه القائمة:** الأوصاف الجامعة المشهورة لكلامه ومجلسه وسيرته في بيته («متواصل الأحزان»، «دائم الفكرة»، «طويل السكت»، «دائم البشر سهل الخلق»، «جزأ دخوله ثلاثة أجزاء»، «يتغافل عما لا يشتهي»، «لا يقطع على أحد حديثه») كلها من حديث واحد طويل: رواية الحسن والحسين عن هند بن أبي هالة وعن علي، من طريق جميع بن عمر العجلي عن رجل من بني تميم من ولد أبي هالة يُكنى أبا عبد الله ولم يُسمّ. وقد حكم عليه الألباني بأنه ضعيف جداً. وكثير منها شائع في الكتب والمواعظ. فكل صفة لا تثبت إلا من هذا الحديث لا تدخل قاعدة المعرفة.\n\n---\n\n## خلاصة الأبواب (مستوى E)\n\n1. **الضحك `T01`:** ثبت أن أكثر ضحكه التبسم (228–229)، وثبت أيضاً أنه ضحك حتى بدت نواجذه في موضعين صحيحين في الباب (230، وهو في مسلم 190؛ و233، وهو في البخاري 6571). أما الحصر «لا يضحك إلا تبسماً» من حديث جابر بن سمرة فضعيف. فالصحيح: الغالب التبسم، مع ضحك ظاهر أحياناً.\n2. **المزاح `T09` `D05`:** ستة نصوص مقبولة (خمسة B وواحد C)، منها مع طفل حزين على طائره، وأعرابي دميم، وعجوز، وخادمه أنس. وضابطه المنصوص: «لا أقول إلا حقاً» (238). وفي حديثي زاهر والعجوز انتهى المزاح بجبر الخاطر قبل أن يفترق الطرفان.\n3. **الاستماع `T26`:** ثلاثة نصوص صحيحة جديدة: استزادته الشعر مائة بيت بقوله «هيه» (250)، وسكوته في مجالس أصحابه وهم يتناشدون الشعر ويتذاكرون أمر الجاهلية، وتبسمه معهم (248)، واستماعه حديث أم زرع إلى آخره (254). كان `T26` مبدئياً بدليل واحد، فصار متقاطعاً.\n4. **التواضع `T05`:** ينهى عن الإطراء (331)، ويعطي امرأة في عقلها شيء الوقت والمكان الذي تختاره (332، مسلم 2326)، ويجيب دعوة الخياط وخبز الشعير (334، 342)، ويخدم نفسه وأهله (343، البخاري 676)، ويكره أن يُقام له (336).\n5. **التعامل مع سيئ الخلق `T13` `T24`:** حديث «بئس أخو العشيرة» (351): وصف الرجل لأهل بيته بما فيه، ثم ألان له القول في وجهه. والتعليل منصوص: «إن من شر الناس من تركه الناس اتقاء فحشه». وتحرير الفرق بين المداراة والمداهنة من الشروح فجوة `RG-043`.\n6. **الكرم `T06`:** «ما سُئل شيئاً قط فقال لا» (353)، و«كان لا يدخر شيئاً لغد» (355)، مع البخاري 5357 أنه كان يحبس لأهله قوت سنتهم. الجمع عند ابن دقيق العيد في `SD-016`.\n"}, {"code": "HKB-SHM-02", "slug": "hkb-shm-02", "sec": "03", "title": "الأحاديث — الشمائل المحمدية للترمذي: بقية أبواب الكتاب (48 باباً)", "short": "الشمائل: بقية الكتاب", "md": "# الأحاديث — الشمائل المحمدية للترمذي: بقية أبواب الكتاب (48 باباً)\n\n- **القسم:** 03 — قاعدة الأحاديث\n- **الدفعة:** 5 — 16 نوفمبر 2026\n- **النطاق:** الأبواب 1–33 و39–46 و50–56، أي كل ما بقي من الكتاب بعد `HKB-SHM-01`. الأرقام 1–223 و255–330 و361–417 بترقيم طبعة الجليمي. عدد المداخل **346**، ومعها 10 أرقام مدمجة في ما قبلها في النسخة الرقمية. بهذا الملف يكتمل الكتاب في القاعدة.\n- **النص:** طبعة الجليمي (الشاملة 13037، OpenITI)، منقول كاملاً بإسناده.\n- **مستوى القراءة، بصراحة:** أبواب الهدي والعبادة والعيش والوفاة (19–24، 39–46، 50–56) قُرئت متونها. وأبواب الصفة الخَلقية واللباس والمتاع والطعام (1–18، 25–33) قُرئ منها مطلع كل متن بما يكفي لتحديد مضمونه، والنص الكامل مثبت هنا للرجوع إليه.\n- **الأحكام:** من «مختصر الشمائل» للألباني (الشاملة 700). **المطابقة بين أرقام الجليمي وأرقام المختصر تمت آلياً** بتشابه المتن، ثم روجعت الحالات المختلطة يدوياً. ما كانت مطابقته ضعيفة عُلّم بذلك، وما لم يُطابق أخذ الدرجة «؟».\n- **التخريج في الصحيحين:** آلي، بتطابق لفظي لا يقل عن 60% من عبارات المتن في نص hadith-api. يُذكر بعبارة «له مطابقة لفظية»، ولا يُعد تخريجاً محققاً.\n- **قاعدة الدرجة:** B ما صححه الألباني؛ C ما حسّنه؛ X ما ضعّفه؛ «؟» ما لم يُحسم؛ B/X ما صح بعضه وضعف بعضه.\n\n## الحصيلة\n\n| الدرجة | العدد |\n|---|---|\n| B | 268 |\n| C | 19 |\n| B/X | 5 |\n| X | 43 |\n| ؟ | 11 |\n| **المجموع** | **346** |\n\n---\n\n## الباب 1: خَلق رسول الله ﷺ\n\n**خلاصة الباب (E):** الأوصاف الصحيحة هنا من أنس والبراء وعلي وجابر بن سمرة وأبي الطفيل. والضعيف: الوصف الطويل من طريق إبراهيم بن محمد عن علي (7)، ووصف هند بن أبي هالة (8)، و«أفلج الثنيتين... كالنور يخرج من بين ثناياه» (15). `D01`\n\n### H-SHM-0001 — كان رسول الله صلى الله عليه وسلم ليس بالطويل البائن، ولا ب…\nقال الحافظ أبو عيسى محمد بن عيسى بن سورة الترمذي، حدثنا أبو رجاء قتيبة بن سعيد، عن مالك بن أنس، عن ربيعة بن أبي عبد الرحمن، عن أنس بن مالك، أنه سمعه يقول: «كان رسول الله صلى الله عليه وسلم ليس بالطويل البائن، ولا بالقصير، ولا بالأبيض الأمهق، ولا بالآدم، ولا بالجعد القطط، ولا بالسبط، بعثه الله تعالى على رأس أربعين سنة، فأقام بمكة عشر سنين، وبالمدينة عشر سنين، وتوفاه الله تعالى على رأس ستين سنة، وليس في رأسه ولحيته عشرون شعرة بيضاء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 1)، وله مطابقة لفظية في مسلم 2347.\n\n### H-SHM-0002 — كان رسول الله صلى الله عليه وسلم ربعة، ليس بالطويل ولا بال…\nحدثنا حميد بن مسعدة البصري قال: حدثنا عبد الوهاب الثقفي، عن حميد، عن أنس بن مالك قال: «كان رسول الله صلى الله عليه وسلم ربعة، ليس بالطويل ولا بالقصير، حسن الجسم، وكان شعره ليس بجعد ولا سبط أسمر اللون، إذا مشى يتكفأ»\n\n- **الدرجة:** B — صححه الألباني (المختصر 2).\n\n### H-SHM-0003 — كان رسول الله صلى الله عليه وسلم رجلا مربوعا بعيد ما بين ا…\nحدثنا محمد بن بشار قال: حدثنا محمد بن جعفر قال: حدثنا شعبة، عن أبي إسحاق قال: سمعت البراء بن عازب يقول: «كان رسول الله صلى الله عليه وسلم رجلا مربوعا بعيد ما بين المنكبين، عظيم الجمة إلى شحمة أذنيه اليسرى، عليه حلة حمراء، ما رأيت شيئا قط أحسن منه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 3)، وله مطابقة لفظية في مسلم 2337.\n\n### H-SHM-0004 — ما رأيت من ذي لمة في حلة حمراء أحسن من رسول الله، له شعر ي…\nحدثنا محمود بن غيلان قال: حدثنا وكيع قال: حدثنا سفيان، عن أبي إسحاق، عن البراء بن عازب قال : «ما رأيت من ذي لمة في حلة حمراء أحسن من رسول الله، له شعر يضرب منكبيه، بعيد ما بين المنكبين، لم يكن بالقصير ولا بالطويل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 3).\n\n### H-SHM-0005 — لم يكن النبي صلى الله عليه وسلم بالطويل ولا بالقصير، شثن ا…\nحدثنا محمد بن إسماعيل قال: حدثنا أبو نعيم قال: حدثنا المسعودي، عن عثمان بن مسلم بن هرمز، عن نافع بن جبير بن مطعم، عن علي بن أبي طالب قال: «لم يكن النبي صلى الله عليه وسلم بالطويل ولا بالقصير، شثن الكفين والقدمين، ضخم الرأس، ضخم الكراديس، طويل المسربة، إذا مشى تكفأ تكفؤا كأنما ينحط من صبب، لم أر قبله ولا بعده مثله ، صلى الله عليه وسلم» .\n\n- **الدرجة:** B — صححه الألباني (المختصر 4).\n\n### H-SHM-0006 — قال: حدثنا أبي، عن المسعودي، بهذا الإسناد نحوه بمعناه\nحدثنا سفيان بن وكيع قال: حدثنا أبي، عن المسعودي، بهذا الإسناد نحوه بمعناه\n\n- **الدرجة:** B — صححه الألباني (المختصر 4) (إسناد آخر للحديث السابق).\n\n### H-SHM-0007 — لم يكن رسول الله بالطويل الممغط، ولا بالقصير المتردد، وكان…\nحدثنا أحمد بن عبدة الضبي البصري، وعلي بن حجر، وأبو جعفر محمد بن الحسين وهو ابن أبي حليمة، والمعنى واحد، قالوا: حدثنا عيسى بن يونس، عن عمر بن عبد الله مولى غفرة قال: حدثني إبراهيم بن محمد من ولد علي بن أبي طالب قال: كان علي إذا وصف رسول الله صلى الله عليه وسلم قال: \" لم يكن رسول الله بالطويل الممغط، ولا بالقصير المتردد، وكان ربعة من القوم، لم يكن بالجعد القطط، ولا بالسبط، كان جعدا رجلا، ولم يكن بالمطهم ولا بالمكلثم، وكان في وجهه تدوير أبيض مشرب، أدعج العينين، أهدب الأشفار، جليل المشاش والكتد، أجرد ذو مسربة، شثن الكفين والقدمين، إذا مشى تقلع كأنما ينحط في صبب، وإذا التفت التفت معا، بين كتفيه خاتم النبوة، وهو خاتم النبيين، أجود الناس صدرا، وأصدق الناس لهجة، وألينهم عريكة، وأكرمهم عشرة، من رآه بديهة هابه، ومن خالطه معرفة أحبه، يقول ناعته: لم أر قبله ولا بعده مثله صلى الله عليه وسلم \". قال أبو عيسى: سمعت أبا جعفر محمد بن الحسين يقول: سمعت الأصمعي يقول في تفسير صفة النبي صلى الله عليه وسلم: \" الممغط: الذاهب طولا \". وقال: \" سمعت أعرابيا يقول في كلامه: تمغط في نشابته أي مدها مدا شديدا. والمتردد: الداخل بعضه في بعض قصرا. وأما القطط: فالشديد الجعودة. والرجل الذي في شعره حجونة: أي تثن قليل. وأما المطهم فالبادن الكثير اللحم. والمكلثم: المدور الوجه. والمشرب: الذي في بياضه حمرة. والأدعج: الشديد سواد العين. والأهدب: الطويل الأشفار. والكتد: مجتمع الكتفين وهو الكاهل. والمسربة: هو الشعر الدقيق الذي كأنه قضيب من الصدر إلى السرة. والشثن: الغليظ الأصابع من الكفين والقدمين. والتقلع: أن يمشي بقوة. والصبب الحدور، نقول: انحدرنا في صبوب وصبب. وقوله: جليل المشاش يريد رءوس المناكب. والعشرة: الصحبة، والعشير: الصاحب. والبديهة: المفاجأة، يقال: بدهته بأمر أي فجأته \"\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 5).\n\n### H-SHM-0008 — كان رسول الله صلى الله عليه وسلم فخما مفخما، يتلألأ وجهه ت…\nحدثنا سفيان بن وكيع قال: حدثنا جميع بن عمر بن عبد الرحمن العجلي إملاء علينا من كتابه قال : أخبرني رجل من بني تميم من ولد أبي هالة زوج خديجة، يكنى أبا عبد الله، عن ابن لأبي هالة، عن الحسن بن علي قال: سألت خالي هند بن أبي هالة، وكان وصافا، عن حلية النبي صلى الله عليه وسلم، وأنا أشتهي أن يصف لي منها شيئا أتعلق به، فقال: \" كان رسول الله صلى الله عليه وسلم فخما مفخما، يتلألأ وجهه تلألؤ القمر ليلة البدر، أطول من المربوع، وأقصر من المشذب، عظيم الهامة، رجل الشعر، إن انفرقت عقيقته فرقها، وإلا فلا يجاوز شعره شحمة أذنيه إذا هو وفره، أزهر اللون، واسع الجبين، أزج الحواجب سوابغ في غير قرن، بينهما عرق يدره الغضب، أقنى العرنين، له نور يعلوه، يحسبه من لم يتأمله أشم، كث اللحية، سهل الخدين، ضليع الفم، مفلج الأسنان، دقيق المسربة، كأن عنقه جيد دمية في صفاء الفضة، معتدل الخلق، بادن متماسك، سواء البطن والصدر، عريض الصدر، بعيد ما بين المنكبين، ضخم الكراديس، أنور المتجرد، موصول ما بين اللبة والسرة بشعر يجري كالخط، عاري الثديين والبطن مما سوى ذلك، أشعر الذراعين والمنكبين وأعالي الصدر، طويل الزندين، رحب الراحة، شثن الكفين والقدمين، سائل الأطراف - أو قال: شائل الأطراف - خمصان الأخمصين، مسيح القدمين، ينبو عنهما الماء، إذا زال زال قلعا، يخطو تكفيا، ويمشي هونا، ذريع المشية، إذا مشى كأنما ينحط من صبب، وإذا التفت التفت جميعا، خافض الطرف، نظره إلى الأرض أطول من نظره إلى السماء، جل نظره الملاحظة، يسوق أصحابه ويبدأ من لقي بالسلام \"\n\n- **الدرجة:** X — ضعيف جداً عند الألباني (المختصر 6) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0009 — كان رسول الله صلى الله عليه وسلم ضليع الفم، أشكل العين، من…\nحدثنا أبو موسى محمد بن المثنى، حدثنا محمد بن جعفر، قال حدثنا شعبة، عن سماك بن حرب قال: سمعت جابر بن سمرة يقول: «كان رسول الله صلى الله عليه وسلم ضليع الفم، أشكل العين، منهوس العقب» . قال شعبة: قلت لسماك: ما ضليع الفم؟ قال: عظيم الفم، قلت: ما أشكل العين؟ قال: طويل شق العين، قلت: ما منهوس العقب؟ قال: قليل لحم العقب\n\n- **الدرجة:** B — صححه الألباني (المختصر 7).\n\n### H-SHM-0010 — رأيت رسول الله صلى الله عليه وسلم في ليلة إضحيان، وعليه حل…\nحدثنا هناد بن السري قال: حدثنا عبثر بن القاسم، عن أشعث، يعني ابن سوار، عن أبي إسحاق، عن جابر بن سمرة قال: «رأيت رسول الله صلى الله عليه وسلم في ليلة إضحيان، وعليه حلة حمراء، فجعلت أنظر إليه وإلى القمر، فلهو عندي أحسن من القمر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 8).\n\n### H-SHM-0011 — لا، بل مثل القمر\nحدثنا سفيان بن وكيع، قال حدثنا حميد بن عبد الرحمن الرؤاسي، عن زهير، عن أبي إسحاق قال: سأل رجل البراء بن عازب: أكان وجه رسول الله صلى الله عليه وسلم مثل السيف؟ قال: «لا، بل مثل القمر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 9).\n\n### H-SHM-0012 — كان رسول الله صلى الله عليه وسلم أبيض كأنما صيغ من فضة، رج…\nحدثنا أبو داود المصاحفي سليمان بن سلم قال: حدثنا النضر بن شميل، عن صالح بن أبي الأخضر، عن ابن شهاب، عن أبي سلمة، عن أبي هريرة قال: «كان رسول الله صلى الله عليه وسلم أبيض كأنما صيغ من فضة، رجل الشعر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 10).\n\n### H-SHM-0013 — عرض علي الأنبياء، فإذا موسى عليه السلام ضرب من الرجال، كأن…\nحدثنا قتيبة بن سعيد قال: أخبرني الليث بن سعد، عن أبي الزبير، عن جابر بن عبد الله، أن رسول الله صلى الله عليه وسلم قال: «عرض علي الأنبياء، فإذا موسى عليه السلام ضرب من الرجال، كأنه من رجال شنوءة، ورأيت عيسى ابن مريم عليه السلام، فإذا أقرب من رأيت به شبها عروة بن مسعود، ورأيت إبراهيم عليه السلام، فإذا أقرب من رأيت به شبها صاحبكم، يعني نفسه، ورأيت جبريل عليه السلام فإذا أقرب من رأيت به شبها دحية»\n\n- **الدرجة:** B — صححه الألباني (المختصر 11)، وله مطابقة لفظية في مسلم 167.\n\n### H-SHM-0014 — رأيت النبي صلى الله عليه وسلم وما بقي على وجه الأرض أحد رآ…\nحدثنا سفيان بن وكيع، ومحمد بن بشار، المعنى واحد، قالا: أخبرنا يزيد بن هارون، عن سعيد الجريري قال: سمعت أبا الطفيل يقول: «رأيت النبي صلى الله عليه وسلم وما بقي على وجه الأرض أحد رآه غيري» ، قلت: صفه لي، قال: «كان أبيض مليحا مقصدا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 12).\n\n### H-SHM-0015 — كان رسول الله صلى الله عليه وسلم أفلج الثنيتين، إذا تكلم ر…\nحدثنا عبد الله بن عبد الرحمن قال: حدثنا إبراهيم بن المنذر الحزامي قال: حدثنا عبد العزيز بن أبي ثابت الزهري قال: حدثني إسماعيل بن إبراهيم ابن أخي موسى بن عقبة، عن موسى بن عقبة، عن كريب، عن ابن عباس قال: «كان رسول الله صلى الله عليه وسلم أفلج الثنيتين، إذا تكلم رئي كالنور يخرج من بين ثناياه»\n\n- **الدرجة:** X — ضعيف جداً عند الألباني (المختصر 13).\n\n\n## الباب 2: خاتم النبوة\n\n### H-SHM-0016 — قال: حدثنا حاتم بن إسماعيل، عن الجعد بن عبد الرحمن قال: سم…\nحدثنا أبو رجاء قتيبة بن سعيد قال: حدثنا حاتم بن إسماعيل، عن الجعد بن عبد الرحمن قال: سمعت السائب بن يزيد يقول: ذهبت بي خالتي إلى النبي صلى الله عليه وسلم فقالت: يا رسول الله، إن ابن أختي وجع. فمسح رأسي ودعا لي بالبركة، وتوضأ، فشربت من وضوئه، وقمت خلف ظهره، فنظرت إلى الخاتم بين كتفيه، فإذا هو مثل زر الحجلة \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 14).\n\n### H-SHM-0017 — رأيت الخاتم بين كتفي رسول الله صلى الله عليه وسلم غدة حمرا…\nحدثنا سعيد بن يعقوب الطالقاني قال: حدثنا أيوب بن جابر، عن سماك بن حرب، عن جابر بن سمرة قال: «رأيت الخاتم بين كتفي رسول الله صلى الله عليه وسلم غدة حمراء مثل بيضة الحمامة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 15).\n\n### H-SHM-0018 — اهتز له عرش الرحمن\nحدثنا أبو مصعب المدني قال: حدثنا يوسف بن الماجشون، عن أبيه، عن عاصم بن عمر بن قتادة، عن جدته رميثة قالت: سمعت رسول الله صلى الله عليه وسلم، ولو أشاء أن أقبل الخاتم الذي بين كتفيه من قربه لفعلت، يقول لسعد بن معاذ يوم مات: «اهتز له عرش الرحمن»\n\n- **الدرجة:** B — صححه الألباني (المختصر 16) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0019 — بين كتفيه خاتم النبوة، وهو خاتم النبيين\nحدثنا أحمد بن عبدة الضبي، وعلي بن حجر، وغير واحد، قالوا: حدثنا عيسى بن يونس، عن عمر بن عبد الله مولى غفرة قال: حدثني إبراهيم بن محمد، من ولد علي بن أبي طالب قال: كان علي، إذا وصف رسول الله صلى الله عليه وسلم - فذكر الحديث بطوله - وقال: «بين كتفيه خاتم النبوة، وهو خاتم النبيين»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 5).\n\n### H-SHM-0020 — يا أبا زيد، ادن مني فامسح ظهري ، فمسحت ظهره، فوقعت أصابعي …\nحدثنا محمد بن بشار قال: حدثنا أبو عاصم قال: حدثنا عزرة بن ثابت قال: حدثني علباء بن أحمر اليشكري قال: حدثني أبو زيد عمرو بن أخطب الأنصاري قال: قال لي رسول الله صلى الله عليه وسلم: «يا أبا زيد، ادن مني فامسح ظهري» ، فمسحت ظهره، فوقعت أصابعي على الخاتم قلت: وما الخاتم؟ قال: «شعرات مجتمعات»\n\n- **الدرجة:** B — صححه الألباني (المختصر 17).\n\n### H-SHM-0021 — يا سلمان ما هذا؟ فقال: صدقة عليك وعلى أصحابك، فقال: ارفعها…\nحدثنا أبو عمار الحسين بن حريث الخزاعي قال: حدثنا علي بن حسين بن واقد، قال حدثني أبي قال: حدثني عبد الله بن بريدة قال: سمعت أبي بريدة، يقول: جاء سلمان الفارسي إلى رسول الله صلى الله عليه وسلم حين قدم المدينة بمائدة عليها رطب فوضعها بين يدي رسول الله صلى الله عليه وسلم، فقال: «يا سلمان ما هذا؟» فقال: صدقة عليك وعلى أصحابك، فقال: «ارفعها، فإنا لا نأكل الصدقة» قال: فرفعها، فجاء الغد بمثله، فوضعه بين يدي رسول الله صلى الله عليه وسلم، فقال: «ما هذا يا سلمان؟» فقال: هدية لك، فقال رسول الله صلى الله عليه وسلم لأصحابه: «ابسطوا»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 18).\n\n### H-SHM-0022 — كان في ظهره بضعة ناشزة\nحدثنا محمد بن بشار قال: حدثنا بشر بن الوضاح قال: حدثنا أبو عقيل الدورقي، عن أبي نضرة العوقي قال : سألت أبا سعيد الخدري عن خاتم رسول الله صلى الله عليه وسلم - يعني خاتم النبوة - فقال: «كان في ظهره بضعة ناشزة»\n\n- **الدرجة:** C — حسّنه الألباني (المختصر 19).\n\n### H-SHM-0023 — ولك فقال القوم: أستغفر لك رسول الله صلى الله عليه وسلم؟ فق…\nحدثنا أحمد بن المقدام أبو الأشعث العجلي البصري قال: أخبرنا حماد بن زيد، عن عاصم الأحول، عن عبد الله بن سرجس قال: أتيت رسول الله صلى الله عليه وسلم وهو في ناس من أصحابه، فدرت هكذا من خلفه، فعرف الذي أريد، فألقى الرداء عن ظهره، فرأيت موضع الخاتم على كتفيه مثل الجمع حولها خيلان كأنها ثآليل، فرجعت حتى استقبلته، فقلت: غفر الله لك يا رسول الله، فقال: «ولك» فقال القوم: أستغفر لك رسول الله صلى الله عليه وسلم؟ فقال: نعم، ولكم، ثم تلا هذه الآية {واستغفر لذنبك وللمؤمنين والمؤمنات} [محمد: 19]\n\n- **الدرجة:** B — صححه الألباني (المختصر 20).\n\n\n## الباب 3: شعره\n\n### H-SHM-0024 — كان شعر رسول الله صلى الله عليه وسلم إلى نصف أذنيه\nحدثنا علي بن حجر قال: أخبرنا إسماعيل بن إبراهيم، عن حميد، عن أنس بن مالك قال: «كان شعر رسول الله صلى الله عليه وسلم إلى نصف أذنيه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 21).\n\n### H-SHM-0025 — كنت أغتسل أنا ورسول الله صلى الله عليه وسلم من إناء واحد، …\nحدثنا هناد بن السري قال: أخبرنا عبد الرحمن بن أبي الزناد، عن هشام بن عروة، عن أبيه، عن عائشة، قالت: «كنت أغتسل أنا ورسول الله صلى الله عليه وسلم من إناء واحد، وكان له شعر فوق الجمة ودون الوفرة»\n\n- **الدرجة:** B — صححه الألباني (المختصر 22).\n\n### H-SHM-0026 — كان رسول الله صلى الله عليه وسلم مربوعا، بعيد ما بين المنك…\nحدثنا أحمد بن منيع قال: حدثنا أبو قطن قال: حدثنا شعبة، عن أبي إسحاق، عن البراء بن عازب قال: «كان رسول الله صلى الله عليه وسلم مربوعا، بعيد ما بين المنكبين، وكانت جمته تضرب شحمة أذنيه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 3).\n\n### H-SHM-0027 — لم يكن بالجعد ولا بالسبط، كان يبلغ شعره شحمة أذنيه\nحدثنا محمد بن بشار قال: حدثنا وهب بن جرير بن حازم قال: حدثني أبي، عن قتادة قال: قلت لأنس: كيف كان شعر رسول الله صلى الله عليه وسلم؟ قال: «لم يكن بالجعد ولا بالسبط، كان يبلغ شعره شحمة أذنيه»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 5) (مطابقة آلية ضعيفة، تُراجع).\n\n### H-SHM-0028 — قدم رسول الله صلى الله عليه وسلم مكة قدمة وله أربع غدائر\nحدثنا محمد بن يحيى بن أبي عمر المكي قال: حدثنا سفيان بن عيينة، عن ابن أبي نجيح، عن مجاهد، عن أم هانئ بنت أبي طالب، قالت: «قدم رسول الله صلى الله عليه وسلم مكة قدمة وله أربع غدائر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 23).\n\n### H-SHM-0029 — أن شعر رسول الله صلى الله عليه وسلم كان إلى أنصاف أذنيه\nحدثنا سويد بن نصر قال: حدثنا عبد الله بن المبارك، عن معمر، عن ثابت البناني، عن أنس: «أن شعر رسول الله صلى الله عليه وسلم كان إلى أنصاف أذنيه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 21).\n\n### H-SHM-0030 — أن رسول الله صلى الله عليه وسلم كان يسدل شعره، وكان المشرك…\nحدثنا سويد بن نصر، حدثنا عبد الله بن المبارك، عن يونس بن يزيد، عن الزهري قال: حدثنا عبيد الله بن عبد الله بن عتبة، عن ابن عباس : «أن رسول الله صلى الله عليه وسلم كان يسدل شعره، وكان المشركون يفرقون رءوسهم، وكان أهل الكتاب يسدلون رءوسهم، وكان يحب موافقة أهل الكتاب فيما لم يؤمر فيه بشيء، ثم فرق رسول الله صلى الله عليه وسلم رأسه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 24)، وله مطابقة لفظية في البخاري 3944.\n\n### H-SHM-0031 — رأيت رسول الله صلى الله عليه وسلم ذا ضفائر أربع\nحدثنا محمد بن بشار قال: حدثنا عبد الرحمن بن مهدي، عن إبراهيم بن نافع المكي، عن ابن أبي نجيح، عن مجاهد، عن أم هانئ، قالت: «رأيت رسول الله صلى الله عليه وسلم ذا ضفائر أربع»\n\n- **الدرجة:** B — صححه الألباني (المختصر 23).\n\n\n## الباب 4: ترجّله\n\n### H-SHM-0032 — كنت أرجل رأس رسول الله صلى الله عليه وسلم وأنا حائض\nحدثنا إسحاق بن موسى الأنصاري قال: حدثنا معن بن عيسى قال: حدثنا مالك بن أنس، عن هشام بن عروة، عن أبيه، عن عائشة، قالت: «كنت أرجل رأس رسول الله صلى الله عليه وسلم وأنا حائض»\n\n- **الدرجة:** B — صححه الألباني (المختصر 25).\n\n### H-SHM-0033 — كان رسول الله صلى الله عليه وسلم يكثر دهن رأسه وتسريح لحيت…\nحدثنا يوسف بن عيسى قال: حدثنا وكيع قال: حدثنا الربيع بن صبيح، عن يزيد بن أبان هو الرقاشي، عن أنس بن مالك قال: «كان رسول الله صلى الله عليه وسلم يكثر دهن رأسه وتسريح لحيته، ويكثر القناع حتى كأن ثوبه ثوب زيات»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 26).\n\n### H-SHM-0034 — إن كان رسول الله صلى الله عليه وسلم ليحب التيمن في طهوره إ…\nحدثنا هناد بن السري قال: حدثنا أبو الأحوص، عن أشعث بن أبي الشعثاء، عن أبيه، عن مسروق، عن عائشة قالت: «إن كان رسول الله صلى الله عليه وسلم ليحب التيمن في طهوره إذا تطهر، وفي ترجله إذا ترجل، وفي انتعاله إذا انتعل»\n\n- **الدرجة:** B — صححه الألباني (المختصر 27)، وله مطابقة لفظية في مسلم 268.\n\n### H-SHM-0035 — نهى رسول الله صلى الله عليه وسلم عن الترجل إلا غبا\nحدثنا محمد بن بشار قال: حدثنا يحيى بن سعيد، عن هشام بن حسان ، عن الحسن، عن عبد الله بن مغفل، قال: «نهى رسول الله صلى الله عليه وسلم عن الترجل إلا غبا»\n\n- **الدرجة:** B — صححه الألباني (المختصر 28).\n\n### H-SHM-0036 — أن النبي صلى الله عليه وسلم كان يترجل غبا\nحدثنا الحسن بن عرفة قال: حدثنا عبد السلام بن حرب، عن يزيد بن أبي خالد، عن أبي العلاء الأودي، عن حميد بن عبد الرحمن، عن رجل من أصحاب النبي صلى الله عليه وسلم: «أن النبي صلى الله عليه وسلم كان يترجل غبا»\n\n- **الدرجة:** X — ضعيف عند الألباني (المختصر 29).\n\n\n## الباب 5: شيبه\n\n**خلاصة الباب (E):** «شيبتني هود وأخواتها» (41–42، صححه الألباني): ثقل ما حُمّل ظهر أثره في بدنه. `T16` `T22`\n\n### H-SHM-0037 — لم يبلغ ذلك، إنما كان شيبا في صدغيه ولكن أبو بكر، خضب بالح…\nحدثنا محمد بن بشار قال: أخبرنا أبو داود قال: أخبرنا همام، عن قتادة قال: قلت لأنس بن مالك: هل خضب رسول الله صلى الله عليه وسلم؟ قال: «لم يبلغ ذلك، إنما كان شيبا في صدغيه» ولكن أبو بكر، خضب بالحناء والكتم \"\n\n- **الدرجة:** B — صححه الألباني (المختصر 30).\n\n### H-SHM-0038 — ما عددت في رأس رسول الله صلى الله عليه وسلم ولحيته إلا أرب…\nحدثنا إسحاق بن منصور، ويحيى بن موسى، قالا: حدثنا عبد الرزاق ، عن معمر، عن ثابت، عن أنس قال: «ما عددت في رأس رسول الله صلى الله عليه وسلم ولحيته إلا أربع ع‍شرة شعرة بيضاء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 31).\n\n### H-SHM-0039 — كان إذا دهن رأسه لم ير منه شيب، وإذا لم يدهن رئي منه\nحدثنا محمد بن المثنى قال: أخبرنا أبو داود قال: حدثنا شعبة، عن سماك بن حرب قال: سمعت جابر بن سمرة، وقد سئل عن شيب رسول الله صلى الله عليه وسلم، فقال: «كان إذا دهن رأسه لم ير منه شيب، وإذا لم يدهن رئي منه»\n\n- **الدرجة:** B — صححه الألباني (المختصر 32)، وله مطابقة لفظية في مسلم 2344.\n\n### H-SHM-0040 — إنما كان شيب رسول الله صلى الله عليه وسلم نحوا من عشرين شع…\nحدثنا محمد بن عمرو بن الوليد الكندي الكوفي قال: حدثنا يحيى بن آدم، عن شريك، عن عبيد الله بن عمر، عن نافع، عن عبد الله بن عمر قال: «إنما كان شيب رسول الله صلى الله عليه وسلم نحوا من عشرين شعرة بيضاء»\n\n- **الدرجة:** B — صححه الألباني (المختصر 33).\n\n### H-SHM-0041 — شيبتني هود، والواقعة، والمرسلات، وعم يتساءلون، وإذا الشمس …\nحدثنا أبو كريب محمد بن العلاء قال: حدثنا معاوية بن هشام، عن شيبان ، عن أبي إسحاق، عن عكرمة، عن ابن عباس قال: قال أبو بكر: يا رسول الله، قد شبت، قال: «شيبتني هود، والواقعة، والمرسلات، وعم يتساءلون، وإذا الشمس كورت»\n\n- **الدرجة:** B — صححه الألباني (المختصر 34).\n\n### H-SHM-0042 — قد شيبتني هود وأخواتها\nحدثنا سفيان بن وكيع قال: حدثنا محمد بن بشر، عن علي بن صالح، عن أبي إسحاق، عن أبي جحيفة قال: قالوا: يا رسول الله، نراك قد شبت، قال: «قد شيبتني هود وأخواتها»\n\n- **الدرجة:** B — صححه الألباني (المختصر 35).\n\n### H-SHM-0043 — هذا نبي الله صلى الله عليه وسلم وعليه ثوبان أخضران، وله شع…\nحدثنا علي بن حجر قال: أنبأنا شعيب بن صفوان، عن عبد الملك بن عمير، عن إياد بن لقيط العجلي، عن أبي رمثة التيمي، تيم الرباب قال: أتيت النبي صلى الله عليه وسلم ومعي ابن لي، قال: فأريته، فقلت لما رأيته: «هذا نبي الله صلى الله عليه وسلم وعليه ثوبان أخضران، وله شعر قد علاه الشيب، وشيبه أحمر»\n\n- **الدرجة:** B — صححه الألباني (المختصر 36).\n\n### H-SHM-0044 — لم يكن في رأس رسول الله صلى الله عليه وسلم شيب إلا شعرات ف…\nحدثنا أحمد بن منيع قال: حدثنا سريج بن النعمان قال: حدثنا حماد بن سلمة، عن سماك بن حر
